[project]
name = "smplwise-vms-backend"
version = "0.1.0"
description = "SmplWise Arx add-on backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "timing_lane: a wall-clock / load-sensitive test; the release gate deselects it (-m 'not timing_lane') and the non-blocking timing lane runs it when the runner is quiet (docs/testing/GATE_LANES.md)",
]

# CR-BE-GATES-2436 (review findings 04:F06, 01:F-17): the static check is pyflakes only (rule set F: unused / undefined names, imports,
# redefinitions), no style rules. The existing `# noqa` markers are honoured.
# CR-PYFLAKES-ENFORCE-2442: the package `smplwise/` is clean under F (0 findings) and the lane (scripts/gate/lint_backend.py, run by
# `gate_entry.py decide` and by the entry check) is BLOCKING for every tree that carries the next line. Do not remove the marker; a tree
# without it (a branch cut before this change) is still only reported. A kept unused import says why: `# noqa: F401 - <reason>`.
# ruff-lane: blocking
[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["F"]

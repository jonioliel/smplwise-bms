name: SmplWise Arx
version: "2.24.1"
slug: smplwise_vms
description: Map-centred video management for Hikvision NVRs and Home Assistant (pilot build)
url: https://github.com/jonioliel/smplwise-bms
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
homeassistant_api: true
# Supervisor API for discovery (the add-on announces the bridge integration it installs) and, with the manager role (CR-021, owner
# decision D1), the in-app update of this add-on and the platform restart. Arx sends only an allow-listed set of calls
# (DOCS.md "What Arx may do on your system"). The first release carrying the role must be updated by hand once.
hassio_api: true
hassio_role: manager
discovery:
  - smplwise_bridge
# The integration is copied into <config>/custom_components/smplwise_bridge; nothing else there is touched.
map:
  - type: homeassistant_config
    read_only: false
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: SmplWise Arx
# Menu entry for every HA user; access inside the product is decided by VMS roles, never by this flag.
panel_admin: false
watchdog: http://[HOST]:[PORT:8099]/healthz
# CR-025: the push listener for Provision-ISR alarm messages. Unmapped (null) by default: nothing listens on the host until the
# owner maps the port in the add-on's Network settings AND chooses "push" for a recorder. Incoming pushes carry a per-recorder
# path token; recorders that cannot send a path are matched by their source address.
# CR-028: the cast relay for "send to screen" (Google Cast TVs fetch the camera's HLS from here, one short-lived token per cast). Unmapped
# (null) by default and the listener runs only when the option `cast_relay` is on: nothing is reachable until the owner does both.
# CR-038: the handler page for service tickets (people outside the system update a ticket through a personal link). Unmapped
# (null): the Cloudflare tunnel reaches the container port - never map it on the host. Listens only with the option `tickets_public`.
# CR-NOTICE106: the TV boards of the notice board (a TV browser opens its board's link; read-only, one revocable token per board).
# Unmapped (null) by default and the listener runs only when the option `notice_boards` is on.
ports:
  18091/tcp: null
  18092/tcp: null
  18093/tcp: null
  18094/tcp: null
ports_description:
  18091/tcp: Provision-ISR alarm push (optional; only for recorders set to push events)
  18092/tcp: Cast relay for media screens (optional; only with the cast_relay option)
  18093/tcp: Handler page for service tickets (optional; only with the tickets_public option)
  18094/tcp: TV notice boards (optional; only with the notice_boards option)
backup: hot
# WKWRITE-295: the WisKey people-write lineage (services/wiskey_write_lineage.py) is kept OUT of the add-on backup; after a restore
# Arx finds the lineage ahead of (or missing from) the restored database and keeps every open write UNKNOWN - never resent
backup_exclude:
  - "wiskey_lineage/*"
options:
  bootstrap_admin_username: ""
  nvr_host: ""
  nvr_http_port: 80
  nvr_rtsp_port: 554
  nvr_username: ""
  go2rtc_url: ""
  go2rtc_api_username: ""
  wiskey_username: ""
  # TKSECRETS2: the go2rtc API password, the WisKey stations' password, the WisKey background token, the OpenAI API key and the
  # push relay key are no add-on options: they are entered in Settings › Connections › Secrets (stored encrypted by Arx).
  # DEPRECATED (2.6.3 only, transitional): the six former secret options below stay declared for ONE version so an upgrade keeps
  # their old values until Arx has moved them into its encrypted store at the first start; Arx then empties them. Leave them empty.
  # They are removed in the next version.
  nvr_password: ""
  go2rtc_api_password: ""
  wiskey_password: ""
  wiskey_background_token: ""
  openai_api_key: ""
  push_relay_key: ""
  # CR-008 SmplWise Arx: https://<your HA hostname>/arx through a Cloudflare tunnel path route (DOCS "Remote access").
  remote_access: false
  remote_path: /arx
  # CR-027: the SmplWise push relay for the phone app's notifications (DOCS "Phone app push"). Empty = the app channel is off.
  push_relay_url: ""
  # CR-FLEET215: the SmplWise fleet receiver for the daily health report (DOCS "Fleet health report"). Empty = no report is ever sent;
  # even when set, nothing is sent until an Arx system administrator also switches the report on in Settings.
  fleet_report_url: ""
  # CR-028: "send to screen" - the cast relay listener (container port 18092; map a host port in Network too). Off by default.
  cast_relay: false
  # CR-038: the service tickets' handler page (container port 18093, reached through the Cloudflare tunnel only). Off by default.
  tickets_public: false
  # CR-NOTICE106: the TV notice boards' listener (container port 18094; map a host port in Network too). Off by default.
  notice_boards: false
  # one database writer at a time, in arrival order (the round-10 lock storm fix); turn off only if support asks
  # NN5/CR-029: makes the Frigate recorder type selectable in Settings (otherwise listed "coming soon"). Off by default; run.sh maps it to SW_FRIGATE.
  frigate_enabled: false
  db_write_gate: true
  log_level: info
schema:
  bootstrap_admin_username: str
  nvr_host: str?
  nvr_http_port: port
  nvr_rtsp_port: port
  nvr_username: str?
  go2rtc_url: str?
  go2rtc_api_username: str?
  wiskey_username: str?
  remote_access: bool
  remote_path: match(^/[a-z0-9][a-z0-9_-]{0,31}$)
  push_relay_url: str?
  fleet_report_url: str?
  cast_relay: bool?
  tickets_public: bool?
  notice_boards: bool?
  frigate_enabled: bool?
  db_write_gate: bool?
  log_level: list(debug|info|warning|error)
  nvr_password: password?
  go2rtc_api_password: password?
  wiskey_password: password?
  wiskey_background_token: password?
  openai_api_key: password?
  push_relay_key: password?

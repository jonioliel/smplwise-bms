<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SmplWise Arx — Plan Studio 6 prototype (realistic 3D + walk-through)</title>
<style>
  :root {
    --sw-bg: #f5f7fb; --sw-surface: #ffffff; --sw-surface-2: #f7f9fc; --sw-surface-3: #eef2f8; --sw-border: #e7ebf2; --sw-border-strong: #e1e6ef;
    --sw-text: #22314c; --sw-heading: #1e2e47; --sw-text-2: #5b6a85; --sw-text-3: #8a97ae; --sw-text-inverse: #fff;
    --sw-accent: #2767ed; --sw-accent-hover: #1f57d1; --sw-accent-soft: #edf3ff; --sw-accent-text: #2767ed;
    --sw-danger: #ef4444; --sw-danger-soft: #fdecec; --sw-success: #22c55e; --sw-success-soft: #e8f8ee; --sw-stale: #f59e0b; --sw-stale-soft: #fff4e0; --sw-offline: #9aa3b5;
    --sw-map-lit: #ffc857; --sw-map-presence: #2767ed; --sw-map-temp: #1e3a63; --sw-map-sky: #dbe7f8; --sw-map-sky-horizon: #f5f8fc;
    --sw-font: "Heebo", "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif; --sw-mono: ui-monospace, Consolas, monospace;
    --r: 12px; --shadow: 0 1px 2px rgba(17,24,39,.06), 0 8px 24px rgba(17,24,39,.10);
    --glass: rgba(255,255,255,.78); --glass-strong: rgba(255,255,255,.92); --glass-border: rgba(255,255,255,.6);
    --label-shadow: 0 1px 2px rgba(255,255,255,.9), 0 0 6px rgba(255,255,255,.8);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  :root[data-theme="dark"] {
    --sw-bg: #0d1220; --sw-surface: #151c2c; --sw-surface-2: #1a2336; --sw-surface-3: #222d44; --sw-border: #232e45; --sw-border-strong: #2f3c58;
    --sw-text: #e6ebf5; --sw-heading: #f3f6fc; --sw-text-2: #a9b4ca; --sw-text-3: #8190aa;
    --sw-accent: #3a6ce0; --sw-accent-soft: rgba(91,140,255,.18); --sw-accent-text: #8fb2ff; --sw-danger-soft: rgba(255,107,98,.2); --sw-success-soft: rgba(61,220,132,.18);
    --sw-map-sky: #0b1a33; --sw-map-sky-horizon: #1a2b47; --sw-map-temp: #cfe0ff;
    --glass: rgba(21,28,44,.72); --glass-strong: rgba(21,28,44,.9); --glass-border: rgba(255,255,255,.08); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    --label-shadow: 0 1px 2px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.8);
  }
  :root[data-style="dark"] { --sw-accent: #38bdf8; --sw-accent-text: #7dd3fc; --sw-map-presence: #38bdf8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 13px/1.45 var(--sw-font); color: var(--sw-text); background: var(--sw-bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .shell { display: grid; grid-template-rows: 48px 1fr; height: 100vh; height: 100dvh; }
  header { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--sw-surface); border-bottom: 1px solid var(--sw-border); min-width: 0; }
  header .brand { font-weight: 700; color: var(--sw-accent-text); letter-spacing: -.2px; white-space: nowrap; }
  header .crumbs { color: var(--sw-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .modes { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; flex: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border: 1px solid var(--sw-border-strong); border-radius: 999px; background: var(--sw-surface); color: var(--sw-text); font-size: 12px; white-space: nowrap; cursor: pointer; line-height: 1.4; transition: background .15s, border-color .15s, color .15s; }
  .chip:hover { border-color: var(--sw-accent); }
  .chip.sel { border-color: var(--sw-accent); color: var(--sw-accent-text); box-shadow: 0 0 0 1px var(--sw-accent); background: var(--sw-accent-soft); }
  .chip[disabled] { opacity: .5; cursor: default; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sw-success); }
  select.chip { appearance: none; padding-inline-end: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--sw-text-3) 50%), linear-gradient(135deg, var(--sw-text-3) 50%, transparent 50%); background-position: calc(100% - 13px) 55%, calc(100% - 9px) 55%; background-size: 4px 4px; background-repeat: no-repeat; }
  html[dir="rtl"] select.chip { background-position: 13px 55%, 9px 55%; padding-inline-end: 11px; padding-inline-start: 24px; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 0; min-height: 0; }
  /* the stage is full-bleed: the chrome floats over it (plan L9) */
  .stage { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sw-map-sky) 0%, var(--sw-map-sky-horizon) 100%); min-height: 0; user-select: none; touch-action: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage.walk canvas { cursor: crosshair; }
  .overlay { position: absolute; pointer-events: none; }
  .card { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--glass-border); border-radius: var(--r); padding: 8px 12px; box-shadow: var(--shadow); pointer-events: auto; }
  /* floating toolbars */
  .tb { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; }
  .tb .chip { border-color: transparent; background: transparent; }
  .tb .chip:hover { background: var(--sw-surface-3); }
  .tb .chip.sel { background: var(--sw-accent-soft); box-shadow: none; border-color: transparent; }
  .tb .sep { width: 1px; height: 18px; background: var(--sw-border-strong); margin: 0 2px; }
  .bar { left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 28px); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  /* time pill, top-left: collapsed to one row; opens on click */
  .sun { left: 14px; top: 14px; width: auto; max-width: 340px; transition: width .25s var(--ease); }
  .sun .row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .sun .row .ico { color: var(--sw-stale); font-size: 14px; }
  .sun .t { font-weight: 600; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  .sun .caret { color: var(--sw-text-3); font-size: 10px; transition: transform .2s; }
  .sun.open .caret { transform: rotate(180deg); }
  .sun .more { display: none; margin-top: 8px; }
  .sun.open .more { display: block; }
  .sun input[type=range] { width: 100%; accent-color: var(--sw-accent); display: block; }
  .sun small { color: var(--sw-text-2); display: block; margin-top: 4px; }
  .sun .presets { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  /* floors / areas tree strip (owner rule: stays in every design) */
  .strip { right: 14px; top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .strip button { width: 96px; padding: 4px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--glass); backdrop-filter: blur(10px); color: var(--sw-text-2); text-align: center; cursor: pointer; pointer-events: auto; font-size: 12px; transition: border-color .15s; }
  .strip button.sel { border-color: var(--sw-accent); color: var(--sw-accent-text); box-shadow: 0 0 0 1px var(--sw-accent); }
  .strip .pic { display: block; height: 50px; border-radius: 6px; background: linear-gradient(135deg, var(--sw-surface-3), var(--sw-border-strong)); position: relative; margin-bottom: 2px; overflow: hidden; }
  .strip .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dots { position: absolute; top: 3px; right: 3px; display: flex; gap: 3px; }
  .dots i { display: block; width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff; }
  .hud { left: 14px; bottom: 14px; font: 11px/1.5 var(--sw-mono); color: var(--sw-text-2); padding: 6px 10px; min-width: 210px; direction: ltr; text-align: left; opacity: 0; pointer-events: none; }
  .hud.on { opacity: 1; pointer-events: auto; }
  /* toast, bottom centre above the bar */
  .note { left: 50%; bottom: 64px; transform: translateX(-50%); background: var(--glass-strong); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--sw-text-2); pointer-events: auto; max-width: min(520px, calc(100% - 28px)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: var(--shadow); transition: opacity .25s; }
  .note[hidden] { display: none; }
  .note.danger { color: #b91c1c; border-color: var(--sw-danger); }
  .labels { inset: 0; overflow: hidden; }
  .lbl { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; }
  .lbl.room { font-size: 12.5px; font-weight: 700; color: var(--sw-heading); text-shadow: 0 0 2px var(--sw-surface), 0 0 1px var(--sw-surface), 0 1px 3px var(--sw-surface); letter-spacing: .1px; opacity: .92; pointer-events: auto; cursor: default; padding: 4px 6px; }
  .lbl.temp { font-size: 11px; font-weight: 600; color: var(--sw-map-temp); background: var(--glass-strong); border: 1px solid var(--glass-border); padding: 1px 7px; border-radius: 999px; box-shadow: 0 1px 2px rgba(0,0,0,.08); display: none; }
  .lbl.room:hover + .lbl.temp, .labels.temps .lbl.temp { display: block; }
  .lbl.camera { font-size: 11px; color: var(--sw-accent-text); background: var(--glass-strong); border: 1px solid var(--glass-border); padding: 0 6px; border-radius: 999px; }
  .lbl.camera.off { color: var(--sw-text-3); }
  .lbl.device { font-size: 11px; background: var(--glass-strong); border: 1px solid var(--glass-border); padding: 0 6px; border-radius: 999px; color: var(--sw-text-2); }
  .lbl.device.on { color: #b45309; border-color: var(--sw-map-lit); }
  .lbl.device.open { color: #b91c1c; border-color: var(--sw-danger); }
  .popover { position: absolute; z-index: 5; background: var(--sw-surface); border: 1px solid var(--sw-border); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; min-width: 200px; pointer-events: auto; animation: pop .18s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
  .popover h4 { margin: 0 0 6px; font-size: 13px; }
  .popover .state { color: var(--sw-text-2); font-size: 12px; margin-bottom: 8px; }
  .popover .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { padding: 5px 12px; border-radius: 9px; border: 1px solid var(--sw-border-strong); background: var(--sw-surface); cursor: pointer; }
  .btn.primary { background: var(--sw-accent); color: var(--sw-text-inverse); border-color: var(--sw-accent); }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  /* walk-through chrome */
  .crosshair { left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border: 1.5px solid rgba(255,255,255,.9); border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.35); display: none; transition: transform .15s; }
  .stage.walk .crosshair { display: block; }
  .stage.walk.aim .crosshair { transform: scale(1.5); border-color: var(--sw-map-lit); }
  .aimhint { left: 50%; top: calc(50% + 18px); transform: translateX(-50%); font-size: 11px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); display: none; white-space: nowrap; }
  .stage.walk.aim .aimhint { display: block; }
  .walkbar { left: 50%; bottom: 14px; transform: translateX(-50%); display: none; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 999px; }
  .stage.walk .walkbar { display: flex; }
  .stage.walk .bar { display: none; }
  .walkbar input[type=number] { width: 58px; padding: 2px 6px; border: 1px solid var(--sw-border-strong); border-radius: 6px; background: var(--sw-surface); direction: ltr; text-align: center; }
  .walkbar label { font-size: 10px; color: var(--sw-text-2); display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .minimap { left: 14px; bottom: 14px; display: none; pointer-events: auto; }
  .stage.walk .minimap { display: block; }
  .stage.walk .hud { bottom: 196px; }
  .minimap canvas { width: 160px; height: 160px; display: block; border-radius: 12px; box-shadow: var(--shadow); cursor: pointer; }
  .minimap .lv { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 600; color: var(--sw-text-2); }
  .joystick { left: 24px; bottom: 200px; width: 118px; height: 118px; border-radius: 50%; background: rgba(255,255,255,.22); border: 1.5px solid rgba(255,255,255,.6); display: none; pointer-events: auto; touch-action: none; backdrop-filter: blur(4px); }
  .joystick .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: var(--sw-accent); opacity: .8; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  .stage.walk.touch .joystick { display: block; }
  .roomname { left: 50%; top: 14px; transform: translateX(-50%); background: var(--glass-strong); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 999px; padding: 3px 14px; font-weight: 600; display: none; box-shadow: var(--shadow); }
  .stage.walk .roomname { display: block; }
  .stage.walk .sun, .stage.walk .strip { display: none; }
  .fade { inset: 0; background: #000; opacity: 0; transition: opacity .22s var(--ease); }
  :root[data-theme="dark"] .fade, :root[data-style="dark"] .fade { background: #070b14; }
  /* floating round buttons (phone walk) */
  .fabs { right: 14px; bottom: 14px; display: none; flex-direction: column; gap: 8px; pointer-events: auto; }
  .stage:not(.walk) .fab.walk-only { display: none; }
  .fab { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass-strong); backdrop-filter: blur(10px); box-shadow: var(--shadow); font-size: 18px; display: grid; place-items: center; cursor: pointer; color: var(--sw-text); }
  /* stills / kiosk layer */
  .kiosk-layer { inset: 0; display: none; background: #0b1220; }
  .stage.stills .kiosk-layer { display: block; }
  .stage.stills canvas { visibility: hidden; }
  .stills-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stills-lit { animation: litfade .5s ease-out; }
  @keyframes litfade { from { opacity: 0 } to { opacity: 1 } }
  .stills-presence { fill: rgba(39,103,237,.18); stroke: var(--sw-map-presence); stroke-width: 3; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { stroke-opacity: .9 } 50% { stroke-opacity: .35 } }
  .stills-door { fill: rgba(239,68,68,.15); stroke: #ef4444; stroke-width: 3; }
  .stills-cam { fill: var(--sw-accent); stroke: #fff; stroke-width: 2; }
  .stills-chips { position: absolute; pointer-events: none; }
  .stills-chips .chipT, .chipT { position: absolute; transform: translate(-50%, -50%); background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 999px; padding: 1px 7px; font-size: 12px; font-weight: 600; color: var(--sw-map-temp); }
  .stills-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #cbd5e1; }
  .kiosk-note { left: 14px; top: 14px; background: var(--glass-strong); border: 1px solid var(--glass-border); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--sw-text-2); display: none; pointer-events: auto; }
  .stage.stills .kiosk-note { display: block; }
  .stage.stills .sun, .stage.stills .note, .stage.stills .labels { display: none; }
  /* side panel: the floors / areas tree, walk, quality */
  aside { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; padding: 12px; border-inline-start: 1px solid var(--sw-border); background: var(--sw-surface); }
  .sheet-handle { display: none; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { flex: 1; padding: 6px; border: 1px solid var(--sw-border-strong); border-radius: 9px; background: var(--sw-surface); cursor: pointer; }
  .tabs button.sel { border-color: var(--sw-accent); color: var(--sw-accent-text); background: var(--sw-accent-soft); }
  .panel { display: none; flex-direction: column; gap: 10px; }
  .panel.sel { display: flex; }
  .pcard { background: var(--sw-surface-2); border: 1px solid var(--sw-border); border-radius: var(--r); padding: 10px 12px; }
  .pcard h3 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .pcard h3 .muted { font-weight: 400; color: var(--sw-text-3); font-size: 11px; margin-inline-start: auto; }
  .pcard.tree h3 { cursor: pointer; margin: 0; }
  .pcard.tree h3 .tw { display: inline-block; width: 14px; color: var(--sw-text-3); transition: transform .2s; font-size: 10px; }
  .pcard.tree .body { margin-top: 8px; }
  .pcard.tree.collapsed .body { display: none; }
  .pcard.tree.collapsed h3 .tw { transform: rotate(-90deg); }
  .room { border-top: 1px solid var(--sw-border); padding: 6px 0; }
  .room:first-of-type { border-top: 0; }
  .room .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .room .name .t { margin-inline-start: auto; color: var(--sw-map-temp); font-weight: 500; font-size: 12px; }
  .dev { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; color: var(--sw-text-2); }
  .dev .lbl2 { flex: 1; }
  .sw { position: relative; width: 34px; height: 20px; border-radius: 999px; background: #c9d1dc; border: 0; cursor: pointer; flex: none; padding: 0; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw.on { background: var(--sw-accent); }
  .sw.on::after { transform: translateX(-14px); }
  .sw.danger.on { background: var(--sw-danger); }
  .sw.success.on { background: var(--sw-success); }
  input[type=range].pos { width: 90px; accent-color: var(--sw-accent); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12px; }
  .kv b { color: var(--sw-text-2); font-weight: 500; }
  .ladder { display: flex; gap: 6px; align-items: center; font-size: 12px; flex-wrap: wrap; }
  .ladder span { padding: 2px 8px; border-radius: 999px; background: var(--sw-surface-3); cursor: pointer; }
  .ladder span.on { background: var(--sw-accent-soft); color: var(--sw-accent-text); font-weight: 600; box-shadow: 0 0 0 1px var(--sw-accent); }
  .ladder span.down { opacity: .5; text-decoration: line-through; }
  .toggles { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 12px; align-items: center; }
  .list { display: flex; flex-direction: column; gap: 4px; }
  .list button { text-align: start; padding: 5px 8px; border: 1px solid var(--sw-border); border-radius: 8px; background: var(--sw-surface); cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .list button .k { font: 11px var(--sw-mono); color: var(--sw-text-3); margin-inline-start: auto; }
  .help { font-size: 11px; color: var(--sw-text-3); line-height: 1.5; }
  kbd { font: 11px var(--sw-mono); background: var(--sw-surface-3); border: 1px solid var(--sw-border-strong); border-radius: 4px; padding: 0 4px; }
  .mobile-toggle { display: none; }
  .progress { height: 4px; background: var(--sw-surface-3); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--sw-accent); transition: width .2s; }
  select.inline { padding: 3px 8px; border: 1px solid var(--sw-border-strong); border-radius: 8px; background: var(--sw-surface); }
  /* phone / tablet: the panel is a bottom sheet, the chrome shrinks, nothing overflows horizontally (design contract) */
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    header { padding: 0 10px; gap: 8px; overflow: hidden; }
    header .crumbs { display: none; }
    header .modes { gap: 4px; min-width: 0; flex: 1 1 auto; justify-content: flex-end; }
    header .modes > span.chip { display: none; }
    header select.chip { max-width: 128px; overflow: hidden; text-overflow: ellipsis; }
    header #style-select { max-width: 96px; }
    aside { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 62vh; z-index: 8; border-radius: 18px 18px 0 0; border: 1px solid var(--sw-border); border-bottom: 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); transform: translateY(calc(100% - 0px)); transition: transform .3s var(--ease); padding-top: 6px; }
    aside.open { transform: translateY(0); }
    .sheet-handle { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--sw-border-strong); margin: 0 auto 6px; flex: none; }
    .mobile-toggle { display: grid; position: absolute; }
    .stage .fabs { display: flex; }
    .sun { max-width: calc(100% - 80px); }
    .sun .more { max-width: 100%; }
    .strip { top: auto; bottom: 70px; right: 10px; flex-direction: row; gap: 4px; }
    .strip button { width: 64px; font-size: 11px; }
    .strip .pic { height: 34px; }
    .bar { bottom: 10px; left: 10px; right: 76px; transform: none; max-width: none; width: auto; justify-content: flex-start; }
    .walkbar { left: 10px; right: 76px; transform: none; bottom: 10px; max-width: none; }
    .walkbar label, .walkbar #walk-save { display: none; }
    .minimap { bottom: 64px; }
    .minimap canvas { width: 112px; height: 112px; }
    .joystick { bottom: 190px; left: 16px; width: 104px; height: 104px; }
    .joystick .knob { width: 40px; height: 40px; margin: -20px 0 0 -20px; }
    .stage.walk .roomname { top: 10px; font-size: 12px; }
    .note { bottom: 56px; }
    .popover { min-width: 180px; max-width: calc(100% - 20px); }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <span class="brand">SmplWise Arx</span>
    <span class="crumbs">חקירה › מתקן ראשי › <span id="crumb-floor">בית דו־קומתי (דמו)</span> › <b>תוכנית</b></span>
    <div class="modes">
      <select id="plan-select" class="chip" aria-label="תוכנית"></select>
      <select id="style-select" class="chip" aria-label="סגנון"></select>
      <button class="chip" id="theme-toggle" title="ערכת נושא">☾</button>
      <span class="chip">2D</span><span class="chip sel">3D</span><span class="chip">היסטוריה</span>
    </div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="3D">
      <canvas id="gl"></canvas>
      <div class="overlay labels" id="labels"></div>
      <div class="overlay kiosk-layer" id="stills"></div>
      <div class="overlay kiosk-note" id="kiosk-note">תצוגת קיר · תמונה מוכנה · <a href="#" id="kiosk-exit">חזרה לתצוגה חיה</a></div>
      <div class="overlay card sun" id="sun-card">
        <div class="row" id="sun-row"><span class="ico">☀</span><span class="t" id="sun-time">15:30</span><button class="chip" id="sun-now">עכשיו</button><span class="caret">▼</span></div>
        <div class="more">
          <input type="range" id="sun-slider" min="0" max="1439" value="930" aria-label="שעה ביום">
          <small id="sun-info"></small>
          <div class="presets" id="weather"></div>
        </div>
      </div>
      <div class="overlay note" id="note" hidden></div>
      <div class="overlay strip" id="strip"></div>
      <div class="overlay card tb bar" id="bar"></div>
      <div class="overlay card hud" id="hud"></div>
      <div class="overlay crosshair"></div>
      <div class="overlay aimhint" id="aimhint"></div>
      <div class="overlay roomname" id="roomname"></div>
      <div class="overlay card tb walkbar" id="walkbar">
        <label>X (מ׳)<input type="number" id="wx" step="0.1"></label>
        <label>Y (מ׳)<input type="number" id="wz" step="0.1"></label>
        <label>כיוון (°)<input type="number" id="wh" step="5"></label>
        <button class="chip" id="walk-save">שמור עמדה</button>
        <button class="chip" id="walk-exit">יציאה</button>
      </div>
      <div class="overlay minimap" id="minimap"><canvas width="336" height="336"></canvas><span class="lv" id="mm-level"></span></div>
      <div class="overlay joystick" id="joystick"><div class="knob" id="knob"></div></div>
      <div class="overlay fabs" id="fabs"><button class="fab mobile-toggle" id="mobile-toggle" title="לוח" style="position:static">☰</button></div>
      <div class="overlay fade" id="fade"></div>
    </section>
    <aside id="aside">
      <div class="sheet-handle" id="sheet-handle"></div>
      <div class="tabs">
        <button class="sel" data-tab="states">קומות ואזורים</button>
        <button data-tab="walk">סיור</button>
        <button data-tab="quality">הגדרות</button>
      </div>
      <div class="panel sel" data-panel="states" id="panel-states"></div>
      <div class="panel" data-panel="walk" id="panel-walk"></div>
      <div class="panel" data-panel="quality" id="panel-quality"></div>
    </aside>
  </main>
</div>
<script src="dist/studio6.js"></script>
</body>
</html>

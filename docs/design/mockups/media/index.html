/* ====================================================================================================
   v2 ("Domus" glass pass). Layers, in the order of frontend/src/styles/devices-themes.ts:
   0. the shell (rail, bottom bar, floating corner, user menu) = design A of tokens.css, LIGHT ONLY, never themed;
   1. the glass KNOBS on the device area: every `--dv-*` name and value below is the palette "default" of
      devices-themes.ts (light block, then the dark block on data-devices-scheme="dark", then phone sizes);
      knobs marked "PROPOSED" do not exist yet - they are the media / remote additions this mockup needs;
   2. the element rules, reading ONLY knobs (plus a few 1-8 px structural literals);
   3. the fallback: no backdrop-filter or prefers-reduced-transparency -> solid surfaces, no blur.
   DomusUI (GPL-3.0) informed the ideas only; no code or CSS of it is used.
   ==================================================================================================== */
.frame{
  --sw-bg:#f5f7fb; --sw-surface:#ffffff; --sw-surface-3:#eef2f8; --sw-border:#e7ebf2;
  --sw-text:#22314c; --sw-heading:#1e2e47; --sw-text-2:#5b6a85; --sw-text-3:#8a97ae;
  --sw-accent:#2767ed; --sw-accent-soft:#edf3ff; --sw-accent-text:#2767ed; --sw-focus:#2767ed; --sw-live:#22c55e;
  --sw-font:"Heebo","Segoe UI",-apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
  --sw-font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}

    case 'power': if (d) { const on = isLit(d); powerTo(d, v === 'tv' ? true : v === 'off' ? false : !on, v); } return;
    case 'vol': if (d) setVol(d, Number(v)); return;
    case 'mute': if (d) { d.mute = !d.mute; } break;
    case 'out': if (d) d.out = v; break;
    case 'pb': if (d) { if (v === 'toggle') d.st = d.st === 'playing' ? 'paused' : 'playing'; else if (v === 'ff') d.pos = Math.min(d.dur || 0, d.pos + 30); else if (v === 'rew') d.pos = Math.max(0, d.pos - 10); } break;
    case 'sendtext': { const inp = $('[data-input="kbd"]'); const t = inp && inp.value.trim(); if (!t) return; inp.value = ''; toast('הטקסט נשלח למסך'); return; }
    case 'flooroff': { const f = floorOf(v); const list = S.D.filter((x) => x.floor === v && !S.hidden[x.id] && isLit(x)); S.dlg = { h: list.length === 1 ? `לכבות מסך אחד ${f.inName}?` : `לכבות ${list.length} מסכים ${f.inName}?`, ids: list.map((x) => x.id), names: list.map((x) => x.name) }; S.fx.add('dlg'); break; }
    case 'areamedia': case 'areaoff': { const list = S.D.filter((x) => x.area === AREA.name && isOn(x)); const n = list.length; S.dlg = { h: a === 'areaoff' ? `לכבות את כל ההתקנים בסלון?` : n === 1 ? 'לכבות מסך אחד בסלון?' : `לכבות ${n} מסכים בסלון?`, ids: list.map((x) => x.id), names: a === 'areaoff' ? ['תאורה: 2', 'מיזוג: 1', ...list.map((x) => x.name)] : list.map((x) => x.name) }; S.fx.add('dlg'); break; }
    case 'confirm': { const ids = S.dlg.ids; S.dlg = null; ids.forEach((i) => { const x = byId(i); S.pend[i] = true; setTimeout(() => { S.pend[i] = false; x.st = 'off'; if (x.cur.t === 'art') x.cur = { t: 'src', id: 'טלוויזיה' }; render(); }, 900); }); toast(`נשלח: כיבוי ${ids.length === 1 ? 'מסך אחד' : ids.length + ' מסכים'}`); return; }
    case 'closedlg': S.dlg = null; break;
    default: return;
  }
  render();
});
document.addEventListener('input', (e) => {
  const t = e.target; if (!$('#frame').contains(t)) return;
  if (t.dataset.input === 'q') { S.q = t.value; render(); }
  else if (t.dataset.range) { const d = byId(t.dataset.range); setVol(d, 0, Number(t.value)); }
});
document.addEventListener('change', (e) => { const t = e.target; if (t.dataset && t.dataset.range) render(); });
/* keyboard on an open remote: arrows / Enter / Backspace act as the remote's keys (not while typing) */
const KMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Enter: 'ok', Backspace: 'back', '+': 'volup', '-': 'voldown' };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.dlg) S.dlg = null; else if (S.menu) S.menu = false; else if (S.pop) S.pop = null; else if (S.floorMenu) S.floorMenu = false; else if (S.remote) { S.remote = null; S.more = false; } else return; render(); return; }
  if (!S.remote || S.edit) return;
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || (tg.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')))) return;
  const k = KMAP[e.key]; if (!k) return;
  const d = byId(S.remote); if (!d || !isOn(d)) return;
  const el = $(`#frame [data-key="${k}"]`); if (!el && !['volup', 'voldown'].includes(k)) return;
  e.preventDefault(); press(k, d, el);
});

buildBar(); readHash(); render();
</script>

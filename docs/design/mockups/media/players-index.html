/* ====================================================================================================
   CR-016 mockup ("players-index"). The SAME v2 Domus glass pass as docs/design/mockups/media/index.html (the approved TV
   mockup): layer 0 the light-only shell, layer 1 the `--dv-*` knobs of devices-themes.ts (palette "default", light, dark
   on data-devices-scheme="dark", phone sizes) plus the media knobs that shipped in frontend/src/styles/media-glass.ts as
   `--mm-*` (kept under their mockup names `--dv-*` here so both mockups diff cleanly), layer 2 element rules reading knobs
   only, layer 3 the solid fallback. New in this file: the PLAYER knobs (cover size, cover radius, the transport key sizes)
   marked "PROPOSED (players)". DomusUI (GPL-3.0) informed the ideas only; no code or CSS of it is used.
   ==================================================================================================== */
.frame{
  --sw-bg:#f5f7fb; --sw-surface:#ffffff; --sw-surface-3:#eef2f8; --sw-border:#e7ebf2; --sw-border-strong:#d5dbe6;
  --sw-text:#22314c; --sw-heading:#1e2e47; --sw-text-2:#5b6a85; --sw-text-3:#8a97ae;
  --sw-accent:#2767ed; --sw-accent-soft:#edf3ff; --sw-accent-text:#2767ed; --sw-focus:#2767ed; --sw-live:#22c55e; --sw-danger:#d92d20;
  --sw-font:"Heebo","Segoe UI",-apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
  --sw-font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
/* ---- 1a. palette "default", light ---- */
.frame[data-devices-style=glass]{
  --dv-color-scheme:light;
  --dv-backdrop:radial-gradient(1100px 560px at 85% -12%,rgba(255,184,86,.2),transparent 60%),radial-gradient(900px 520px at 8% 112%,rgba(10,132,255,.16),transparent 60%),linear-gradient(180deg,#eef2f9,#e5eaf4);
  --dv-surface:rgba(255,255,255,.64); --dv-surface-2:rgba(255,255,255,.5); --dv-surface-3:rgba(120,120,128,.14);
  --dv-surface-solid:#fbfcfe; --dv-surface-2-solid:#f2f5fa; --dv-surface-blur:blur(28px) saturate(1.7);
  --dv-border:rgba(60,60,67,.12); --dv-border-strong:rgba(60,60,67,.22); --dv-overlay:rgba(15,23,42,.38);
  --dv-font:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI','Noto Sans Hebrew','Heebo',Roboto,Arial,sans-serif;
  --dv-text:#1c1c1e; --dv-text-2:#4c4c50; --dv-text-3:#6e6e73;
  --dv-accent:#007aff; --dv-accent-hover:#0066d6; --dv-accent-soft:rgba(0,122,255,.13); --dv-accent-text:#0062cc; --dv-focus:#007aff;
  --dv-success:#34c759; --dv-success-soft:rgba(52,199,89,.16); --dv-warning:#ff9f0a; --dv-warning-soft:rgba(255,159,10,.16); --dv-warning-text:#8a4b00;
  --dv-danger:#d70015; --dv-danger-soft:rgba(255,59,48,.13); --dv-neutral-soft:rgba(120,120,128,.14); --dv-offline:#8e8e93;
  --dv-radius-sm:14px; --dv-radius-md:22px; --dv-radius-lg:28px; --dv-radius-control:999px;
  --dv-shadow-1:0 10px 30px rgba(31,45,80,.1),inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-2:0 18px 44px rgba(31,45,80,.16),inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-3:0 24px 64px rgba(15,23,42,.26); --dv-shadow-control:0 1px 4px rgba(0,0,0,.18);
  --dv-tile-on-warm:255 159 10; --dv-tile-on-cool:61 90 254; --dv-tile-on-switch:52 199 89;
  --dv-glow-fill-start:.3; --dv-glow-fill-end:.07; --dv-glow-border:.4; --dv-glow-halo:.22;
  --dv-icon-ring-size:36px; --dv-icon-ring-size-lg:40px; --dv-icon-ring-pad:9px;
  --dv-icon-ring-bg:rgba(120,120,128,.14); --dv-icon-ring-on-bg:rgba(255,255,255,.34); --dv-icon-ring-fg:#1c1c1e;
  --dv-card-badge-size:34px; --dv-toggle-on:#34c759;
  --dv-fs-title:16px; --dv-fs-tile-name:14px; --dv-fs-item-name:12.5px; --dv-fs-value-big:24px; --dv-fw-title:700;
  --dv-gap-lg:18px; --dv-gap:14px; --dv-gap-sm:10px; --dv-card-pad-block:18px; --dv-card-pad-inline:20px;
  --dv-item-pad-block:12px; --dv-item-pad-inline:14px; --dv-item-min-block:64px; --dv-hover-lift:-2px;
  /* media knobs (shipped as --mm-* in media-glass.ts) */
  --dv-surface-sheen:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 46%);
  --dv-accent-glow:rgba(0,122,255,.3);
  --dv-text-inverse:#ffffff;
  --dv-fs-page-title:44px; --dv-fs-page-title-compact:24px;
  --dv-art-glow-blur:46px; --dv-art-glow-alpha:.5; --dv-art-halo-alpha:.2; --dv-art-veil:rgba(255,255,255,.38);
  --dv-screen-off:linear-gradient(155deg,rgba(120,120,128,.2),rgba(120,120,128,.08));
  --dv-sheet-surface:rgba(248,250,253,.84); --dv-sheet-blur:blur(40px) saturate(1.8); --dv-sheet-w:440px;
  --dv-seg-thumb:#ffffff;
  --dv-key-size:52px; --dv-key-bg:linear-gradient(180deg,#ffffff,#eef1f6); --dv-key-fg:#1c1c1e;
  --dv-key-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 2px rgba(31,45,80,.12),0 4px 12px rgba(31,45,80,.08),0 0 0 1px rgba(60,60,67,.1);
  --dv-remote-body:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.4));
  --dv-motion:240ms; --dv-ease:cubic-bezier(.22,1,.36,1);
  /* PROPOSED (players): the cover, the transport keys, the member rows */
  --dv-cover-size:104px; --dv-cover-radius:18px; --dv-cover-size-sm:72px; --dv-cover-radius-sm:14px;
  --dv-cover-shadow:0 12px 28px rgb(var(--art, 20 24 34) / .32);
  --dv-tkey-size:48px; --dv-tkey-main-size:66px;
  --dv-member-row-h:52px;
}
/* ---- 1b. palette "default", dark: only on data-devices-scheme="dark" (never the OS scheme) ---- */
.frame[data-devices-style=glass][data-devices-scheme=dark]{
  --dv-color-scheme:dark;
  --dv-backdrop:radial-gradient(1200px 600px at 80% -10%,rgba(255,184,86,.22),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(10,132,255,.25),transparent 60%),#0a0a0c;
  --dv-surface:rgba(28,28,30,.72); --dv-surface-2:rgba(44,44,46,.62); --dv-surface-3:rgba(235,235,245,.14);
  --dv-surface-solid:#1c1c1e; --dv-surface-2-solid:#2c2c2e;
  --dv-border:rgba(255,255,255,.13); --dv-border-strong:rgba(255,255,255,.24); --dv-overlay:rgba(0,0,0,.55);
  --dv-text:#f5f5f7; --dv-text-2:rgba(235,235,245,.72); --dv-text-3:rgba(235,235,245,.56);
  --dv-accent:#0a84ff; --dv-accent-hover:#409cff; --dv-accent-soft:rgba(10,132,255,.26); --dv-accent-text:#64d2ff; --dv-focus:#64d2ff;
  --dv-success:#30d158; --dv-success-soft:rgba(48,209,88,.2); --dv-warning-soft:rgba(255,159,10,.2); --dv-warning-text:#ffb340;
  --dv-danger:#ff453a; --dv-danger-soft:rgba(255,69,58,.2); --dv-neutral-soft:rgba(142,142,147,.2);
  --dv-shadow-1:0 18px 48px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);
  --dv-shadow-2:0 22px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
  --dv-shadow-3:0 26px 70px rgba(0,0,0,.6); --dv-shadow-control:0 1px 4px rgba(0,0,0,.35);
  --dv-icon-ring-bg:rgba(235,235,245,.12); --dv-icon-ring-on-bg:rgba(255,255,255,.18); --dv-icon-ring-fg:#f5f5f7; --dv-toggle-on:#30d158;
  --dv-surface-sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 50%);
  --dv-accent-glow:rgba(10,132,255,.45); --dv-text-inverse:#1c1c1e;
  --dv-art-glow-alpha:.62; --dv-art-halo-alpha:.3; --dv-art-veil:rgba(18,18,20,.34);
  --dv-screen-off:linear-gradient(155deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
  --dv-sheet-surface:rgba(22,22,25,.84); --dv-seg-thumb:rgba(118,118,128,.5);
  --dv-key-bg:linear-gradient(180deg,rgba(78,78,84,.95),rgba(50,50,54,.95)); --dv-key-fg:#f5f5f7;
  --dv-key-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 10px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);
  --dv-remote-body:linear-gradient(180deg,rgba(58,58,62,.55),rgba(30,30,33,.35));
  --dv-cover-shadow:0 14px 32px rgb(var(--art, 0 0 0) / .45);
}
/* ---- 1c. phone sizes ---- */
.frame.dev-phone[data-devices-style=glass]{

.toast{position:absolute;z-index:90;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 24px);inset-block-end:26px;background:rgba(28,28,30,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 20px 11px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.1);font-size:13.5px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.25);display:flex;gap:9px;align-items:center;animation:pop var(--dv-motion) var(--dv-ease);font-family:var(--dv-font)}
.toast .ic{color:#30d158;font-size:16px}
.toast.bad .ic{color:#ff6961}
.dev-phone .toast{inset-block-end:calc(var(--bar-h) + 14px)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skl{background:linear-gradient(90deg,var(--dv-surface-3) 0%,var(--dv-surface-2) 50%,var(--dv-surface-3) 100%);background-size:200% 100%;animation:sh 1.6s linear infinite;border-radius:12px;display:block}
.statebox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:64px 24px}
.statebox .ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--dv-surface-3);color:var(--dv-text-2);font-size:32px;margin-bottom:4px}
.statebox b{font-size:18px;font-weight:600}.statebox p{margin:0;color:var(--dv-text-2);font-size:13.5px}
.errbar{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;padding-inline:16px 8px;border-radius:var(--dv-radius-md);background:linear-gradient(var(--dv-danger-soft),var(--dv-danger-soft)),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);border:1px solid color-mix(in srgb,var(--dv-danger) 30%,transparent);color:var(--dv-text);font-size:13.5px;font-weight:500}
.errbar>.ic{color:var(--dv-danger);font-size:18px}
.errbar .btn{margin-inline-start:auto}
.editbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px 10px 16px;padding-inline:16px 10px;border-radius:var(--dv-radius-md);background:var(--dv-surface-sheen),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);border:1px solid color-mix(in srgb,var(--dv-accent) 45%,transparent);box-shadow:var(--dv-shadow-1),0 0 0 4px var(--dv-accent-soft)}
.editbar .t{font-weight:700;display:flex;align-items:center;gap:8px}
.editbar .t .ic{color:var(--dv-accent-text);font-size:17px}

/* ---------------------------------------------------------------- Domus-like page header */
.dh{position:sticky;top:0;z-index:15;margin-inline:-36px;padding:16px 36px 4px;padding-inline-end:96px;display:flex;flex-direction:column;gap:12px;transition:background var(--dv-motion) var(--dv-ease),padding var(--dv-motion) var(--dv-ease),box-shadow var(--dv-motion)}
.dev-phone .dh{margin-inline:-14px;padding:12px 14px 2px;padding-inline-end:86px;gap:10px}
.dh.compact{padding-block:10px;background:var(--dv-surface-sheen),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);border-bottom:1px solid var(--dv-border);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.dh-tabs{display:flex;max-height:44px;transition:max-height var(--dv-motion) var(--dv-ease),opacity var(--dv-motion)}
.dev-phone .dh-tabs .seg{overflow-x:auto;scrollbar-width:none}
.dh.compact .dh-tabs,.dh.compact .dh-det{max-height:0;opacity:0;overflow:hidden;margin-block-end:-12px;pointer-events:none}
.dh-row{display:flex;align-items:center;gap:12px 18px;min-width:0}
.dh h1{margin:0;font-size:var(--dv-fs-page-title);font-weight:700;letter-spacing:-.035em;line-height:1.04;flex:none;transition:font-size var(--dv-motion) var(--dv-ease)}
.dh.compact h1{font-size:var(--dv-fs-page-title-compact)}
.dh h1.tin{animation:tin 460ms var(--dv-ease) both}
@keyframes tin{from{opacity:0;filter:blur(10px);transform:translateY(10px)}}
.dh .back{width:40px;height:40px;border-radius:50%;border:1px solid var(--dv-border);background:var(--dv-surface-sheen),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);display:grid;place-items:center;color:var(--dv-text);flex:none;box-shadow:var(--dv-shadow-control)}
.dh .back .ic{font-size:18px}
.rooms{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 18px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent,#000 18px,#000 calc(100% - 18px),transparent);cursor:grab;user-select:none;touch-action:pan-x}
.rooms::-webkit-scrollbar{display:none}
.rooms.dragging{cursor:grabbing}
.rc{flex:none;height:38px;padding:0 17px;border-radius:var(--dv-radius-control);border:1px solid var(--dv-border);background:var(--dv-surface-2);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);font-size:14px;font-weight:500;color:var(--dv-text-2);white-space:nowrap;transition:background var(--dv-motion),color var(--dv-motion)}
.rc:hover{color:var(--dv-text);background:var(--dv-surface)}
.rc[aria-pressed=true]{background:var(--dv-text);border-color:transparent;color:var(--dv-text-inverse);font-weight:600;box-shadow:var(--dv-shadow-control)}
.rc.plain{border:0;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0 10px;font-size:19px;font-weight:500;letter-spacing:-.02em;color:var(--dv-text-2)}
.rc.plain:hover{color:var(--dv-text)}
.dh.compact .rc.plain{font-size:15px}
.flwrap{position:relative;flex:none}
.floorbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding-inline:13px 12px;border-radius:var(--dv-radius-control);border:1px solid var(--dv-border);background:var(--dv-surface-sheen),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);box-shadow:var(--dv-shadow-control);font-size:13.5px;font-weight:600;color:var(--dv-text);white-space:nowrap}
.floorbtn .ic{font-size:17px;color:var(--dv-text-2)}
.floorbtn .ic:last-child{font-size:14px;transition:transform var(--dv-motion) var(--dv-ease)}
.floorbtn[aria-expanded=true] .ic:last-child{transform:rotate(180deg)}
.flwrap .pop{inset-block-start:calc(100% + 8px);inset-inline-end:0}
.dh-det{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-height:120px;transition:max-height var(--dv-motion) var(--dv-ease),opacity var(--dv-motion)}
.dh-det .amb{font-size:14px;color:var(--dv-text-2)}
.dh-det .amb em{font-style:normal;color:var(--dv-text);font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--dv-radius-control);background:var(--dv-surface-sheen),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);border:1px solid var(--dv-border);min-width:240px;color:var(--dv-text-2)}
.search:focus-within{outline:2px solid var(--dv-focus);outline-offset:1px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:13.5px;color:var(--dv-text)}
.search input::placeholder{color:var(--dv-text-2)}
.search .ic{font-size:16px}
.dev-phone .dh-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'b t f' 'r r r';gap:10px}
.dev-phone .dh-row h1{grid-area:t}
.dev-phone .dh-row .back{grid-area:b}
.dev-phone .dh-row .flwrap{grid-area:f}
.dev-phone .dh-row .rooms{grid-area:r;margin-inline:-14px;padding-inline:14px}
.dev-phone .dh-row:not(:has(.back)){grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'t f' 'r r'}
.dev-phone .dh.compact .rooms{display:none}
.dev-phone .dh-det .amb{display:none}
.dev-phone .dh-det .seg{overflow-x:auto;scrollbar-width:none}
.dev-phone .search{min-width:0;flex:1 1 100%}
.dev-phone .dh-det .btn{margin-inline-start:auto}

/* ---------------------------------------------------------------- floor sections */
.fsec{display:flex;flex-direction:column;gap:14px}
.sh{display:flex;align-items:flex-end;gap:12px;padding-inline:4px}
.sh h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.shlink{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:2px;border-radius:8px}
.shlink .ic{font-size:19px;color:var(--dv-text-3);transition:transform var(--dv-motion) var(--dv-ease)}
.shlink:hover .ic{transform:translateX(-3px)}
.shlink:focus-visible{outline:2px solid var(--dv-focus);outline-offset:2px}
.sh small{display:block;font-size:13px;color:var(--dv-text-2);margin-top:1px}
.sh small em{font-style:normal;color:var(--dv-text);font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:var(--dv-gap-lg);align-items:start}
.dev-phone .sgrid{grid-template-columns:minmax(0,1fr)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:var(--dv-gap-lg);align-items:start}
.dev-phone .pgrid{grid-template-columns:minmax(0,1fr)}

/* ---------------------------------------------------------------- the TV card (index.html, unchanged) */
.scard{position:relative;display:flex;flex-direction:column;gap:12px;padding:10px 10px 14px;min-width:0;transition:box-shadow var(--dv-motion) var(--dv-ease),transform var(--dv-motion) var(--dv-ease),border-color var(--dv-motion)}
.gbox{position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:0;pointer-events:none}
.gbox .art{inset:-35%;filter:blur(var(--dv-art-glow-blur)) saturate(1.5);opacity:var(--dv-art-glow-alpha);-webkit-mask-image:linear-gradient(180deg,#000 22%,transparent 88%);mask-image:linear-gradient(180deg,#000 22%,transparent 88%)}
.gbox::after{content:'';position:absolute;inset:0;background:var(--dv-art-veil)}
.scard>:not(.gbox):not(.pop):not(.ecard),.pcard>:not(.gbox):not(.pop):not(.ecard){position:relative;z-index:1}
.scard.lit,.pcard.lit{border-color:rgb(var(--art) / .34);box-shadow:0 22px 56px rgb(var(--art) / var(--dv-art-halo-alpha)),var(--dv-shadow-1)}
.scard.paused .gbox,.pcard.paused .gbox{opacity:.55}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .scard:not(.un):hover,.pcard:not(.un):hover{transform:translateY(var(--dv-hover-lift));box-shadow:var(--dv-shadow-2)}
  .scard.lit:hover,.pcard.lit:hover{box-shadow:0 26px 60px rgb(var(--art) / calc(var(--dv-art-halo-alpha) + .08)),var(--dv-shadow-2)}
}
.scard.un,.pcard.un{background:var(--dv-surface-2);box-shadow:none;border-style:dashed;border-color:var(--dv-border-strong)}
.shot{position:relative;display:block;width:100%;aspect-ratio:16/6.3;border-radius:calc(var(--dv-radius-md) - 8px);overflow:hidden;border:0;padding:0;color:#fff;text-align:start;background:var(--dv-screen-off);cursor:pointer;isolation:isolate;box-shadow:0 10px 26px rgb(var(--art, 20 24 34) / .28)}
.shot::after{content:'';position:absolute;inset:0;z-index:5;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);background:linear-gradient(118deg,rgba(255,255,255,.13),rgba(255,255,255,0) 36%);pointer-events:none}
.shot .ov{position:absolute;inset-inline:0;inset-block-end:0;padding:26px 16px 13px;background:linear-gradient(0deg,rgba(0,0,0,.66),rgba(0,0,0,0));display:flex;flex-direction:column;gap:1px;z-index:2}
.shot .ov b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.3)}
.shot .ov small{font-size:12.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .tl{position:absolute;inset-block-start:10px;inset-inline-start:10px;z-index:3;display:flex;gap:6px}
.shot .pb{position:absolute;inset-inline:14px;inset-block-end:7px;height:3px;border-radius:3px;background:rgba(255,255,255,.25);z-index:3;overflow:hidden}
.shot .pb i{display:block;height:100%;width:var(--p,0%);background:#fff;border-radius:3px}
.shot .ctr{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--dv-text-2);font-size:12.5px;font-weight:500}
.shot .ctr .ic{font-size:24px;stroke-width:1.6}
.shot.off{box-shadow:none}
.sbody{display:flex;flex-direction:column;gap:12px;padding-inline:6px}
.srow{display:flex;align-items:center;gap:12px;min-width:0}
.srow .tx,.mt .tx,.pcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.srow .tx b,.pcard .tx b{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tx small,.pcard .tx small{font-size:13px;color:var(--dv-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sctl{display:flex;align-items:center;gap:8px;min-width:0}
.unl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dv-text-2)}
.unl .ic{color:var(--dv-danger)}
.ecard{position:absolute;inset-block-start:12px;inset-inline-end:12px;z-index:6;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--dv-sheet-surface);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:var(--dv-shadow-control);border:1px solid var(--dv-border)}
.ecard button,.ecard span{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--dv-text)}
.ecard button:hover{background:var(--dv-surface-3)}
.ecard .ic{font-size:16px}
.editing .scard,.editing .pcard,.editing .gcard{outline:2px dashed color-mix(in srgb,var(--dv-accent) 55%,transparent);outline-offset:4px}
.editing .hid{opacity:.45}
.dev-phone .scard{display:grid;grid-template-columns:112px minmax(0,1fr) auto;grid-template-areas:'shot tx pw' 'ctl ctl ctl';gap:12px 12px;padding:8px 8px 10px}
.dev-phone .sbody,.dev-phone .srow{display:contents}
.dev-phone .srow .tx{grid-area:tx;align-self:center}
.dev-phone .srow .pw{grid-area:pw;align-self:center}
.dev-phone .shot{grid-area:shot;aspect-ratio:16/10.5;border-radius:14px}
.dev-phone .shot .ov{padding:14px 9px 7px}.dev-phone .shot .ov b{font-size:12px}.dev-phone .shot .ov small,.dev-phone .shot .tl{display:none}
.dev-phone .shot .ctr .ic{font-size:22px}.dev-phone .shot .ctr span{display:none}
.dev-phone .shot .pb{inset-inline:8px;inset-block-end:4px}
.dev-phone .sctl{grid-area:ctl;padding-inline:2px}

/* the "poster": a gradient of our own hue and a neutral glyph, or the proxied cover art (mockup: never a logo) */
.art{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,var(--a1),var(--a2));overflow:hidden}
.art::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 78% 18%,rgba(255,255,255,.3),transparent 45%),radial-gradient(circle at 10% 110%,rgba(0,0,0,.35),transparent 55%)}
.art .gl{position:absolute;inset-inline-end:-2%;inset-block-start:-6%;width:60%;height:auto;aspect-ratio:1;color:rgba(255,255,255,.16);stroke-width:1.1}
.art .ch{position:absolute;inset-block-start:8%;inset-inline-end:8%;font-size:68px;font-weight:800;letter-spacing:-.04em;color:rgba(255,255,255,.22);direction:ltr}
/* cover art: square, the glyph centred and larger (album covers are square; a station shows the radio glyph) */
.art.cover .gl{inset:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;color:rgba(255,255,255,.5);stroke-width:1.2}
.art.cover::before{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.34),transparent 48%),radial-gradient(circle at 85% 100%,rgba(0,0,0,.38),transparent 55%)}
.art.cover.vinyl::after{content:'';position:absolute;inset:14%;border-radius:50%;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 0 10px rgba(0,0,0,.08),inset 0 0 0 11px rgba(255,255,255,.1)}

/* ==================================================================================================
   PLAYER CARD (<media-player-card>): a horizontal card - square cover with the art glow, name + state + group chip,
   play/pause as the main key, then the controls row (volume, mute, source, "נגן"). Receivers get the neutral tile.
   ================================================================================================== */
.pcard{position:relative;display:grid;grid-template-columns:var(--dv-cover-size) minmax(0,1fr) auto;grid-template-areas:'cov tx main' 'ctl ctl ctl';gap:12px 14px;align-items:center;padding:10px 12px 12px 10px;padding-inline:10px 14px;min-width:0;transition:box-shadow var(--dv-motion) var(--dv-ease),transform var(--dv-motion) var(--dv-ease),border-color var(--dv-motion)}
.pcard.pop-open{z-index:20}
.cov{grid-area:cov;position:relative;display:block;width:var(--dv-cover-size);height:var(--dv-cover-size);border-radius:var(--dv-cover-radius);overflow:hidden;border:0;padding:0;background:var(--dv-screen-off);color:#fff;cursor:pointer;isolation:isolate;box-shadow:var(--dv-cover-shadow);transition:transform 140ms var(--dv-ease)}
.cov:active{transform:scale(.97)}
.cov::after{content:'';position:absolute;inset:0;z-index:5;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);background:linear-gradient(118deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%);pointer-events:none}
.cov .ctr{position:absolute;inset:0;display:grid;place-items:center;color:var(--dv-text-2);font-size:26px;z-index:2}
.cov .ctr .ic{stroke-width:1.5}
.cov.off,.cov.un,.cov.idle{box-shadow:none}
.cov.un{background:repeating-linear-gradient(135deg,var(--dv-surface-3) 0 10px,transparent 10px 20px),var(--dv-surface-2)}
.cov .pilld{position:absolute;inset-block-start:7px;inset-inline-start:7px;z-index:3;height:22px;padding:0 8px;font-size:11px}
.cov .pb{position:absolute;inset-inline:8px;inset-block-end:6px;height:3px;border-radius:3px;background:rgba(255,255,255,.25);z-index:3;overflow:hidden}
.cov .pb i{display:block;height:100%;width:var(--p,0%);background:#fff;border-radius:3px}
.cov .live{position:absolute;inset-block-end:7px;inset-inline-start:8px;z-index:3;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.cov .live i{width:6px;height:6px;border-radius:50%;background:#ff453a;box-shadow:0 0 6px #ff453a;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.cov .pend{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.32);z-index:4;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.cov .pend i{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
/* the receiver tile: a neutral glass tile with the source name */
.cov.rcv{background:var(--dv-key-bg);color:var(--dv-text);box-shadow:var(--dv-key-shadow)}
.cov.rcv .ctr{color:var(--dv-text);display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;padding:8px;text-align:center;line-height:1.2}
.cov.rcv .ctr .ic{font-size:26px;color:var(--dv-text-2)}
.cov.rcv .ctr span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cov.rcv.off .ctr{color:var(--dv-text-3)}
.pcard .tx{grid-area:tx;align-self:center;gap:3px}
.pcard .tx .st{display:flex;align-items:center;gap:6px 8px;min-width:0;flex-wrap:wrap}
.pcard .tx .st small{flex:0 1 auto}
.pcard .tx small.now{color:var(--dv-text);font-weight:500;font-size:13px;unicode-bidi:plaintext;text-align:start}
.pcard .tx small.now .sep{color:var(--dv-text-3)}
.pcard .tx small.bad{color:var(--dv-danger);font-weight:600}
.pcard .main{grid-area:main;align-self:center}
.pcard .sctl{grid-area:ctl;flex-wrap:wrap}
/* play/pause main key: the dark key of the remote's playback row */
.pk{position:relative;flex:none;width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--dv-text);color:var(--dv-text-inverse);box-shadow:0 8px 20px rgba(0,0,0,.2);transition:transform 120ms var(--dv-ease),background var(--dv-motion),box-shadow var(--dv-motion)}
.pk .ic{font-size:22px;stroke-width:2}
.pk:active{transform:scale(.92)}
.pk.idle{background:var(--dv-key-bg);color:var(--dv-text);box-shadow:var(--dv-key-shadow)}
.pk[disabled]{opacity:.38;pointer-events:none;box-shadow:none}
.pk.pend::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-top-color:var(--dv-accent);animation:spin .8s linear infinite}
.pk.nack{box-shadow:0 0 0 3px var(--dv-danger-soft),0 0 0 1.5px var(--dv-danger)}
.pcard .pop{inset-block-start:calc(100% - 10px);inset-inline-start:10px}
.dev-phone .pcard{gap:10px 12px;padding:8px 10px 10px 8px;padding-inline:8px 10px}
.dev-phone .pcard .tx b{font-size:15px}
.dev-phone .pk{width:46px;height:46px}

/* ==================================================================================================
   GROUPS tab: live group card, static group card, saved group card
   ================================================================================================== */

  { id: 'p4', name: 'מסיבה', leader: 'liv', members: ['liv', 'kit', 'per', 'par', 'off'], vols: { liv: 45, kit: 45, per: 50, par: 30, off: 35 } },
];
const AREA = {
  name: 'סלון', floor: 'g', rooms: ['סלון', 'מטבח', 'פרגולה', 'חדר אורחים', 'כניסה', 'מרפסת'],
  lights: [['תקרה', true, 80], ['פסי לד', true, 40], ['מנורת עמידה', false, 0], ['ספוט תמונה', false, 0]],

};

const newState = (ma = true) => ({
  screen: 'players', dev: 'd1440', scheme: 'light', tab: 'players', q: '', filt: 'all', floor: 'all', area: null, floorMenu: false, compact: false,
  state: 'normal', nolib: false, edit: false, notes: false, fail: false, joinFail: false, ma,
  panel: null, ptab: 'fav', byRoom: false, pop: null, dlg: null, toast: null, menu: false, zone: 'main',
  D: ma ? SEED() : SEED_SONOS(), T: ma ? TVS() : TVS_SONOS(), P: ma ? PRESETS() : PRESETS_SONOS(), sugg: (ma ? SUGG.ma : SUGG.sonos).slice(),
  pend: {}, nack: {}, outcome: {}, prun: {}, ticks: {}, joinT: 0, hidden: {}, fx: new Set(['title']),
  favHidden: {}, kindsOn: { fav: true, sta: true, pls: true }, sopen: {},

let S = newState();
let toastT = 0;
const byId = (id) => S.D.find((d) => d.id === id);

const leaderOf = (d) => (d.group && d.group.role === 'member' ? byId(d.group.of) : d);

const groupOf = (d) => { const l = leaderOf(d); return l.group && l.group.role === 'leader' ? [l, ...membersOf(l)] : [l]; };
const inGroup = (d) => !!(d.group && (d.group.role === 'member' || (d.group.role === 'leader' && d.group.members.length)));

const ceilOf = (d) => (d.max == null ? null : d.max);

const roomName = (d) => d.area || 'ללא חדר';

/* what the card shows: the state line, the cover, the glow colour (an RGB triplet like --dv-tile-on-*) */
function viewOf(d) {
  if (d.st === 'unavailable') return { kind: 'un', line: `${roomName(d)} · לא זמין`, rgb: null };
  if (d.st === 'off') return { kind: 'off', line: `${roomName(d)} · כבוי`, rgb: null };
  if (d.kind === 'receiver') return { kind: 'rcv', line: `${roomName(d)} · ${d.src}${d.mode ? ' · ' + d.mode : ''}`, rgb: null };
  const l = leaderOf(d), n = l.now;
  if (!n || l.st === 'idle') return { kind: 'idle', line: `${roomName(d)} · לא מנגן`, rgb: null };
  const rgb = trip(n.t[1]);
  /* the state line stays Hebrew; the now-playing names go on their own bidi-isolated line (nowLine) */
  if (d.group && d.group.role === 'member') return { kind: l.st, now: n, rgb, line: `מנגן עם ${l.area || l.name}${l.st === 'paused' ? ' · מושהה' : ''}`, member: true };
  return { kind: l.st, now: n, rgb, line: `${roomName(d)} · ${l.st === 'paused' ? 'מושהה' : n.station ? 'תחנה' : 'מנגן'}` };
}
const nowLine = (n) => (n ? `<small class="now">${B(n.title)}${n.station || !n.artist ? '' : `<span class="sep"> · </span>${B(n.artist)}`}</small>` : '');
function coverArt(n, cls = '') {
  if (!n) return '';

}
const glowHTML = (v) => `<span class="gbox" aria-hidden="true">${v.rgb && v.now ? coverArt(v.now) : ''}</span>`;
function giHTML(key, cls = '') {
  const it = itemOf(key);
  return `<span class="gi ${cls}" style="--a1:${it.t[0]};--a2:${it.t[1]};--art:${trip(it.t[1])}">${ic(it.g)}</span>`;
}

/* ==================================================================================================
   Player card
   ================================================================================================== */
function vrockHTML(d) {
  if (!has(d, 'vset')) return '';
  const cap = ceilOf(d), capped = cap != null && d.vol >= cap;
  return `<span class="vrock ${d.mute ? 'muted' : ''} ${capped ? 'capped' : ''}" role="group" aria-label="עוצמה · ${esc(d.name)}"${capped ? ` title="תקרה ${cap}"` : ''}><button data-a="vol" data-id="${d.id}" data-v="-1" aria-label="הנמך">${ic('minus')}</button><span class="vv" data-volval="${d.id}">${d.vol}</span><button data-a="vol" data-id="${d.id}" data-v="1" aria-label="הגבר" ${capped ? 'disabled' : ''}>${ic('plus')}</button></span>`;
}
const muteHTML = (d) => `<button class="rb ${d.mute ? 'muted' : ''}" data-a="mute" data-id="${d.id}" aria-pressed="${d.mute}" aria-label="${d.mute ? 'בטל השתקה' : 'השתק'}" title="${d.mute ? 'בטל השתקה' : 'השתק'}">${ic(d.mute ? 'volOff' : 'vol')}</button>`;
const openBtn = (d) => `<button class="rbtn" data-a="panel" data-id="${d.id}" aria-label="${d.kind === 'receiver' ? 'שלט' : 'נגן'} · ${esc(d.name)}">${ic(d.kind === 'receiver' ? 'remote' : 'music')}${d.kind === 'receiver' ? 'שלט' : 'נגן'}</button>`;
function srcBtnHTML(d) {

}
function srcPopHTML(d) {
  return `<div class="pop" role="menu" aria-label="בחירת מקור">${d.srcs.map((s) => `<button role="menuitemradio" aria-checked="${s === d.src}" data-a="pick-src" data-id="${d.id}" data-v="${esc(s)}">${ic(s.includes('Bluetooth') ? 'bt' : s.includes('רדיו') ? 'radio' : s.includes('טלוויזיה') ? 'tv' : 'hdmi')}${B(s)}${s === d.src ? `<span class="ck">${ic('check')}</span>` : ''}</button>`).join('')}</div>`;
}
function pwHTML(d) {
  const on = isOn(d);
  const dis = !capsKnown(d) || !has(d, 'pw') || ro();
  const tip = !capsKnown(d) ? 'לא זמין' : !has(d, 'pw') ? 'אין הפעלה מרחוק' : on ? 'כבה' : 'הפעל';
  return `<button class="pw ${on ? 'on' : ''} ${S.pend['pw' + d.id] ? 'pend' : ''} ${S.nack[d.id] ? 'nack' : ''}" data-a="power" data-id="${d.id}" aria-pressed="${on}" aria-label="${tip} · ${esc(d.name)}" title="${tip}" ${dis ? 'disabled' : ''}>${ic('power')}</button>`;
}
function playKeyHTML(d, cls = '') {
  const l = leaderOf(d), playing = l.st === 'playing' && !!l.now, idle = !l.now || l.st === 'idle';
  const dis = !capsKnown(d) || d.st === 'off' || ro();

}
function coverHTML(d, v) {

  if (v.kind === 'un') return `<button class="cov un" data-a="panel" data-id="${d.id}" aria-label="${esc(lbl)}"><span class="ctr">${ic('wifiOff')}</span></button>`;
  if (v.kind === 'off') return `<button class="cov off" data-a="panel" data-id="${d.id}" aria-label="${esc(lbl)}"><span class="ctr">${ic('power')}</span>${pend}</button>`;
  if (v.kind === 'rcv') return `<button class="cov rcv" data-a="panel" data-id="${d.id}" aria-label="${esc(lbl)}"><span class="ctr">${ic(d.src.includes('Bluetooth') ? 'bt' : d.src.includes('רדיו') ? 'radio' : 'tv')}<span>${B(d.src.split(' · ')[0])}</span></span>${pend}</button>`;
  if (v.kind === 'idle') return `<button class="cov idle" data-a="panel" data-id="${d.id}" aria-label="${esc(lbl)}"><span class="ctr">${ic(d.kind === 'player' ? 'media' : 'speaker')}</span>${pend}</button>`;

function gchipHTML(d) {

  if (!inGroup(d)) return '';
  const g = groupOf(d);
  if (d.group.role === 'leader') return `<span class="gchip">${ic('group')}${g.length} חדרים</span>`;

/* ==================================================================================================
   Players tab
   ================================================================================================== */
function filtered() {
  const q = S.q.trim();
  let list = vis();
  if (S.floor !== 'all') list = list.filter((d) => (d.floor || 'none') === S.floor);
  if (S.area) list = list.filter((d) => (S.area === '__none' ? !d.area : d.area === S.area));
  if (q) list = list.filter((d) => (d.name + (d.area || '')).includes(q));
  if (S.filt === 'on') list = list.filter((d) => isPlaying(d));
  if (S.filt === 'off') list = list.filter((d) => d.st === 'off' || (isOn(d) && !isPlaying(d)));
  if (S.filt === 'un') list = list.filter((d) => d.st === 'unavailable');
  return list;
}
function skeletonHTML() {
  const card = '<div class="pcard glass"><span class="skl" style="width:var(--dv-cover-size);height:var(--dv-cover-size);border-radius:var(--dv-cover-radius)"></span><div class="tx"><span class="skl" style="height:16px;width:55%"></span><span class="skl" style="height:12px;width:40%;margin-top:8px"></span></div><span class="skl" style="width:50px;height:50px;border-radius:50%"></span><span class="skl" style="grid-area:ctl;height:40px;border-radius:999px"></span></div>';
  return `<section class="fsec"><div class="sh"><div><span class="skl" style="height:22px;width:130px"></span><span class="skl" style="height:13px;width:90px;margin-top:8px"></span></div></div><div class="pgrid">${card.repeat(S.dev === 'phone' ? 3 : 6)}</div></section>`;
}
function floorSection(f, items, all) {
  const playing = all.filter(isPlaying).length;
  const pauseBtn = playing && !ro() && !S.edit && f.id !== 'none' ? `<button class="btn sm quiet" data-a="floorpause" data-v="${f.id}">${ic('pause')}עצור מוזיקה</button>` : '';
  const sub = f.id === 'none' ? `${N(all.length)} ללא חדר` : `${N(all.length)} התקנים${playing ? ` · <em>${N(playing)}</em> מנגנים` : ''}`;
  const h2 = f.id === 'a:*' ? f.name : `<button class="shlink" data-a="floorpick" data-v="${f.id}">${f.name}${ic('chevronBack')}</button>`;
  return `<section class="fsec" aria-label="${f.name}"><header class="sh"><div><h2>${h2}</h2><small>${sub}</small></div><span class="grow"></span>${pauseBtn}</header><div class="pgrid">${items.map(pcardHTML).join('')}</div></section>`;
}
function playersBodyHTML() {
  if (S.state === 'loading') return skeletonHTML();
  if (S.state === 'empty') return `<div class="statebox glass"><span class="ring">${ic('speaker')}</span><b>אין נגנים</b><p>נגנים שיאושרו בהגדרות › מולטימדיה יופיעו כאן.</p></div>`;
  const list = filtered();
  const err = S.state === 'error' ? `<div class="errbar" role="alert">${ic('warning')}הרענון האחרון נכשל. המצב עשוי להיות לא עדכני.<button class="btn sm" data-a="toast" data-v="מרענן...">נסה שוב</button></div>` : '';
  const ebar = S.edit ? `<div class="editbar"><span class="t">${ic('edit')}עריכת מסך הנגנים</span><span class="grow"></span><button class="btn sm quiet" data-a="toast" data-v="השינויים בוטלו">ביטול</button><button class="btn sm primary" data-a="editdone">${ic('check')}סיום</button></div>` : '';
  if (!list.length) return err + ebar + `<div class="statebox glass"><span class="ring">${ic('search')}</span><b>לא נמצאו נגנים</b><button class="btn sm" data-a="clearq">נקה סינון</button></div>`;
  let groups;
  if (hasFloors()) {
    groups = [...FLOORS, UNPLACED].map((f) => {
      const items = list.filter((d) => (d.floor || 'none') === f.id); if (!items.length) return '';
      const all = vis().filter((d) => (d.floor || 'none') === f.id);
      return floorSection(f, items, all);

  } else {
    /* no floors in this installation (system-K): one list, the room chips are the filter; the unplaced keep their section */
    const placed = list.filter((d) => d.area), un = list.filter((d) => !d.area);
    const secName = S.area && S.area !== '__none' ? S.area : 'כל החדרים';

      + (un.length ? floorSection(UNPLACED, un, vis().filter((d) => !d.area)) : '');

function screensBodyHTML() {
  return `<div style="display:flex;flex-direction:column;gap:30px">${FLOORS.map((f) => { const items = S.T.filter((t) => t.floor === f.id); if (!items.length) return ''; const on = items.filter((t) => t.st !== 'off').length; return `<section class="fsec"><header class="sh"><div><h2><button class="shlink">${f.name}${ic('chevronBack')}</button></h2><small>${N(items.length)} מסכים${on ? ` · <em>${N(on)}</em> פועלים` : ''}</small></div><span class="grow"></span>${on && !ro() ? `<button class="btn sm quiet dz" data-a="toast" data-v="(מוקאפ המסכים)">${ic('power')}כבה מסכים</button>` : ''}</header><div class="sgrid">${items.map(tvCardHTML).join('')}</div></section>`; }).join('')}</div>`;

/* ==================================================================================================

  const favRows = (kind, title) => `<div class="fgrp"><h3>${title}</h3>${LIB[kind].map(([k]) => { const it = itemOf(k), off = !!S.favHidden[k]; return `<div class="frow ${off ? 'off' : ''}"><span class="grip">${ic('grip')}</span>${giHTML(k)}<div class="nm"><b>${B(it.title)}</b><small>${B(it.artist)}</small></div><button class="tg" role="switch" aria-checked="${!off}" data-a="s-fav" data-v="${k}" aria-label="הצג: ${esc(it.title)}"></button></div>`; }).join('')}</div>`;
  const favs = `<div class="sc"><h2>מועדפים ותחנות<span class="cnt">רשימה אחת לכולם</span></h2>
    <div class="srw"><span class="lbl2">לשוניות בנגן<span class="mut">אילו רשימות מופיעות בחלונית הנגן</span></span><span class="gwrap">${[['fav', 'מועדפים'], ['sta', 'תחנות'], ['pls', 'פלייליסטים']].filter(([k]) => S.ma || k !== 'pls').map(([k, l]) => `<label class="f inline">${l}<button class="tg" role="switch" aria-checked="${S.kindsOn[k]}" data-a="s-kind" data-v="${k}" aria-label="${l}"></button></label>`).join('')}</span></div>

  const np = S.ma ? NONPHYS.ma : NONPHYS.sonos;

    ${np.length ? `<div class="srw"><span class="lbl2">רכיבים לא פיזיים<span class="mut">${np.length} רשומות: סשנים, קבוצות עזר ושירותים · לא מוצגים כנגנים ולא מוצעים לאיחוד</span></span><button class="sb" data-a="s-toggle" data-v="np">${S.sopen.np ? 'הסתר' : 'הצג'}</button></div>${S.sopen.np ? np.map(([n, k]) => `<div class="srw"><span class="lbl2">${esc(n)}</span><span class="badge">${NP_LABEL[k]}</span></div>`).join('') : ''}` : ''}</div>`;

    ${S.ma ? `<div class="srw"><span class="lbl2">חיבור ישיר ל־Music Assistant<span class="mut">שלב 2ב: תור מלא, ספרייה מלאה, עוצמת קבוצה מקורית · דורש חשבון וטוקן</span></span><span class="gwrap"><span class="badge">שלב מאוחר יותר</span><button class="sb" disabled>${ic('lock')}הגדר</button></span></div>` : ''}</div>`;
  const perms = `<div class="sc"><h2>הרשאות</h2>
    <div class="srw"><span class="lbl2">קיבוץ רמקולים וקבוצות שמורות<span class="mut"><span class="mono">media.group</span> · מפעיל, מנהל אתר, מנהל מערכת · קבוצה של 4 חדרים ומעלה או יותר מקומה אחת מבקשת אישור; כל הבניין רק למנהל</span></span><button class="slink" data-a="toast" data-v="תפקידים והרשאות (מחוץ למוקאפ)">תפקידים והרשאות ›</button></div>

    <div class="srw"><span class="lbl2">הכרזות<span class="mut">לא ב־0.1.150</span></span><span class="badge">לא פעיל</span></div></div>`;
  return `<div class="sp"><h1>מולטימדיה</h1><div class="subh">${S.T.length} מסכים · ${approved} נגנים מאושרים${pending ? ` · ${pending} ממתינים לאישור` : ''}${S.sugg.length ? ` · ${S.sugg.length} הצעות איחוד` : ''}</div>${note}${general}${screens}${plist}${merge}${groups}${favs}${conn}${perms}</div>`;

<script>
'use strict';
/* ==================================================================================================
   Shell: rail with the מולטימדיה entry, bottom bar, floating corner, user menu, dialogs, toast
   ================================================================================================== */
const NAV = [['home', 'ראשי', 'home'], ['sec', 'אבטחה', 'shield'], ['map', 'מפה', 'map'], ['media', 'מולטימדיה', 'media'], ['wis', 'WisKey', 'door']];
const activeNav = () => (S.screen === 'area' ? 'home' : S.screen === 'settings' ? '' : 'media');
function railHTML() {
  return `<nav class="rail" aria-label="ניווט ראשי"><span class="brand-tile" aria-hidden="true">S</span>${NAV.map(([id, l, i]) => `<a class="item ${id === activeNav() ? 'active' : ''}" href="#" data-a="nav" data-v="${id}" title="${l}" ${id === activeNav() ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span></a>`).join('')}<div class="grow"></div><button class="me" data-a="menu" aria-haspopup="menu" aria-expanded="${S.menu}" title="התפריט שלי"><span class="avatar">יו</span><span>יוני</span></button></nav>`;
}
function bottomHTML() {
  return `<nav class="bottom" aria-label="ניווט ראשי">${NAV.map(([id, l, i]) => `<a href="#" class="${id === activeNav() ? 'active' : ''}" data-a="nav" data-v="${id}" ${id === activeNav() ? 'aria-current="page"' : ''}><span class="icp">${ic(i)}</span><span>${l}</span></a>`).join('')}<button data-a="menu" aria-haspopup="menu" aria-expanded="${S.menu}"><span class="icp"><span class="avatar">יו</span></span><span>יוני</span></button></nav>`;
}
const floatHTML = () => `<div class="float"><div class="pillrow"><button aria-label="מצב המערכת: תקין" title="המערכת תקינה"><i></i></button><button aria-label="חיפוש">${ic('search', 16)}</button></div></div>`;
function menuHTML() {
  return `<div class="scrim clear" data-a="closemenu"></div><div class="usermenu" role="menu" aria-label="התפריט שלי"><div class="uh"><span class="avatar">יו</span><div><b>יוני</b><small>מנהל מערכת</small></div></div>
  ${S.screen === 'players' && S.tab === 'players' ? `<button class="mi key" role="menuitem" data-a="editon">${ic('edit')}עריכת מסך הנגנים</button>` : ''}
  ${S.screen === 'players' && S.tab === 'groups' ? `<button class="mi key" role="menuitem" data-a="editon">${ic('edit')}עריכת הקבוצות השמורות</button>` : ''}
  <button class="mi" role="menuitem" data-a="gosettings">${ic('settings')}הגדרות › מולטימדיה</button>
  <button class="mi" role="menuitem" data-a="toast" data-v="ההתראות שלי (מחוץ למוקאפ)">${ic('bell')}ההתראות שלי</button><button class="mi" role="menuitem" data-a="toast" data-v="התנתקות (מחוץ למוקאפ)">${ic('user')}התנתקות</button></div>`;
}
function dlgHTML() {
  const d = S.dlg; if (!d) return '';
  if (d.kind === 'preset-edit') {
    const p = d.p;
    const cands = vis().filter((x) => x.kind !== 'receiver' && has(x, 'grp') && x.st !== 'unavailable');
    return `<div class="scrim" data-a="closedlg"></div><div class="dlg shell ${S.fx.has('dlg') ? 'enter' : ''}" role="dialog" aria-label="${p.id ? 'עריכת קבוצה' : 'קבוצה חדשה'}"><h3>${p.id ? 'עריכת קבוצה שמורה' : 'קבוצה שמורה חדשה'}</h3>
      <label class="fld">${ic('star')}<input type="text" placeholder="שם הקבוצה" value="${esc(p.name)}" data-input="pname" maxlength="40"></label>
      <div class="ckl">${cands.map((x) => `<label class="ckb"><input type="checkbox" data-pm="${x.id}" ${p.members.includes(x.id) ? 'checked' : ''}> ${esc(x.name)}<small>${esc(roomName(x))}${x.floor ? ' · ' + floorOf(x.floor).name : ''}</small></label>`).join('')}</div>
      <div class="acts"><button class="sb" data-a="closedlg">ביטול</button><button class="sb pri" data-a="psave">${ic('check')}שמור</button></div></div>`;
  }
  const ring = d.danger ? 'dz' : '';
  return `<div class="scrim" data-a="closedlg"></div><div class="dlg ${S.fx.has('dlg') ? 'enter' : ''}" role="alertdialog" aria-label="${esc(d.h)}"><div class="dh3"><span class="ring ${ring}">${ic(d.icon || 'group')}</span><h3>${esc(d.h)}</h3></div>${d.sub ? `<p style="margin:0;color:var(--dv-text-2);font-size:13.5px">${esc(d.sub)}</p>` : ''}${d.names && d.names.length ? `<details><summary>פרטים</summary><ul>${d.names.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}<div class="acts"><button class="btn quiet" data-a="closedlg">ביטול</button><button class="btn ${d.danger ? 'danger' : 'primary'}" data-a="confirm">${esc(d.ok || 'אישור')}</button></div></div>`;
}
function frameHTML() {
  let main;
  if (S.screen === 'area') main = `<main class="main dvx" id="main" tabindex="-1">${areaHTML()}</main>`;
  else if (S.screen === 'settings') main = `<main class="main shellpage" id="main" tabindex="-1">${settingsHTML()}</main>`;
  else main = `<main class="main dvx" id="main" tabindex="-1">${mediaHTML()}</main>`;
  return `${railHTML()}${main}${bottomHTML()}${floatHTML()}${S.panel ? panelHTML() : ''}${S.menu ? menuHTML() : ''}${dlgHTML()}${S.toast ? `<div class="toast ${S.toast.bad ? 'bad' : ''}" role="status">${ic(S.toast.bad ? 'warning' : 'check')}${esc(S.toast.m)}</div>` : ''}`;
}

/* ==================================================================================================
   Design notes (mockup chrome)
   ================================================================================================== */
function notesHTML() {
  return `<h2>הערות עיצוב · נגנים ורמקולים (CR-016)</h2>
  <h3>עקרונות</h3><ul>
  <li>כרטיס אחד לכל <b>התקן פיזי</b>. ישות Music Assistant / Sonos / HEOS היא <b>שכבת המוזיקה</b> של אותו כרטיס (תור, ערבוב, חזרה, ספרייה, קיבוץ); הישות של היצרן / Cast היא שכבת ההפעלה והמקור. לעולם לא כרטיס שני.</li>
  <li>הבקרות נגזרות מהדגלים החיים של נקודת קצה <b>זמינה</b>; "לא זמין" = יכולות לא ידועות (הבקרות האחרונות מושבתות), לא "אין יכולות".</li>
  <li>שכבת קיבוץ אחת לכל התקן (MA כשקיים, אחרת היצרן; Cast לעולם לא). חברות בקבוצה = איחוד כל ה־<code>group_members</code> + <code>active_queue</code>. "קיבוץ לא תואם" כשההתקן מקובץ בשתי שכבות.</li>
  <li>עוצמה: תקרה רק כשמנהל הגדיר (סימן צהוב קטן על המחוון); עוצמת קבוצה = fan-out יחסי עם תוצאה לפי חדר בשם.</li>
  <li>צירוף: סימון חדרים, איחוד ל־diff אחד אחרי 500ms; 4 חדרים+ או יותר מקומה אחת → אישור עם ספירה; תוצאה אמיתית לכל חדר ("פרגולה לא הצטרף").</li>
  <li>בלי ספריית מוזיקה (MA לא זמין / לא מותקן וללא Sonos): הכרטיסים עובדים, בחלונית אין לשוניות ספרייה ו"הבא בתור" = "לא זמין". בלי קומות: קיבוץ לפי חדר.</li>
  <li>מסכי מפעיל נקיים: בלי הסברים, בלי שמות תשתית; ההגדרות שומרות שמות טכניים.</li></ul>
  <h3>knobs חדשים (PROPOSED, players)</h3><ul><li><code>--dv-cover-size(-sm)</code> <code>--dv-cover-radius(-sm)</code> <code>--dv-cover-shadow</code> <code>--dv-tkey-size</code> <code>--dv-tkey-main-size</code> <code>--dv-member-row-h</code>. כל השאר: הידיות של media-glass.ts ו־devices-themes.ts ללא שינוי.</li></ul>
  <h3>מיפוי בקרות לשכבה</h3>
  <table><tr><th>בקרה</th><th>בית עם MA (H, V)</th><th>בית בלי MA (K · Sonos)</th></tr>
  <tr><td>ניגון, דילוג, ערבוב, חזרה</td><td>ישות MA</td><td>ישות Sonos</td></tr>
  <tr><td>הפעלה / כיבוי</td><td>יצרן (WiiM, Cast, Denon); MA כגיבוי</td><td>אין (Sonos ללא on/off)</td></tr>
  <tr><td>עוצמה</td><td>יצרן עם VOLUME_SET, אחרת MA</td><td>Sonos</td></tr>
  <tr><td>מקורות, מצב שמע</td><td>Denon (לפי אזור) / Onkyo</td><td>—</td></tr>
  <tr><td>מועדפים / תחנות / פלייליסטים</td><td>MA get_library (config entry מתגלה בגשר)</td><td>Sonos favourites (select_source); בלי פלייליסטים</td></tr>
  <tr><td>הבא בתור</td><td>MA get_queue: נוכחי + הבא + כמות</td><td>queue_position / queue_size בלבד</td></tr>
  <tr><td>קיבוץ</td><td>MA join/unjoin (חוצה מותגים); HEOS/WiiM מוסתרים</td><td>Sonos join/unjoin; קבוצות עזר = קיצור וירטואלי</td></tr>
  <tr><td>העברת מוזיקה</td><td>MA transfer_queue</td><td>—</td></tr>
  <tr><td>הכרזות</td><td colspan="2">לא ב־0.1.150 (6א)</td></tr></table>
  <h3>הרשאות</h3><ul><li><code>media.read</code> צפייה · <code>media.control</code> ניגון, עוצמה, מועדפים, העברה · <code>media.power</code> הפעלה ומקור · <code>media.group</code> (חדש) קיבוץ וקבוצות שמורות · <code>media.bulk</code> עצירת קומה, קבוצה בכל הבניין.</li></ul>`;
}

    case 'hide': S.hidden[id] = !S.hidden[id]; break;
    case 'toast': toast(v); return;
    case 'pop': S.pop = S.pop === (v === 'tr' ? 'tr' + id : id) ? null : (v === 'tr' ? 'tr' + id : id); break;
    case 'panel': S.pop = null; if (S.panel !== id) { S.fx.add('sheet'); S.byRoom = false; S.zone = 'main'; } S.panel = id; break;
    case 'pclose': S.panel = null; S.pop = null; break;
    case 'ptab': S.ptab = v; break;
    case 'byroom': S.byRoom = S.byRoom === v || S.byRoom === true ? false : (v === '1' ? true : v); break;
    case 'zone': S.zone = v; break;
    case 'power': if (d) powerTo(d, !isOn(d)); return;
    case 'zpower': if (d) { const z = zoneOf(d); if (z) command(d, 'z', () => { z.on = !z.on; }); } return;
    case 'toggle': if (d) toggleTransport(d); return;
    case 'tp': if (d) { const l = leaderOf(d); if (v === 'toggle') toggleTransport(l); else if (v === 'shuffle') { l.shuffle = !l.shuffle; render(); } else if (v === 'repeat') { l.repeat = l.repeat === 'off' ? 'all' : l.repeat === 'all' ? 'one' : 'off'; render(); } else if (v === 'next' || v === 'prev') { if (l.now && !l.now.station) { const k = l.queue && l.queue.next && v === 'next' ? l.queue.next : l.now.key; l.now = nowFrom(k, 0); if (l.queue) { l.queue.index += v === 'next' ? 1 : -1; l.queue.next = S.ma ? (k === 't:blue' ? 't:allblues' : 't:blue') : null; } } render(); } el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 180); } return;
    case 'vol': if (d) setVol(d, Number(v) * 2); return;
    case 'mute': if (d) { d.mute = !d.mute; } break;
    case 'pick-src': S.pop = null; if (d) command(d, 'src', () => { d.src = v; if (d.st === 'off') d.st = 'on'; }); return;
    case 'pick-zsrc': if (d) { const z = zoneOf(d); if (z) command(d, 'z', () => { z.src = v; }); } return;
    case 'pick-mode': if (d) command(d, 'mode', () => { d.mode = v; }); return;
    case 'playitem': if (d) playItem(leaderOf(d), v); return;
    case 'tick': if (d) tick(d, v); return;
    case 'leave': if (d) { S.pend['join' + d.id] = true; render(); setTimeout(() => { S.pend['join' + d.id] = false; ungroup(d, true); toast(`${d.area || d.name} נותק`); }, 800); } return;
    case 'ungroup': if (d) { const n = groupOf(d).length; S.dlg = { kind: 'ungroup', h: `לפרק את הקבוצה (${n} חדרים)?`, sub: d.st === 'playing' ? 'המוזיקה תימשך רק ב' + (d.area || d.name) + '.' : '', ok: 'פרק', icon: 'unlink', leader: d.id }; S.fx.add('dlg'); } break;
    case 'preset': { const p = S.P.find((x) => x.id === id); if (p) applyPreset(p); return; }
    case 'transfer': S.pop = null; if (d) transferTo(d, v); return;
    case 'floorpause': floorPause(v); return;
    case 'areapause': { const list = vis().filter((x) => x.area === AREA.name && isPlaying(x) && (!x.group || x.group.role !== 'member')); S.dlg = { kind: 'pause', h: list.length === 1 ? 'לעצור את המוזיקה בסלון?' : `לעצור את המוזיקה ב־${list.length} התקנים בסלון?`, names: list.map((x) => x.name), ok: 'עצור', icon: 'pause', ids: list.map((x) => x.id) }; S.fx.add('dlg'); break; }
    case 'confirm': { const g = S.dlg; S.dlg = null; if (g.kind === 'join') sendJoin(byId(g.leader), true); else if (g.kind === 'preset') applyPreset(S.P.find((x) => x.id === g.preset), true); else if (g.kind === 'ungroup') { ungroup(byId(g.leader)); toast('הקבוצה פורקה'); } else if (g.kind === 'pause') { g.ids.forEach((i) => { const x = byId(i); S.pend['pb' + i] = true; setTimeout(() => { S.pend['pb' + i] = false; x.st = 'paused'; membersOf(x).forEach((m) => (m.st = 'paused')); render(); }, 900); }); toast(`נשלח: עצירת מוזיקה ב־${g.ids.length === 1 ? 'חדר אחד' : g.ids.length + ' חדרים'}`); } else if (g.kind === 'pdel') { S.P = S.P.filter((x) => x.id !== g.preset); toast('הקבוצה נמחקה'); } return; }
    case 'closedlg': if (S.dlg && S.dlg.kind === 'join') { const dr = joinDraft[S.dlg.leader]; if (dr) { [...dr.add, ...dr.remove].forEach((i) => (S.pend['join' + i] = false)); delete joinDraft[S.dlg.leader]; } } S.dlg = null; break;
    case 'pnew': S.menu = false; S.dlg = { kind: 'preset-edit', p: { id: '', name: '', members: [] } }; S.fx.add('dlg'); break;
    case 'pedit': { const p = S.P.find((x) => x.id === id); S.dlg = { kind: 'preset-edit', p: { ...p, members: [...p.members] } }; S.fx.add('dlg'); break; }
    case 'pdel': { const p = S.P.find((x) => x.id === id); S.dlg = { kind: 'pdel', h: `למחוק את "${p.name}"?`, ok: 'מחק', icon: 'trash', danger: true, preset: id }; S.fx.add('dlg'); break; }
    case 'psave': { const p = S.dlg.p; const name = ($('[data-input="pname"]') || {}).value || ''; const members = $$('[data-pm]').filter((c) => c.checked).map((c) => c.dataset.pm); if (!name.trim() || members.length < 2) { shakeEl($('.dlg')); return; } const leader = members[0]; if (p.id) { const x = S.P.find((y) => y.id === p.id); Object.assign(x, { name: name.trim(), members, leader: members.includes(x.leader) ? x.leader : leader }); } else S.P.push({ id: 'p' + Date.now(), name: name.trim(), leader, members, vols: null }); S.dlg = null; toast('נשמר'); return; }
    /* settings */
    case 's-approve': if (d) { d.approved = !d.approved; note('s' + d.id, 'נשמר', 2500); } return;
    case 's-approve-all': S.D.forEach((x) => { if (!x.approved) x.approved = true; }); toast('אושרו כל הנגנים'); return;
    case 's-night': if (d) { d.night = d.night ? null : { from: '22:00', to: '07:00', max: 30 }; note('s' + d.id, 'נשמר', 2500); } return;
    case 's-eps': S.sopen[id] = !S.sopen[id]; break;
    case 's-toggle': S.sopen[v] = !S.sopen[v]; break;
    case 's-fav': S.favHidden[v] = !S.favHidden[v]; note('settings', 'נשמר', 2500); return;
    case 's-kind': S.kindsOn[v] = !S.kindsOn[v]; note('settings', 'נשמר', 2500); return;
    case 's-merge': { const s = S.sugg.find((x) => x.id === id); S.sugg = S.sugg.filter((x) => x.id !== id); toast(`אוחד: ${s.a} ← ${s.b}`); return; }
    case 's-ignore': S.sugg = S.sugg.filter((x) => x.id !== id); toast('ההצעה הוסרה'); return;
    default: return;
  }
  render();
});
document.addEventListener('input', (e) => {
  const t = e.target; if (!$('#frame').contains(t)) return;
  if (t.dataset.input === 'q') { S.q = t.value; render(); }
  else if (t.dataset.range) { if (!gate(t)) { t.value = byId(t.dataset.range).vol; return; } const d = byId(t.dataset.range); const before = d.vol; const got = setVol(d, 0, Number(t.value)); if (got < Number(t.value)) { t.value = got; t.style.setProperty('--v', got + '%'); } if (d.group && d.group.role === 'leader') { const g = groupOf(d).filter((m) => m.st !== 'off' && m.st !== 'unavailable'); const gv = Math.max(...g.map((m) => m.vol)); $$(`[data-gvolval="${d.id}"]`).forEach((x) => (x.textContent = gv)); const r = $(`[data-grange="${d.id}"]`); if (r) { r.value = gv; r.style.setProperty('--v', gv + '%'); } } void before; }
  else if (t.dataset.grange) { if (!gate(t)) return; setGroupVol(byId(t.dataset.grange), Number(t.value)); }
  else if (t.dataset.zrange) { const d = byId(t.dataset.zrange), z = zoneOf(d); if (z) { z.vol = Number(t.value); t.style.setProperty('--v', z.vol + '%'); $$(`[data-zvolval="${d.id}"]`).forEach((x) => (x.textContent = z.vol)); } }
  else if (t.dataset.seek) { const d = byId(t.dataset.seek); if (d && d.now) { d.now.pos = Number(t.value); t.style.setProperty('--v', Math.round(d.now.pos / d.now.dur * 100) + '%'); $$(`[data-pos="${d.id}"]`).forEach((x) => (x.textContent = mmss(d.now.pos))); } }
});
document.addEventListener('change', (e) => {
  const t = e.target; if (!$('#frame').contains(t)) return;
  if (t.dataset.range || t.dataset.grange) { render(); return; }
  if (t.dataset.seek) { const d = byId(t.dataset.seek); if (d) command(d, 'seek', () => { }); return; }
  const d = t.dataset.id ? byId(t.dataset.id) : null;
  if (t.dataset.sinput && d) {
    const k = t.dataset.sinput, val = t.value.trim();
    if (k === 'name') d.name = val || d.name;
    else if (k === 'max') d.max = val === '' ? null : Math.max(0, Math.min(100, Number(val)));
    else if (k === 'nfrom' && d.night) d.night.from = val; else if (k === 'nto' && d.night) d.night.to = val; else if (k === 'nmax' && d.night) d.night.max = Math.max(0, Math.min(100, Number(val)));
    if (d.max != null && d.vol > d.max) d.vol = d.max;
    note('s' + d.id, 'נשמר', 2500);
  } else if (t.dataset.ssel && d) {
    const k = t.dataset.ssel, val = t.value;
    if (k === 'kind') d.kind = val; else if (k === 'area') { d.area = val || null; d.floor = val ? (hasFloors() ? (['סלון', 'מטבח', 'פרגולה', 'חדר אורחים', 'כניסה', 'מרפסת'].includes(val) ? 'g' : ['מרתף', 'חדר כושר'].includes(val) ? 'b' : 'u1') : null) : null; } else if (k === 'amp') d.amp = val || null;
    note('s' + d.id, 'נשמר', 2500);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.dlg) S.dlg = null; else if (S.menu) S.menu = false; else if (S.pop) S.pop = null; else if (S.floorMenu) S.floorMenu = false; else if (S.panel) S.panel = null; else return; render(); return; }
  if (!S.panel || S.dlg) return;
  const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT')) return;
  const d = byId(S.panel); if (!d || !isOn(d)) return;
  if (e.key === ' ' && !(tg && tg.tagName === 'BUTTON')) { e.preventDefault(); toggleTransport(d); }
  else if (e.key === '+' || e.key === '=') { e.preventDefault(); setVol(d, 2); }
  else if (e.key === '-') { e.preventDefault(); setVol(d, -2); }
});

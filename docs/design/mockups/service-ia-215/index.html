<!doctype html>

<head>

<title>ניהול השירות - מבנה הניווט המוצע</title>
<!--
  SERVICE-IA (2026-10-23) - clickable NAVIGATION mock-up of the service-management area for the owner's decision.
  NOT product code: self-contained, no network request, fake data only. Companion documents: docs/changes/SERVICE-IA-INVENTORY.md and
  docs/changes/SERVICE-IA-PROPOSAL.md.

  Owner standing rule: every mock-up follows the visual language of the existing infrastructure temperature / elevators / schedules-automations
  screens. This file therefore uses the product's real token table (frontend/src/design/tokens.ts, classic skin, light + dark - copied verbatim
  from the approved maintenance-215 mock-up), the real shell (shell/sw-app.ts design A: the area rail on the inline-start side, no top bar,
  the floating search / status pill; phone: the areas bottom bar), the real tab rows (components/sw-tabs.ts: level 1 = pill track, level 2 =
  compact underline row, nav.ts TAB_STYLE_DEFAULTS), the real page head (screens/infra-temperature.ts .top: crumbs + h1 + subtitle + actions),
  the KPI row of the temperature / elevators screens, the places tree of components/sw-place-tree.ts, the electricity table (table.t), the
  segmented control of the tickets list (.seg), the solid badge / soft chip pair, and the sw-state-panel states.

  What it shows: the FOUR job-based sections (level 1) and their pages (level 2) as clickable navigation; the content of every page is a
  placeholder in the real list / table look. A role switch (עובד / מטפל / מנהל / מנהל מערכת) draws what each role is offered. A "לפני / אחרי"
  map compares today's flat row of nine tabs with the proposal. Every page shows its canonical href - NO existing href is renamed.
  URL switches: ?role=emp|handler|mgr|admin  ?sec=requests|maintenance|vendors|reports  ?page=<id>  ?theme=dark  ?map=1
-->
<style>
/* ===== the product token table (frontend/src/design/tokens.ts, classic skin) - the names used by the real screens ===== */
:root {
  --sw-bg: #f5f7fb; --sw-surface: #ffffff; --sw-surface-2: #f7f9fc; --sw-surface-3: #eef2f8; --sw-surface-solid: #ffffff;
  --sw-menu-surface: #ffffff; --sw-menu-border: #e7ebf2; --sw-border: #e7ebf2; --sw-border-strong: #e1e6ef; --sw-overlay: rgba(17,24,39,.45);
  --sw-text: #22314c; --sw-heading: #1e2e47; --sw-text-2: #4b5976; --sw-text-3: #5e6d88; --sw-text-inverse: #ffffff;
  --sw-accent: #2767ed; --sw-accent-hover: #1f57d1; --sw-accent-soft: #edf3ff; --sw-accent-text: #2062ec; --sw-focus: #2767ed;
  --sw-live: #22c55e; --sw-offline: #9aa3b5; --sw-offline-soft: #f1f3f7; --sw-offline-text: #666d7a;
  --sw-unknown: #b3bac7; --sw-unknown-soft: #f4f6f9; --sw-unknown-text: #666d7a;
  --sw-danger: #ef4444; --sw-danger-soft: #fdecec; --sw-danger-text: #b91c1c;
  --sw-warning: #f59e0b; --sw-warning-soft: #fff4e0; --sw-warning-text: #b45309;
  --sw-success: #22c55e; --sw-success-soft: #e8f8ee; --sw-success-text: #117d39;
  --sw-forbidden: #dc2626; --sw-forbidden-soft: #fdecec; --sw-stale: #f59e0b; --sw-stale-soft: #fff4e0;
  --sw-font: "Heebo", "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans Hebrew", Roboto, Arial, sans-serif;
  --sw-font-mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  --sw-fs-2xs: 10px; --sw-fs-xs: 11px; --sw-fs-sm: 12.5px; --sw-fs-base: 13px; --sw-fs-md: 14px; --sw-fs-lg: 15px; --sw-fs-xl: 17px; --sw-fs-2xl: 20px; --sw-fs-3xl: 26px;
  --sw-fs-state: 12px; --sw-lh: 1.5; --sw-fw-regular: 400; --sw-fw-medium: 500; --sw-fw-semibold: 600; --sw-fw-bold: 700;
  --sw-h1-weight: 700; --sw-h1-tracking: -0.6px;
  --sw-s-1: 4px; --sw-s-2: 8px; --sw-s-3: 12px; --sw-s-4: 16px; --sw-s-8: 32px; --sw-page-pad: 30px; --sw-rail-w: 70px; --sw-bottomnav-h: 50px;
  --sw-r-2xs: 4px; --sw-r-xs: 6px; --sw-r-sm: 8px; --sw-r-md: 12px; --sw-r-lg: 14px; --sw-r-xl: 14px; --sw-r-pill: 999px;
  --sw-shadow-1: 0 1px 2px rgba(16,24,40,.04); --sw-shadow-2: 0 6px 18px rgba(34,49,76,.06); --sw-shadow-3: 0 14px 36px rgba(34,49,76,.14);
  --sw-shadow-primary: 0 1px 2px rgba(39,103,237,.25);
  --sw-ctl-h-sm: 26px; --sw-disabled-opacity: .5; --sw-hover-wash: rgba(20,30,50,.05); --sw-focus-w: 2px; --sw-focus-offset: 2px;
  --sw-skeleton: #eef2f8; --sw-skeleton-shine: rgba(255,255,255,.65); --sw-toast-bg: #1e2e47; --sw-toast-text: #ffffff;
  --sw-touch-desktop: 44px; --sw-t-fast: 120ms; --sw-ease: cubic-bezier(.2,0,0,1); --sw-z-topbar: 30; --sw-z-modal: 50; --sw-z-toast: 60;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --sw-bg: #0d1220; --sw-surface: #151c2c; --sw-surface-2: #1a2336; --sw-surface-3: #222d44; --sw-surface-solid: #151c2c;
  --sw-menu-surface: #151c2c; --sw-menu-border: #232e45; --sw-border: #232e45; --sw-border-strong: #2f3c58; --sw-overlay: rgba(0,0,0,.62);
  --sw-text: #e6ebf5; --sw-heading: #f3f6fc; --sw-text-2: #a9b4ca; --sw-text-3: #8896af; --sw-text-inverse: #ffffff;
  --sw-accent: #3a6ce0; --sw-accent-hover: #5a88f2; --sw-accent-soft: rgba(91,140,255,.18); --sw-accent-text: #8fb2ff; --sw-focus: #7aa2ff;
  --sw-live: #3ddc84; --sw-offline: #8b96a8; --sw-offline-soft: rgba(139,150,168,.2); --sw-offline-text: #b4bdcc;
  --sw-unknown: #6b7686; --sw-unknown-soft: rgba(107,118,134,.22); --sw-unknown-text: #aab5c9;
  --sw-danger: #ff6b62; --sw-danger-soft: rgba(255,107,98,.2); --sw-danger-text: #ff8a82;
  --sw-warning: #f5b043; --sw-warning-soft: rgba(245,176,67,.2); --sw-warning-text: #f5b043;
  --sw-success: #3ddc84; --sw-success-soft: rgba(61,220,132,.18); --sw-success-text: #3ddc84;
  --sw-forbidden: #ff7a70; --sw-forbidden-soft: rgba(255,122,112,.2); --sw-stale: #f5b043; --sw-stale-soft: rgba(245,176,67,.2);
  --sw-shadow-1: 0 1px 2px rgba(0,0,0,.35); --sw-shadow-2: 0 6px 18px rgba(0,0,0,.4); --sw-shadow-3: 0 14px 36px rgba(0,0,0,.55);
  --sw-shadow-primary: 0 1px 2px rgba(0,0,0,.4); --sw-hover-wash: rgba(255,255,255,.06); --sw-skeleton: #222d44; --sw-skeleton-shine: rgba(255,255,255,.08);
  --sw-toast-bg: #2c3a57; --sw-toast-text: #f3f6fc; color-scheme: dark;
}
/* the state looks of the temperature screen (temperature/styles.ts): --c = the colour, --c-text = the text on its soft fill */
[data-look="ok"] { --c: var(--sw-success); --c-text: var(--sw-success-text); --c-soft: var(--sw-success-soft); }
[data-look="warn"] { --c: var(--sw-warning); --c-text: var(--sw-warning-text); --c-soft: var(--sw-warning-soft); }
[data-look="alarm"] { --c: var(--sw-danger); --c-text: var(--sw-danger-text); --c-soft: var(--sw-danger-soft); }
[data-look="off"] { --c: var(--sw-offline); --c-text: var(--sw-offline-text); --c-soft: var(--sw-offline-soft); }
[data-look="unk"] { --c: var(--sw-unknown); --c-text: var(--sw-unknown-text); --c-soft: var(--sw-unknown-soft); }
[data-look="acc"] { --c: var(--sw-accent); --c-text: var(--sw-accent-text); --c-soft: var(--sw-accent-soft); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--sw-bg); color: var(--sw-text); font-family: var(--sw-font); font-size: var(--sw-fs-md); line-height: var(--sw-lh); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; }
.ltr, .num, code { direction: ltr; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; }
code { font-family: var(--sw-font-mono); font-size: var(--sw-fs-xs); background: var(--sw-surface-3); padding: 1px 5px; border-radius: var(--sw-r-2xs); }
:focus-visible { outline: var(--sw-focus-w) solid var(--sw-focus); outline-offset: var(--sw-focus-offset); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
svg.ic { inline-size: 1em; block-size: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--sw-accent-text); }

/* ===== mock-up-only controls ===== */
.mock { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 12px; background: var(--sw-toast-bg); color: var(--sw-toast-text); font-size: var(--sw-fs-sm); position: sticky; inset-block-start: 0; z-index: 70; }
.mock b { margin-inline-end: 6px; }
.mock select, .mock button { font: inherit; font-size: var(--sw-fs-sm); border: 1px solid rgba(255,255,255,.25); background: transparent; color: inherit; border-radius: var(--sw-r-pill); padding: 3px 10px; min-block-size: 28px; cursor: pointer; }
.mock select option { color: #1e2e47; }
.mock button[aria-pressed="true"] { background: rgba(255,255,255,.18); }
.mock .sp { flex: 1; }
.mock .roles { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--sw-r-pill); background: rgba(255,255,255,.08); }
.mock .roles button { border: 0; }

/* ===== the shell (shell/sw-app.ts, design A) ===== */
.app { display: grid; grid-template-columns: var(--sw-rail-w) minmax(0, 1fr); grid-template-areas: 'rail main'; min-block-size: calc(100dvh - 40px); position: relative; }
nav.rail { grid-area: rail; display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px 7px 10px; background: var(--sw-surface); border-inline-end: 1px solid var(--sw-border); }
.brand { align-self: center; display: grid; place-items: center; inline-size: 36px; block-size: 36px; border-radius: var(--sw-r-md); background: var(--sw-accent); color: var(--sw-text-inverse); font-weight: 800; font-size: var(--sw-fs-xl); margin-block-end: 8px; box-shadow: var(--sw-shadow-primary); }
nav.rail a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-inline-size: 56px; min-block-size: 52px; padding: 6px 4px; border-radius: var(--sw-r-md); color: var(--sw-text-2); text-decoration: none; font-size: 10.5px; font-weight: var(--sw-fw-medium); line-height: 1.3; white-space: nowrap; }
nav.rail a svg { font-size: 22px; color: var(--sw-text-3); }
nav.rail a:hover { background: var(--sw-surface-3); color: var(--sw-text); }
nav.rail a.active { background: var(--sw-accent-soft); color: var(--sw-accent-text); font-weight: var(--sw-fw-semibold); }
nav.rail a.active svg { color: var(--sw-accent); }
nav.rail a.active::after { content: ''; position: absolute; inset-inline-end: -8px; inset-block: 16px; inline-size: 3px; border-radius: 3px; background: var(--sw-accent); }
nav.rail .grow { flex: 1; }
.me { align-self: center; display: grid; place-items: center; inline-size: 36px; block-size: 36px; border-radius: 50%; background: var(--sw-surface-3); color: var(--sw-text-2); font-weight: var(--sw-fw-semibold); font-size: var(--sw-fs-sm); }
.cnt { position: absolute; inset-block-start: 4px; inset-inline-end: 8px; min-inline-size: 16px; block-size: 16px; padding-inline: 4px; border-radius: var(--sw-r-pill); background: var(--sw-danger); color: #fff; font-size: 10px; font-weight: var(--sw-fw-bold); line-height: 16px; text-align: center; }
.float { position: absolute; inset-block-start: 8px; inset-inline-end: 22px; z-index: var(--sw-z-topbar); }
.float .pillrow { display: inline-flex; align-items: center; block-size: 34px; padding-inline: 4px; border-radius: var(--sw-r-pill); background: var(--sw-surface); border: 1px solid var(--sw-border); box-shadow: var(--sw-shadow-1); }
.float .pillrow > span { display: grid; place-items: center; inline-size: 28px; block-size: 28px; border-radius: 50%; color: var(--sw-text-2); font-size: 16px; }
.float .sysdot i { display: block; inline-size: 9px; block-size: 9px; border-radius: 50%; background: var(--sw-live); }
main { grid-area: main; min-inline-size: 0; display: flex; flex-direction: column; }

/* the tab rows (components/sw-tabs.ts): level 1 = pill track, level 2 = compact underline row */
.subnav { padding: 12px 24px 0; display: flex; align-items: center; gap: 12px; }
.subnav.l2 { padding-block-start: 8px; }
.tabs { display: inline-flex; max-inline-size: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .row { position: relative; display: inline-flex; flex: none; gap: 2px; }
.tabs a { position: relative; display: inline-flex; align-items: center; color: var(--sw-text-2); text-decoration: none; font-size: var(--sw-fs-sm); font-weight: var(--sw-fw-medium); white-space: nowrap; cursor: pointer; }
.tabs a:hover { color: var(--sw-text); }
.tabs a.on { color: var(--sw-accent-text); }
.tabs.pill .row { padding-inline: 3px; }
.tabs.pill .row::before { content: ''; position: absolute; inset: 0; background: var(--sw-surface-3); border-radius: var(--sw-r-md); }
.tabs.pill a { min-block-size: 34px; padding-inline: 1px; }
.tabs.pill a .lbl { display: inline-flex; align-items: center; gap: 6px; min-block-size: 28px; padding: 0 12px; border-radius: var(--sw-r-sm); }
.tabs.pill a.on .lbl { background: var(--sw-surface); box-shadow: var(--sw-shadow-1); font-weight: var(--sw-fw-semibold); }
.tabs.compact { display: flex; position: relative; }
.tabs.compact .row { flex: 1 0 auto; gap: 0; }
.tabs.compact .row::after { content: ''; position: absolute; inset-inline: 0; inset-block-start: 31px; block-size: 1px; background: var(--sw-border); }
.tabs.compact a { align-items: flex-start; padding: 0 10px; min-block-size: 32px; }
.tabs.compact a .lbl { display: inline-flex; align-items: center; gap: 6px; min-block-size: 30px; }
.tabs.compact a::after { content: ''; position: absolute; inset-inline: 0; inset-block-start: 29px; block-size: 2px; z-index: 1; }
.tabs.compact a.on::after { background: var(--sw-accent); }
.tabs .bdg { min-inline-size: 18px; block-size: 18px; padding-inline: 6px; border-radius: var(--sw-r-pill); background: var(--sw-danger-soft); color: var(--sw-danger-text); font-size: var(--sw-fs-xs); font-weight: var(--sw-fw-semibold); display: inline-grid; place-items: center; }
.tabs .dot { inline-size: 7px; block-size: 7px; border-radius: 50%; background: var(--sw-danger); }
.tabs a .short { display: none; }
.tabs a.reserved .lbl { color: var(--sw-text-3); font-style: italic; }
.subnav .act { margin-inline-start: auto; }
@media (max-width: 767px) and (pointer: coarse) { .tabs a { min-block-size: 44px; } }

/* ===== the screen (screens/infra-temperature.ts :host / .top / .kpis) ===== */
.screen { display: none; flex-direction: column; gap: 16px; padding: 14px var(--sw-page-pad) 28px; max-inline-size: var(--sw-content-max, 1400px); inline-size: 100%; }
.screen.on { display: flex; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: var(--sw-fs-2xl); font-weight: var(--sw-h1-weight); letter-spacing: var(--sw-h1-tracking); color: var(--sw-heading); line-height: 1.2; }
.top .sub { margin: 2px 0 0; font-size: var(--sw-fs-sm); color: var(--sw-text-3); }
.top .crumbs { font-size: var(--sw-fs-xs); color: var(--sw-text-3); margin-block-end: 2px; display: flex; gap: 4px; flex-wrap: wrap; }
.top .crumbs a { color: inherit; text-decoration: none; }
.top .crumbs a:hover { color: var(--sw-accent-text); }
.top .sp { flex: 1; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.href { font-family: var(--sw-font-mono); font-size: var(--sw-fs-xs); color: var(--sw-text-3); direction: ltr; unicode-bidi: isolate; background: var(--sw-surface-2); border: 1px solid var(--sw-border); border-radius: var(--sw-r-xs); padding: 2px 7px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--sw-r-pill); border: 1px solid var(--sw-border); background: var(--sw-surface); color: var(--sw-text); font: inherit; font-size: var(--sw-fs-sm); font-weight: var(--sw-fw-medium); padding: 6px 14px; min-block-size: 32px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--sw-border-strong); }
.btn.pri { background: var(--sw-accent); border-color: var(--sw-accent); color: var(--sw-text-inverse); box-shadow: var(--sw-shadow-primary); }
.btn.pri:hover { background: var(--sw-accent-hover); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--sw-accent-text); }
.btn.sm { padding: 4px 10px; min-block-size: 0; font-size: var(--sw-fs-sm); }
.btn svg { font-size: 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.kpi { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--sw-r-md); background: var(--sw-surface); border: 1px solid var(--sw-border); box-shadow: var(--sw-shadow-1); font: inherit; color: inherit; text-align: start; cursor: pointer; --c: var(--sw-accent); }
.kpi[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent); }
.kpi .dot { inline-size: 12px; block-size: 12px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
.kpi b { display: block; font-size: var(--sw-fs-2xl); line-height: 1; font-variant-numeric: tabular-nums; color: var(--sw-heading); }
.kpi span.l { font-size: var(--sw-fs-state); color: var(--sw-text-2); }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--sw-r-pill); padding: 3px 11px; white-space: nowrap; background: var(--c); color: var(--sw-text-inverse); font-size: var(--sw-fs-sm); font-weight: var(--sw-fw-semibold); line-height: 1.4; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: var(--sw-r-pill); padding: 2px 9px; line-height: 1.5; font-size: var(--sw-fs-xs); font-weight: var(--sw-fw-medium); background: var(--sw-surface-2); color: var(--sw-text-2); white-space: nowrap; }
.chip[data-look] { background: var(--c-soft); color: var(--c-text); }
.panel { background: var(--sw-surface); border: 1px solid var(--sw-border); border-radius: var(--sw-r-lg); box-shadow: var(--sw-shadow-1); }
.panel.flush { overflow: hidden; }
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.cols.one { grid-template-columns: minmax(0, 1fr); }
/* the places tree (components/sw-place-tree.ts) */
.tree { display: flex; flex-direction: column; gap: 2px; padding: 8px; }
.tree button { display: flex; align-items: center; gap: var(--sw-s-2); min-block-size: 36px; padding-inline: var(--sw-s-3); border: 0; border-radius: var(--sw-r-sm); background: transparent; color: var(--sw-text); font: inherit; font-size: var(--sw-fs-sm); text-align: start; cursor: pointer; inline-size: 100%; }
.tree button:hover { background: var(--sw-hover-wash); }
.tree button .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .floor .name { font-weight: var(--sw-fw-semibold); }
.tree .depth-1 { padding-inline-start: var(--sw-s-4); }
.tree button[aria-current="true"] { background: var(--sw-accent-soft); color: var(--sw-accent-text); }
.tree .n { font-size: var(--sw-fs-xs); color: var(--sw-text-3); font-variant-numeric: tabular-nums; }
.tree-m { display: none; }
/* toolbar: search (shell .search), segmented control (tickets-list .seg) */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-block-end: 1px solid var(--sw-border); }
.search { flex: 1; min-inline-size: 160px; display: flex; align-items: center; gap: 8px; block-size: 32px; padding: 0 10px; border: 1px solid var(--sw-border); border-radius: var(--sw-r-sm); background: var(--sw-surface-2); color: var(--sw-text-3); }
.search input { flex: 1; border: 0; background: transparent; font: inherit; font-size: var(--sw-fs-sm); color: var(--sw-text); outline: none; min-inline-size: 0; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sw-surface-3); border-radius: var(--sw-r-sm); max-inline-size: 100%; }
.seg button { padding: 5px 12px; border-radius: calc(var(--sw-r-sm) - 2px); color: var(--sw-text-2); cursor: pointer; font: inherit; font-size: var(--sw-fs-sm); white-space: nowrap; border: 0; background: transparent; min-block-size: 28px; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--sw-surface-solid); color: var(--sw-text); font-weight: var(--sw-fw-semibold); box-shadow: var(--sw-shadow-1); }
.seg .n { color: var(--sw-text-3); font-size: var(--sw-fs-xs); margin-inline-start: 4px; }

        h += kpis([{ n: 14, l: 'פתוחות' }, { n: 3, l: 'ממתינות לי', look: 'warn' }, { n: 2, l: 'תקועות', look: 'alarm' }, { n: 5, l: 'נסגרו השבוע', look: 'ok' }, { n: 2, l: 'ממתינות לאישורי', look: 'acc' }]);
        h += '<div class="mapgrid"><div class="panel flush"><div class="group-h">איפה תקוע</div>' + table(['מקום', 'תקועות', 'ללא מטפל', ''], [['קומה 2', '<span class="num">1</span>', '<span class="num">1</span>', chip('מזגן', 'warn')], ['קומת קרקע', '<span class="num">1</span>', '<span class="num">0</span>', chip('דלת', 'alarm')]]) + '</div><div class="panel flush"><div class="group-h">עומס מטפלים · 30 יום</div>' + table(['מטפל', 'בטיפול', 'טופלו', ''], [['אלון ד.', '<span class="num">4</span>', '<span class="num">12</span>', chip('עמוס', 'warn')], ['דני כהן', '<span class="num">2</span>', '<span class="num">21</span>', chip('תקין', 'ok')]]) + '</div></div>';
        h += '<p class="note">מסך הסקירה (tickets-overview.ts) ללא שינוי: כל הכרטיסים, הקיפול הזכור, בורר התקופה, קישורים ללוח / לחשבון הספקים / לבקשת הצעת המחיר.</p>';
        break;
      case 'ledger': case 'plans': case 'rounds': case 'tags':
        var L = { ledger: ['אישור חדש', ['פריטים', 'פג תוקף', 'מתקרבים', 'בתוקף'], ['אישור', 'מקום', 'בתוקף עד', 'אחראי', ''], [['בדיקת מעלית שנתית<span class="t2">מעלית צפונית</span>', 'מבנה א', '<span class="num">14.02.2027</span>', 'דני כהן', badge('עוד 30 ימים', 'warn')], ['ביטוח צד ג׳<span class="t2">חשמל השרון · מסמך ספק</span>', '-', '<span class="num">10.01.2027</span>', '-', badge('פג', 'alarm')], ['מטפי כיבוי<span class="t2">כל המבנה</span>', 'מבנה א', '<span class="num">30.11.2027</span>', 'דני כהן', badge('בתוקף', 'ok')]]],
                  plans: ['תוכנית חדשה', ['תוכניות', 'באיחור', 'השבוע', 'תקין'], ['תוכנית', 'מחזור', 'הבא', 'מבצע', ''], [['החלפת מסנני מיזוג<span class="t2">קומות 1-2</span>', 'כל 3 חודשים', '<span class="num">01.11.2026</span>', 'אלון ד.', badge('השבוע', 'warn')], ['שימון משאבות<span class="t2">חדר מכונות</span>', 'כל חודש', '<span class="num">15.11.2026</span>', 'דני כהן', badge('תקין', 'ok')]]],
                  rounds: ['סבב חדש', ['סבבים', 'פתוחים עכשיו', 'באיחור', 'בוצעו השבוע'], ['סבב', 'תדירות', 'נקודות', 'הליכה אחרונה', ''], [['סבב בטיחות יומי<span class="t2">כל המבנה</span>', 'כל יום', '<span class="num">12</span>', '<span class="num">היום 07:40</span>', badge('בוצע', 'ok')], ['סבב גג שבועי<span class="t2">גג</span>', 'כל שבוע', '<span class="num">6</span>', '<span class="num">16.10</span>', badge('באיחור', 'alarm')]]],
                  tags: ['תג חדש', ['תגים', 'על התקנים', 'על משימות', 'בוטלו'], ['תג', 'יעד', 'נוצר', 'סריקות', ''], [['QR-0012', 'מזגן VRF-12 · חדר ישיבות', '<span class="num">02.10.2026</span>', '<span class="num">7</span>', badge('פעיל', 'ok')], ['NFC-0003', 'סבב גג שבועי', '<span class="num">02.10.2026</span>', '<span class="num">3</span>', badge('פעיל', 'ok')]]] }[P.kind];
        h += head(S, P, (can('maintenance.manage') ? '<button class="btn pri">' + ic('plus') + L[0] + '</button>' : ''));
        h += kpis([{ n: L[3].length + 4, l: L[1][0] }, { n: 1, l: L[1][1], look: 'alarm' }, { n: 2, l: L[1][2], look: 'warn' }, { n: 3, l: L[1][3], look: 'ok' }]);
        h += '<div class="cols">' + tree() + '<div class="panel flush">' + tree(true) + table(L[2], L[3]) + '</div></div>';
        h += '<p class="note">העמוד כמו בדגם המאושר של 2.15.0 (docs/design/mockups/maintenance-215): מוצג רק כשמודול "תחזוקה ובקרה" פועל ולבעלי maintenance.view; אין פעולת "פתיחת בקשת שירות" כשמודול הבקשות כבוי.</p>';
        break;
      case 'building':
        h += head(S, P, '<button class="btn">' + ic('download') + 'PDF</button>');
        h += '<div class="panel flush"><div class="toolbar"><div class="seg" role="radiogroup" aria-label="חודש"><button role="radio" aria-checked="true">ספטמבר 2026</button><button role="radio" aria-checked="false">אוגוסט 2026</button></div><div class="seg" role="radiogroup" aria-label="שפה"><button role="radio" aria-checked="true">עברית</button><button role="radio" aria-checked="false">English</button></div></div>' + table(['מקטע', 'מקור', 'מצב', ''], [['סיכום', 'כל המודולים', 'כלול', chip('כלול', 'ok')], ['בקשות שירות', 'ניהול השירות', 'כלול', chip('כלול', 'ok')], ['חשמל', 'תשתיות › חשמל', 'כלול', chip('כלול', 'ok')], ['דלתות', 'תובנות', 'לא כלול · המתג כבוי', chip('switch_off', 'unk')]]) + '</div>';
        h += '<p class="note">כמו בדגם המאושר של 2.15.0 (docs/design/mockups/insight-215): חודש, שפה, בחירת מקטעים, תצוגה מקדימה, PDF, רשימת "לא כלול" עם הסיבה.</p>';
        break;
      case 'insights':
        h += head(S, P, '');
        h += '<div class="panel flush"><div class="toolbar"><div class="seg" role="radiogroup" aria-label="סוג"><button role="radio" aria-checked="true">דלתות</button><button role="radio" aria-checked="false">בזבוז</button></div><div class="seg" role="radiogroup" aria-label="טווח"><button role="radio" aria-checked="true">24 שעות</button><button role="radio" aria-checked="false">7 ימים</button><button role="radio" aria-checked="false">30 ימים</button></div></div>' + table(['דלת', 'פתיחות', 'ללא הסבר', 'לא ניתן לאמת', ''], [['כניסה ראשית', '<span class="num">142</span>', '<span class="num">2</span>', '<span class="num">0</span>', chip('לבדיקה', 'warn')], ['חניון', '<span class="num">61</span>', '<span class="num">0</span>', '<span class="num">3</span>', chip('תקין', 'ok')]]) + '</div>';
        h += '<p class="note">דלתות / בזבוז כמקטע בתוך עמוד אחד; ההגדרות (מתגים, זוגות דלתות, ספים) בהגדרות › ניהול השירות.</p>';
        break;
      case 'reserved':
        h += head(S, P, '');
        h += '<div class="panel"><div class="state-panel"><div class="icon">' + ic('lock') + '</div><div><h4>מקום שמור - לא נבנה</h4><p>תקציב מחלקה מול עלויות מאושרות (רעיון 24): סכום שנתי לכל מחלקה, פס ניצול בסקירה, אזהרה באישור דרישה שחוצה את התקציב. מוצג כאן רק כדי שהבעלים יחליט אם לשמור את המקום.</p></div></div></div>';
        break;
    }
    return h + '</section>';
  }

  // ---- before / after map ----
  var STATUS_LOOK = { 'MOVED': 'acc', 'MERGED-AS-VIEW': 'warn', 'UNCHANGED': 'ok', 'NEW': 'unk', 'RESERVED': 'unk' };
  function renderMap(host) {
    var today = [['סקירה', '#/tickets/overview', 'MOVED'], ['שלי', '#/tickets/mine', 'MERGED-AS-VIEW'], ['המחלקה', '#/tickets/department', 'MERGED-AS-VIEW'], ['לוח מנהל', '#/tickets/board', 'MOVED'], ['הכול', '#/tickets/all', 'MERGED-AS-VIEW'], ['מטפלים וספקים', '#/tickets/handlers', 'MOVED'], ['בקשות הצעת מחיר', '#/tickets/rfqs', 'MOVED'], ['חשבון ספקים', '#/tickets/accounts', 'MOVED'], ['גישת חוץ', '#/tickets/external', 'MOVED']];
    var h = '<div class="top"><div><h1>מפת הניווט: לפני / אחרי</h1><p class="sub">אף כתובת קיימת לא משתנה; כל קישור בהתראה, בוואטסאפ או בסימנייה ממשיך לעבוד. הסטטוס לפי המילון של הבעלים (23.10).</p></div></div>';
    h += '<div class="lg">' + [['MOVED', 'acc', 'הועבר - אותו מסך ואותה כתובת, מקום אחר בניווט'], ['MERGED-AS-VIEW', 'warn', 'מוזג כתצוגה - היה כבר מסך אחד; יורדת רק הכפילות'], ['UNCHANGED', 'ok', 'ללא שינוי'], ['NEW', 'unk', 'חדש ב-2.15.0 / שמור']].map(function (l) { return chip(l[0] + ' · ' + l[2], l[1]); }).join('') + '</div>';
    h += '<div class="mapgrid"><div class="panel mapcol"><h3>היום: שורה אחת של תשע לשוניות</h3><p class="hint">TICKETS_TABS (nav.ts:712-723), מסוננת לפי הרשאה; ההגדרות בנפרד ב-הגדרות › ניהול השירות (9 לשוניות משנה)</p><div class="flat">' + today.map(function (t) { return '<span class="tab' + (t[2] === 'MERGED-AS-VIEW' ? ' x' : '') + '" title="' + t[1] + '">' + esc(t[0]) + '</span>'; }).join('') + '</div><p class="hint" style="margin-top:10px">+ המגירה / העמוד המלא #/tickets/&lt;id&gt;, הטופס ?new=1, המקטעים של "מטפלים וספקים" (?seg=), לוח / השוואה / חדש של הצעות המחיר (?rfq= &view=compare ?new=1), לוח המטפלים בתוך הלוח (?pane=handlers) - כולם נשארים כפי שהם.</p></div>';
    h += '<div class="panel mapcol"><h3>מוצע: ארבעה מדורים לפי העבודה</h3><p class="hint">שורה 1 = המדור (pill), שורה 2 = עמודי המדור (underline-compact), כמו עמודי החשמל והגנרטור בתשתיות</p><ul class="tree2">' + SECTIONS.map(function (s) {
      return '<li><b>' + esc(s.label) + ' <span class="chip">' + esc(s.short) + ' בנייד</span>' + (s.mod ? chip('מודול ' + s.mod, 'unk') : '') + '<span class="href" style="margin-inline-start:auto">' + esc(s.href) + '</span></b><ul>' + s.pages.map(function (p) { return '<li>' + esc(p.label) + ' ' + chip(p.status, STATUS_LOOK[p.status]) + ' <span class="chip">' + esc(p.perm.join(' | ')) + '</span><span class="href">' + esc(p.hrefs || p.href) + '</span></li>'; }).join('') + '</ul></li>';
    }).join('') + '</ul></div></div>';
    // roles table
    var roles = ['emp', 'handler', 'mgr', 'admin'];
    h += '<div class="panel flush"><div class="group-h">מי רואה מה (נגזר מההרשאות הקיימות - אין הרשאה חדשה)</div><div class="scrollx"><table class="t roles-tbl"><thead><tr><th>עמוד</th>' + roles.map(function (r) { return '<th>' + esc(ROLES[r].name) + '</th>'; }).join('') + '</tr></thead><tbody>';
    SECTIONS.forEach(function (s) { s.pages.forEach(function (p) { h += '<tr><td><span class="t1">' + esc(s.label) + ' › ' + esc(p.label) + '</span></td>' + roles.map(function (r) { var keep = role; role = r; var ok = secOk(s) && pageOk(p); role = keep; return '<td class="' + (ok ? 'y' : 'n') + '">' + (ok ? '✓' : '-') + '</td>'; }).join('') + '</tr>'; }); });
    h += '</tbody></table></div></div>';
    h += '<p class="note">הגדרות › ניהול השירות (9 לשוניות משנה) נשארות במקומן; שני המודולים החדשים מתווספים ככרטיס "מודולים נלווים" בלשונית כללי (שאלה 6).</p>';
    host.innerHTML = h;
  }

  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(function () { el.classList.remove('on'); }, 2200); }
  document.querySelectorAll('.mock .roles button').forEach(function (b) { b.onclick = function () { role = b.dataset.role; render(); }; });
  document.getElementById('mapbtn').onclick = function () { mapOn = !mapOn; render(); };
  render();
})();
</script>
</body>
</html>

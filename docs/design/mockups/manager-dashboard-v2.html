<!--
  Manager dashboard ("סקירה") - static design mock-up v2. NOT product code. Self-contained: no network requests, fake data only.

  Built from the product's own layers, copied rule for rule (not imitated) so the page is indistinguishable in language from the
  service-management screens:
    - the shell: frontend/src/shell/sw-app.ts (the rail, the floating search pill, the sub-tab row, the phone dock) on the classic
      skin tokens of frontend/src/design/tokens.ts (--sw-*, light + dark);
    - the glass page frame: frontend/src/styles/devices-themes.ts (the --dv-* palette, the bridge), media-glass.ts (--mm-* knobs,
      .glass / .btn / .seg / .tog / .rb / .skl / .statebox / .errbar), media-page.ts (.page / .dh / .rc / .search / .sh),
      automations-glass.ts (.chip / .banner / .sentence / .sect / .blk), tickets/handlers-glass.ts (.hcard stats, .crow rows,
      .av, .tile), tickets/rfq-styles.ts (.kpis / .kpi / .rtbl / .vbar), tickets/list-styles.ts (.load meter, .closedrows .cr),
      tickets/board-tree.ts (.tree .row);
    - the tab bar: frontend/src/components/sw-tabs.ts (pill variant).
  What is NEW here (the dashboard's own, kept to a minimum, tokens only): the widget grid, the fold chevron, the delta mark on a
  stat tile, the 14-day bars, the quiet "all fine" line.

  Spec: docs/design/MANAGER_DASHBOARD_SPEC_HE.md. Comparison images: docs/design/mockups/v2-compare/.
  URL switches (for screenshots): ?theme=dark &role=all|dept &costs=1|0 &state=normal|loading|fine|empty|partial|offline &bare=1 (hides the gallery bar)
-->

/* ============================================================================================================================
   1. THE PRODUCT TOKENS (design/tokens.ts, classic skin): the shell reads --sw-*; a dark scheme is data-theme="dark" on <html>
   ============================================================================================================================ */
:root {
  --sw-bg: #f5f7fb; --sw-surface: #ffffff; --sw-surface-2: #f7f9fc; --sw-surface-3: #eef2f8; --sw-surface-solid: #ffffff;
  --sw-menu-surface: #ffffff; --sw-menu-border: #e7ebf2; --sw-border: #e7ebf2; --sw-border-strong: #e1e6ef; --sw-overlay: rgba(17, 24, 39, 0.45);
  --sw-text: #22314c; --sw-heading: #1e2e47; --sw-text-2: #5b6a85; --sw-text-3: #8a97ae; --sw-text-inverse: #ffffff;
  --sw-accent: #2767ed; --sw-accent-hover: #1f57d1; --sw-accent-soft: #edf3ff; --sw-accent-text: #2767ed; --sw-focus: #2767ed;
  --sw-live: #22c55e; --sw-live-soft: #e8f8ee; --sw-stale: #f59e0b; --sw-stale-soft: #fff4e0; --sw-danger: #ef4444; --sw-danger-soft: #fdecec;
  --sw-warning: #f59e0b; --sw-warning-soft: #fff4e0; --sw-success: #22c55e; --sw-success-soft: #e8f8ee; --sw-purple: #8b5cf6;
  --sw-success-text: #16a34a; --sw-warning-text: #b45309; --sw-danger-text: #b91c1c; --sw-toggle-on: #2767ed; --sw-toggle-thumb: #ffffff;
  --sw-font: "Heebo", "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans Hebrew", Roboto, Arial, sans-serif;
  --sw-fs-2xs: 10px; --sw-fs-xs: 11px; --sw-fs-sm: 12.5px; --sw-fs-base: 13px; --sw-fs-md: 14px; --sw-fs-lg: 15px; --sw-fs-xl: 17px; --sw-fs-2xl: 20px; --sw-fs-3xl: 26px;
  --sw-fw-regular: 400; --sw-fw-medium: 500; --sw-fw-semibold: 600; --sw-fw-bold: 700;
  --sw-s-1: 4px; --sw-s-2: 8px; --sw-s-3: 12px; --sw-s-4: 16px; --sw-s-5: 20px; --sw-s-6: 24px;
  --sw-bottomnav-h: 50px;
  --sw-r-2xs: 4px; --sw-r-xs: 6px; --sw-r-sm: 8px; --sw-r-md: 12px; --sw-r-lg: 14px; --sw-r-xl: 14px; --sw-r-2xl: 22px; --sw-r-pill: 999px;
  --sw-shadow-1: 0 1px 2px rgba(16, 24, 40, 0.04); --sw-shadow-2: 0 6px 18px rgba(34, 49, 76, 0.06); --sw-shadow-3: 0 14px 36px rgba(34, 49, 76, 0.14);
  --sw-shadow-primary: 0 1px 2px rgba(39, 103, 237, 0.25);
  --sw-t-fast: 120ms; --sw-t-med: 200ms; --sw-ease: cubic-bezier(0.2, 0, 0, 1);
  --sw-z-topbar: 30;
  /* the product colours as the knob layer sees them (never bridged) */
  --sw-product-accent: var(--sw-accent); --sw-product-accent-hover: var(--sw-accent-hover); --sw-product-accent-soft: var(--sw-accent-soft);
  --sw-product-accent-text: var(--sw-accent-text); --sw-product-focus: var(--sw-focus); --sw-product-toggle-on: var(--sw-toggle-on);
  --sw-product-success: var(--sw-success); --sw-product-success-soft: var(--sw-success-soft); --sw-product-warning: var(--sw-warning);
  --sw-product-warning-soft: var(--sw-warning-soft); --sw-product-danger: var(--sw-danger); --sw-product-danger-soft: var(--sw-danger-soft);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --sw-bg: #0d1220; --sw-surface: #151c2c; --sw-surface-2: #1a2336; --sw-surface-3: #222d44; --sw-surface-solid: #151c2c;
  --sw-menu-surface: #151c2c; --sw-menu-border: #232e45; --sw-border: #232e45; --sw-border-strong: #2f3c58; --sw-overlay: rgba(0, 0, 0, 0.62);
  --sw-text: #e6ebf5; --sw-heading: #f3f6fc; --sw-text-2: #a9b4ca; --sw-text-3: #8190aa;
  --sw-accent: #3a6ce0; --sw-accent-hover: #5a88f2; --sw-accent-soft: rgba(91, 140, 255, 0.18); --sw-accent-text: #8fb2ff; --sw-focus: #7aa2ff;
  --sw-live: #3ddc84; --sw-live-soft: rgba(61, 220, 132, 0.18); --sw-stale: #f5b043; --sw-stale-soft: rgba(245, 176, 67, 0.2); --sw-danger: #ff6b62; --sw-danger-soft: rgba(255, 107, 98, 0.2);
  --sw-warning: #f5b043; --sw-warning-soft: rgba(245, 176, 67, 0.2); --sw-success: #3ddc84; --sw-success-soft: rgba(61, 220, 132, 0.18); --sw-purple: #a78bfa;
  --sw-success-text: #3ddc84; --sw-warning-text: #f5b043; --sw-danger-text: #ff8a82; --sw-toggle-on: #3a6ce0;
  --sw-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35); --sw-shadow-2: 0 6px 18px rgba(0, 0, 0, 0.4); --sw-shadow-3: 0 14px 36px rgba(0, 0, 0, 0.55);
  --sw-shadow-primary: 0 1px 2px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --sw-t-fast: 0ms; --sw-t-med: 0ms; } }

/* ============================================================================================================================
   2. THE SHELL (shell/sw-app.ts, design "a"): rail at the inline start, the content column, the floating corner, the phone dock
   ============================================================================================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--sw-bg); color: var(--sw-text); font-family: var(--sw-font); font-size: var(--sw-fs-md); line-height: 1.5; -webkit-font-smoothing: antialiased; }
sw-app { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: 'rail main'; block-size: 100dvh; background: var(--sw-bg); position: relative; }
nav.rail { grid-area: rail; display: flex; flex-direction: column; background: var(--sw-surface); border-inline-end: 1px solid var(--sw-border); padding-block: 12px 10px; padding-inline: 7px; gap: 4px; align-items: stretch; overflow: auto; scrollbar-width: none; }
.brand-tile { display: grid; place-items: center; inline-size: 36px; block-size: 36px; border-radius: var(--sw-r-md); background: var(--sw-accent); color: var(--sw-text-inverse); font-weight: 800; font-size: var(--sw-fs-xl); text-decoration: none; margin-block-end: 8px; box-shadow: var(--sw-shadow-primary); align-self: center; font-family: var(--sw-font); }
a.item { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; min-inline-size: 70px; min-block-size: 52px; padding: 6px 4px; line-height: 1.3; border-radius: var(--sw-r-md); color: var(--sw-text-2); text-decoration: none; font-weight: var(--sw-fw-medium); font-size: 10.5px; white-space: nowrap; position: relative; transition: background var(--sw-t-fast) var(--sw-ease), color var(--sw-t-fast) var(--sw-ease); }
a.item .ic { inline-size: 22px; block-size: 22px; color: var(--sw-text-3); }
a.item:hover { background: var(--sw-surface-3); color: var(--sw-text); }
a.item.active { background: var(--sw-accent-soft); color: var(--sw-accent-text); font-weight: var(--sw-fw-semibold); }
a.item.active .ic { color: var(--sw-accent); }
a.item.active::after { content: ''; position: absolute; inset-inline-end: -8px; inset-block: 16px; inline-size: 3px; border-radius: 3px; background: var(--sw-accent); }
.rail .grow { flex: 1; }
button.me { all: unset; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; color: var(--sw-text-2); font-size: 10.5px; font-weight: var(--sw-fw-medium); padding-block: 6px; }
button.me .av { display: inline-grid; place-items: center; inline-size: 32px; block-size: 32px; border-radius: 50%; background: var(--sw-surface-3); color: var(--sw-text-2); font-size: var(--sw-fs-sm); font-weight: var(--sw-fw-semibold); box-shadow: 0 0 0 2px var(--sw-surface); }
main { grid-area: main; min-block-size: 0; min-inline-size: 0; overflow: hidden; display: flex; flex-direction: column; }
.subnav { padding: 12px 24px 0; display: flex; flex: none; }
/* sw-tabs, pill variant: a 34 px track, the active item a lifted pill */
sw-tabs { display: inline-flex; overflow-x: auto; scrollbar-width: none; max-inline-size: 100%; }
sw-tabs::-webkit-scrollbar { display: none; }
sw-tabs .row { position: relative; display: inline-flex; flex: none; gap: 2px; padding-inline: 3px; }
sw-tabs .row::before { content: ''; position: absolute; inset-inline: 0; inset-block: 0; background: var(--sw-surface-3); border-radius: var(--sw-r-md); }
sw-tabs a { position: relative; display: inline-flex; align-items: center; min-block-size: 34px; padding-inline: 1px; color: var(--sw-text-2); text-decoration: none; font-size: var(--sw-fs-sm); font-weight: var(--sw-fw-medium); white-space: nowrap; cursor: pointer; }
sw-tabs a:hover { color: var(--sw-text); }
sw-tabs .lbl { display: inline-flex; align-items: center; gap: 5px; min-block-size: 28px; padding: 0 12px; border-radius: var(--sw-r-sm); justify-content: center; }
sw-tabs .on { color: var(--sw-accent-text); }
sw-tabs .on .lbl { background: var(--sw-surface); box-shadow: var(--sw-shadow-1); font-weight: var(--sw-fw-semibold); }
main > .screen { flex: 1; min-block-size: 0; display: flex; flex-direction: column; }

.blk { display: flex; align-items: center; gap: 12px; min-block-size: 48px; padding: 8px 12px; border-radius: var(--sw-r-lg); background: var(--dv-surface); border: 1px solid var(--dv-border); font-size: var(--sw-fs-md); min-inline-size: 0; }

@media (pointer: coarse), (max-width: 767px) { .chip { block-size: 28px; } }

/* ---- tickets/rfq-styles.ts: the KPI tiles, the table; handlers-glass.ts: the stat numbers, the rows, the avatar;
        list-styles.ts: the load meter, the closed rows; board-tree.ts: the tree rows; screens/tickets-board.ts: .cnt ---- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--sw-s-3); }
.kpi { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border-radius: var(--sw-r-xl); border: 1px solid var(--dv-border); background: var(--dv-surface); -webkit-backdrop-filter: var(--dv-surface-blur); backdrop-filter: var(--dv-surface-blur); box-shadow: var(--dv-shadow-1); min-inline-size: 0; color: inherit; text-decoration: none; }

.kpi b { font-size: var(--sw-fs-2xl); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--dv-text); overflow-wrap: anywhere; }

.kpi.bad b { color: var(--dv-danger); }

.cnt.info { background: var(--dv-accent-soft); color: var(--dv-accent-text); }
.cnt.bad { background: var(--dv-danger-soft); color: var(--dv-danger); }

.stats { display: flex; gap: 18px; font-size: var(--sw-fs-sm); color: var(--dv-text-2); }
.stats b { display: block; font-size: var(--sw-fs-3xl); font-weight: 800; color: var(--dv-text); line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stats b.warn { color: var(--au-warn-text); }
.stats b.bad { color: var(--dv-danger); }
.av { display: inline-grid; place-items: center; flex: none; inline-size: 36px; block-size: 36px; border-radius: 50%; font-weight: 800; font-size: var(--sw-fs-sm); background: var(--dv-accent-soft); color: var(--dv-accent-text); }
.av.ext { color: var(--au-warn-text); background: var(--dv-warning-soft); }
.av.sm { inline-size: 28px; block-size: 28px; font-size: var(--sw-fs-xs); }
.tile { flex: none; inline-size: 44px; block-size: 44px; border-radius: var(--sw-r-lg); display: grid; place-items: center; font-weight: 800; font-size: var(--sw-fs-lg); background: var(--dv-accent-soft); color: var(--dv-accent-text); }
.tile .ic { font-size: var(--sw-fs-2xl); }
.crows { padding: 0; overflow: hidden; }
.crow { display: grid; grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 16px; min-block-size: 56px; border: 0; border-block-end: 1px solid var(--dv-border); background: transparent; color: inherit; font: inherit; font-size: var(--sw-fs-md); text-align: start; inline-size: 100%; cursor: pointer; text-decoration: none; }
.crow:last-child { border-block-end: 0; }
.crow:hover { background: var(--dv-surface-2); }
.crow b { display: block; font-weight: 700; }
.crow small { display: block; color: var(--dv-text-3); font-size: var(--sw-fs-xs); }
.mut { color: var(--dv-text-3); font-size: var(--sw-fs-sm); }
.load { display: inline-flex; gap: 3px; align-items: center; }
.load i { inline-size: 14px; block-size: 6px; border-radius: var(--sw-r-pill); background: var(--dv-surface-3); }
.load i.on { background: var(--dv-accent); }
.load i.hot { background: var(--dv-danger); }
.closedrows { display: flex; flex-direction: column; padding: 4px 6px; }
.closedrows .cr { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 6px 14px; min-block-size: 44px; padding: 6px 12px; border: 0; background: transparent; color: var(--dv-text); font: inherit; font-size: var(--sw-fs-base); text-align: start; text-decoration: none; border-radius: var(--sw-r-lg); cursor: pointer; }
.closedrows .cr + .cr { border-block-start: 1px solid var(--dv-border); }
.closedrows .cr:hover, .closedrows .cr:focus-visible { background: var(--dv-surface-3); outline: none; }
.closedrows .cr .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; color: var(--dv-text-3); font-weight: 600; }
.closedrows .cr b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.closedrows .cr span:not(.num):not(.chip) { color: var(--dv-text-2); white-space: nowrap; }
.rtbl { inline-size: 100%; border-collapse: collapse; font-size: var(--sw-fs-base); }
.rtbl th { text-align: start; font-size: var(--sw-fs-sm); font-weight: 600; color: var(--dv-text-2); padding: 6px 8px; border-block-end: 1px solid var(--dv-border); white-space: nowrap; }
.rtbl td { padding: 10px 8px; border-block-end: 1px solid var(--dv-border); vertical-align: middle; font-variant-numeric: tabular-nums; }
.rtbl tr:last-child td { border-block-end: 0; }
.rtbl tfoot td { font-weight: 700; color: var(--dv-text-2); border-block-start: 1px solid var(--dv-border); border-block-end: 0; }
.rtbl td.num, .rtbl th.num { text-align: center; }
.rtbl td.bad { color: var(--dv-danger); font-weight: 700; }
.vbar { display: flex; flex-direction: column; gap: 6px; min-inline-size: 0; }
.vbar .track { display: flex; block-size: 8px; border-radius: var(--sw-r-pill); background: var(--dv-surface-3); overflow: hidden; }
.vbar .seg-q { background: var(--dv-success); }
.vbar .seg-d { background: var(--dv-danger); }
.vbar .seg-o { background: var(--dv-accent); }
.vbar .seg-w { background: var(--dv-warning); }
.vbar .seg-n { background: var(--dv-border-strong); }
.tree { display: flex; flex-direction: column; gap: 2px; padding: 0; }
.tree .row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-block-size: 40px; padding-inline: 8px 12px; border-radius: var(--sw-r-lg); cursor: pointer; color: var(--dv-text); font-size: var(--sw-fs-base); }
.tree .row:hover { background: color-mix(in srgb, var(--dv-text) 6%, transparent); }
.tree .row[aria-pressed='true'] { background: var(--dv-accent-soft); color: var(--dv-accent-text); font-weight: 700; }
.tree .row.l0 b { font-weight: 700; }
.tree .row.l1 { padding-inline-start: 28px; color: var(--dv-text-2); }
.tree .row.l2 { padding-inline-start: 48px; color: var(--dv-text-2); }
.tree .row .n { font-variant-numeric: tabular-nums; color: var(--dv-accent-text); font-size: var(--sw-fs-sm); font-weight: 600; }
.tree .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .tw { display: inline-grid; place-items: center; inline-size: 24px; block-size: 24px; border-radius: var(--sw-r-sm); color: var(--dv-text-3); }
.tree .tw .ic { font-size: var(--sw-fs-lg); }
.tl { display: inline-flex; align-items: center; gap: 5px; color: var(--dv-accent-text); font-weight: 600; text-decoration: none; min-block-size: 32px; border-radius: var(--sw-r-sm); font-size: var(--sw-fs-base); }
.tl:hover { text-decoration: underline; }
.cwarn { display: flex; align-items: center; gap: 7px; min-inline-size: 0; font-size: var(--sw-fs-base); font-weight: 600; color: var(--au-warn-text); }
.cwarn.bad { color: var(--dv-danger); }
.cwarn .ic { flex: none; font-size: var(--sw-fs-lg); }

/* ============================================================================================================================
   4. THE DASHBOARD'S OWN (new; tokens only): the widget grid, the widget card, folding, the delta mark, the 14-day bars, states
   ============================================================================================================================ */
.wgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--dv-gap-lg, 18px); align-items: start; }
.w { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px 14px; border-radius: var(--sw-r-2xl); min-inline-size: 0; }
.w.wide { grid-column: span 2; }
.w.full { grid-column: 1 / -1; }
.w > header { display: flex; align-items: center; gap: 10px; min-inline-size: 0; }
.w > header h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: var(--sw-fs-lg); font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; min-inline-size: 0; }
.w > header .q { font-size: var(--sw-fs-sm); font-weight: 500; color: var(--dv-text-2); white-space: nowrap; }
.w > header .fold { all: unset; box-sizing: border-box; margin-inline-start: auto; display: grid; place-items: center; inline-size: 32px; block-size: 32px; border-radius: 50%; color: var(--dv-text-3); cursor: pointer; }
.w > header .fold:hover { background: var(--dv-surface-3); color: var(--dv-text); }
.w > header .fold .ic { font-size: var(--sw-fs-xl); transition: transform var(--mm-motion) var(--mm-ease); }
.w.folded > header .fold .ic { transform: rotate(90deg); }
.w.folded > :not(header) { display: none; }
.w > header .seg { margin-inline-start: auto; }
.w > header .seg + .fold { margin-inline-start: 0; }
.w .body { display: flex; flex-direction: column; gap: 10px; min-inline-size: 0; }
/* the stat strip of the page: the RFQ board's tiles, with the small change-since-yesterday mark */
.kpi .d { display: inline-flex; align-items: center; gap: 2px; font-size: var(--sw-fs-xs); font-weight: 600; color: var(--dv-text-3); margin-inline-start: 6px; font-variant-numeric: tabular-nums; }
.kpi .d.up { color: var(--dv-danger); }
.kpi .d.down { color: var(--au-ok-text); }
.kpi .d .ic { font-size: 10px; stroke-width: 2.4; }
.kpi.stale b { color: var(--dv-text-3); }
/* the quiet "all fine" line */
.quiet { display: inline-flex; align-items: center; gap: 8px; min-block-size: 36px; font-size: var(--sw-fs-base); font-weight: 600; color: var(--au-ok-text); }
.quiet .ic { font-size: var(--sw-fs-lg); }
/* where stuck: the reasons as room chips, the places as tree rows with a bar */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.place { display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; align-items: center; gap: 12px; }
.place .vbar .track { block-size: 6px; }
.place .why { display: flex; flex-wrap: wrap; gap: 4px 10px; padding-inline-start: 28px; margin-block: -2px 4px; font-size: var(--sw-fs-xs); color: var(--dv-text-3); }
.place .why span { display: inline-flex; align-items: center; gap: 4px; }
.place .why i { inline-size: 6px; block-size: 6px; border-radius: 50%; display: inline-block; }
/* handler load rows */
a.blk, a.crow, a.cr, a.dcard { text-decoration: none; color: inherit; }
.hrow { grid-template-columns: auto minmax(0, 1.4fr) auto auto auto auto; padding-inline: 6px; }
.hrow .st { display: contents; }
.hrow .cell { font-size: var(--sw-fs-md); color: var(--dv-text); font-variant-numeric: tabular-nums; min-inline-size: 58px; text-align: center; }
.hrow .cell small { display: none; font-size: var(--sw-fs-2xs); color: var(--dv-text-3); text-align: center; }
.hrow .cell.bad { color: var(--dv-danger); font-weight: 700; }
.hrow .cell.warn { color: var(--au-warn-text); font-weight: 700; }
.hrow .ldc { min-inline-size: 70px; display: grid; justify-items: center; gap: 3px; }
.hrow .ldc small { font-size: var(--sw-fs-2xs); color: var(--dv-text-3); }
.hhead { display: grid; grid-template-columns: auto minmax(0, 1.4fr) auto auto auto auto; gap: 12px; padding-inline: 6px; font-size: var(--sw-fs-2xs); color: var(--dv-text-3); }
.hhead span { min-inline-size: 58px; text-align: center; }
.hhead .ldc { min-inline-size: 70px; }
.hhead .nm { min-inline-size: 0; text-align: start; }
/* who waits for whom: four lanes as block rows */
.lanes { display: grid; grid-template-columns: 1fr; gap: 8px; }
.lane .bt b { display: flex; align-items: center; gap: 8px; font-size: var(--sw-fs-md); color: var(--dv-text); }
.lane .bt small { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.lane .big { font-size: var(--sw-fs-2xl); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--dv-text); min-inline-size: 28px; text-align: center; }
.lane .bi.me { background: var(--dv-accent-soft); color: var(--dv-accent-text); }
.lane .bi.ext { background: color-mix(in srgb, var(--sw-purple) 16%, transparent); color: color-mix(in srgb, var(--sw-purple) 68%, var(--dv-text)); }
/* the 14-day bars (SVG, direct labels) */
.bars { display: grid; gap: 6px; }
.bars svg { inline-size: 100%; block-size: 132px; display: block; overflow: visible; }
.bars .lg { display: flex; gap: 14px; font-size: var(--sw-fs-xs); color: var(--dv-text-2); }
.bars .lg span { display: inline-flex; align-items: center; gap: 5px; }
.bars .lg i { inline-size: 10px; block-size: 10px; border-radius: 3px; display: inline-block; }
.net { font-size: var(--sw-fs-sm); color: var(--dv-text-2); }
.net b { color: var(--dv-text); font-variant-numeric: tabular-nums; }
/* agenda days */
.day > h4 .today { color: var(--dv-accent-text); }
.day .cr .dot { margin-inline-end: 2px; }
/* the department cards on a phone */
.dcards { display: none; }
/* the offline strip at the top of the page */
.offline-top { position: sticky; inset-block-start: 0; z-index: 16; margin: 0 -36px -16px; padding: 8px 36px; background: linear-gradient(var(--dv-warning-soft), var(--dv-warning-soft)), var(--dv-surface-solid); border-block-end: 1px solid color-mix(in srgb, var(--dv-warning) 38%, transparent); font-size: var(--sw-fs-sm); font-weight: 600; color: var(--au-warn-text); display: flex; align-items: center; gap: 8px; }
.offline-top .ic { font-size: var(--sw-fs-md); }
/* the states */
.skel { display: flex; flex-direction: column; gap: 10px; }
.unavail { display: flex; align-items: center; gap: 10px; min-block-size: 44px; font-size: var(--sw-fs-base); color: var(--dv-text-2); }
.unavail .btn { margin-inline-start: auto; }
.page.stale .kpi b, .page.stale .stats b, .page.stale .lane .big, .page.stale .tree .n { color: var(--dv-text-3); }
.page.stale .load i.on, .page.stale .load i.hot { background: var(--dv-border-strong); }
/* tablet */
@media (max-width: 1180px) { .wgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .w.wide { grid-column: span 2; } }
/* phone */
@media (max-width: 767px) {
  .page { padding: 0 14px 26px; gap: 18px; }
  .dh { margin-inline: -14px; padding: 12px 14px 2px; gap: 10px; }
  .dh-row { display: grid; grid-template-columns: minmax(0, 1fr) var(--sw-float-reserve, 0px); grid-template-areas: 't .'; gap: 10px; }
  .dh.compact h1 { font-size: var(--mm-fs-page-title); }
  .amb { display: none; }
  .dh-det .seg { inline-size: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: var(--sw-r-xl); overflow: visible; }
  .dh-det .seg button { min-inline-size: 0; padding-inline: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dh-det .grow { display: none; }
  .dh-det .rooms { inline-size: 100%; flex: 1 1 100%; margin-inline: -14px; padding-inline: 14px; }
  .offline-top { margin: 0 -14px -10px; padding: 8px 14px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 12px 14px; }
  .wgrid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .w.wide, .w.full { grid-column: auto; }
  .w { padding: 14px 14px 12px; }
  .w > header .seg { display: inline-flex; inline-size: auto; }
  .w > header .seg button { min-block-size: 32px; padding-inline: 9px; }
  .place { grid-template-columns: minmax(0, 1fr) auto; }
  .place .vbar { display: none; }
  .hhead { display: none; }
  .hrow { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: 'av nm ld' 'av st st'; row-gap: 4px; padding-block: 10px; }
  .hrow .av { grid-area: av; }
  .hrow .nm { grid-area: nm; }
  .hrow .ldc { grid-area: ld; }
  .hrow .st { grid-area: st; display: flex; gap: 16px; }
  .hrow .cell { min-inline-size: 0; text-align: start; display: inline-flex; gap: 4px; align-items: baseline; font-size: var(--sw-fs-base); }
  .hrow .cell small { display: inline; font-size: var(--sw-fs-xs); }
  .chips.rooms { flex-wrap: nowrap !important; overflow-x: auto; scrollbar-width: none; margin-inline: -14px; padding-inline: 14px; }
  .dh-det .hide-ph { display: none; }
  .rtbl.phone-cards { display: none; }
  .dcards { display: flex; flex-direction: column; gap: 8px; }
  .dcard { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--sw-r-lg); background: var(--dv-surface); border: 1px solid var(--dv-border); }
  .dcard b { font-size: var(--sw-fs-md); }
  .dcard .nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--sw-fs-sm); color: var(--dv-text-2); }
  .dcard .nums em { font-style: normal; font-weight: 700; color: var(--dv-text); font-variant-numeric: tabular-nums; }
  .bars svg { block-size: 110px; }
  .closedrows .cr { grid-template-columns: auto minmax(0, 1fr) auto; }
  .closedrows .cr .hide-p { display: none; }
  .w > header .fold { inline-size: 44px; block-size: 44px; margin-block: -6px; }
}

/* ============================================================================================================================
   5. THE GALLERY BAR - NOT product (the reviewer's switches); hidden with ?bare=1
   ============================================================================================================================ */
.gal { position: fixed; inset-block-end: 12px; inset-inline-start: 12px; z-index: 99; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 14px; background: #1e2e47; color: #fff; font: 12px/1.3 var(--sw-font); box-shadow: 0 14px 36px rgba(0,0,0,.35); max-inline-size: calc(100vw - 24px); }
.gal label { display: inline-flex; align-items: center; gap: 4px; }
.gal select, .gal input { font: inherit; }
.gal select { border-radius: 8px; border: 0; padding: 3px 6px; background: #2c3a57; color: #fff; }
.gal b { opacity: .7; margin-inline-end: 4px; }
[hidden] { display: none !important; }
</style>

    const sum = rows.reduce((a, r) => [a[0] + r[1], a[1] + r[2], a[2] + r[3]], [0, 0, 0]);
    body = `<div class="body"><table class="rtbl"><thead><tr><th>מטפל</th><th class="num">סומנו "בוצע"</th><th class="num">נסגרו</th><th class="num">הוחזרו לטיפול</th><th class="num">זמן טיפול חציוני</th></tr></thead>
      <tbody>${rows.map((r) => `<tr><td><a class="tl" href="#">${esc(r[0])}</a></td><td class="num">${n(r[1])}</td><td class="num">${n(r[2])}</td><td class="num">${n(r[3])}</td><td class="num mut">${r[4]}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>סה"כ</td><td class="num">${n(sum[0])}</td><td class="num">${n(sum[1])}</td><td class="num">${n(sum[2])}</td><td></td></tr></tfoot></table></div>`;
  }
  return { seg, body };
}
function openedClosed() {
  if (S.state === 'loading') return skeleton(1, 150);
  if (S.state === 'partial') return `<div class="body">${unavailable()}</div>`;
  const W = 420, H = 110, pad = 14, bw = 9, gap = (W - pad * 2) / 14, max = 8;
  const opened = DAILY.reduce((s, d) => s + d[0], 0), closed = DAILY.reduce((s, d) => s + d[1], 0), net = opened - closed;
  const bars = DAILY.map(([o, c], i) => {
    const x = pad + i * gap + gap / 2;
    const ho = (o / max) * H, hc = (c / max) * H;
    return `<rect x="${x - bw - 1}" y="${H - ho}" width="${bw}" height="${ho}" rx="2.5" fill="var(--dv-accent)"/><rect x="${x + 1}" y="${H - hc}" width="${bw}" height="${hc}" rx="2.5" fill="var(--dv-success)"/>
      ${o ? `<text x="${x - bw / 2 - 1}" y="${H - ho - 3}" font-size="8.5" text-anchor="middle" fill="var(--dv-text-3)">${o}</text>` : ''}${c ? `<text x="${x + bw / 2 + 1}" y="${H - hc - 3}" font-size="8.5" text-anchor="middle" fill="var(--dv-text-3)">${c}</text>` : ''}
      ${i % 2 === 1 ? `<text x="${x}" y="${H + 12}" font-size="9" text-anchor="middle" fill="var(--dv-text-3)">${['4.10', '6.10', '8.10', '10.10', '12.10', '14.10', '16.10'][(i - 1) / 2]}</text>` : ''}`;
  }).join('');
  return `<div class="body"><div class="net">צבר נטו: <b>${net > 0 ? '+' : ''}${net}</b> בשבועיים · נפתחו ${opened} · נסגרו ${closed}</div>
    <div class="bars"><svg viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="נפתחו מול נסגרו, 14 ימים"><line x1="${pad}" x2="${W - pad}" y1="${H + 0.5}" y2="${H + 0.5}" stroke="var(--dv-border)"/>${bars}</svg>
    <div class="lg"><span><i style="background:var(--dv-accent)"></i>נפתחו</span><span><i style="background:var(--dv-success)"></i>נסגרו</span></div></div>
    <table class="vh"><caption>נפתחו מול נסגרו לפי יום</caption><thead><tr><th>יום</th><th>נפתחו</th><th>נסגרו</th></tr></thead><tbody>${DAILY.map(([o, c], i) => `<tr><td>${4 + i}.10</td><td>${o}</td><td>${c}</td></tr>`).join('')}</tbody></table></div>`;
}
function approvals() {
  if (S.state === 'loading') return skeleton(4, 44);
  if (S.state === 'fine') return `<div class="body">${quiet('אין מה לאשר')}</div>`;
  if (S.state === 'partial') return `<div class="body">${unavailable()}</div>`;
  return `<div class="body">${APPROVALS.map((g) => `<div class="sect"><h4>${esc(g.g)}<span class="num">· ${g.rows.length}</span></h4><div class="closedrows">${g.rows.map((r) => `<a class="cr" href="#"><span class="num">${r[0]}</span><b>${esc(r[1])}<small class="mut" style="display:block;font-weight:400">${esc(r[2])} · מחכה ${r[3]}</small></b>${S.costs ? `<span class="n" style="font-weight:700;color:var(--dv-text)">${r[4]}</span>` : '<span></span>'}<span class="hide-p">${ic('i-back')}</span></a>`).join('')}</div></div>`).join('')}</div>`;
}
function rfqs() {
  if (S.state === 'loading') return skeleton(4, 44);
  if (S.state === 'fine') return `<div class="body">${quiet('אין בקשות שמחכות להחלטה')}</div>`;
  if (S.state === 'partial') return `<div class="body">${unavailable()}</div>`;
  return `<div class="body"><div class="closedrows">${RFQS.map((r) => `<a class="cr" href="#"><span class="num">${r.id}</span><b>${esc(r.t)}<small style="display:block;font-weight:400;color:var(--dv-text-2)">מועד הגשה ${r.due}</small></b><span class="chip ${r.c} xs">${esc(r.st)}</span>${r.q ? `<span class="chip warn xs">${ic('i-inbox')}שאלה מספק</span>` : '<span></span>'}</a>`).join('')}</div></div>`;
}
function overdue() {
  if (S.state === 'loading') return skeleton(4, 44);
  if (S.state === 'fine') return `<div class="body">${quiet('אין איחורים')}</div>`;
  return `<div class="body"><div class="closedrows">${OVERDUE.map((r) => `<a class="cr" href="#"><span class="num">${r[0]}</span><b>${esc(r[1])}<small style="display:block;font-weight:400"><span class="cwarn ${r[5]}">${ic('i-clock')}${r[2]} · ${r[3]}</span></small></b><span class="hide-p">${esc(r[4])}</span><span>${ic('i-back')}</span></a>`).join('')}</div>
    <div><a class="btn sm" href="#">הצג הכול<small class="mut">· 9</small></a></div></div>`;
}
function agenda() {
  if (S.state === 'loading') return skeleton(4, 44);
  // partial: the arrivals come from the board and stay; work starts, due dates and payments come from the summary route
  const days = S.state === 'partial' ? AGENDA.map((d) => ({ ...d, rows: d.rows.filter((r) => r[1].startsWith('הגעת')) })).filter((d) => d.rows.length) : AGENDA;
  return `<div class="body">${S.state === 'partial' ? `<div class="unavail">מועדי הגשה, תחילת עבודה ותשלומים - לא זמין כרגע<button type="button" class="btn sm">${ic('i-refresh')}נסה שוב</button></div>` : ''}${days.map((d, i) => `<div class="sect day"><h4><span class="${i === 0 ? 'today' : ''}">${esc(d.d)}</span></h4><div class="closedrows">${d.rows.map((r) => `<a class="cr" href="#"><span class="num">${r[0]}</span><b><i class="dot ${r[4]}"></i> ${esc(r[1])}<small style="display:block;font-weight:400;color:var(--dv-text-2)">${esc(r[2])}${r[3] ? ' · ' + esc(r[3]) : ''}</small></b><span></span><span>${ic('i-back')}</span></a>`).join('')}</div></div>`).join('')}</div>`;
}
function departments() {
  if (S.state === 'loading') return skeleton(3, 40);
  if (S.state === 'partial') return `<div class="body">${unavailable()}</div>`;
  const H = ['מחלקה', 'פתוחות', 'תקועות', 'באיחור', 'מחכות להחלטה', 'טופלו ב-7 ימים', 'מטפלים עמוסים'];
  return `<div class="body"><table class="rtbl phone-cards"><thead><tr>${H.map((h, i) => `<th class="${i ? 'num' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${DEPT_ROWS.map((r) => `<tr><td><a class="tl" href="#">${esc(r[0])}</a></td>${r.slice(1).map((v, i) => `<td class="num${(i === 1 || i === 2) && v > 2 ? ' bad' : ''}">${n(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <div class="dcards">${DEPT_ROWS.map((r) => `<a class="dcard" href="#"><b>${esc(r[0])}</b><span class="nums"><span>פתוחות <em>${r[1]}</em></span><span>תקועות <em>${r[2]}</em></span><span>באיחור <em>${r[3]}</em></span><span>להחלטה <em>${r[4]}</em></span><span>טופלו <em>${r[5]}</em></span><span>עמוסים <em>${r[6]}</em></span></span></a>`).join('')}</div></div>`;
}

/* ---------------------------------------------------------------- the page */
function render() {
  document.documentElement.dataset.theme = S.theme;
  const page = document.getElementById('page');
  page.className = 'page' + (S.state === 'offline' ? ' stale' : '');
  const deptSeg = S.role === 'all'
    ? `<div class="seg sm depts" role="radiogroup" aria-label="מחלקות"><button type="button" role="radio" aria-checked="${!S.dept}" data-dept="">כל המחלקות<small>39</small></button>${DEPTS.map((d, i) => `<button type="button" role="radio" aria-checked="${S.dept === d.id}" data-dept="${d.id}">${d.name}<small>${[24, 9, 6][i]}</small></button>`).join('')}</div>`
    : `<div class="seg sm depts" role="radiogroup" aria-label="מחלקות"><button type="button" role="radio" aria-checked="${!S.dept}" data-dept="">כל המחלקות שלי<small>33</small></button><button type="button" role="radio" aria-checked="${S.dept === 'maint'}" data-dept="maint">אחזקה<small>24</small></button><button type="button" role="radio" aria-checked="${S.dept === 'clean'}" data-dept="clean">ניקיון<small>9</small></button></div>`;
  const header = `<header class="dh" id="dh">
    ${S.state === 'offline' ? `<div class="offline-top" role="status">${ic('i-offline')}אין חיבור · הנתונים מ-14:02</div>` : ''}
    <div class="dh-row"><div class="titles"><div class="crumbs">ניהול השירות</div><h1>סקירה</h1></div></div>
    <div class="dh-det">
      ${deptSeg}
      <span class="amb">עודכן <em>לפני 20 שנ׳</em></span>
      <span class="grow"></span>
      <a class="btn sm hide-ph" href="#">${ic('i-ticket')}לוח מנהל</a>
    </div>
  </header>`;
  if (S.state === 'empty') {
    page.innerHTML = header + `<div class="statebox glass" role="status"><span class="ring">${ic('i-ticket')}</span><b>אין עדיין קריאות במחלקה</b><a class="btn primary" href="#">${ic('i-plus')}פתיחת קריאה</a></div>`;
    return;
  }
  const th = throughput();
  const widgets = [];
  widgets.push(kpis());
  const grid = [];
  if (S.role === 'all' && !S.dept) grid.push(widget('departments', 'השוואת מחלקות', 'איזו מחלקה בבעיה?', departments(), { cls: 'full' }));
  grid.push(widget('stuck', 'איפה נתקע', 'באיזה מקום ולמה?', whereStuck(), { cls: 'wide', badge: S.state === 'fine' ? '' : ` <span class="cnt">10</span>` }));
  grid.push(widget('waits', 'מי מחכה למי', 'אצל מי הכדור?', whoWaits()));
  grid.push(widget('load', 'עומס מטפלים', 'מי עמוס ומי פנוי?', handlerLoad(), { cls: 'wide', badge: S.state === 'fine' ? '' : ` <span class="cnt bad">1 עמוס</span>` }));
  grid.push(widget('overdue', 'באיחור', 'מה עבר את המועד?', overdue(), { badge: S.state === 'fine' ? '' : ` <span class="cnt bad">9</span>` }));
  grid.push(widget('approvals', 'ממתין לאישורי', 'מה תקוע בגללי?', approvals(), { badge: S.state === 'fine' ? '' : ` <span class="cnt">4</span>` }));
  grid.push(widget('rfqs', 'בקשות להצעת מחיר', 'מה מחכה להחלטה?', rfqs(), { badge: S.state === 'fine' ? '' : ` <span class="cnt info">4</span>` }));
  grid.push(widget('upcoming', 'השבועיים הקרובים', 'מי מגיע ומה לשלם?', agenda()));
  grid.push(widget('throughput', 'כמה טופל', 'כמה כל אחד סיים?', th.body, { cls: 'wide', extra: th.seg }));
  grid.push(widget('daily', 'נפתחו מול נסגרו', 'עומדים בקצב?', openedClosed()));
  page.innerHTML = header + widgets.join('') + `<div class="wgrid">${grid.join('')}</div>`;
}
document.getElementById('page').addEventListener('click', (e) => {
  const fold = e.target.closest('[data-fold]');
  if (fold) { const k = fold.dataset.fold; S.folded.has(k) ? S.folded.delete(k) : S.folded.add(k); try { localStorage.setItem('mock.mgrdash.folded', JSON.stringify([...S.folded])); } catch {} render(); return; }
  const r = e.target.closest('[data-reason]'); if (r) { S.reason = r.dataset.reason; render(); return; }
  const p = e.target.closest('[data-period]'); if (p) { S.period = p.dataset.period; render(); return; }
  const d = e.target.closest('[data-dept]'); if (d) { S.dept = d.dataset.dept; render(); return; }
  if (e.target.closest('a[href="#"]')) e.preventDefault();
});
/* the header compacts while scrolling (media-page.ts: a visual bar of the title row's height) */
const screen = document.getElementById('screen');
screen.addEventListener('scroll', () => { const dh = document.getElementById('dh'); if (!dh) return; const compact = screen.scrollTop > 40; dh.classList.toggle('compact', compact); const row = dh.querySelector('.dh-row'); if (row) dh.style.setProperty('--mm-bar-h', (row.getBoundingClientRect().bottom - dh.getBoundingClientRect().top + 4) + 'px'); }, { passive: true });
/* phone: cards 5, 6 and 11 folded by default (the spec) - only when the viewer never chose */
if (matchMedia('(max-width: 767px)').matches && !localStorage.getItem('mock.mgrdash.folded')) { S.folded.add('throughput'); S.folded.add('daily'); S.folded.add('departments'); }
render();
</script>
</body>
</html>

/* ====================================================================================================
   v2 ("Domus" glass pass). Layers, in the order of frontend/src/styles/devices-themes.ts:
   0. the shell (rail, bottom bar, floating corner, user menu) = design A of tokens.css, LIGHT ONLY, never themed;
   1. the glass KNOBS on the device area: every `--dv-*` name and value below is the palette "default" of
      devices-themes.ts (light block, then the dark block on data-devices-scheme="dark", then phone sizes);
      knobs marked "PROPOSED" do not exist yet - they are the media / remote additions this mockup needs;
   2. the element rules, reading ONLY knobs (plus a few 1-8 px structural literals);
   3. the fallback: no backdrop-filter or prefers-reduced-transparency -> solid surfaces, no blur.
   DomusUI (GPL-3.0) informed the ideas only; no code or CSS of it is used.
   ==================================================================================================== */
.frame{
  --sw-bg:#f5f7fb; --sw-surface:#ffffff; --sw-surface-3:#eef2f8; --sw-border:#e7ebf2;
  --sw-text:#22314c; --sw-heading:#1e2e47; --sw-text-2:#5b6a85; --sw-text-3:#8a97ae;
  --sw-accent:#2767ed; --sw-accent-soft:#edf3ff; --sw-accent-text:#2767ed; --sw-focus:#2767ed; --sw-live:#22c55e;
  --sw-font:"Heebo","Segoe UI",-apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
  --sw-font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}

.daysleft{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--dv-text-2);font-variant-numeric:tabular-nums}

.tcard{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:var(--dv-radius-sm);background:var(--dv-surface-2);border:1px solid var(--dv-border);text-align:start;color:var(--dv-text);min-height:132px;cursor:pointer;transition:transform 120ms,background var(--dv-motion)}
.tcard:hover{background:var(--dv-surface)}
.tcard:active{transform:scale(.98)}

.tcard b{font-size:14px;font-weight:600;line-height:1.3}
.tcard small{font-size:12px;color:var(--dv-text-2);line-height:1.45}
.tcard .row{display:flex;gap:6px;align-items:center;margin-top:auto}
.tcard.blank{border-style:dashed;border-color:var(--dv-border-strong);background:transparent;justify-content:center;align-items:center;text-align:center}

.mtx .ic{font-size:15px;color:#1a7f37}

.tplrow .grip{color:var(--dv-text-3);font-size:16px;cursor:grab}
.tplrow .nm{flex:1;min-width:0}
.tplrow.off .nm{opacity:.5}
.rolechips{display:flex;flex-wrap:wrap;gap:6px}

.lk .ic{font-size:14px}

.dlg .dh3 .ring.acc{background:var(--dv-accent-soft);color:var(--dv-accent-text)}
.dlg p{margin:0;font-size:13.5px;color:var(--dv-text-2);line-height:1.5}
.dlg .list{display:flex;flex-direction:column;gap:6px}
.dlg .acts .btn{min-height:40px}
.dev-phone .dlg{inset-block-start:auto;inset-block-end:calc(var(--bar-h) + 12px);width:calc(100% - 20px);z-index:85}
.dev-phone .dlg .acts .btn{min-height:44px;flex:1}
.ovl{display:flex;flex-direction:column;gap:10px}
.ovl .r{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.ovl .r span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.sk{display:flex;flex-direction:column;gap:10px;padding:var(--dv-card-pad-block) var(--dv-card-pad-inline)}
.undo{all:unset;cursor:pointer;color:#64d2ff;font-weight:700;margin-inline-start:4px;padding:4px 6px;border-radius:8px}
.undo:hover{background:rgba(255,255,255,.1)}

/* ---- script runner (fields form) ---- */
function runnerSheet(s) {
  const f = S.fields;
  const row = (fd) => { const v = f[fd.key] ?? fd.def; let ctl = '';
    if (fd.sel.kind === 'number') ctl = `<div class="stepper"><button data-a="fstep" data-k="${fd.key}" data-v="-1" aria-label="פחות">${ic('minus')}</button><span class="v"><bdi>${v}</bdi><small>${fd.sel.unit || ''}</small></span><button data-a="fstep" data-k="${fd.key}" data-v="1" aria-label="יותר">${ic('plus')}</button></div>`;
    else if (fd.sel.kind === 'boolean') ctl = `<button class="tog" role="switch" aria-checked="${!!v}" data-a="fbool" data-k="${fd.key}"></button>`;
    else if (fd.sel.kind === 'select') ctl = `<select class="selx inline" data-fsel="${fd.key}">${fd.sel.options.map((o) => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else if (fd.sel.kind === 'entity') ctl = `<select class="selx inline" data-fsel="${fd.key}">${Object.keys(ENT).filter((e) => fd.sel.domains.includes(E(e).dom) && !E(e).cls).map((e) => `<option value="${e}" ${[].concat(v)[0] === e ? 'selected' : ''}>${E(e).name}</option>`).join('')}</select>`;
    return `<div class="fr"><label>${esc(fd.name)}</label>${ctl}</div>`; };
  return sheetWrap('', `${sheetHead(esc(s.name), esc(s.desc || 'הפעלה עם פרטים'))}<div class="shb" id="shb"><div class="sentbox quiet">${ic('script')}<div>${esc(sentence(s))}</div></div><div class="fform">${s.fields.map(row).join('')}</div></div><div class="shf">${U().manage ? `<button class="btn" data-a="editscript" data-id="${s.id}">${ic('edit')}עריכה</button>` : ''}<span class="sp"></span><button class="btn quiet" data-a="closesheet">ביטול</button><button class="runbtn" data-a="dorun" data-id="${s.id}">${ic('play')}הפעל</button></div>`);
}

function toastHTML() { const t = S.toast; if (!t) return ''; return `<div class="toast ${t.bad ? 'bad' : ''}" role="status">${ic(t.bad ? 'warning' : 'check')}<span>${esc(t.m)}</span>${t.undo ? `<button class="undo" data-a="undo">${t.undo}</button>` : ''}</div>`; }
function sheetHTML() {
  const sh = S.sheet; if (!sh) return '';
  if (sh.t === 'detail') { const a = autById(sh.id); return a ? detailSheet(a) : ''; }
  if (sh.t === 'builder') return S.draft ? builderSheet() : '';
  if (sh.t === 'trace') { const a = autById(sh.id); return a ? traceSheet(a) : ''; }

  if (sh.t === 'runner') { const s = scrById(sh.id); return s ? runnerSheet(s) : ''; }
  if (sh.t === 'trash') return trashSheet();

  if (sh.t === 'templates') return templatesSheet();
  return '';
}
function frameHTML() {
  const u = U();
  let main;
  if (S.screen === 'settings') main = settingsPage();
  else if (S.state === 'noperm' && !u.manage && false) main = '';

  return `${railHTML()}<main class="main" id="main">${floatHTML()}${main}</main>${bottomHTML()}${sheetHTML()}${S.menu ? menuHTML() : ''}${dlgHTML()}${toastHTML()}`;

    case 'goerr': S.open = uid || null; S.view = 'builder'; break;
    case 'save': doSave(); return;
    case 'assched': openDlg({ h: 'ליצור כתזמון?', p: `"${esc(S.draft.name)}" היא שעון + שליטה במכשירים – בתזמונים זה פשוט יותר. חלון התזמון ייפתח עם הנתונים שכבר הזנתם.`, icon: 'calendar', ring: 'acc', ok: 'פתח תזמון חדש', cancel: 'השאר אוטומציה', cb: () => { S.sheet = null; S.draft = null; toast('נפתח תזמון חדש עם הנתונים (לשונית תזמונים)'); } }); return;

function onFrameInput(e) {
  const t = e.target;

  if (t.dataset.input === 'pq') { S.pick.q = t.value; render(); return; }

  if (t.dataset.fld === 'capName') { S.capName = t.value; render(); return; }

  if (t.dataset.cap) { const [i, k] = t.dataset.cap.split('|'); S.capRows[+i].at[k] = Number(t.value); return; }
  if (t.dataset.code != null) { S.codeDirty = true; return; }
}
function onFrameChange(e) {
  const t = e.target;
  if (t.dataset.sel) { const [uid, f] = t.dataset.sel.split('|'); if (uid === 'root') { S.draft[f] = t.value; } else if (uid.startsWith('cap')) { S.capRows[+uid.slice(3)].st = t.value; } else { const b = findBlock(uid, allBlocks(S.draft)); if (f === 'sunref') { const [w, x] = t.value.split(':'); b.after = w === 'after' ? x : null; b.before = w === 'before' ? x : null; } else { b[f] = t.value === '' ? null : t.value; if (f === 'action') { b.sens = /alarm|lock\.|siren/.test(t.value) || b.ent.some((x) => E(x).cls); if (/turn_on/.test(t.value) && !b.data) b.data = {}; } } } render(); return; }
  if (t.dataset.fsel) { S.fields[t.dataset.fsel] = t.value; return; }
}
function init() {

  fr.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.pick) S.pick = null; else if (S.typePop) S.typePop = null; else if (S.dlg) S.dlg = null; else if (S.pop) S.pop = null; else if (S.menu) S.menu = false; else if (S.sheet) { S.sheet = null; S.draft = null; } render(); } if (e.key === 'Enter' && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); } });

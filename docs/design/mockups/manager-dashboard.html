:root {
  --sw-font: "Heebo", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans Hebrew", Arial, sans-serif;
  --sw-fs-xs: 12px; --sw-fs-sm: 12.5px; --sw-fs-md: 14px; --sw-fs-lg: 15.5px; --sw-fs-xl: 17px; --sw-fs-2xl: 21px;
  --card-r: 24px; --blk-r: 14px; --ctl-r: 999px;
  --mm-motion: 240ms; --mm-ease: cubic-bezier(0.22, 1, 0.36, 1);
}
:root, :root[data-theme="light"] {
  --sw-accent: #2a63f0; --sw-accent-hover: #1f52d6; --sw-accent-soft: rgba(42,99,240,.12); --sw-accent-text: #1d51d2;
  --sw-success: #1f9d55; --sw-success-soft: rgba(31,157,85,.14); --ok-text: #14703c;
  --sw-warning: #bf7506; --sw-warning-soft: rgba(217,138,11,.15); --warn-text: #7a4c00;
  --sw-danger: #d93838; --sw-danger-soft: rgba(217,56,56,.12); --bad-text: #a82525;
  --sw-purple-soft: rgba(124,92,240,.14); --sw-purple-text: #5a3fc0;
  --dv-backdrop: radial-gradient(1100px 560px at 85% -12%, rgba(255,184,86,.2), transparent 60%), radial-gradient(900px 520px at 8% 112%, rgba(10,132,255,.16), transparent 60%), linear-gradient(180deg, #eef2f9, #e5eaf4);
  --dv-bg: #e9eef6;
  --dv-surface: rgba(255,255,255,.64); --dv-surface-2: rgba(255,255,255,.5); --dv-surface-3: rgba(120,120,128,.14); --dv-surface-solid: #fbfcfe;
  --dv-border: rgba(60,60,67,.12); --dv-border-strong: rgba(60,60,67,.22);
  --dv-text: #1c1c1e; --dv-text-2: #4c4c50; --dv-text-3: #6e6e73;
  --dv-shadow-1: 0 10px 30px rgba(31,45,80,.1), inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-2: 0 18px 44px rgba(31,45,80,.16), inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-control: 0 1px 4px rgba(0,0,0,.18);
  --mm-sheen: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 46%); --mm-seg-thumb: #ffffff;
  --skel: rgba(120,120,128,.16);
  --s-closed: #2a63f0; --s-opened: #0f9488;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sw-accent: #6ea2ff; --sw-accent-hover: #8ab5ff; --sw-accent-soft: rgba(110,162,255,.18); --sw-accent-text: #8fb8ff;
    --sw-success: #3ddc84; --sw-success-soft: rgba(61,220,132,.2); --ok-text: #3ddc84;
    --sw-warning: #f5b043; --sw-warning-soft: rgba(245,176,67,.2); --warn-text: #f5b043;
    --sw-danger: #ff6b62; --sw-danger-soft: rgba(255,107,98,.2); --bad-text: #ff8a82;
    --sw-purple-soft: rgba(167,139,250,.2); --sw-purple-text: #c4b1ff;
    --dv-backdrop: radial-gradient(1200px 600px at 80% -10%, rgba(255,184,86,.22), transparent 60%), radial-gradient(900px 500px at 10% 110%, rgba(10,132,255,.25), transparent 60%), #0a0a0c;
    --dv-bg: #0a0a0c;
    --dv-surface: rgba(28,28,30,.72); --dv-surface-2: rgba(44,44,46,.62); --dv-surface-3: rgba(235,235,245,.14); --dv-surface-solid: #1c1c1e;
    --dv-border: rgba(255,255,255,.13); --dv-border-strong: rgba(255,255,255,.24);
    --dv-text: #f5f5f7; --dv-text-2: rgba(235,235,245,.72); --dv-text-3: rgba(235,235,245,.56);
    --dv-shadow-1: 0 18px 48px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
    --dv-shadow-2: 0 22px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);

    --mm-sheen: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.015) 50%); --mm-seg-thumb: rgba(118,118,128,.5);
    --skel: rgba(235,235,245,.1);
    --s-closed: #4a86f5; --s-opened: #1f9a8b;
  }
}
:root[data-theme="dark"] {

@media (prefers-reduced-motion: reduce) { * { animation-duration: 0ms !important; transition-duration: 0ms !important; } }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--sw-font); font-size: var(--sw-fs-md); line-height: 1.5; color: var(--dv-text); background: var(--dv-backdrop); background-color: var(--dv-bg); background-attachment: fixed; min-height: 100vh; overflow-x: hidden; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sw-accent); outline-offset: 2px; }

/* gallery bar - NOT product */
#gal { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 6px 16px; background: #ffffff; color: #1d2433; border-bottom: 1px solid #d5dae4; font-size: 12px; }
#gal b { font-size: 12.5px; }
#gal .g { display: inline-flex; border: 1px solid #c4cad6; border-radius: 6px; overflow: hidden; }
#gal .g button { border: 0; border-inline-start: 1px solid #c4cad6; background: #fff; color: #1d2433; padding: 3px 9px; cursor: pointer; font-size: 12px; }
#gal .g button:first-child { border-inline-start: 0; }
#gal .g button.on { background: #2767ed; color: #fff; }
#gal small { color: #5b6a85; }

/* page */
.page { max-width: 1480px; margin: 0 auto; padding: 22px 36px 60px; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
.top h1 { margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
.top .grow { flex: 1; }
.upd { font-size: var(--sw-fs-sm); color: var(--dv-text-3); display: inline-flex; align-items: center; gap: 6px; }
.upd::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sw-success); }
.upd.stale::before { background: var(--dv-text-3); }
.seg { display: inline-flex; align-items: center; gap: 2px; background: var(--dv-surface-3); border-radius: var(--ctl-r); padding: 3px; max-width: 100%; }
.seg button { border: 0; background: transparent; border-radius: var(--ctl-r); padding: 4px 13px; font-size: var(--sw-fs-sm); font-weight: 600; min-height: 32px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; color: var(--dv-text); transition: background var(--mm-motion) var(--mm-ease); }
.seg button.on { background: var(--mm-seg-thumb); box-shadow: var(--dv-shadow-control); }
.seg button small { font-size: var(--sw-fs-xs); color: var(--dv-text-2); }
.rb { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--dv-surface-3); cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 13px; border-radius: var(--ctl-r); border: 1px solid var(--dv-border); background: var(--mm-sheen), var(--dv-surface); font-size: var(--sw-fs-sm); font-weight: 600; cursor: pointer; box-shadow: var(--dv-shadow-control); white-space: nowrap; }
.btn.text { background: transparent; border-color: transparent; box-shadow: none; color: var(--sw-accent-text); padding: 0 6px; }

        thru(d, partial) + trend(d, partial) + '</div>';
    }
    if (st === 'offline') html = html.replace('<div class="kpis">', '<div class="kpis" style="opacity:.6">').replace('<div class="grid">', '<div class="grid" style="opacity:.6">');
    document.getElementById('app').innerHTML = html;
    bindChart(d);
  }

  function bindChart(d) {
    var tip = document.getElementById('tip'); if (!tip) return;
    var svg = tip.previousElementSibling;
    svg.querySelectorAll('g.b').forEach(function (g) {
      g.addEventListener('mousemove', function (ev) {
        var i = +g.getAttribute('data-i'), v = d.daily[i], day = 17 - i;
        tip.innerHTML = '<b>' + day + '.10</b> · נפתחו ' + v[0] + ' · נסגרו ' + v[1];
        var r = svg.parentElement.getBoundingClientRect();
        tip.style.display = 'block';
        var x = ev.clientX - r.left, w = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(r.width - w, x - w / 2)) + 'px';
        tip.style.top = '-8px';
      });
      g.addEventListener('mouseleave', function () { tip.style.display = 'none'; });
    });
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button, a');
    if (!t) return;
    if (t.tagName === 'A') ev.preventDefault();
    var g = t.closest('#gal .g');
    if (g) {
      g.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === t); });
      S[g.getAttribute('data-g')] = t.getAttribute('data-v');
      if (g.getAttribute('data-g') === 'who') S.dept = t.getAttribute('data-v') === 'all' ? 'all' : 'mnt';
      render(); return;
    }
    if (t.id === 'theme') {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
      render(); return;
    }
    if (t.hasAttribute('data-dept')) { S.dept = t.getAttribute('data-dept'); render(); return; }
    if (t.hasAttribute('data-period')) { S.period = t.getAttribute('data-period'); save(); render(); return; }
    if (t.hasAttribute('data-reason')) { var r = t.getAttribute('data-reason'); S.reason = S.reason === r ? '' : r; render(); return; }
    if (t.hasAttribute('data-fold')) {
      var id = t.getAttribute('data-fold'), c = t.closest('.card'), f = !c.classList.contains('folded');
      c.classList.toggle('folded', f); t.setAttribute('aria-expanded', String(!f)); S.folded[id] = f; save(); return;
    }
  });
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
  render();
})();
</script>
</body>
</html>

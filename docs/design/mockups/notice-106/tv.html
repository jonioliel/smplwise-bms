<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>לוח הודעות - מסך טלוויזיה</title>
<!--
  CR-NOTICE106 v3 - the TV (digital-signage) surface as a STANDALONE page. Static design mock-up, NOT product code:
  self-contained, no network request, fake data only. The board page's "display" tab previews THIS file in an iframe,
  so the preview and the full screen are the same renderer.

  HOW IT SCALES (v3): the screen is authored on a fixed design canvas - 1920 x 1080 (landscape) or 1080 x 1920 (portrait) -
  and the whole canvas is zoomed to the viewport: 1280x720 = x0.667, 1920x1080 = x1, 3840x2160 = x2. One axis is exactly the
  base and the other stretches to the screen's real ratio, so the page always fills the screen, never scrolls and never shrinks
  its type relative to the screen. A portrait template on a landscape screen (or the reverse) is pillar-/letter-boxed.

  URL:  tv.html?board=lobby|parking|gym  &template=1|2|3  &theme=dark|light  &orient=auto|landscape|portrait
        &urgent=band|full|0 (default band: the board's urgent notice)  &net=live|stale|offline|gone  &empty=1  &night=1
        &news=0|1 &promo=0|1 &info=0|1 &weather=0|1 &clock=0|1 &hebdate=0|1 &company=0|1  &fs=0.8..1.4 (font scale)
        &rotate=<s>  &clock=fixed (09:12, ticker and drift frozen - for screenshots)  &controls=1 (mock-up control strip)
        &embed=1 (inside the Settings preview iframe: no controls, nothing else changes)
  Sizes (canvas px at 1920): clock 176-210, notice title 84, notice body 50, urgent title 66 (full takeover 116), weather 104,
  ticker 42, building chips 30. Safe margins 64 / 40 px (3.3 % / 3.7 %). Burn-in: the whole canvas drifts +-6 px every 60 s.
-->
<style>
:root {
  --bg: #f2f5fa; --bg-2: #e8edf6; --card: #ffffff; --card-2: #f6f8fc; --line: #dde3ee; --line-2: #ccd5e4;
  --text: #17233a; --head: #0f1b30; --text-2: #3f4d68; --text-3: #5d6b85;
  --accent: #2160e0; --accent-soft: #e5eeff; --accent-text: #1c55c9;
  --warn: #e08a00; --warn-soft: #fff1d6; --warn-text: #9a5b00;
  --danger: #c62828; --danger-band: #c62828; --danger-soft: #fde7e7; --danger-text: #a61b1b;
  --ok: #1fa855; --stale: #e08a00; --off: #8a94a6; --off-soft: #e9edf3; --off-text: #4f5a6c;
  --shadow: 0 10px 30px rgba(20,35,60,.08);
  --font: "Heebo", "Assistant", "Rubik", "Segoe UI", "Noto Sans Hebrew", Roboto, Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #070c18; --bg-2: #0c1426; --card: #111b30; --card-2: #16223b; --line: #1f2c47; --line-2: #2b3b5c;
  --text: #e8edf7; --head: #ffffff; --text-2: #b3bfd6; --text-3: #8f9cb6;
  --accent: #4f86ff; --accent-soft: rgba(79,134,255,.18); --accent-text: #9dbcff;
  --warn: #ffb02e; --warn-soft: rgba(255,176,46,.17); --warn-text: #ffc566;
  --danger: #ff5a52; --danger-band: #b71c1c; --danger-soft: rgba(255,90,82,.18); --danger-text: #ff8f88;
  --ok: #34d67a; --stale: #ffb02e; --off: #7d899e; --off-soft: rgba(125,137,158,.2); --off-text: #c0c8d6;
  --shadow: none;
  color-scheme: dark;
}
[data-look="acc"] { --c: var(--accent); --c-soft: var(--accent-soft); --c-text: var(--accent-text); }
[data-look="warn"] { --c: var(--warn); --c-soft: var(--warn-soft); --c-text: var(--warn-text); }
[data-look="alarm"] { --c: var(--danger); --c-soft: var(--danger-soft); --c-text: var(--danger-text); }
[data-look="ok"] { --c: var(--ok); }
[data-look="off"] { --c: var(--off); }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; block-size: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; cursor: none; }
body.ctl { cursor: default; }
svg.ic { inline-size: 1em; block-size: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }

/* ===== the viewport host and the design canvas (sized + zoomed by fitCanvas()) ===== */
#host { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: var(--bg); }
body.box #host { background: #000; }
#cv { position: relative; inline-size: 1920px; block-size: 1080px; overflow: hidden; background: var(--bg); --fs: 1; --k: 1; }
#cv.tf { position: absolute; inset-block-start: 0; left: 0; transform-origin: 0 0; }
:root[data-theme="dark"] #cv { background: radial-gradient(120% 90% at 85% 0%, #10204a 0%, rgba(16,32,74,0) 55%), var(--bg); }
.shift { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
  grid-template-areas: 'hd' 'ban' 'off' 'bd' 'tk' 'ft'; row-gap: 22px; padding: 36px 64px 32px; transition: transform 3s linear, filter .6s; }
#cv.portrait .shift { padding: 52px 48px 40px; row-gap: 24px; }

/* header: company logo (inline start) - building / board name - [clock in template 2] - SmplWise logo (inline end) */
.hd { grid-area: hd; display: flex; align-items: center; gap: 40px; block-size: 100px; }
.lg { flex: none; display: flex; align-items: center; block-size: 88px; }
.lg svg { block-size: 100%; inline-size: auto; }
.lg.company svg { inline-size: 385px; }
.lg.product { block-size: 76px; }
.lg.product svg { inline-size: 280px; }
#cv[data-company="0"] .lg.company { display: none; }
.bname { flex: 1; min-inline-size: 0; text-align: center; display: grid; gap: 2px; }
.bname b { font-size: calc(46px * var(--fs)); font-weight: 800; line-height: 1.1; color: var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
.bname span { font-size: calc(28px * var(--fs)); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hclock { display: none; flex: none; text-align: center; padding-inline: 34px; border-inline: 2px solid var(--line); }
.hclock b { display: block; font-size: calc(92px * var(--fs)); font-weight: 800; line-height: .95; color: var(--head); letter-spacing: -0.03em; }
.hclock span { display: block; font-size: calc(27px * var(--fs)); color: var(--text-2); margin-block-start: 4px; white-space: nowrap; }
#cv[data-tpl="2"]:not(.portrait) .hclock { display: block; }
#cv[data-tpl="2"][data-clock="0"] .hclock { display: none; }

/* urgent band (critical notice): never rotated out, white on a deep red (>= 6:1) */
.ban { grid-area: ban; display: none; align-items: center; gap: 34px; padding: 20px 40px; border-radius: 22px; background: var(--danger-band); color: #fff; min-block-size: 0; }
#cv[data-ub="1"] .ban { display: flex; }
.ban > svg { font-size: 84px; flex: none; stroke-width: 2.2; }
.ban .bt { flex: 1; min-inline-size: 0; display: grid; gap: 4px; }
.ban .bt small { display: none; font-size: calc(26px * var(--fs)); font-weight: 700; letter-spacing: .02em; opacity: .9; }
#cv.portrait .ban .bt small { display: block; }
.ban .bt b { font-size: calc(64px * var(--fs)); font-weight: 800; line-height: 1.05; letter-spacing: -0.01em; }
.ban .bt > span { font-size: calc(36px * var(--fs)); line-height: 1.25; opacity: .96; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.ban .until { flex: none; font-size: calc(34px * var(--fs)); font-weight: 700; background: rgba(255,255,255,.2); border-radius: 999px; padding: 12px 30px; white-space: nowrap; }
.offband { grid-area: off; display: none; align-items: center; justify-content: center; gap: 16px; padding: 14px; border-radius: 16px; background: var(--off-soft); color: var(--off-text); font-size: calc(32px * var(--fs)); font-weight: 700; }
.offband svg { font-size: 40px; }
#cv[data-net="offline"] .offband { display: flex; }

/* ===== body per template ===== */
.bd { grid-area: bd; min-block-size: 0; display: grid; gap: 28px; }
/* template 1 (landscape): side column (clock, date, weather) at the inline start + the stage (notice) and the promo strip */
#cv[data-tpl="1"] .bd { grid-template-columns: 560px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: 'side stage' 'side promo'; }
#cv[data-tpl="1"][data-promo="0"] .bd, #cv[data-tpl="1"][data-ub="1"] .bd { grid-template-rows: minmax(0, 1fr); grid-template-areas: 'side stage'; }
#cv[data-tpl="1"][data-promo="0"] .promo, #cv[data-tpl="1"][data-ub="1"] .promo { display: none; }
#cv[data-tpl="1"][data-clock="0"][data-weather="0"] .bd { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'stage' 'promo'; }
#cv[data-tpl="1"][data-clock="0"][data-weather="0"]:not(.portrait) .side { display: none; }
/* template 2 (landscape): one large notice + "up next" strip; the clock lives in the header */
#cv[data-tpl="2"] .bd { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: 'stage' 'next'; }
#cv[data-tpl="2"] .side, #cv[data-tpl="2"] .promo { display: none; }

.side { grid-area: side; min-block-size: 0; display: flex; flex-direction: column; gap: 26px; }
.clk { display: grid; gap: 6px; padding-block-start: 4px; }
.clk b { font-size: calc(184px * var(--fs)); font-weight: 800; line-height: .9; letter-spacing: -0.045em; color: var(--head); text-align: right; }
.clk .d1 { font-size: calc(42px * var(--fs)); font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-block-start: 10px; }
.clk .d2 { font-size: calc(32px * var(--fs)); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#cv[data-clock="0"] .clk { display: none; }
#cv[data-hebdate="0"] .clk .d2 { display: none; }
.wx { background: var(--card); border: 2px solid var(--line); border-radius: 28px; padding: 26px 32px; display: grid; gap: 20px; box-shadow: var(--shadow); min-block-size: 0; }
#cv[data-weather="0"] .wx { display: none; }
.wx .now { display: flex; align-items: center; gap: 26px; }
.wx .now svg { font-size: 104px; color: var(--warn); }
.wx .now b { font-size: calc(104px * var(--fs)); font-weight: 800; line-height: 1; color: var(--head); letter-spacing: -0.03em; }
.wx .now span { font-size: calc(32px * var(--fs)); color: var(--text-2); line-height: 1.25; }
.wx .hrs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); text-align: center; border-block-start: 2px solid var(--line); padding-block-start: 18px; }
.wx .hrs div { display: grid; gap: 8px; justify-items: center; }
.wx .hrs span { font-size: calc(26px * var(--fs)); color: var(--text-3); }
.wx .hrs svg { font-size: 46px; color: var(--text-2); }
.wx .hrs b { font-size: calc(36px * var(--fs)); color: var(--head); font-weight: 700; }
#cv[data-tpl="1"][data-ub="1"] .wx .hrs, #cv[data-tpl="1"][data-ub="1"] .clk .d2, .side.c1 .wx .hrs, .side.c2 .clk .d2, .side.c3 .wx .now span, .side.c4 .wx { display: none; }

/* the stage: one notice at a time, severity on the inline-start edge */
.stage { grid-area: stage; position: relative; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-block-size: 0; }
.card { grid-area: 1 / 1; position: relative; display: flex; flex-direction: column; gap: calc(16px * var(--k)); padding: calc(36px * var(--k)) calc(52px * var(--k)) calc(34px * var(--k)); min-block-size: 0; overflow: hidden;
  background: var(--card); border: 2px solid var(--line); border-inline-start: 16px solid var(--c); border-radius: 32px; box-shadow: var(--shadow); opacity: 0; transition: opacity .9s cubic-bezier(.2,0,0,1); }
.card.on { opacity: 1; }
.card > * { flex-shrink: 0; }
.card .sev { align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; padding: calc(8px * var(--k)) calc(26px * var(--k)); border-radius: 999px; background: var(--c-soft); color: var(--c-text); font-size: calc(32px * var(--fs) * var(--k)); font-weight: 700; }
.card .sev svg { font-size: 1.1em; }
.card h1 { margin: 0; font-size: calc(84px * var(--fs) * var(--k)); line-height: 1.08; font-weight: 800; color: var(--head); letter-spacing: -0.015em; text-wrap: balance; }
.card p { margin: 0; font-size: calc(50px * var(--fs) * var(--k)); line-height: 1.32; color: var(--text); white-space: pre-line; max-inline-size: 40ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .when { margin-block-start: auto; display: flex; align-items: center; gap: 16px; font-size: calc(36px * var(--fs) * var(--k)); font-weight: 600; color: var(--text-2); }
.card .when svg { font-size: 1.1em; color: var(--text-3); }
#cv[data-tpl="2"] .card h1 { font-size: calc(96px * var(--fs) * var(--k)); }
#cv[data-tpl="2"] .card p { font-size: calc(54px * var(--fs) * var(--k)); max-inline-size: 46ch; }
#cv[data-tpl="2"] .card .when { font-size: calc(40px * var(--fs) * var(--k)); }
.dots { position: absolute; inset-block-end: 40px; inset-inline-end: 52px; display: flex; gap: 12px; direction: rtl; }
.dots span { inline-size: 18px; block-size: 18px; border-radius: 999px; background: var(--line-2); transition: inline-size .5s, background .5s; }
.dots span.on { inline-size: 56px; background: var(--accent); }
.empty, .gone { grid-area: 1 / 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; background: var(--card); border: 2px solid var(--line); border-radius: 32px; color: var(--text-2); }
.empty svg, .gone svg { font-size: 96px; color: var(--text-3); }
.empty p, .gone p { margin: 0; font-size: calc(56px * var(--fs)); font-weight: 700; color: var(--head); }
.empty span, .gone span { font-size: calc(34px * var(--fs)); }
#cv[data-empty="1"] .card, #cv[data-empty="1"] .dots, #cv[data-empty="1"] .next, #cv[data-empty="1"] .ban, #cv[data-empty="1"] .stack { display: none !important; }
#cv[data-empty="1"] .empty { display: flex; }

/* template 2: "up next" strip */
.next { grid-area: next; display: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 22px; }
#cv[data-tpl="2"] .next { display: grid; }
.next div { display: flex; align-items: center; gap: 18px; padding: 20px 28px; border-radius: 22px; background: var(--card); border: 2px solid var(--line); min-inline-size: 0; font-size: calc(34px * var(--fs)); font-weight: 700; color: var(--text-2); transition: border-color .6s, color .6s; }
.next div i { inline-size: 20px; block-size: 20px; border-radius: 50%; background: var(--c); flex: none; }
.next div span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next div.on { border-color: var(--c); color: var(--head); background: var(--card-2); }

/* promo / info slides */
.promo { grid-area: promo; position: relative; block-size: 168px; border-radius: 28px; overflow: hidden; }
.promo .sl { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 36px; padding: 26px 44px; color: #fff; opacity: 0; transition: opacity .9s; background: linear-gradient(115deg, #1846b8, #0d6e66); }
.promo .sl.b { background: linear-gradient(115deg, #4c1d95, #1d4ed8); }
.promo .sl.c { background: linear-gradient(115deg, #9a3412, #b91c1c); }
.promo .sl.on { opacity: 1; }
.promo .sl b { display: block; font-size: calc(48px * var(--fs)); font-weight: 800; line-height: 1.1; }
.promo .sl > div > span { display: block; font-size: calc(32px * var(--fs)); opacity: .94; margin-block-start: 8px; }
.promo .sl .pic { inline-size: 220px; block-size: 108px; margin-block-end: 14px; border-radius: 18px; background: rgba(255,255,255,.14); border: 3px dashed rgba(255,255,255,.5); display: grid; place-items: center; font-size: 26px; }
.promo .pd { position: absolute; inset-block-end: 9px; inset-inline-end: 44px; inline-size: 220px; justify-content: center; display: flex; gap: 10px; }
.promo .pd span { inline-size: 14px; block-size: 14px; border-radius: 999px; background: rgba(255,255,255,.45); }
.promo .pd span.on { background: #fff; inline-size: 40px; }

/* the news ticker (off by default) */
.tk { grid-area: tk; display: none; align-items: stretch; block-size: 84px; border-radius: 20px; overflow: hidden; background: var(--card); border: 2px solid var(--line); }
#cv[data-news="1"] .tk { display: flex; }
.tk .lbl { flex: none; display: inline-flex; align-items: center; gap: 14px; padding-inline: 32px; background: var(--accent); color: #fff; font-size: calc(34px * var(--fs)); font-weight: 800; }
.tk .lbl svg { font-size: 36px; }
.tk .win { position: relative; flex: 1; min-inline-size: 0; overflow: hidden; }
.tk .track { position: absolute; left: 0; top: 50%; white-space: nowrap; font-size: calc(42px * var(--fs)); font-weight: 600; color: var(--head); animation: tick var(--dur, 60s) linear infinite; transform: translate(-100%, -50%); }
.tk .track em { font-style: normal; font-weight: 500; color: var(--text-3); font-size: .78em; margin-inline: 22px 70px; }
@keyframes tick { from { transform: translate(-100%, -50%); } to { transform: translate(var(--winw, 1600px), -50%); } }
body.frozen .tk .track { animation-play-state: paused; animation-delay: calc(var(--dur, 60s) * -0.42); }

/* footer: building chips (state only) + the live / stale status */
.ft { grid-area: ft; display: flex; align-items: center; gap: 18px; min-block-size: 62px; }
.chips { display: flex; flex-wrap: wrap; gap: 14px; min-inline-size: 0; flex: 0 1 auto; block-size: calc(64px * var(--fs)); padding-block: 1px; overflow: hidden; }
#cv[data-info="0"] .chips { display: none; }
.ch { display: flex; align-items: center; gap: 12px; padding: 8px 20px; line-height: 1.2; border-radius: 999px; background: var(--card); border: 2px solid var(--line); font-size: calc(30px * var(--fs)); font-weight: 700; color: var(--text); white-space: nowrap; }
.ch svg { font-size: 34px; color: var(--text-3); }
.ch small { font-size: 1em; font-weight: 500; color: var(--text-2); }
.ch i { inline-size: 18px; block-size: 18px; border-radius: 50%; background: var(--c); flex: none; }
.ft .sp { flex: 1; }
.live { flex: none; display: inline-flex; align-items: center; gap: 12px; font-size: calc(26px * var(--fs)); color: var(--text-3); white-space: nowrap; }
.live i { inline-size: 16px; block-size: 16px; border-radius: 50%; background: var(--ok); }
.stale { display: none; align-items: center; gap: 10px; padding: 8px 20px; border-radius: 999px; background: var(--warn-soft); color: var(--warn-text); font-size: calc(28px * var(--fs)); font-weight: 700; white-space: nowrap; }
.stale svg { font-size: 30px; }
#cv[data-net="stale"] .stale { display: inline-flex; }
#cv[data-net="stale"] .live i, #cv[data-net="offline"] .live i { background: var(--stale); }
#cv[data-net="offline"] .bd { opacity: .7; }
#cv[data-net="gone"] .bd > *, #cv[data-net="gone"] .ban, #cv[data-net="gone"] .tk, #cv[data-net="gone"] .chips, #cv[data-net="gone"] .live { display: none !important; }
#cv[data-net="gone"] .bd { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: minmax(0, 1fr) !important; grid-template-areas: 'gone' !important; }
#cv[data-net="gone"] .bd > .gone { display: flex !important; grid-area: gone; }
#cv[data-night="1"] .shift { filter: brightness(.5); }

/* ===== the full urgent takeover (?urgent=full): the first minute after publication, then one slot per rotation round ===== */
.take { position: absolute; inset: 0; z-index: 5; display: none; grid-template-rows: auto minmax(0, 1fr) auto; padding: 48px 72px 44px; color: #fff; background: linear-gradient(160deg, #8f1111 0%, #c21d1d 55%, #a51616 100%); }
#cv[data-urgent="full"] .take { display: grid; }
.take .top { display: flex; align-items: center; gap: 36px; }
.take .top .lg { block-size: 80px; }
.take .top .lg.product { block-size: 70px; }
.take .top .lg.company { block-size: 92px; padding: 10px 22px; border-radius: 18px; background: #fff; }
.take .top .sp { flex: 1; }
.take .top .tclk { font-size: calc(80px * var(--fs)); font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.take .mid { display: flex; flex-direction: column; justify-content: center; gap: 30px; min-block-size: 0; max-inline-size: 1500px; }
.take .tag { display: inline-flex; align-items: center; gap: 20px; align-self: flex-start; padding: 14px 34px; border-radius: 999px; background: #fff; color: #a51616; font-size: calc(44px * var(--fs)); font-weight: 800; }
.take .tag svg { font-size: 52px; stroke-width: 2.4; }
.take h1 { margin: 0; font-size: calc(124px * var(--fs) * var(--k)); line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.take p { margin: 0; font-size: calc(62px * var(--fs) * var(--k)); line-height: 1.3; opacity: .97; max-inline-size: 32ch; }
.take .bot { display: flex; align-items: center; gap: 24px; font-size: calc(44px * var(--fs)); font-weight: 700; }
.take .bot .until { background: rgba(255,255,255,.2); border-radius: 999px; padding: 14px 36px; }
.take .bot .sp { flex: 1; }
.take .bot .meta { font-size: calc(28px * var(--fs)); font-weight: 500; opacity: .85; }

    ['news', 'promo', 'info', 'weather', 'clock', 'hebdate', 'company'].forEach(function (k) { cv.dataset[k] = O[k] ? '1' : '0'; });
    cv.style.setProperty('--fs', O.fs);
    var items = b.items, h = '';
    h += '<header class="hd">' + L.co + '<div class="bname"><b>' + esc(b.name) + '</b><span>' + esc(b.sub) + '</span></div>';
    h += '<div class="hclock"><b class="num" data-time>' + timeStr() + '</b><span data-date-short>' + esc(dateStr(true)) + '</span></div>' + L.sw + '</header>';
    h += '<div class="ban" role="alert">' + ic('warning') + '<div class="bt"><small>הודעה דחופה</small><b>' + tx(URGENT.t) + '</b><span>' + tx(URGENT.b) + '</span></div><span class="until">' + tx(URGENT.until) + '</span></div>';
    h += '<div class="offband">' + ic('offline') + 'הלוח מנותק מהמערכת · מוצגות ההודעות האחרונות</div>';
    h += '<main class="bd">';
    h += '<div class="side">';
    h += '<div class="clk"><b class="num" data-time>' + timeStr() + '</b><span class="d1" data-date>' + esc(dateStr(false)) + '</span><span class="d2">י״א בחשוון תשפ״ז · כניסת שבת 17:24</span></div>';
    h += '<div class="wx"><div class="now">' + ic(WX.i) + '<b class="num">' + WX.t + '°</b><span>' + esc(WX.d) + '</span></div><div class="hrs">' + WX.hrs.map(function (x) { return '<div><span class="num">' + x[0] + '</span>' + ic(x[1]) + '<b class="num">' + x[2] + '°</b></div>'; }).join('') + '</div></div></div>';
    var chips = INFO.map(function (x) { return '<div class="ch" data-look="' + x[3] + '">' + ic(x[0]) + '<span>' + esc(x[1]) + ' <small>' + esc(x[2]) + '</small></span><i></i></div>'; }).join('');
    h += '<div class="pchips">' + chips + '</div>';
    h += '<div class="stage">' + items.map(function (n, k) { return card(n, k === 0); }).join('');
    h += '<div class="dots" aria-hidden="true">' + (items.length > 1 ? items.map(function (n, k) { return '<span' + (k === 0 ? ' class="on"' : '') + '></span>'; }).join('') : '') + '</div>';
    h += '<div class="empty">' + ic('board') + '<p>אין הודעות כרגע</p><span>' + esc(b.bld) + ' · יום נעים</span></div></div>';
    h += '<div class="stack"></div>';
    h += '<div class="next">' + items.map(function (n, k) { return '<div class="' + (k === 0 ? 'on' : '') + '" data-look="' + SEV[n.sev] + '"><i></i><span>' + esc(n.t) + '</span></div>'; }).join('') + '</div>';
    h += '<div class="promo">' + b.promos.map(function (p, k) { return '<div class="sl ' + p[0] + (k === 0 ? ' on' : '') + '"><div><b>' + esc(p[1]) + '</b><span>' + esc(p[2]) + '</span></div><div class="pic">' + esc(p[3]) + '</div></div>'; }).join('') + '<div class="pd">' + (b.promos.length > 1 ? b.promos.map(function (p, k) { return '<span' + (k === 0 ? ' class="on"' : '') + '></span>'; }).join('') : '') + '</div></div>';
    h += '<div class="gone">' + ic('offline') + '<p>הלוח אינו פעיל</p><span>פנו להנהלת הבניין</span></div>';
    h += '</main>';
    h += '<div class="tk"><span class="lbl">' + ic('rss') + 'חדשות</span><div class="win"><div class="track">' + NEWS.map(function (n) { return esc(n[1]) + '<em>' + esc(n[0]) + '</em>'; }).join('') + '</div></div></div>';
    h += '<footer class="ft"><div class="chips">' + chips + '</div><span class="sp"></span><span class="stale">' + ic('clock') + 'לא מעודכן מ-09:04</span><span class="live"><i></i>עודכן <span class="num" data-time>' + timeStr() + '</span> · ' + esc(b.name) + '</span></footer>';
    shift.innerHTML = h;
    take.innerHTML = '<div class="top">' + L.co.replace('#co-dark', '#co-light') + '<span class="sp"></span><span class="tclk num" data-time>' + timeStr() + '</span><span class="sp"></span>' + L.sw.replace('#sw-word"', '#sw-word-dark"') + '</div>' +
      '<div class="mid"><span class="tag">' + ic('warning') + 'הודעה דחופה</span><h1>' + tx(URGENT.t) + '</h1><p>' + tx(URGENT.b) + '</p></div>' +
      '<div class="bot"><span class="until">' + tx(URGENT.until) + '</span><span class="sp"></span><span class="meta">' + esc(b.bld) + ' · ' + esc(b.name) + '</span></div>';
    state.i = 0; state.pi = 0; state.page = 0;
    fitCanvas(); layoutAfter();
  }
  function card(n, on) { return '<article class="card' + (on ? ' on' : '') + '" data-look="' + SEV[n.sev] + '"><span class="sev">' + (n.sev !== 'info' ? ic('warning') : '') + SEVL[n.sev] + '</span><h1>' + tx(n.t) + '</h1><p>' + tx(n.b) + '</p><div class="when">' + ic('calendar') + '<span>' + tx(n.when) + '</span>' + '</div></article>'; }

  // ===== the canvas: fixed design size, zoomed to the viewport; one axis = base, the other follows the screen ratio =====
  var useZoom = window.CSS && CSS.supports && CSS.supports('zoom', '2');
  function fitCanvas() {
    var portrait = cv.classList.contains('portrait'), W0 = portrait ? 1080 : 1920, H0 = portrait ? 1920 : 1080;
    var vw = innerWidth || W0, vh = innerHeight || H0, s = Math.min(vw / W0, vh / H0), W = W0, H = H0;
    var sameOrient = (vh > vw) === portrait;
    if (sameOrient) { W = Math.max(W0, Math.round(vw / s)); H = Math.max(H0, Math.round(vh / s)); }
    body.classList.toggle('box', !sameOrient);
    cv.style.inlineSize = W + 'px'; cv.style.blockSize = H + 'px';
    if (useZoom) { cv.classList.remove('tf'); cv.style.zoom = s; cv.style.transform = ''; }
    else { cv.classList.add('tf'); cv.style.transform = 'translate(' + Math.round((vw - W * s) / 2) + 'px,' + Math.round((vh - H * s) / 2) + 'px) scale(' + s + ')'; }
  }

  // ===== after layout: shrink-to-fit for long notices, ticker speed, portrait pages =====
  function fit(el, min) {
    if (!el) return; el.style.setProperty('--k', 1); var k = 1, i = 0;
    while (el.scrollHeight > el.clientHeight + 2 && k > min && i < 24) { k -= 0.04; el.style.setProperty('--k', k.toFixed(2)); i++; }
  }
  function layoutAfter() {
    cv.querySelectorAll('.stage .card').forEach(function (c) { fit(c, 0.62); });
    // the side column drops its least important lines when the screen is short (offline band, urgent band, 4:3 screens)
    var side = cv.querySelector('.side'); if (side) { side.classList.remove('c1', 'c2', 'c3', 'c4'); ['c1', 'c2', 'c3', 'c4'].forEach(function (c) { if (side.scrollHeight > side.clientHeight + 1) side.classList.add(c); }); }
    if (O.urgent === 'full') fit(take.querySelector('.mid'), 0.6);
    var win = cv.querySelector('.tk .win'), tr = cv.querySelector('.tk .track');
    if (win && tr && O.news) { var ww = win.clientWidth, tw = tr.scrollWidth; tr.style.setProperty('--winw', ww + 'px'); tr.style.setProperty('--dur', Math.max(20, Math.round((ww + tw) / 130)) + 's'); }
    paginate();
  }
  // portrait: the featured card + the others as rows (as many rows as fit; the featured card shrinks to fit last)
  function paginate() {
    var st = cv.querySelector('.stack'); if (!st || !cv.classList.contains('portrait')) return;
    var items = b.items, n = items.length, cur = state.i % Math.max(1, n), h = card(items[cur], true);
    var rest = []; for (var k = 1; k < n; k++) rest.push(items[(cur + k) % n]);
    if (rest.length) h += '<div class="ul"><span class="h">ובהמשך</span>' + rest.map(function (x) { return '<div class="r" data-look="' + SEV[x.sev] + '"><i></i><b>' + tx(x.t) + '</b><span>' + tx(x.when) + '</span></div>'; }).join('') + '</div>';
    if (n > 1) h += '<div class="pdots" aria-hidden="true">' + items.map(function (x, k) { return '<span' + (k === cur ? ' class="on"' : '') + '></span>'; }).join('') + '</div>';
    st.innerHTML = h;
    var rows = [].slice.call(st.querySelectorAll('.ul .r')), c = st.querySelector('.card');
    while (rows.length && c.clientHeight < 300) { rows.pop().remove(); }
    fit(c, 0.62);
  }
  // ===== motion: rotation, promo slides, clock, burn-in drift =====
  var state = { i: 0, pi: 0, page: 0, pages: null };
  function step() {
    if (O.empty || O.net === 'gone') return;
    if (cv.classList.contains('portrait')) { if (b.items.length > 1) { state.i = (state.i + 1) % b.items.length; paginate(); } return; }
    var cards = cv.querySelectorAll('.stage .card'); if (cards.length < 2) return;
    state.i = (state.i + 1) % cards.length;
    cards.forEach(function (c, k) { c.classList.toggle('on', k === state.i); });
    cv.querySelectorAll('.stage .dots span').forEach(function (d, k) { d.classList.toggle('on', k === state.i); });
    cv.querySelectorAll('.next div').forEach(function (d, k) { d.classList.toggle('on', k === state.i); });
  }
  function promoStep() { var sl = cv.querySelectorAll('.promo .sl'), pd = cv.querySelectorAll('.promo .pd span'); if (sl.length < 2) return; state.pi = (state.pi + 1) % sl.length; sl.forEach(function (s, k) { s.classList.toggle('on', k === state.pi); }); pd.forEach(function (s, k) { s.classList.toggle('on', k === state.pi); }); }
  function tickClock() { var t = timeStr(); cv.querySelectorAll('[data-time]').forEach(function (e) { if (e.textContent !== t) e.textContent = t; }); var d = dateStr(false), ds = dateStr(true); cv.querySelectorAll('[data-date]').forEach(function (e) { e.textContent = d; }); cv.querySelectorAll('[data-date-short]').forEach(function (e) { e.textContent = ds; }); }
  var DRIFT = [[0, 0], [6, 3], [0, 6], [-6, 3], [-6, -3], [0, -6], [6, -3]], ph = 0;
  function drift() { ph = (ph + 1) % DRIFT.length; shift.style.transform = 'translate(' + DRIFT[ph][0] + 'px,' + DRIFT[ph][1] + 'px)'; take.style.transform = shift.style.transform; }
  if (!FIXED) { setInterval(step, O.rot * 1000); setInterval(promoStep, 15000); setInterval(tickClock, 5000); setInterval(drift, 60000); }
  var rt = null; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 120); });

  // ===== mock-up control strip (?controls=1) =====
  if (body.classList.contains('ctl')) {
    var ctl = document.getElementById('ctl');
    function sel(key, label, opts, cur) { return '<select data-k="' + key + '" aria-label="' + label + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (String(cur) === o[0] ? ' selected' : '') + '>' + label + ': ' + o[1] + '</option>'; }).join('') + '</select>'; }
    ctl.innerHTML = sel('board', 'לוח', [['lobby', 'לובי'], ['parking', 'חניון'], ['gym', 'חדר כושר']], boardId) +
      sel('template', 'תבנית', [['1', '1 מידע והודעות'], ['2', '2 הודעות בלבד'], ['3', '3 לובי אנכי']], tplReq) +
      sel('theme', 'ערכה', [['dark', 'כהה'], ['light', 'בהירה']], root.getAttribute('data-theme')) +
      sel('orient', 'כיוון', [['auto', 'אוטומטי'], ['landscape', 'רוחב'], ['portrait', 'אנכי']], O.orient) +
      sel('urgent', 'דחוף', [['band', 'פס'], ['full', 'מסך מלא'], ['0', 'ללא']], O.urgent) +
      sel('net', 'רשת', [['live', 'מחובר'], ['stale', 'לא מעודכן'], ['offline', 'מנותק'], ['gone', 'בוטל']], O.net) +
      sel('empty', 'הודעות', [['0', 'יש'], ['1', 'ריק']], O.empty ? '1' : '0') +
      sel('news', 'חדשות', [['1', 'כן'], ['0', 'לא']], O.news ? '1' : '0') +
      sel('company', 'לוגו חברה', [['1', 'כן'], ['0', 'לא']], O.company ? '1' : '0') +
      sel('night', 'לילה', [['0', 'לא'], ['1', 'כן']], O.night ? '1' : '0');
    ctl.addEventListener('change', function (e) { var k = e.target.dataset.k; if (!k) return; Q.set(k, e.target.value); if (k === 'board') Q.delete('template'); location.search = Q.toString(); });
  }

  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layoutAfter(); });
})();
</script>

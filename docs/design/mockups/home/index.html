/* ====================================================================================================
   Design tokens. Shell (rail, bottom bar, floating corner) = "design A" values of frontend/src/styles/tokens.css.
   Content of the home / area screens = the "glass" palette of frontend/src/styles/devices-themes.ts (what the
   home screen runs today). The mockup adds only its own chrome (.mk-*).
   ==================================================================================================== */
:root{
  color-scheme:light;
  --sw-bg:#f5f7fb; --sw-surface:#ffffff; --sw-surface-2:#f7f9fc; --sw-surface-3:#eef2f8;
  --sw-border:#e7ebf2; --sw-border-strong:#e1e6ef; --sw-overlay:rgba(17,24,39,.45);
  --sw-text:#22314c; --sw-heading:#1e2e47; --sw-text-2:#5b6a85; --sw-text-3:#8a97ae;
  --sw-accent:#2767ed; --sw-accent-hover:#1f57d1; --sw-accent-soft:#edf3ff; --sw-accent-text:#2767ed; --sw-focus:#2767ed;
  --sw-live:#22c55e; --sw-danger:#ef4444; --sw-warning:#f59e0b;
  --sw-font:"Heebo","Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
  --sw-font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  --sw-t-fast:120ms; --sw-t-med:200ms; --sw-ease:cubic-bezier(.2,0,0,1);
  /* glass palette (devices-themes.ts, palette "default", light) */
  --dv-backdrop:radial-gradient(1100px 560px at 85% -12%,rgba(255,184,86,.2),transparent 60%),radial-gradient(900px 520px at 8% 112%,rgba(10,132,255,.16),transparent 60%),linear-gradient(180deg,#eef2f9,#e5eaf4);
  --dv-surface:rgba(255,255,255,.64); --dv-surface-2:rgba(255,255,255,.5); --dv-surface-3:rgba(120,120,128,.14);
  --dv-solid:#fbfcfe; --dv-solid-2:#f2f5fa; --dv-blur:blur(28px) saturate(1.7);
  --dv-border:rgba(60,60,67,.12); --dv-border-strong:rgba(60,60,67,.22);
  --dv-text:#1c1c1e; --dv-text-2:#4c4c50; --dv-text-3:#6e6e73;
  --dv-accent:#007aff; --dv-accent-hover:#0066d6; --dv-accent-soft:rgba(0,122,255,.13); --dv-accent-text:#0062cc;
  --dv-success:#34c759; --dv-success-soft:rgba(52,199,89,.16); --dv-success-text:#16803c;
  --dv-warning:#ff9f0a; --dv-warning-soft:rgba(255,159,10,.16); --dv-warning-text:#a15c00;
  --dv-danger:#d70015; --dv-danger-soft:rgba(255,59,48,.13);
  --dv-r-sm:14px; --dv-r-md:22px; --dv-r-lg:28px; --dv-r-pill:999px;
  --dv-shadow-1:0 10px 30px rgba(31,45,80,.1),inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-2:0 18px 44px rgba(31,45,80,.16),inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-3:0 24px 64px rgba(15,23,42,.26);
  --dv-ctl:0 1px 4px rgba(0,0,0,.18);
  --dv-icon-ring:rgba(120,120,128,.14);
  --on-warm:255 159 10; --on-cool:61 90 254; --on-green:52 199 89;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#e3e8f1;color:var(--sw-text);font-family:var(--sw-font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sw-focus);outline-offset:2px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.mono{direction:ltr;unicode-bidi:isolate;font-family:var(--sw-font-mono);font-size:.9em}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
svg.ic.flip{transform:scaleX(-1)}

/* ---------------------------------------------------------------- mockup chrome (not part of the product) */
.mk-bar{position:sticky;top:0;z-index:300;background:#101a2e;color:#e8edf7;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 14px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.mk-bar b{font-weight:700;letter-spacing:-.2px}
.mk-grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mk-grp>span{opacity:.6;margin-inline-end:2px}
.mk-b{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e8edf7;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.mk-b:hover{background:rgba(255,255,255,.14)}
.mk-b[aria-pressed=true]{background:#2767ed;border-color:#2767ed;color:#fff}
.mk-sel{background:#1b2740;color:#e8edf7;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:4px 6px;font-size:12px}
.mk-rng{display:flex;align-items:center;gap:4px;font-size:11.5px}
.mk-rng input{width:74px;accent-color:#7aa7ff}
.mk-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;background:rgba(255,255,255,.08)}
.mk-chip.ok{background:rgba(52,199,89,.22);color:#b8f5c8}.mk-chip.bad{background:rgba(255,99,71,.28);color:#ffd2c9}
.mk-stage{display:flex;gap:16px;padding:16px;align-items:flex-start;justify-content:center}
.mk-fit{flex:none}
.mk-notes{flex:none;width:420px;background:#fff;border-radius:14px;box-shadow:var(--dv-shadow-3);position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;font-size:12.5px;line-height:1.55}
.mk-notes[hidden]{display:none}
.mk-notes h2{margin:0;padding:14px 16px 6px;font-size:16px;color:var(--sw-heading)}
.mk-notes h3{margin:0;padding:12px 16px 4px;font-size:12.5px;color:var(--sw-text-2)}
.mk-notes .sub{padding:0 16px 8px;color:var(--sw-text-3)}
.mk-notes table{width:calc(100% - 24px);margin:0 12px 8px;border-collapse:collapse}
.mk-notes td,.mk-notes th{padding:5px 6px;border-bottom:1px solid var(--sw-border);vertical-align:top;text-align:start}
.mk-notes th{color:var(--sw-text-3);font-weight:500;font-size:11.5px}
.mk-notes ul{margin:0 0 10px;padding-inline:32px 16px}.mk-notes li{margin:3px 0}
.mk-notes code,.mk-notes .tag{background:var(--sw-surface-3);border-radius:5px;padding:0 5px;font-family:var(--sw-font-mono);direction:ltr;unicode-bidi:isolate;font-size:11px;color:var(--sw-heading)}
.mk-cmp{padding:20px;display:flex;flex-direction:column;gap:22px;align-items:center}
.mk-cmp h2{margin:0;font-size:15px;color:var(--sw-heading)}
.mk-cmp .row{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.mk-cmp .cell{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--sw-text-2)}
.mk-cmp .cell b{color:var(--sw-heading);font-size:13px}
.mk-cmp .cell .rk{display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid var(--sw-border);border-radius:14px;overflow:hidden;box-shadow:var(--dv-shadow-1)}
.mk-cmp .cell .bk{width:390px;display:grid;background:#fff;border:1px solid var(--sw-border);border-radius:14px;overflow:hidden}
.mk-cmp .demo{background:var(--dv-backdrop);flex:1;width:100%;min-height:80px}
.mk-cmp .ruler{width:100%;border-top:1px dashed var(--sw-text-3);position:relative;height:0}

/* ---------------------------------------------------------------- the product frame (shell of design A, no top bar) */
.frame{position:relative;background:var(--sw-bg);border-radius:16px;box-shadow:0 20px 50px rgba(20,30,55,.22);overflow:hidden;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-areas:'rail main';color:var(--dv-text);font-size:14px;
  /* rail (desktop / tablet) and bottom bar (phone) sizes - set inline from the size preset */
  --rail-w:96px;--ri-w:80px;--ri-h:76px;--ri-ic:28px;--ri-fs:13px;--brand:46px;--av:36px;
  --bar-h:66px;--bar-ic:25px;--bar-fs:11.5px;--bar-pw:54px;--bar-ph:32px}
.frame.dev-d1440{width:1440px;height:900px}
.frame.dev-d1920{width:1920px;height:1080px}
.frame.dev-tablet{width:820px;height:1100px}
.frame.dev-phone{width:390px;height:812px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) var(--bar-h);grid-template-areas:'main' 'bottom'}
.frame.tall{height:auto!important;min-height:900px}
.frame.tall .main{overflow:visible}

nav.rail{grid-area:rail;background:var(--sw-surface);border-inline-end:1px solid var(--sw-border);display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:6px;overflow:hidden;color:var(--sw-text-2);z-index:5}
.brand-tile{display:grid;place-items:center;width:var(--brand);height:var(--brand);border-radius:calc(var(--brand)*.28);background:var(--sw-accent);color:#fff;font-weight:800;font-size:calc(var(--brand)*.5);margin-block-end:8px;box-shadow:0 5px 12px rgba(39,103,237,.25);flex:none}
a.item,button.item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--ri-ic)*.12 + 1px);width:var(--ri-w);min-height:var(--ri-h);padding:6px 2px;border-radius:calc(var(--ri-w)*.17);font-size:var(--ri-fs);line-height:1.25;font-weight:500;color:var(--sw-text-2);text-decoration:none;position:relative;border:0;background:transparent;flex:none;white-space:nowrap}
a.item svg.ic,button.item svg.ic{width:var(--ri-ic);height:var(--ri-ic);color:var(--sw-text-3);stroke-width:1.7}
a.item span,button.item span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
a.item:hover,button.item:hover{background:var(--sw-surface-3);color:var(--sw-text)}
a.item.active{background:var(--sw-accent-soft);color:var(--sw-accent-text);font-weight:600}
a.item.active svg.ic{color:var(--sw-accent)}
a.item.active::after{content:'';position:absolute;inset-inline-end:calc((var(--ri-w) - var(--rail-w))/2);inset-block:22%;width:3px;border-radius:3px;background:var(--sw-accent)}
nav.rail .grow{flex:1}
button.me{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;width:var(--ri-w);padding:4px 0;border-radius:12px;color:var(--sw-text-2);font-size:calc(var(--ri-fs) - 1px);flex:none}
button.me:hover,button.me[aria-expanded=true]{background:var(--sw-surface-3)}
.avatar{width:var(--av);height:var(--av);border-radius:50%;background:var(--sw-surface-3);color:var(--sw-text-2);display:grid;place-items:center;font-weight:600;font-size:calc(var(--av)*.36);position:relative}
.avatar i{position:absolute;inset-block-start:-1px;inset-inline-end:-1px;width:10px;height:10px;border-radius:50%;background:var(--sw-danger);border:2px solid #fff}

nav.bottom{grid-area:bottom;display:none;grid-template-columns:repeat(5,1fr);background:var(--sw-surface);border-block-start:1px solid var(--sw-border);box-shadow:0 -6px 18px rgba(34,49,76,.06);position:relative;z-index:6}
.dev-phone nav.rail{display:none}
.dev-phone nav.bottom{display:grid}
nav.bottom a,nav.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--bar-h);min-width:44px;padding:3px 2px 4px;font-size:var(--bar-fs);font-weight:500;color:var(--sw-text-3);text-decoration:none;border:0;background:transparent}
nav.bottom .icp{display:grid;place-items:center;width:var(--bar-pw);height:var(--bar-ph);border-radius:calc(var(--bar-ph)/2)}
nav.bottom .icp svg.ic{width:var(--bar-ic);height:var(--bar-ic)}
nav.bottom a.active{color:var(--sw-accent-text);font-weight:600}
nav.bottom a.active .icp{background:var(--sw-accent-soft);color:var(--sw-accent)}
nav.bottom .avatar{width:calc(var(--bar-ic) + 3px);height:calc(var(--bar-ic) + 3px);font-size:10px}

/* the shell's floating search / status corner (no top bar): inline-end = the top left in Hebrew */
.float{position:absolute;inset-block-start:10px;inset-inline-end:22px;z-index:30}
.float .pillrow{display:inline-flex;align-items:center;height:34px;padding-inline:4px;border-radius:999px;background:#fff;border:1px solid var(--sw-border);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.float .pillrow button{all:unset;box-sizing:border-box;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--sw-text-2);cursor:pointer;position:relative}
.float .pillrow button:hover{background:var(--sw-surface-3)}
.float .pillrow i{width:9px;height:9px;border-radius:50%;background:var(--sw-live)}
.dev-phone .float{inset-inline-end:10px;inset-block-start:8px}

/* ---------------------------------------------------------------- main scroller + glass page */
.main{grid-area:main;overflow:auto;position:relative;min-width:0;background:var(--dv-backdrop);scrollbar-width:thin}
.page{padding:16px 30px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%;color:var(--dv-text)}
.dev-phone .page{padding:12px 12px 16px;gap:12px}
.dev-tablet .page{padding:14px 20px 22px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 12px;padding-inline-end:76px;min-height:52px}
.dev-phone .ph{padding-inline-end:66px;min-height:44px}
.ph h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2;color:var(--dv-text)}
.dev-phone .ph h1{font-size:20px}
.ph .sub{margin-top:2px;color:var(--dv-text-3);font-size:12.5px}
.ph-a{display:flex;align-items:center;gap:8px}
.ttl-in{font:inherit;font-size:26px;font-weight:700;letter-spacing:-.6px;line-height:1.2;color:var(--dv-text);background:var(--dv-surface);border:1.5px dashed var(--dv-accent);border-radius:12px;padding:0 10px;height:42px;width:min(420px,100%)}
.dev-phone .ttl-in{font-size:18px;height:38px}

/* ---------------------------------------------------------------- glass controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding-inline:14px;border-radius:999px;border:1px solid var(--dv-border-strong);background:var(--dv-surface);backdrop-filter:var(--dv-blur);color:var(--dv-text);font-size:12.5px;font-weight:500;line-height:1;white-space:nowrap;box-shadow:var(--dv-ctl)}
.btn:hover{background:var(--dv-solid)}
.btn.sm{min-height:28px;padding-inline:11px;font-size:11.5px;gap:5px}
.btn.primary{background:var(--dv-accent);border-color:var(--dv-accent);color:#fff}
.btn.primary:hover{background:var(--dv-accent-hover)}
.btn.primary[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--dv-text-2);backdrop-filter:none}
.btn.ghost:hover{background:var(--dv-surface-3)}
.btn.danger{color:var(--dv-danger);border-color:rgba(215,0,21,.4)}
.btn.danger:hover{background:var(--dv-danger-soft)}
.btn.icon{width:32px;padding:0}.btn.icon.sm{width:28px}
.btn .ic{font-size:15px}.btn.sm .ic{font-size:13px}
.seg{display:inline-flex;align-items:center;gap:2px;background:var(--dv-surface-3);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--dv-text-2);min-height:30px;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed=true],.seg button.on{background:#fff;color:var(--dv-text);box-shadow:var(--dv-ctl)}
.seg button:disabled{opacity:.5;pointer-events:none}
.seg.sm button{padding:3px 9px;min-height:24px;font-size:11px}
.tog{position:relative;flex:none;width:42px;height:26px;border-radius:999px;background:rgba(120,120,128,.32);border:0;padding:0;transition:background var(--sw-t-fast)}
.tog::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start var(--sw-t-fast) var(--sw-ease)}
.tog[aria-checked=true]{background:var(--dv-success)}
.tog[aria-checked=true]::after{inset-inline-start:18px}
.tog.sm{width:36px;height:22px}.tog.sm::after{width:18px;height:18px}.tog.sm[aria-checked=true]::after{inset-inline-start:16px}
.tog:disabled{opacity:.4;pointer-events:none}
.dev-phone .tog{width:48px;height:30px}.dev-phone .tog::after{width:26px;height:26px}.dev-phone .tog[aria-checked=true]::after{inset-inline-start:20px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;background:var(--dv-surface-3);color:var(--dv-text-2)}
.badge.live{background:var(--dv-success-soft);color:var(--dv-success-text)}
.badge.warn{background:var(--dv-warning-soft);color:var(--dv-warning-text)}
.badge.err{background:var(--dv-danger-soft);color:var(--dv-danger)}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--sw-border-strong);flex:none}.sdot.on{background:var(--dv-warning)}

/* ---------------------------------------------------------------- popovers, dialogs, toast */
.scrim{position:absolute;inset:0;z-index:60;background:var(--dv-overlay,rgba(15,23,42,.38))}
.scrim.clear{background:transparent;z-index:40}
.dlg{position:absolute;z-index:70;inset-inline:0;inset-block-start:18%;margin-inline:auto;width:min(420px,calc(100% - 32px));background:var(--dv-solid);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-3);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:17px;font-weight:700}
.dlg p{margin:0;color:var(--dv-text-2);font-size:13px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.usermenu{position:absolute;z-index:70;width:290px;background:var(--dv-solid);border-radius:var(--dv-r-sm);box-shadow:var(--dv-shadow-3);border:1px solid var(--dv-border);padding:8px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.usermenu.rail-pos{inset-inline-start:calc(var(--rail-w) + 8px);inset-block-end:12px}
.usermenu.bar-pos{inset-inline:12px;width:auto;inset-block-end:calc(var(--bar-h) + 8px)}
.usermenu .uh{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;border-bottom:1px solid var(--dv-border);margin-bottom:4px}
.usermenu .uh b{display:block;font-size:13.5px}.usermenu .uh small{color:var(--dv-text-3);font-size:11.5px}
.usermenu button.mi{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:10px;padding:9px 10px;text-align:start;width:100%;font-size:13px;color:var(--dv-text)}
.usermenu button.mi:hover{background:var(--dv-surface-3)}
.usermenu button.mi .ic{font-size:16px;color:var(--dv-text-2)}
.usermenu button.mi.key{background:var(--dv-accent-soft);color:var(--dv-accent-text);font-weight:600}
.usermenu button.mi.key .ic{color:var(--dv-accent)}
.usermenu hr{border:0;border-top:1px solid var(--dv-border);margin:4px 0;width:100%}
.toast{position:absolute;z-index:80;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 24px);inset-block-end:24px;background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center}
.dev-phone .toast{inset-block-end:calc(var(--bar-h) + 14px)}
.railpick{display:flex;flex-direction:column;gap:8px}
.railpick .opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--dv-border-strong);border-radius:14px;background:#fff;padding:9px 12px;text-align:start;width:100%}
.railpick .opt[aria-pressed=true]{border-color:var(--dv-accent);background:var(--dv-accent-soft)}
.railpick .opt b{font-size:13px}.railpick .opt small{color:var(--dv-text-3);font-size:11.5px;margin-inline-start:auto;direction:ltr}
.railpick .sl{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--dv-text-2)}
.railpick .sl input{width:100%;accent-color:var(--dv-accent)}
.mini-rail{width:22px;flex:none;border-radius:5px;background:var(--sw-accent-soft);border:1px solid var(--sw-border)}

@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skl{background:linear-gradient(90deg,rgba(120,120,128,.12),rgba(120,120,128,.24),rgba(120,120,128,.12));background-size:200% 100%;animation:sh 1.6s linear infinite;border-radius:8px;display:block}
@media (prefers-reduced-motion:reduce){.skl{animation:none}}

/* ==================================================================================================
   HOME: widgets (shared by the three directions), summary tiles, floors
   ================================================================================================== */
/* size tiers: .only-s / .only-m / .only-l show in one size; .ge-m from medium up; .le-m up to medium */
[data-size=s] :is(.only-m,.only-l,.ge-m){display:none!important}
[data-size=m] :is(.only-s,.only-l){display:none!important}
[data-size=l] :is(.only-s,.only-m,.le-m){display:none!important}

.wg{position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding:14px 18px;background:var(--dv-surface);backdrop-filter:var(--dv-blur);-webkit-backdrop-filter:var(--dv-blur);border:1px solid var(--dv-border);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-1);overflow:hidden;color:var(--dv-text)}
.wg-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--dv-text-2)}
.wg-h .ic{font-size:15px;color:var(--dv-accent)}
.wg-h small{margin-inline-start:auto;font-weight:400;color:var(--dv-text-3);font-size:11px}
.wg-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.wg[data-size=s]{padding:12px 14px;gap:4px}
/* clock */
.wg-clock .hm{font-size:var(--hm,52px);font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wg-clock .hm b{font-weight:300;opacity:.55;margin-inline:.03em}
.wg-clock .ss{font-size:calc(var(--hm,52px)*.32);color:var(--dv-text-3);font-weight:400;margin-inline-start:6px;direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
.wg-clock .clk{display:flex;align-items:baseline;direction:ltr;justify-content:flex-end}
.crow .wg-clock .clk{justify-content:flex-start}
.wg-clock .dts{display:flex;flex-direction:column;gap:1px;min-width:0}
.wg-clock .d1{font-size:13.5px;font-weight:500;color:var(--dv-text-2);white-space:nowrap}
.wg-clock .d2{font-size:12.5px;color:var(--dv-accent-text);font-weight:600;white-space:nowrap}
.wg-clock[data-size=s] .d1{font-size:11.5px}
/* weather */
.wg-weather{background:linear-gradient(160deg,var(--sky1,rgba(120,180,255,.26)),var(--sky2,rgba(255,206,120,.16)) 70%),var(--dv-surface)}
.wg-weather .wx-main{display:flex;align-items:center;gap:12px}
.wg-weather .wx-ic{width:var(--wxi,44px);height:var(--wxi,44px);color:#e58e0b;stroke-width:1.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wg-weather[data-cond=cloud] .wx-ic,.wg-weather[data-cond=fog] .wx-ic{color:#7b8aa6}
.wg-weather[data-cond=rain] .wx-ic,.wg-weather[data-cond=storm] .wx-ic{color:#3d6fd8}
.wg-weather .wx-tc{display:flex;flex-direction:column;line-height:1.1}
.wg-weather .wx-t{font-size:var(--wxt,36px);font-weight:300;letter-spacing:-.03em;direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:start}
.wg-weather .wx-c{font-size:13px;font-weight:600;color:var(--dv-text-2);margin-top:2px;white-space:nowrap}
.wg-weather .wx-m{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--dv-text-2)}
.wg-weather .wx-m span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.wg-weather .wx-m .ic{font-size:14px;color:var(--dv-accent)}
.wg-weather .wx-fc{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;border-top:1px solid var(--dv-border);padding-top:8px;margin-top:2px}
.wg-weather .fc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dv-text-3)}
.wg-weather .fc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:#e58e0b}
.wg-weather .fc[data-cond=cloud] svg{color:#7b8aa6}.wg-weather .fc[data-cond=rain] svg{color:#3d6fd8}
.wg-weather .fc b{font-size:12.5px;color:var(--dv-text);font-weight:600}.wg-weather .fc i{font-style:normal;font-size:11px}
.wg-weather .fc .hl{display:flex;gap:5px;align-items:baseline;direction:ltr}
.wg-weather .fc svg{width:20px;height:20px}
/* shabbat */
.wg-shabbat{background:linear-gradient(160deg,rgba(255,184,86,.26),rgba(255,184,86,.04) 75%),var(--dv-surface)}
.wg-shabbat .pr{font-size:var(--prs,19px);font-weight:700;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.wg-shabbat .tms{display:flex;flex-direction:column;gap:5px}
.wg-shabbat .tm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dv-text-2)}
.wg-shabbat .tm .ic{font-size:16px;color:#d97706}
.wg-shabbat .tm b{margin-inline-start:auto;font-size:15px;color:var(--dv-text);font-weight:600;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.wg-shabbat .tm2{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dv-text-2);white-space:nowrap}
.wg-shabbat .tm2 .ic{color:#d97706;font-size:14px}
.wg-shabbat .cd{font-size:11.5px;color:#a15c00;font-weight:600}
/* alarm */
.wg-alarm{flex-direction:row;align-items:center;gap:12px}
.wg-alarm .aic{display:grid;place-items:center;width:var(--ali,40px);height:var(--ali,40px);border-radius:50%;background:var(--dv-success-soft);color:var(--dv-success-text);flex:none}
.wg-alarm .aic .ic{font-size:calc(var(--ali,40px)*.5)}
.wg-alarm[data-tone=neutral] .aic{background:var(--dv-surface-3);color:var(--dv-text-2)}
.wg-alarm[data-tone=err]{background:linear-gradient(160deg,rgba(255,59,48,.22),rgba(255,59,48,.04)),var(--dv-surface);border-color:rgba(215,0,21,.35)}
.wg-alarm[data-tone=err] .aic{background:var(--dv-danger-soft);color:var(--dv-danger)}
.wg-alarm .al-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.wg-alarm .al-l{font-size:11.5px;color:var(--dv-text-3)}
.wg-alarm .al-s{font-size:var(--als,16px);font-weight:700;white-space:nowrap}
.wg-alarm .al-x{font-size:11.5px;color:var(--dv-text-3);margin-top:2px}
.wg-alarm .al-go{font-size:11.5px;color:var(--dv-accent-text);font-weight:600;margin-top:3px;display:inline-flex;gap:3px;align-items:center;border:0;background:none;padding:0}
/* quick actions */
.wg-quick .qa{display:flex;flex-direction:column;gap:7px}
.wg-quick .qbtn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--dv-border-strong);background:var(--dv-solid);font-weight:600;font-size:12.5px;box-shadow:var(--dv-ctl);color:var(--dv-text);white-space:nowrap}
.wg-quick .qbtn:hover{background:#fff}
.wg-quick .qbtn.danger{color:var(--dv-danger);border-color:rgba(215,0,21,.4)}
.wg-quick .qbtn .ic{font-size:16px}
.wg-quick .q-x{font-size:11.5px;color:var(--dv-text-3)}
.wg-quick[data-size=s] .qa{flex-direction:row}.wg-quick[data-size=s] .qbtn{flex:1;min-height:34px;padding:0 6px;font-size:11.5px}
/* ghost (edit mode: a widget that is off or unavailable) */
.wg.ghost{border:2px dashed var(--dv-border-strong);background:var(--dv-surface-2);box-shadow:none;align-items:center;text-align:center;color:var(--dv-text-3);gap:6px;font-size:12.5px}
.wg.ghost b{color:var(--dv-text-2)}
.wg.ghost .btn{margin-top:2px}
.wg.ghost.warn{border-color:rgba(255,159,10,.55);background:var(--dv-warning-soft)}
/* edit chrome on every shown widget */
.editing .wg:not(.ghost){outline:2px solid var(--dv-accent);outline-offset:-2px;padding-bottom:50px}
.wg-e{position:absolute;inset-inline:8px;inset-block-end:8px;display:flex;align-items:center;gap:6px;background:var(--dv-solid);border-radius:999px;padding:3px 4px 3px 8px;box-shadow:var(--dv-ctl);z-index:3}
.wg-e .seg{background:var(--dv-surface-3);padding:2px}.wg-e .seg button{padding:2px 9px;min-height:24px;font-size:11px}
.wg-e .x{margin-inline-start:auto;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--dv-text-2);display:grid;place-items:center}
.wg-e .x:hover{background:var(--dv-surface-3)}
/* loading */
.wg.loading{gap:10px}.wg.loading .skl{height:14px}

/* ---------------------------------------------------------------- A: control centre - a hero band */
.hero{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.hero .wg{flex:1 1 var(--wb,210px)}
.hero .wg[data-size=s]{--wb:140px;min-height:104px;flex-grow:.8}
.hero .wg[data-size=m]{--wb:205px;min-height:146px;flex-grow:1.2}
.hero .wg[data-size=l]{--wb:290px;min-height:176px;flex-grow:1.8}
.hero .wg-weather[data-size=l] .wg-b,.side .wg-weather[data-size=l] .wg-b{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:8px}
.hero .wg-weather[data-size=l] .wx-fc,.side .wg-weather[data-size=l] .wx-fc{grid-column:1/-1;margin-top:0}
.hero .wg-weather[data-size=l] .wx-m,.side .wg-weather[data-size=l] .wx-m{flex-direction:column;gap:6px}
.hero .wg[data-size=s]{--hm:36px;--wxi:30px;--wxt:26px;--prs:15px;--ali:30px;--als:14px}
.hero .wg[data-size=m]{--hm:54px;--wxi:44px;--wxt:38px;--prs:20px;--ali:46px;--als:18px}
.hero .wg[data-size=l]{--hm:74px;--wxi:56px;--wxt:50px;--prs:26px;--ali:54px;--als:20px}
.hero .wg-alarm[data-size=s]{padding:12px 14px}
.hero .wg-quick[data-size=l] .qa{gap:9px}
/* ---------------------------------------------------------------- B: side panel */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) var(--side-w,300px);gap:18px;align-items:start}
.bgrid.side-start{grid-template-columns:var(--side-w,300px) minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:12px}
.side .wg{flex:none}
.side .wg[data-size=s]{min-height:78px;--hm:34px;--wxi:28px;--wxt:24px;--prs:15px;--ali:32px;--als:14px}
.side .wg[data-size=m]{min-height:124px;--hm:46px;--wxi:38px;--wxt:34px;--prs:19px;--ali:40px;--als:16px}
.side .wg[data-size=l]{min-height:176px;--hm:64px;--wxi:54px;--wxt:46px;--prs:24px;--ali:46px;--als:18px}
.side .wg-clock[data-size=s] .wg-b{flex-direction:row;align-items:center;gap:12px}
.side .wg-quick[data-size=m] .qa,.side .wg-quick[data-size=l] .qa{flex-direction:row;flex-wrap:wrap}
.side .wg-quick[data-size=m] .qbtn,.side .wg-quick[data-size=l] .qbtn{flex:1 1 120px}
/* ---------------------------------------------------------------- C: compact single row */
.crow{display:flex;gap:10px;align-items:stretch}
.crow .wg{flex:1 1 var(--wb,220px);flex-direction:row;align-items:center;gap:14px;padding:10px 16px;min-height:var(--wh,88px)}
.crow .wg .wg-h{display:none}
.crow .wg-b{flex-direction:row;align-items:center;gap:14px;flex:1 1 auto}
.crow .wg[data-size=s]{--wb:118px;--wh:70px;--hm:30px;--wxi:28px;--wxt:24px;--prs:14px;--ali:30px;--als:13px;padding:8px 12px}
.crow .wg-clock[data-size=m] .d1 .only-m{display:none!important}
.crow .wg-clock[data-size=m] .d1 .only-s{display:inline!important}
.crow .wg[data-size=m]{--wb:250px;--wh:90px;--hm:42px;--wxi:38px;--wxt:32px;--prs:17px;--ali:38px;--als:15px}
.crow .wg[data-size=l]{--wb:330px;--wh:112px;--hm:52px;--wxi:48px;--wxt:38px;--prs:20px;--ali:44px;--als:16px;flex-grow:1.4}
.crow .wg-weather .wx-m{flex-direction:column;gap:2px}
.crow .wg-weather .wx-fc{border-top:0;padding-top:0;margin:0;border-inline-start:1px solid var(--dv-border);padding-inline-start:12px;grid-template-columns:repeat(3,auto);gap:10px}
.crow .wg-shabbat .wg-b{flex-direction:column;align-items:flex-start;gap:3px}
.crow .wg-shabbat .tms{flex-direction:row;gap:14px}
.crow .wg-shabbat[data-size=m] .tms{flex-direction:column;gap:2px}
.crow .wg-quick .qa{flex-direction:row;gap:6px}
.crow .wg-quick[data-size=m] .qa{flex-direction:column;gap:5px}
.crow .wg-quick .qbtn{min-height:32px;font-size:12px;padding:0 10px}
.crow .wg-quick[data-size=l] .qa{flex-direction:row}
/* ---------------------------------------------------------------- phone: widgets as a horizontal snap row */
.wsnap{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 12px 8px;margin-inline:-12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-inline:12px}
.wsnap::-webkit-scrollbar{display:none}
.wsnap .wg{flex:0 0 var(--sw,80%);scroll-snap-align:start;min-height:var(--sh,150px)}
.wsnap .wg[data-size=s]{--sw:46%;--sh:96px;--hm:32px;--wxi:28px;--wxt:24px;--prs:15px;--ali:30px;--als:14px}
.wsnap .wg[data-size=m]{--sw:66%;--sh:140px;--hm:48px;--wxi:40px;--wxt:34px;--prs:19px;--ali:38px;--als:16px}
.wsnap .wg[data-size=l]{--sw:86%;--sh:184px;--hm:66px;--wxi:54px;--wxt:46px;--prs:24px;--ali:46px;--als:18px}
.wdots{display:flex;justify-content:center;gap:5px;margin-top:-2px}
.wdots i{width:6px;height:6px;border-radius:50%;background:rgba(60,60,67,.25)}.wdots i:first-child{background:var(--dv-accent);width:16px;border-radius:4px}
.dev-phone .wg-weather .wx-fc{grid-template-columns:repeat(5,1fr)}

/* ---------------------------------------------------------------- summary tiles (sw-kpi, compact, icon at the end) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));grid-auto-rows:1fr;gap:8px}
.dev-phone .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;min-height:60px;padding:8px 12px;background:var(--dv-surface);backdrop-filter:var(--dv-blur);border:1px solid var(--dv-border);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-1);text-align:start;color:inherit;width:100%}
.kpi:hover{border-color:var(--dv-border-strong);box-shadow:var(--dv-shadow-2)}
.kpi .ico{order:2;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--dv-accent-soft);color:var(--dv-accent);font-size:16px}
.kpi.live .ico{background:var(--dv-success-soft);color:#16a34a}.kpi.stale .ico{background:var(--dv-warning-soft);color:#b45309}.kpi.err .ico{background:var(--dv-danger-soft);color:var(--dv-danger)}
.kpi .v{display:block;font-size:17px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .l{display:block;font-size:11px;color:var(--dv-text-2);line-height:1.25}
.kpi .dt{display:block;font-size:11px;font-weight:500;color:#16a34a}.kpi.stale .dt{color:#b45309}
.kpi.skl-k{pointer-events:none}

/* ---------------------------------------------------------------- toolbar row (פריסה, bulk buttons) */
.tbr{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.tbr .lbl{font-size:11.5px;color:var(--dv-text-3)}
.tbr .grow{flex:1}
.tbr .bulk{display:inline-flex;gap:6px}

/* ---------------------------------------------------------------- floors: tree + cards / tiles */
.split{display:grid;grid-template-columns:clamp(250px,16vw,320px) minmax(0,1fr);gap:18px;align-items:start}
.dev-tablet .split,.dev-phone .split{grid-template-columns:minmax(0,1fr)}
.dev-tablet nav.tree,.dev-phone nav.tree{display:none}
nav.tree{display:flex;flex-direction:column;gap:3px;padding:10px;background:var(--dv-surface);backdrop-filter:var(--dv-blur);border:1px solid var(--dv-border);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-1);position:sticky;top:0}
.trow{display:flex;align-items:center;gap:8px;width:100%;padding:5px 12px;border:0;border-radius:999px;background:transparent;color:var(--dv-text);font-size:12.5px;text-align:start;min-width:0}
.trow:hover{background:var(--dv-surface-3)}
.trow.selected{background:var(--dv-accent-soft);color:var(--dv-accent-text);font-weight:600}
.trow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .lit{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--dv-text-3);font-variant-numeric:tabular-nums;min-width:38px;justify-content:flex-end}
.trow .lit.warm{color:var(--dv-text)}.trow .lit .ic{font-size:12px}.trow .lit.warm .ic{color:var(--dv-warning)}
.tfl{margin-top:6px}.tfl .trow{font-weight:600;font-size:11.5px;color:var(--dv-text-2)}
.tar{padding-inline-start:10px}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.dev-phone .fcards{grid-template-columns:minmax(0,1fr);gap:12px}
section.fcard{display:flex;flex-direction:column;background:var(--dv-surface);backdrop-filter:var(--dv-blur);border:1px solid var(--dv-border);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-1);min-width:0}
.fcard header{display:flex;align-items:center;gap:6px 8px;padding:16px 20px 8px;flex-wrap:wrap}
.fcard header h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.fcard header h2 button{border:0;background:none;padding:0;font:inherit;color:inherit;border-radius:4px}
.fcard header h2 button:hover{color:var(--dv-accent);text-decoration:underline;text-underline-offset:3px}
.fcard header .hd-end{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;flex-basis:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-variant-numeric:tabular-nums;padding:2px 9px;min-height:26px;border:1px solid var(--dv-border-strong);border-radius:999px;background:var(--dv-solid);color:var(--dv-text-2);white-space:nowrap}
.chip .ic{font-size:12px}.chip.warm{color:var(--dv-text);font-weight:600}.chip.warm .ic{color:var(--dv-warning)}
.chip.lit{font-weight:600;color:var(--dv-text)}
.rows{display:flex;flex-direction:column;gap:4px;padding:0 10px 6px}
.arow{display:flex;align-items:center;gap:6px 10px;width:100%;padding:9px 14px;border:0;border-radius:var(--dv-r-sm);background:var(--dv-surface-2);color:var(--dv-text);font-size:12.5px;text-align:start;flex-wrap:wrap}
.arow:hover{background:var(--dv-solid)}
.arow .nm{font-weight:500;min-width:84px}
.arow .pills{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;color:var(--dv-text-2);min-width:0;padding-inline-start:18px}
.pills{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dv-text-2)}
.pills span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.pills .warm{color:var(--dv-text);font-weight:600}.pills .warm .ic{color:var(--dv-warning)}
.pills .ic{font-size:12px}.pills .none{color:var(--dv-text-3)}
.fcard footer{display:flex;gap:8px;padding:4px 20px 16px}
.fcard.loose{border-style:dashed;grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 20px;gap:10px 14px;background:var(--dv-surface-2)}
.fcard.loose h2{margin:0;font-size:14px;font-weight:700}.fcard.loose .sub{font-size:12px;color:var(--dv-text-3)}
.fcard.loose .btn{margin-inline-start:auto}
/* tiles view */
.floors{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 20px;align-items:start}
.dev-phone .floors{grid-template-columns:minmax(0,1fr);gap:14px}
.floor{display:flex;flex-direction:column;gap:10px;min-width:0}
.floor-head{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.floor-head h2{margin:0;font-size:16px;font-weight:700}
.floor-head .level{font-size:11px;color:var(--dv-text-3)}
.floor-head .hd-end{margin-inline-start:auto;display:flex;gap:4px;align-items:center}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px}
.dev-phone .areas{grid-template-columns:repeat(2,minmax(0,1fr))}
a.tile,.tile{display:flex;flex-direction:column;gap:8px;padding:12px 14px;min-height:96px;background:var(--dv-surface);backdrop-filter:var(--dv-blur);border:1px solid var(--dv-border);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-1);color:inherit;text-align:start;width:100%;text-decoration:none;transition:transform var(--sw-t-med) var(--sw-ease),box-shadow var(--sw-t-med)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--dv-shadow-2)}
.tile.on{background:linear-gradient(135deg,rgb(var(--on-warm)/.3),rgb(var(--on-warm)/.07)),var(--dv-surface);border-color:rgb(var(--on-warm)/.4);box-shadow:0 0 28px rgb(var(--on-warm)/.22),var(--dv-shadow-1)}
.tile.empty{background:var(--dv-surface-2)}
.tile .th{display:flex;align-items:center;gap:8px}
.tile .th .rg{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--dv-icon-ring);flex:none;font-size:16px}
.tile.on .th .rg{background:rgba(255,255,255,.4)}
.tile .th .name{font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .th .dot{width:8px;height:8px;border-radius:50%;background:var(--dv-warning)}
.tile.loose{border-style:dashed}
.loose-tile{margin-top:0}
/* edit chrome: floors */
.grip{display:inline-grid;place-items:center;width:26px;height:26px;color:var(--dv-text-3);cursor:grab;border-radius:8px;flex:none}
.grip:hover{background:var(--dv-surface-3)}
.editing .fcard,.editing .floor{outline:2px dashed rgba(0,122,255,.45);outline-offset:3px;border-radius:var(--dv-r-md)}
.editing .floor{padding:6px}
.fmv{display:inline-flex;gap:2px}
.fmv .btn.icon{width:26px;min-height:26px}
[draggable=true].dragging{opacity:.4}
.editbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--dv-solid);border:1.5px solid var(--dv-accent);border-radius:var(--dv-r-sm);padding:8px 12px;box-shadow:var(--dv-shadow-1)}
.editbar .t{font-weight:700;display:flex;align-items:center;gap:6px}
.editbar .t .ic{color:var(--dv-accent)}
.editbar .st{font-size:12px;color:var(--dv-text-3)}.editbar .st.dirty{color:var(--dv-warning-text);font-weight:600}
.editbar .grow{flex:1}
/* edit drawer: pushes the content (a real layout would be the same panel) */
.dev-d1440.has-drawer,.dev-d1920.has-drawer,.dev-tablet.has-drawer{grid-template-columns:var(--rail-w) minmax(0,1fr) 340px;grid-template-areas:'rail main drawer'}
aside.drawer{grid-area:drawer;background:var(--dv-solid);border-inline-end:1px solid var(--dv-border);overflow:auto;display:flex;flex-direction:column;z-index:8;font-size:13px}
aside.drawer .dh{position:sticky;top:0;background:var(--dv-solid);display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--dv-border);z-index:2}
aside.drawer .dh h3{margin:0;font-size:15px;flex:1}
aside.drawer .ds{padding:12px 16px;border-bottom:1px solid var(--dv-border);display:flex;flex-direction:column;gap:10px}
aside.drawer .ds h4{margin:0;font-size:11.5px;color:var(--dv-text-3);font-weight:600;letter-spacing:.02em}
aside.drawer .fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--dv-text-2)}
aside.drawer input[type=text],aside.drawer select{width:100%;height:36px;border:1px solid var(--dv-border-strong);border-radius:10px;background:#fff;padding:0 10px;font-size:13px;color:var(--dv-text)}
aside.drawer select{padding-inline-end:6px}
aside.drawer .wrow{display:flex;flex-direction:column;gap:8px;border:1px solid var(--dv-border);border-radius:14px;padding:10px 12px;background:var(--dv-surface-2)}
aside.drawer .wrow.off{opacity:.62}
aside.drawer .wtop{display:flex;align-items:center;gap:8px;font-weight:600}
aside.drawer .wtop .ic{color:var(--dv-accent);font-size:16px}
aside.drawer .wtop .tog{margin-inline-start:auto}
aside.drawer .note{font-size:11.5px;color:var(--dv-text-3)}
aside.drawer .warnline{font-size:11.5px;color:var(--dv-warning-text);background:var(--dv-warning-soft);border-radius:8px;padding:5px 8px}
aside.drawer .fl{display:flex;align-items:center;gap:8px;border:1px solid var(--dv-border);border-radius:12px;padding:6px 8px;background:#fff}
aside.drawer .fl .nm{flex:1;font-weight:500}
aside.drawer .df{position:sticky;bottom:0;background:var(--dv-solid);border-top:1px solid var(--dv-border);padding:10px 16px;display:flex;gap:8px;margin-top:auto}
.dev-phone aside.drawer{position:absolute;inset-inline:0;inset-block-end:var(--bar-h);height:70%;border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(15,23,42,.28);z-index:50}

/* ==================================================================================================
   AREA screen: sticky header with room tabs, security strip, sections grouped by device type
   ================================================================================================== */
.page.area{padding:0 0 24px;gap:14px}
.ah{position:sticky;top:0;z-index:12;padding:12px 30px 10px;background:rgba(238,242,249,.78);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-bottom:1px solid var(--dv-border);display:flex;flex-direction:column;gap:6px}
.dev-tablet .ah{padding-inline:20px}.dev-phone .ah{padding:8px 12px 8px;gap:4px}
.ah .crumbs{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dv-text-3);padding-inline-end:76px}
.ah .crumbs .ic{font-size:10px}.ah .crumbs a{color:inherit;text-decoration:none;border:0;background:none;padding:0}.ah .crumbs a:hover{color:var(--dv-accent);text-decoration:underline}
.dev-phone .ah .crumbs{display:none}
.ah .arow1{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-inline-end:76px}
.dev-phone .ah .arow1{padding-inline-end:62px;gap:6px 10px}
.ah .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--dv-border-strong);background:var(--dv-solid);display:grid;place-items:center;color:var(--dv-text-2);flex:none}
.ah h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.dev-phone .ah h1{font-size:19px}
.ah .asub{font-size:12px;color:var(--dv-text-3);white-space:nowrap}
.ah .aend{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.dev-phone .ah .aend{display:none}
.ah .rtabs{display:flex;overflow-x:auto;scrollbar-width:none;padding-inline-end:76px}
.dev-phone .ah .rtabs{padding-inline-end:0;margin-inline:-2px}
.rtabs .seg{flex:none}
.rtabs .seg button small{font-size:10.5px;color:var(--dv-text-3);font-weight:500;font-variant-numeric:tabular-nums;background:rgba(120,120,128,.14);border-radius:999px;padding:0 6px}
.rtabs .seg button[aria-pressed=true] small{background:var(--dv-accent-soft);color:var(--dv-accent-text)}
.dev-phone .rtabs .seg button{min-height:38px;padding-inline:14px}
.arow1 .tabs-inline{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
.abody{padding:0 30px;display:flex;flex-direction:column;gap:14px}
.dev-tablet .abody{padding-inline:20px}.dev-phone .abody{padding-inline:12px}
/* security strip */
.sstrip{display:flex;align-items:center;gap:8px;background:var(--dv-surface);backdrop-filter:var(--dv-blur);border:1px solid var(--dv-border);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-1);padding:8px 12px;overflow-x:auto;scrollbar-width:none}
.sstrip .sl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--dv-text-2);flex:none;padding-inline-end:6px;border-inline-end:1px solid var(--dv-border);margin-inline-end:2px;min-height:30px}
.sstrip .sl .ic{color:var(--dv-accent);font-size:16px}
.sc{display:inline-flex;align-items:center;gap:7px;flex:none;min-height:34px;padding:0 12px 0 10px;border-radius:999px;background:var(--dv-surface-2);border:1px solid var(--dv-border);font-size:12px;white-space:nowrap}
.sc .ic{font-size:15px;color:var(--dv-text-2)}
.sc b{font-weight:600}.sc .st{color:var(--dv-text-3)}
.sc.ok .st{color:var(--dv-success-text);font-weight:600}.sc.warn{background:var(--dv-warning-soft)}.sc.warn .st{color:var(--dv-warning-text);font-weight:600}
.sc.off .st{color:var(--dv-text-3)}
.dev-phone .sc{min-height:40px}
/* sections */
.masonry{column-width:340px;column-gap:14px}
.masonry>.asec{break-inside:avoid;margin-bottom:14px;display:block}
.asec{background:var(--dv-surface);backdrop-filter:var(--dv-blur);border:1px solid var(--dv-border);border-radius:var(--dv-r-md);box-shadow:var(--dv-shadow-1);padding:10px 12px 12px}
.ash{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;min-height:40px}
.ash .rg{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--dv-accent-soft);color:var(--dv-accent);font-size:15px;flex:none}
.asec[data-k=lighting] .ash .rg{background:rgb(var(--on-cool)/.14);color:rgb(var(--on-cool))}

  return `<section class="wg ghost ${av === 'none' || av === 'unavail' ? 'warn' : ''}" data-size="m" data-w="${id}"><b>${ic(WICON[id], 16)} ${WNAME[id]}</b><span>${msg}</span>${btn}<span class="note" style="font-size:11px">${av === 'off' ? '' : 'מוצג רק במצב עריכה. במסך הרגיל הווידג׳ט לא תופס מקום.'}</span></section>`;

/* the widgets as the current direction draws them: array of html */
function widgetSlots(s) {
  const dir = s.dir, sizes = s.cfg.sizes[dir];

    if (av === 'ok') {
      const h = wgHTML(id, sizes[id], s);
      out.push(s.edit ? h.slice(0, -'</section>'.length) + wgEdit(id, sizes[id]) + '</section>' : h);

/* ==================================================================================================

function pillsOf(c) {

}
function pageHeader(s) {

  return `<header class="ph"><div>${h1}${sub}</div><div class="ph-a">${s.state === 'unsynced' ? '<span class="badge warn"><i></i>לא מסונכרן</span>' : ''}<button class="btn ghost icon sm" data-a="toast" data-v="רענון: אין שינויים במבנה" title="רענן" aria-label="רענן">${ic('refresh')}</button></div></header>`;
}
function kpisHTML(s, hideAlarm) {

  if (!hideAlarm) out.push(`<button class="kpi live" data-a="toast" data-v="נפתח פאנל: אזעקה (מחוץ למוקאפ)"><div><span class="v">${AL.text}</span><span class="l">אזעקה</span></div><span class="ico">${ic('shield')}</span></button>`);

function bulkButtons() {

function treeHTML(s) {

/* ---------------------------------------------------------------- the three directions */
function homeHTML(s) {
  const dir = s.dir, phone = s.dev === 'phone';
  const slots = widgetSlots(s);
  const quickShown = !!slots.length && s.state !== 'loading' && wAvail('quick', s) === 'ok';
  const alarmShown = wAvail('alarm', s) === 'ok' && s.state !== 'loading';
  const kp = kpisHTML(s, alarmShown);
  const bSide = dir === 'b' && !phone && s.dev !== 'tablet'; // B: the tree becomes a floor filter in the toolbar row (the side column takes its width)
  const tb = toolbarRow(s, !quickShown && s.state !== 'loading', bSide);
  const fl = floorsHTML(s, bSide);
  const head = pageHeader(s) + (s.edit ? editBar(s) : '');
  const ws = slots.join('');
  let w = '';
  if (slots.length) {
    if (phone) w = `<div class="wsnap" data-wsnap role="list" aria-label="ווידג׳טים">${ws}</div><div class="wdots" aria-hidden="true">${slots.map(() => '<i></i>').join('')}</div>`;
    else if (dir === 'a') w = `<div class="hero" data-hero>${ws}</div>`;
    else if (dir === 'c') w = `<div class="crow" data-crow>${ws}</div>`;
  }
  let body;
  if (dir === 'b' && !phone) {
    body = `${kp}<div class="bgrid ${s.side === 'start' ? 'side-start' : ''}"><div style="display:flex;flex-direction:column;gap:14px;min-width:0">${tb}${fl}</div>${slots.length ? `<div class="side" data-side>${ws}</div>` : ''}</div>`;
  } else body = `${w}${kp}${tb}${fl}`;
  return `<div class="page ${s.edit ? 'editing' : ''} home-${dir}" data-screen="home">${head}${body}</div>`;
}

const DEVS = [['d1440', 'דסקטופ 1440×900'], ['d1920', 'רחב 1920×1080'], ['tablet', 'טאבלט 820'], ['phone', 'טלפון 390']];
const DIRN = { home: [['a', 'א', 'מרכז בקרה'], ['b', 'ב', 'לוח צד'], ['c', 'ג', 'מצומצם']], area: [['a', 'א', 'אריחים צפופים'], ['b', 'ב', 'מקטעים ברצף']] };
let toastT = 0, dragId = '';
const dim = { d1440: [1440, 900], d1920: [1920, 1080], tablet: [820, 1100], phone: [390, 812] };

function buildBar() {
  $('#bar').innerHTML = `<b>Arx · מסך ראשי ומסך אזור · מוקאפ סטטי</b>
  <div class="mk-grp" id="g-screen"><span>מסך:</span><button class="mk-b" data-k="home">מסך ראשי</button><button class="mk-b" data-k="area">מסך אזור</button></div>
  <div class="mk-grp" id="g-dir"></div>
  <div class="mk-grp" id="g-dev"><span>מסגרת:</span>${DEVS.map(([k, l]) => `<button class="mk-b" data-d="${k}">${l}</button>`).join('')}</div>
  <div class="mk-grp" id="g-view"><span>תצוגה:</span><button class="mk-b" data-v="cards">כרטיסים</button><button class="mk-b" data-v="tiles">אריחים</button></div>
  <div class="mk-grp" id="g-area"><span>אזור:</span><select class="mk-sel" id="sel-area" aria-label="אזור להצגה">${[['sports', 'אולם ספורט (30 התקנים, טיפוסי)'], ['lockers', 'מלתחות (8, קטן)'], ['offices', 'משרדים (62, גדול)'], ['none', 'ללא שיוך']].map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
  <div class="mk-grp"><span>מצב:</span><select class="mk-sel" id="sel-state" aria-label="מצב להדגמה"></select><button class="mk-b" id="b-edit">מצב עריכה</button></div>
  <div class="mk-grp" id="g-rail"><span>תפריט צד:</span>${['s', 'm', 'l', 'xl', 'free'].map((k) => `<button class="mk-b" data-r="${k}">${k === 'free' ? 'חופשי' : RAIL[k].name}</button>`).join('')}<span class="mk-rng" id="free-ctl" hidden></span></div>
  <div class="mk-grp"><button class="mk-b" id="b-cmp">השוואת גדלים</button><button class="mk-b" id="b-tall">גובה מלא</button><button class="mk-b" id="b-notes">הערות עיצוב</button><button class="mk-b" id="b-reset">איפוס</button></div>
  <span class="mk-chip" id="scrollchip"></span><span class="mk-chip" id="railread"></span>`;
  $('#bar').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k) { S.screen = b.dataset.k; closeAll(); }
    else if (b.dataset.dir) { if (S.screen === 'home') S.dir = b.dataset.dir; else S.adir = b.dataset.dir; }
    else if (b.dataset.d) S.dev = b.dataset.d;
    else if (b.dataset.v) { S.view = b.dataset.v; }
    else if (b.dataset.r) { S.rail = b.dataset.r; }
    else if (b.id === 'b-edit') { if (S.screen === 'home') S.edit ? (S.edit = false) : startEdit(); else S.aedit = !S.aedit; S.menu = false; }
    else if (b.id === 'b-cmp') S.compare = !S.compare;
    else if (b.id === 'b-tall') S.tall = !S.tall;
    else if (b.id === 'b-notes') S.notes = !S.notes;
    else if (b.id === 'b-reset') { const keep = { dev: S.dev, rail: S.rail, free: S.free, notes: S.notes }; S = Object.assign(newState(), keep); }
    else return;
    render();
  });
  $('#sel-state').addEventListener('change', (e) => { if (S.screen === 'home') S.state = e.target.value; else S.astate = e.target.value; render(); });
  $('#sel-area').addEventListener('change', (e) => { S.area = e.target.value; S.bri = null; render(); });
  $('#free-ctl').addEventListener('input', (e) => { const k = e.target.dataset.free; if (!k) return; S.free[k] = Number(e.target.value); e.target.parentElement.querySelector(`[data-out="${k}"]`).textContent = e.target.value; render(true); });
  window.addEventListener('resize', () => { fit(); measure(); });
}
function closeAll() { S.menu = false; S.dlg = null; S.bri = null; }
function startEdit() { S.edit = true; S.snap = clone(S.cfg); S.dirty = false; S.drawer = true; S.sel = 'all'; }
function touch() { S.dirty = JSON.stringify(S.cfg) !== JSON.stringify(S.snap); }
function toast(m) { S.toast = m; clearTimeout(toastT); render(); toastT = setTimeout(() => { S.toast = null; render(); }, 2400); }

function syncBar() {
  const home = S.screen === 'home';
  $$('#g-screen .mk-b').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === S.screen)));
  const dir = home ? S.dir : S.adir;
  $('#g-dir').innerHTML = `<span>כיוון:</span>${DIRN[home ? 'home' : 'area'].map(([k, l, n]) => `<button class="mk-b" data-dir="${k}" aria-pressed="${dir === k}" title="${n}">${l} · ${n}</button>`).join('')}`;
  $$('#g-dev .mk-b').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.d === S.dev)));
  $$('#g-view .mk-b').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S.view)));
  $('#g-view').hidden = !home; $('#g-area').hidden = home;
  $('#sel-area').value = S.area;
  const ss = $('#sel-state'); const list = home ? HOME_STATES : AREA_STATES;
  if (ss.dataset.for !== S.screen) { ss.innerHTML = list.map(([k, l]) => `<option value="${k}">${l}</option>`).join(''); ss.dataset.for = S.screen; }
  ss.value = home ? S.state : S.astate;
  const eb = $('#b-edit'); eb.setAttribute('aria-pressed', String(home ? S.edit : S.aedit)); eb.textContent = home ? 'מצב עריכה' : 'עריכת אזור';
  $$('#g-rail .mk-b').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.r === S.rail)));
  const fc = $('#free-ctl'); fc.hidden = S.rail !== 'free';
  if (S.rail === 'free' && !fc.dataset.built) {
    fc.dataset.built = '1';
    fc.innerHTML = [['ic', 'סמל', 16, 40, 1], ['fs', 'טקסט', 9, 16, 0.5], ['item', 'פריט', 48, 120, 1]].map(([k, l, mn, mx, st]) => `<label class="mk-rng">${l}<input type="range" data-free="${k}" min="${mn}" max="${mx}" step="${st}" value="${S.free[k]}"><b data-out="${k}">${S.free[k]}</b></label>`).join('');
  }
  const { r, b } = railOf(S);
  $('#railread').textContent = `תפריט ${r.w}px · סמל ${r.ic} · טקסט ${r.fs} · סרגל תחתון ${b.h}px`;
  $('#b-cmp').setAttribute('aria-pressed', String(S.compare)); $('#b-tall').setAttribute('aria-pressed', String(S.tall)); $('#b-notes').setAttribute('aria-pressed', String(S.notes));
  $('#notes').hidden = !S.notes;
}
function measure() {
  const m = $('#main'), chip = $('#scrollchip'); if (!m || S.compare) { chip.textContent = ''; return; }
  const over = m.scrollHeight - m.clientHeight;
  const scrollable = S.dev === 'd1440' || S.dev === 'd1920';
  chip.className = 'mk-chip ' + (over <= 1 ? 'ok' : scrollable && !S.edit && S.screen === 'home' ? 'bad' : '');
  chip.textContent = over <= 1 ? 'ללא גלילה אנכית ✓' : `גלילה אנכית: +${over}px`;
}
function fit() {
  const w = S.compare ? 0 : dim[S.dev][0] + (S.tall ? 0 : 0);
  const avail = window.innerWidth - 32 - (S.notes ? 436 : 0);
  const z = w ? Math.min(1, avail / w) : 1;
  $('#fit').style.zoom = z < 1 ? z.toFixed(3) : '';
}
let pendingFocus = null;
function render(soft) {
  const f = $('#frame');
  const ae = document.activeElement; let keep = null;
  if (ae && f && f.contains(ae) && ae.dataset && ae.dataset.aInput) keep = { k: ae.dataset.aInput, s: ae.selectionStart, e: ae.selectionEnd };
  const sc = $('#main') ? $('#main').scrollTop : 0;
  $('#stage').classList.toggle('cmp', S.compare);
  if (S.compare) {
    $('#fit').innerHTML = compareHTML(S); $('#fit').style.zoom = ''; $('#fit').className = 'mk-fit mk-cmpwrap';
    syncBar(); if (S.notes) $('#notes').innerHTML = notesHTML(S); measure(); writeHash(); return;
  }
  $('#fit').className = 'mk-fit';
  if (!$('#frame')) $('#fit').innerHTML = '<div class="frame" id="frame"></div>';
  const fr = $('#frame'); const out = frameHTML(S);
  fr.className = out.cls; fr.setAttribute('style', railStyle(S));
  fr.innerHTML = out.html;
  const m2 = $('#main'); if (m2) m2.scrollTop = sc;
  if (keep) { const el = $(`[data-a-input="${keep.k}"]`, fr); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (_) { } } }
  syncBar(); fit(); measure();
  if (S.notes) $('#notes').innerHTML = notesHTML(S);
  writeHash();
}
function writeHash() {
  try { history.replaceState(null, '', '#' + new URLSearchParams({ s: S.screen, d: S.dir, ad: S.adir, f: S.dev, v: S.view, e: S.edit ? 1 : 0, ae: S.aedit ? 1 : 0, st: S.state, ast: S.astate, r: S.rail, n: S.notes ? 1 : 0, t: S.tall ? 1 : 0, a: S.area, c: S.compare ? 1 : 0, x: S.sensOpen ? 1 : 0, fr: `${S.free.ic}-${S.free.fs}-${S.free.item}` })); } catch (_) { }
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1)); if (![...p.keys()].length) return;
  const g = (k, d) => (p.has(k) ? p.get(k) : d);
  S.screen = g('s', S.screen); S.dir = g('d', S.dir); S.adir = g('ad', S.adir); S.dev = g('f', S.dev); S.view = g('v', S.view);
  S.state = g('st', 'normal'); S.astate = g('ast', 'normal'); S.rail = g('r', S.rail); S.notes = g('n', '0') === '1'; S.tall = g('t', '0') === '1'; S.area = g('a', S.area); S.compare = g('c', '0') === '1'; S.sensOpen = g('x', '0') === '1'; S.fz = g('fz', '0') === '1';
  const fr = g('fr', '').split('-').map(Number); if (fr.length === 3 && fr.every((n) => !isNaN(n))) S.free = { ic: fr[0], fs: fr[1], item: fr[2] };
  if (g('e', '0') === '1') startEdit(); S.aedit = g('ae', '0') === '1';
  if (g('di', '') === '0') S.drawer = false;
}

/* ---------------------------------------------------------------- actions (one delegated handler) */
function applyOff(kinds, pred) { Object.keys(S.D).forEach((k) => S.D[k].forEach((d) => { if (kinds.includes(d.k) && (!pred || pred(k, d))) d.on = false; })); }
function confirmDlg() {
  const d = S.dlg; if (!d) return;
  if (d.t === 'bulk') {
    if (d.v === 'lights_off') applyOff(['lighting']); else if (d.v === 'all_off') applyOff(['lighting', 'switches', 'climate', 'media']);
    else if (d.v === 'floor') applyOff(['lighting', 'switches', 'climate', 'media'], (k) => (AREA_SEED.find((a) => a.id === k) || {}).floor === d.id);
    else if (d.v === 'area') applyOff(['lighting', 'switches', 'climate', 'media'], (k) => k === d.id);
    S.dlg = null; toast('נשלח: כיבוי. ההתקנים יתעדכנו כשהמצב יאושר');
  } else if (d.t === 'covers') {
    (S.D[S.area] || []).forEach((x) => { if (x.k === 'covers') { x.on = d.v === 'covers-open'; x.pos = x.on ? 100 : 0; } });
    S.dlg = null; toast(d.v === 'covers-open' ? 'נשלח: פתיחת התריסים' : 'נשלח: סגירת התריסים');
  }
}
document.addEventListener('click', (e) => {
  const fr = $('#frame'); if (!fr || !fr.contains(e.target)) return;
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, v = el.dataset.v;
  const dev = id ? (S.D[S.area] || []).find((x) => x.id === id) : null;
  switch (a) {
    case 'nav': e.preventDefault(); S.screen = 'home'; break;
    case 'home': e.preventDefault(); S.screen = 'home'; break;
    case 'menu': S.menu = !S.menu; break;
    case 'closemenu': S.menu = false; break;
    case 'editHome': S.menu = false; S.screen = 'home'; startEdit(); break;
    case 'editArea': S.menu = false; if (S.screen !== 'area') { S.screen = 'area'; } S.aedit = true; break;
    case 'railpick': S.menu = false; S.dlg = { t: 'railpick' }; break;
    case 'rail': S.rail = v; break;
    case 'toast': toast(v); return;
    case 'view': S.view = v; break;
    case 'sel': S.sel = v; break;
    case 'area': S.screen = 'area'; S.area = v; S.bri = null; S.sensOpen = false; break;
    case 'bulk': S.dlg = { t: 'bulk', v }; break;
    case 'floorOff': { const f = FLOORS.find((x) => x.id === v); const n = AREA_SEED.filter((x) => x.floor === v).reduce((t, ar) => t + (S.D[ar.id] || []).filter((d) => d.on && ['lighting', 'switches', 'climate', 'media'].includes(d.k)).length, 0); S.dlg = { t: 'bulk', v: 'floor', id: v, h: `כיבוי ${f.name}`, p: `${n} התקנים דולקים ב${f.name} ייכבו. מנעולים, תריסים ואזעקה לא ישתנו.` }; break; }
    case 'areaOff': { const ar = areaById(S.area); const n = (S.D[ar.id] || []).filter((d) => d.on && ['lighting', 'switches', 'climate', 'media'].includes(d.k)).length; S.dlg = { t: 'bulk', v: 'area', id: ar.id, h: `כיבוי ${ar.name}`, p: `${n} התקנים דולקים באזור ייכבו. מנעולים, תריסים ואזעקה לא ישתנו.` }; break; }
    case 'confirm': confirmDlg(); break;
    case 'closedlg': S.dlg = null; break;
    /* edit: home */
    case 'wsize': S.cfg.sizes[S.dir][id] = v; touch(); break;
    case 'wtoggle': S.cfg[id].on = !S.cfg[id].on; touch(); break;
    case 'cmode': S.cfg.clock.mode = v; touch(); break;
    case 'jewish': S.cfg.clock.jewish = !S.cfg.clock.jewish; touch(); break;
    case 'side': S.side = v; break;
    case 'drawer': S.drawer = !S.drawer; break;
    case 'fmove': { const o = S.cfg.order, i = o.indexOf(id), j = i + Number(v); if (j >= 0 && j < o.length) { o.splice(i, 1); o.splice(j, 0, id); touch(); } break; }
    case 'save': S.snap = clone(S.cfg); S.dirty = false; S.dlg = null; toast('נשמר: הגדרות המסך הראשי'); return;
    case 'revert': S.cfg = cfgDefault(); touch(); break;
    case 'finish': if (S.dirty) S.dlg = { t: 'unsaved' }; else S.edit = false; break;
    case 'saveexit': S.snap = clone(S.cfg); S.dirty = false; S.edit = false; S.dlg = null; toast('נשמר: הגדרות המסך הראשי'); return;
    case 'discard': S.cfg = clone(S.snap); S.dirty = false; S.edit = false; S.dlg = null; break;
    /* area */
    case 'dtog': if (dev) { dev.on = !dev.on; if (dev.k === 'covers') dev.pos = dev.on ? 100 : 0; } break;
    case 'texp': S.bri = S.bri === id ? null : id; break;
    case 'tgt': if (dev) dev.tgt = Math.round((dev.tgt + Number(v)) * 10) / 10; break;
    case 'cover': if (dev) { if (v === 'open') { dev.pos = 100; dev.on = true; } else if (v === 'close') { dev.pos = 0; dev.on = false; } toast(v === 'stop' ? 'נשלח: עצירה' : v === 'open' ? 'נשלח: פתיחה (אושר)' : 'נשלח: סגירה (אושר)'); return; } break;
    case 'master': {
      const [k, mode] = v.split('-');
      if (k === 'covers') { S.dlg = { t: 'covers', v }; break; }
      const kind = k; (S.D[S.area] || []).forEach((x) => { if (x.k === kind && !x.un) x.on = mode === 'on'; }); break;
    }
    case 'collapse': S.collapsed[v] = !S.collapsed[v]; break;
    case 'sensopen': S.sensOpen = !S.sensOpen; break;
    case 'pin': { const cur = el.getAttribute('aria-pressed') === 'true'; S.pins[id] = !cur; break; }
    case 'hidesec': S.hiddenSec[v] = !S.hiddenSec[v]; break;
    case 'afinish': S.aedit = false; break;
    default: return;
  }
  render();
});
document.addEventListener('input', (e) => {
  const t = e.target; if (!$('#frame').contains(t)) return;
  if (t.dataset.aInput === 'title') { S.cfg.title = t.value; touch(); render(); }
  else if (t.dataset.aRange) {
    const d = (S.D[S.area] || []).find((x) => x.id === t.dataset.aRange); if (!d) return;
    d.bri = Number(t.value); const tile = t.closest('.at'); tile.style.setProperty('--p', d.bri + '%'); tile.querySelector('[data-brival]').textContent = d.bri + '%';
    tile.querySelector('small').textContent = `דולק · ${d.bri}%`;
  } else if (t.dataset.aFree) { S.free[t.dataset.aFree] = Number(t.value); t.nextElementSibling.textContent = t.value; const fr = $('#frame'); fr.setAttribute('style', railStyle(S)); syncBar(); measure(); }
});
document.addEventListener('change', (e) => {
  const t = e.target; if (!$('#frame').contains(t)) return; const k = t.dataset.aSelect; if (!k) return;
  if (k === 'wx') S.cfg.weather.entity = t.value; else if (k === 'alarm') S.cfg.alarm.entity = t.value; else S.cfg.shabbat[k] = t.value;
  touch(); render();
});
document.addEventListener('dragstart', (e) => { const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return; dragId = el.dataset.drag; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { } });
document.addEventListener('dragend', () => { dragId = ''; $$('.dragging').forEach((x) => x.classList.remove('dragging')); });
document.addEventListener('dragover', (e) => { if (dragId && e.target.closest && e.target.closest('[data-drag]')) e.preventDefault(); });
document.addEventListener('drop', (e) => { const el = e.target.closest && e.target.closest('[data-drag]'); if (!el || !dragId) return; e.preventDefault(); const o = S.cfg.order, from = o.indexOf(dragId), to = o.indexOf(el.dataset.drag); if (from < 0 || to < 0 || from === to) return; o.splice(from, 1); o.splice(to, 0, dragId); dragId = ''; touch(); render(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (S.menu || S.dlg)) { S.menu = false; S.dlg = null; render(); } });

function tickClock() {
  if (S.fz || S.compare) return;
  const [h, m, s] = clockNow();
  $$('#frame .wg-clock .hm').forEach((x) => (x.innerHTML = `${pad(h)}<b>:</b>${pad(m)}`));
  $$('#frame .wg-clock .ss').forEach((x) => (x.textContent = pad(s)));
}
buildBar(); readHash(); render(); setInterval(tickClock, 1000);

</script>

/* ====================================================================================================
   Design tokens: copied from frontend/src/styles/tokens.css (v3 base + the "design A" values, which are what the
   product runs today). The mockup adds only its own chrome (.mk-*) and the scheduler-specific colours (--sc-*).
   ==================================================================================================== */
:root{
  color-scheme:light;
  --sw-bg:#f5f7fb; --sw-surface:#ffffff; --sw-surface-2:#f7f9fc; --sw-surface-3:#eef2f8;
  --sw-border:#e7ebf2; --sw-border-strong:#e1e6ef; --sw-overlay:rgba(17,24,39,.45);
  --sw-text:#22314c; --sw-heading:#1e2e47; --sw-text-2:#5b6a85; --sw-text-3:#8a97ae; --sw-text-inverse:#fff;
  --sw-accent:#2767ed; --sw-accent-hover:#1f57d1; --sw-accent-soft:#edf3ff; --sw-accent-text:#2767ed; --sw-focus:#2767ed; --sw-nav:#2868ef;
  --sw-live:#22c55e; --sw-live-soft:#e8f8ee; --sw-stale:#f59e0b; --sw-stale-soft:#fff4e0; --sw-offline:#9aa3b5; --sw-offline-soft:#f1f3f7;
  --sw-danger:#ef4444; --sw-danger-soft:#fdecec; --sw-warning:#f59e0b; --sw-warning-soft:#fff4e0; --sw-success:#22c55e; --sw-success-soft:#e8f8ee;
  --sw-forbidden:#dc2626; --sw-forbidden-soft:#fdecec; --sw-purple:#8b5cf6;
  --sw-obj-light:#f2b544; --sw-circuit-6:#14b8a6; --sw-map-lit:#ffc857;
  --sw-font:"Heebo","Inter","Segoe UI",-apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
  --sw-font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
  --sw-fs-xs:11px; --sw-fs-sm:12.5px; --sw-fs-md:14px; --sw-fs-lg:15px; --sw-fs-xl:17px; --sw-fs-2xl:20px; --sw-fs-3xl:26px; --sw-lh:1.5;
  --sw-fw-regular:400; --sw-fw-medium:500; --sw-fw-semibold:600; --sw-fw-bold:700;
  --sw-h1:26px; --sw-h1-weight:700; --sw-h1-tracking:-.6px; --sw-page-pad:30px;
  --sw-s-1:4px; --sw-s-2:8px; --sw-s-3:12px; --sw-s-4:16px; --sw-s-5:20px; --sw-s-6:24px; --sw-s-8:32px;
  --sw-r-sm:8px; --sw-r-md:12px; --sw-r-lg:14px; --sw-r-pill:999px;
  --sw-shadow-1:0 1px 2px rgba(16,24,40,.04); --sw-shadow-2:0 6px 18px rgba(34,49,76,.06); --sw-shadow-3:0 14px 36px rgba(34,49,76,.14);
  --sw-rail-w:86px; --sw-topbar-h:72px; --sw-bottomnav-h:58px; --sw-drawer-w:360px;
  --sw-t-fast:120ms; --sw-t-med:200ms; --sw-ease:cubic-bezier(.2,0,0,1);
  /* scheduler colours: one per ACTION kind, always paired with an icon and a text label (never colour alone) */
  --sc-on:#16a34a; --sc-on-bg:rgba(34,197,94,.16);
  --sc-off:#64748b; --sc-off-bg:rgba(100,116,139,.15);
  --sc-level:#d97706; --sc-level-bg:rgba(245,158,11,.18);
  --sc-climate:#2767ed; --sc-climate-bg:rgba(39,103,237,.14);
  --sc-cover:#0d9488; --sc-cover-bg:rgba(20,184,166,.16);
  --sc-scene:#7c3aed; --sc-scene-bg:rgba(139,92,246,.15);
  --sc-custom:#475569; --sc-custom-bg:rgba(71,85,105,.12);
  --sc-night:rgba(30,46,71,.045);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#e3e8f1;color:var(--sw-text);font-family:var(--sw-font);font-size:var(--sw-fs-md);line-height:var(--sw-lh);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sw-focus);outline-offset:2px}
.ltr,code,kbd{direction:ltr;unicode-bidi:isolate;font-family:var(--sw-font-mono);font-size:.92em}
svg.ic.flip{transform:scaleX(-1)}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}

/* ---------------------------------------------------------------- mockup chrome (not part of the product) */
.mk-bar{position:sticky;top:0;z-index:200;background:#101a2e;color:#e8edf7;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 14px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.mk-bar b{font-weight:700;letter-spacing:-.2px}
.mk-grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mk-grp>span{opacity:.6;margin-inline-end:2px}
.mk-b{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e8edf7;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px;white-space:nowrap}
.mk-b:hover{background:rgba(255,255,255,.14)}
.mk-b[aria-pressed=true]{background:#2767ed;border-color:#2767ed;color:#fff}
.mk-sel{background:#1b2740;color:#e8edf7;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:4px 6px;font:inherit;font-size:12px}
.mk-stage{display:flex;gap:16px;padding:16px;align-items:flex-start;justify-content:center}
.mk-fit{flex:none}
.mk-notes{flex:none;width:400px;background:#fff;border-radius:14px;box-shadow:var(--sw-shadow-3);padding:0;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;font-size:12.5px}
.mk-notes[hidden]{display:none}
.mk-notes h2{margin:0;padding:14px 16px 6px;font-size:16px;color:var(--sw-heading)}
.mk-notes h3{margin:0;padding:12px 16px 4px;font-size:12.5px;color:var(--sw-text-2);text-transform:none}
.mk-notes .sub{padding:0 16px 8px;color:var(--sw-text-3)}
.mk-notes table{width:calc(100% - 24px);margin:0 12px 8px;border-collapse:collapse}
.mk-notes td,.mk-notes th{padding:5px 6px;border-bottom:1px solid var(--sw-border);vertical-align:top;text-align:start}
.mk-notes th{color:var(--sw-text-3);font-weight:500;font-size:11.5px}
.mk-notes ul{margin:0 0 10px;padding-inline:32px 16px}
.mk-notes li{margin:3px 0}
.mk-notes .tag{display:inline-block;background:var(--sw-surface-3);border-radius:5px;padding:0 5px;font-family:var(--sw-font-mono);direction:ltr;unicode-bidi:isolate;font-size:11px;color:var(--sw-heading)}
.mk-notes .v{color:#16a34a;font-weight:600}.mk-notes .u{color:#d97706;font-weight:600}.mk-notes .p{color:var(--sw-accent-text);font-weight:600}
.mk-legend{display:flex;gap:10px;flex-wrap:wrap;padding:6px 16px 12px}

/* ---------------------------------------------------------------- the product frame */
.frame{position:relative;background:var(--sw-bg);border-radius:16px;box-shadow:0 20px 50px rgba(20,30,55,.22);overflow:hidden;display:grid;grid-template-columns:var(--sw-rail-w) minmax(0,1fr);grid-template-rows:var(--sw-topbar-h) minmax(0,1fr);grid-template-areas:'rail top' 'rail main';color:var(--sw-text);font-size:var(--sw-fs-md)}
.frame.dev-desktop{width:1440px;height:900px}
.frame.dev-tablet{width:820px;height:1100px}
.frame.dev-phone{width:390px;height:812px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) var(--sw-bottomnav-h);grid-template-areas:'main' 'bottom'}
.frame.tall{height:auto!important;min-height:900px}
.frame.tall .main{overflow:visible}
nav.rail{grid-area:rail;background:var(--sw-surface);border-inline-start:1px solid var(--sw-border);display:flex;flex-direction:column;align-items:center;padding:14px 8px 12px;gap:6px}
.brand-tile{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--sw-accent);color:#fff;font-weight:800;font-size:22px;margin-block-end:12px;box-shadow:0 6px 14px rgba(39,103,237,.25)}
a.item,button.item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:70px;min-height:64px;padding:8px 0;border-radius:12px;font-size:11.5px;color:var(--sw-text-3);text-decoration:none;position:relative;border:0;background:transparent;cursor:pointer}
a.item.active,button.item.active{background:var(--sw-accent-soft);color:var(--sw-accent-text)}
a.item.active::after{content:'';position:absolute;inset-inline-end:-8px;inset-block:16px;width:3px;border-radius:3px;background:var(--sw-accent)}
a.item .ic,button.item .ic{font-size:22px}
nav.rail .grow{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sw-surface-3);color:var(--sw-text-2);display:grid;place-items:center;font-weight:600;font-size:13px}
header.topbar{grid-area:top;background:var(--sw-surface);border-block-end:1px solid var(--sw-border);display:flex;align-items:center;gap:14px;padding-inline:26px}
.crumbs-a{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sw-text-2);white-space:nowrap}
.crumbs-a .strong{color:var(--sw-heading);font-weight:700}.crumbs-a .ic{color:var(--sw-text-3);font-size:11px}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding-inline:11px;border-radius:8px;border:1px solid var(--sw-border-strong);background:var(--sw-surface);color:var(--sw-text);font-size:var(--sw-fs-sm);font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:var(--sw-shadow-1)}

.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding-inline:8px;border-radius:999px;font-size:var(--sw-fs-xs);font-weight:500;background:var(--sw-surface-3);color:var(--sw-text-2);white-space:nowrap}
.badge.live{background:var(--sw-live-soft);color:#15803d}.badge.warn{background:var(--sw-warning-soft);color:#b45309}.badge.err{background:var(--sw-danger-soft);color:#b91c1c}
.badge.info{background:var(--sw-accent-soft);color:var(--sw-accent-text)}.badge.off{background:var(--sw-offline-soft);color:var(--sw-text-2)}.badge.purple{background:#f1ebff;color:#6d28d9}

.card h3{margin:0;font-size:var(--sw-fs-md);font-weight:600;color:var(--sw-heading)}
.card .sub{font-size:var(--sw-fs-xs);color:var(--sw-text-3)}
.tgl{width:42px;height:24px;border-radius:999px;border:0;background:var(--sw-border-strong);position:relative;cursor:pointer;padding:0;flex:none;transition:background var(--sw-t-fast) var(--sw-ease)}

.inp,.sel,textarea.inp{height:34px;border:1px solid var(--sw-border-strong);border-radius:9px;background:var(--sw-surface);padding-inline:11px;font:inherit;font-size:var(--sw-fs-sm);color:var(--sw-text);min-width:0;width:100%}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.sp{flex:1}
.sep{height:1px;background:var(--sw-border);margin-block:2px}

.tile.green{background:var(--sw-live-soft);color:#16a34a}.tile.amber{background:var(--sw-stale-soft);color:var(--sw-stale)}.tile.red{background:var(--sw-danger-soft);color:var(--sw-danger)}.tile.grey{background:var(--sw-surface-3);color:var(--sw-text-2)}

.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-size:var(--sw-fs-sm);border:1px solid transparent}

.banner.info{background:var(--sw-accent-soft);color:#1f4fbf;border-color:#d6e3ff}
.banner.warn{background:var(--sw-warning-soft);color:#8a4b06;border-color:#fbe0b0}
.banner.err{background:var(--sw-danger-soft);color:#a61b1b;border-color:#f7c4c4}
.banner.ok{background:var(--sw-success-soft);color:#166534;border-color:#c8ecd5}
.banner .sp{flex:1}
.banner b{font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--sw-surface);border:1px solid var(--sw-border);border-radius:var(--sw-r-lg);box-shadow:var(--sw-shadow-1);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .v{font-size:26px;font-weight:700;color:var(--sw-heading);line-height:1.1;letter-spacing:-.4px}

.kpi.btnlike{cursor:pointer}.kpi.btnlike:hover{box-shadow:var(--sw-shadow-2)}
.nextruns{display:flex;flex-direction:column;gap:5px;font-size:var(--sw-fs-sm)}
.nextruns .r{display:flex;align-items:center;gap:8px}
.nextruns .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--sw-heading);min-width:44px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .searchf{position:relative;flex:1;min-width:180px;max-width:320px}
.tools .searchf .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--sw-text-3);font-size:15px}
.daychips{display:inline-flex;gap:3px}
.daychips button{width:28px;height:28px;border-radius:8px;border:1px solid var(--sw-border-strong);background:var(--sw-surface);font-size:var(--sw-fs-xs);font-weight:600;cursor:pointer;color:var(--sw-text-2)}

.daychips.sm button.dim{opacity:.35}
.bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sw-heading);color:#fff;border-radius:12px;padding:8px 12px;font-size:var(--sw-fs-sm)}
.bulkbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.bulkbar .btn:hover{background:rgba(255,255,255,.2)}
.bulkbar .btn.danger{border-color:#fca5a5;color:#fecaca}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--sw-border-strong);background:#fff;display:inline-grid;place-items:center;cursor:pointer;color:#fff;flex:none;padding:0}
.cb[aria-checked=true]{background:var(--sw-accent);border-color:var(--sw-accent)}
.cb .ic{font-size:12px;stroke-width:3}
.grid-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dev-tablet .grid-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.dev-phone .grid-cards{grid-template-columns:1fr}

.dev-phone .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.dev-phone .kpi.wide{grid-column:span 2}
.group-h{display:flex;align-items:center;gap:8px;margin:10px 2px 2px;font-weight:600;color:var(--sw-heading);font-size:var(--sw-fs-md)}

.mini{position:relative;height:22px;border-radius:6px;background:var(--sw-surface-3);direction:ltr;overflow:hidden}

.dropline{box-shadow:0 -3px 0 0 var(--sw-accent) inset}
.warnicon{color:var(--sw-warning)}
.menu{position:absolute;z-index:40;min-width:190px;background:var(--sw-surface);border:1px solid var(--sw-border);border-radius:12px;box-shadow:var(--sw-shadow-3);padding:5px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:start;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:var(--sw-fs-sm)}

.menu .ic{font-size:15px;color:var(--sw-text-3)}.menu button.danger .ic{color:var(--sw-danger)}
/* table (sw-table look) */

.acp{display:inline-flex;align-items:center;gap:5px;height:22px;padding-inline:8px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap}

.acp.on{background:var(--sc-on-bg);color:var(--sc-on)}.acp.off{background:var(--sc-off-bg);color:var(--sc-off)}.acp.level{background:var(--sc-level-bg);color:var(--sc-level)}
.acp.climate{background:var(--sc-climate-bg);color:var(--sc-climate)}.acp.cover{background:var(--sc-cover-bg);color:var(--sc-cover)}.acp.scene{background:var(--sc-scene-bg);color:var(--sc-scene)}.acp.custom{background:var(--sc-custom-bg);color:var(--sc-custom)}
/* overlays */

.toast{position:absolute;inset-inline-start:20px;bottom:20px;z-index:90;background:var(--sw-heading);color:#fff;padding:10px 14px;border-radius:11px;font-size:var(--sw-fs-sm);box-shadow:var(--sw-shadow-3);display:flex;align-items:center;gap:9px;max-width:80%}

<script>
/* ==================================================================================================
   State
   ================================================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clone = o => JSON.parse(JSON.stringify(o));
const D = { screen: 'list', dev: 'desktop', state: 'normal', tall: false, notes: false };
let SCH = seed();
const L = { tab: 'schedules', view: 'cards', q: '', area: '', st: '', days: new Set(), sort: 'next', group: 'none', sel: new Set(), menu: null, detail: null, mfilters: false, folder: 'all', otab: 'order', archiveView: false };
let ED = null, DLG = null, TOAST = null, toastT = null, CR = null;
const ACOL = { on: 'var(--sc-on)', off: 'var(--sc-off)', level: 'var(--sc-level)', climate: 'var(--sc-climate)', cover: 'var(--sc-cover)', scene: 'var(--sc-scene)', custom: 'var(--sc-custom)' };
const canManage = () => D.state !== 'noperm';
const sorted = s => s.slots.slice().sort((a, b) => res(a.s) - res(b.s));
const areasOf = s => [...new Set(s.ents.map(id => (E[id] || {}).area).filter(Boolean))];
const entNames = s => s.ents.map(id => (E[id] || { n: id }).n);
const entLine = s => { const n = entNames(s); return n.length <= 2 ? n.join(' · ') : n.slice(0, 2).join(' · ') + ` ועוד ${n.length - 2}`; };
const ROLE = { repeat: 'חוזר', pause: 'פעם אחת, אחר כך מושהה', single: 'פעם אחת, אחר כך נמחק' };

function runsOf(s, n = 5) {
  const out = [];
  for (let d = 0; d < 420 && out.length < n; d++) {
    const date = addDays(NOW.date, d), dow = (NOW.dow + d) % 7;
    if (!s.days.includes(dow)) continue;
    if (s.from && date < s.from) continue;
    if (s.to && date > s.to) continue;
    for (const sl of sorted(s)) {
      const m = res(sl.s);
      if (d === 0 && m <= NOW.min) continue;
      out.push({ date, dow, m, d, sl }); if (out.length >= n) break;
    }
  }
  return out;
}
function fmtRun(r) {
  if (!r) return '—';
  const day = r.d === 0 ? 'היום' : r.d === 1 ? 'מחר' : r.d < 7 ? `יום ${DS[r.dow]}` : `${r.date.slice(8)}/${r.date.slice(5, 7)}`;
  return `${day} ${hm0(r.m)}`;
}
const nextRun = s => (s.on && !s.archived) ? runsOf(s, 1)[0] : null;
const nextTxt = s => s.on ? (fmtRun(nextRun(s))) : 'מושהה';
function visible() {
  const q = L.q.trim();
  let a = SCH.filter(s => s.archived === L.archiveView);
  if (L.folder !== 'all' && !L.archiveView) { if (L.folder.startsWith('area:')) a = a.filter(s => areasOf(s).includes(L.folder.slice(5))); else if (L.folder.startsWith('tag:')) a = a.filter(s => s.tags.includes(L.folder.slice(4))); else a = a.filter(s => s.folder === L.folder); }
  if (q) a = a.filter(s => (s.name + ' ' + entNames(s).join(' ') + ' ' + s.tags.join(' ')).includes(q));
  if (L.area) a = a.filter(s => areasOf(s).includes(L.area));
  if (L.st === 'on') a = a.filter(s => s.on); else if (L.st === 'off') a = a.filter(s => !s.on); else if (L.st === 'conflict') a = a.filter(s => s.conflict);
  if (L.days.size) a = a.filter(s => [...L.days].every(d => s.days.includes(d)));
  const key = s => { const r = nextRun(s); return r ? r.d * 2000 + r.m : 1e9; };
  if (L.sort === 'next') a = a.slice().sort((x, y) => key(x) - key(y)); else if (L.sort === 'name') a = a.slice().sort((x, y) => x.name.localeCompare(y.name, 'he'));
  return a;
}
function groupsOf(list) {
  if (L.group === 'none') return [{ h: null, items: list }];
  const m = new Map();
  for (const s of list) {
    let ks;
    if (L.group === 'area') ks = areasOf(s); else if (L.group === 'folder') ks = [(FOLDERS.find(f => f.id === s.folder) || { n: 'ללא תיקיה' }).n]; else if (L.group === 'state') ks = [s.on ? 'פעילים' : 'מושהים']; else ks = [...new Set(s.slots.map(x => ACT[x.act].l))].slice(0, 1);
    for (const k of (ks.length ? ks : ['אחר'])) { if (!m.has(k)) m.set(k, []); m.get(k).push(s); }
  }
  return [...m.entries()].map(([h, items]) => ({ h, items }));
}

      <td style="white-space:nowrap"><button class="btn ghost icon sm" data-a="sdup" data-id="${x.id}" aria-label="שכפול" title="שכפול" ${d.ro ? 'disabled' : ''}>${ic('copy')}</button><button class="btn ghost icon sm" data-a="sdel" data-id="${x.id}" aria-label="מחיקת משבצת" title="מחיקה" ${d.ro || x.ro ? 'disabled' : ''}>${ic('trash')}</button></td></tr>${bad.has(x.id) ? `<tr><td></td><td colspan="8" class="err-t">${ic('warning', 13)} ${esc(validate(d).find(v => v.id === x.id).m)}</td></tr>` : ''}`;
  }).join('');

   <div class="tbl"><table style="min-width:900px"><thead><tr><th style="width:30px">#</th><th>משעה</th><th>עד שעה (סוף חלון)</th><th>פעולה</th><th>ערך</th><th>התקנים</th><th>תנאים</th><th>הרצה הבאה</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="9" class="hint" style="padding:18px;text-align:center">אין משבצות. הוסיפו שורה או גררו על ציר הזמן.</td></tr>`}</tbody></table></div>
   <div class="row wrap" style="margin-top:10px"><button class="btn sm" data-a="saddrow" ${d.ro ? 'disabled' : ''}>${ic('plus')}משבצת חדשה</button><span class="hint">הפעולה מתבצעת ברגע ה"משעה". "עד שעה" הוא סוף החלון (המתנה לתנאים); כדי לכבות בסופו – הוסיפו משבצת כיבוי או הפעילו "כיבוי בסיום" בפרטי המשבצת.</span></div>`;
}
function paramInput(x, i, compact) {

  if (x.act === 'climate') return `<div class="row" style="gap:4px"><select class="sel ${c}" style="width:auto" data-a-tsel="${i}|mode" ${dis}><option value="cool" ${p.mode === 'cool' ? 'selected' : ''}>קירור</option><option value="heat" ${p.mode === 'heat' ? 'selected' : ''}>חימום</option><option value="off" ${p.mode === 'off' ? 'selected' : ''}>כיבוי</option></select>${p.mode === 'off' ? '' : `<input class="inp ${c} time" style="width:56px" data-a-tinput="${i}|v" value="${p.v ?? 23}" ${dis} aria-label="טמפרטורה"><span class="hint">°</span>`}</div>`;
  if (x.act === 'cover') return `<div class="row" style="gap:4px"><input class="inp ${c} time" style="width:64px" data-a-tinput="${i}|v" value="${p.v ?? 50}" ${dis} aria-label="מיקום תריס באחוזים"><span class="hint">% פתוח</span></div>`;
  if (x.act === 'scene') return `<select class="sel ${c}" style="width:auto" data-a-tsel="${i}|name" ${dis}>${['ערב', 'בוקר', 'ישיבה', 'ניקיון'].map(n => `<option ${p.name === n ? 'selected' : ''}>${n}</option>`).join('')}</select>`;

}

/* ------------------------------------------------ slot inspector */

  if (i < 0) return `<div class="card insp"><div class="row"><div class="tile grey">${ic('target')}</div><div><b style="color:var(--sw-heading)">אין משבצת נבחרת</b><div class="hint">גררו על ציר הזמן ליצירת משבצת, או לחצו על משבצת קיימת כדי לערוך אותה. במקלדת: חצים להזזה, Shift+חצים לשינוי אורך, Delete למחיקה.</div></div></div></div>`;
  const x = d.slots[i]; const ro = x.ro || d.ro; const dis = ro ? 'disabled' : '';
  const tsel = (t, which) => `<select class="sel sm" data-a-tsel="${i}|${which}type" ${dis} aria-label="סוג שעה">${which === 'e' ? `<option value="none" ${!t ? 'selected' : ''}>ללא סיום (נקודת זמן)</option>` : ''}<option value="fix" ${t && t.k === 'fix' ? 'selected' : ''}>שעה קבועה</option><option value="rise" ${t && t.k === 'sun' && t.ev === 'rise' ? 'selected' : ''}>זריחה + היסט</option><option value="set" ${t && t.k === 'sun' && t.ev === 'set' ? 'selected' : ''}>שקיעה + היסט</option></select>`;
  const companion = d.slots.find(y => y.pair === x.id);
  const conds = x.cond.map((c, ci) => `<div class="row" style="gap:6px"><select class="sel sm" data-a-tsel="${i}|c${ci}ent" ${dis}>${SENSORS.map(s => `<option value="${s.id}" ${c.ent === s.id ? 'selected' : ''}>${s.n}</option>`).join('')}</select><select class="sel sm" style="width:100px" data-a-tsel="${i}|c${ci}m" ${dis}>${Object.entries(MATCH).map(([k, v]) => `<option value="${k}" ${c.m === k ? 'selected' : ''}>${v}</option>`).join('')}</select><input class="inp sm" style="width:90px" data-a-tinput="${i}|c${ci}v" value="${esc(c.v)}" ${dis} aria-label="ערך"><button class="btn ghost icon sm" data-a="cdel" data-v="${ci}" aria-label="הסרת תנאי" ${dis}>${ic('close')}</button></div>`).join('');
  return `<div class="card insp" aria-label="פרטי משבצת">
   <div class="h"><div class="tile ${ACT[x.act].k === 'on' ? 'green' : ACT[x.act].k === 'level' ? 'amber' : ''}">${ic(ACT[x.act].ic)}</div><div class="grow"><b style="color:var(--sw-heading)">משבצת ${i + 1} מתוך ${d.slots.length}</b> <span class="hint">· ${esc(actLabel(x))}</span></div>
     <button class="btn sm ${ro ? 'dis' : ''}" data-a="copydays" data-id="${x.id}">${ic('copy')}העתקה לימים…</button><button class="btn sm ${d.ro ? 'dis' : ''}" data-a="sdup" data-id="${x.id}">שכפול</button><button class="btn sm danger ${ro ? 'dis' : ''}" data-a="sdel" data-id="${x.id}" aria-label="מחיקת משבצת">${ic('trash')}מחיקה</button><button class="btn ghost icon sm" data-a="unsel" aria-label="סגירה">${ic('close')}</button></div>
   ${x.ro ? `<div class="banner warn" style="margin-bottom:10px">${ic('lock')}<span>${esc(x.roWhy || 'משבצת זו לקריאה בלבד עבורך.')} <b>לעריכה: ברכיב התזמונים המקורי.</b></span></div>` : ''}
   <div class="insp"><div class="g3">
     <div class="field"><label>משעה (רגע הביצוע)</label>${tsel(x.s, 's')}<div class="row">${timeInput(x.s, i, 's')}${x.s.k === 'sun' ? `<span class="hint">= ${hm(res(x.s))} היום</span>` : ''}</div></div>
     <div class="field"><label>עד שעה (סוף חלון)</label>${tsel(x.e, 'e')}<div class="row">${x.e ? timeInput(x.e, i, 'e') : '<span class="hint">מבוצע פעם אחת</span>'}</div></div>
     <div class="field"><label>פעולה</label><select class="sel" data-a-tsel="${i}|act" ${dis}>${Object.entries(ACT).map(([k, v]) => `<option value="${k}" ${x.act === k ? 'selected' : ''}>${v.l}${k === 'scene' ? ' (דורש אישור בהרצה)' : ''}</option>`).join('')}</select><div class="row">${paramInput(x, i)}</div></div></div>
   ${x.act === 'custom' ? `<div class="banner warn" style="margin-top:8px">${ic('warning')}<span>שירות מותאם – למנהלים בלבד. שירותים שאינם ברשימה המותרת (מנעולים, אזעקה, שערים) יידחו בשמירה.</span></div>` : ''}
   ${x.act === 'scene' ? `<div class="hint" style="margin-top:6px">סצנות וסקריפטים מותרים רק אם המנהל אפשר זאת בהגדרות.</div>` : ''}
   <div class="row wrap" style="margin-top:10px"><button class="tgl sm" role="switch" aria-checked="${!!companion}" data-a="autooff" data-id="${x.id}" aria-label="כיבוי בסיום" ${dis || !x.e || x.act === 'off' ? 'disabled' : ''}></button><span><b style="font-size:12.5px">כיבוי בסיום החלון</b> <span class="hint">מוסיף משבצת כיבוי אחרי המשבצת (הרכיב אינו מפעיל דבר בסוף חלון)</span></span></div>
   <div class="sep" style="margin-block:10px"></div>
   <div class="row wrap"><b style="font-size:12.5px;color:var(--sw-heading)">תנאים</b><span class="hint">נבדקים ברגע הביצוע</span><span class="sp"></span>${x.cond.length > 1 ? `<div class="seg sm" role="group" aria-label="לוגיקת תנאים"><button class="${x.condType === 'and' ? 'on' : ''}" data-a="ctype" data-v="and" ${dis}>כולם</button><button class="${x.condType === 'or' ? 'on' : ''}" data-a="ctype" data-v="or" ${dis}>אחד מהם</button></div>` : ''}<button class="btn sm ${ro ? 'dis' : ''}" data-a="cadd">${ic('plus')}תנאי</button></div>
   ${conds ? `<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${conds}</div>` : `<div class="hint" style="margin-top:4px">ללא תנאים – המשבצת תבוצע תמיד. תנאי שעה נקבע בשעות המשבצת; תנאי שמש – ב"זריחה / שקיעה" או בתנאי על מצב השמש.</div>`}
   ${x.cond.length ? `<div class="row" style="margin-top:8px"><button class="tgl sm" role="switch" aria-checked="${x.track}" data-a="track" ${dis}></button><span class="hint">המשך לבדוק את התנאים עד סוף החלון, ובצע כשיתקיימו</span></div>` : ''}
  </div></div>`;
}

  const ents = d.ents.map(id => { const e = E[id] || { n: id, ctl: true }; const nc = e.ctl === false; return `<span class="entchip ${nc ? 'ro' : ''}" title="${esc(id)}">${ic(TYPE_ICON[e.t] || 'power')}${esc(e.n)}${nc ? ic('lock') : `<button data-a="rment" data-v="${id}" aria-label="הסרת ${esc(e.n)}" ${dis}>${ic('close', 12)}</button>`}</span>`; }).join('');
  return `<div class="card sidebar" style="padding:0 14px">

   <div class="sec"><div class="st">${ic('tag')}פרטים</div><div class="field"><label>שם</label><input class="inp ${d.name.trim() ? '' : 'bad'}" data-a-input="ename" value="${esc(d.name)}" placeholder="למשל: תאורת משרדים – שעות עבודה" ${dis}></div>
     <div class="row wrap">${d.tags.map(t => `<span class="chip static x">${esc(t)}<button class="ck" data-a="rmtag" data-v="${esc(t)}" aria-label="הסרת תגית ${esc(t)}" ${dis}>${ic('close', 12)}</button></span>`).join('')}<button class="chip" data-a="addtag" ${dis}>${ic('plus', 12)}תגית</button></div>
     <div class="field"><label>תיקיה</label><select class="sel sm" data-a-change="efolder" ${dis}><option value="">ללא תיקיה</option>${FOLDERS.map(f => `<option value="${f.id}" ${d.folder === f.id ? 'selected' : ''}>${f.n}</option>`).join('')}</select></div></div>
   <div class="sec"><div class="st">${ic('light')}התקנים <span class="hint">(${d.ents.length})</span></div><div class="row wrap">${ents || '<span class="hint">לא נבחרו התקנים</span>'}</div><div><button class="btn sm" data-a="dlg" data-v="entities" ${dis}>${ic('plus')}בחירת התקנים…</button></div>${d.ents.some(id => (E[id] || {}).ctl === false) ? `<div class="hint">${ic('lock', 12)} התקן אחד אינו בהרשאת השליטה שלך – אי אפשר לשנות את התזמון, רק להפעיל/להשהות.</div>` : ''}</div>

     <div class="row wrap"><button class="chip" data-a="dpreset" data-v="all" ${dis}>כל יום</button><button class="chip" data-a="dpreset" data-v="work" ${dis}>א׳–ה׳</button><button class="chip" data-a="dpreset" data-v="weekend" ${dis}>סוף שבוע</button></div>
     <div class="hint">הימים חלים על כל המשבצות של התזמון. יום שונה = תזמון נפרד (פיצול).</div></div>

     <div class="hint">${d.repeat === 'repeat' ? 'ממשיך לחזור בכל יום מתאים.' : d.repeat === 'pause' ? 'אחרי המשבצת האחרונה התזמון עובר למושהה ונשמר.' : `${ic('warning', 12)} אחרי המשבצת האחרונה התזמון נמחק אוטומטית.`}</div></div>
   <div class="sec"><div class="st">${ic('clock')}תקופה</div><div class="row"><div class="field grow"><label>מתאריך</label><input type="date" class="inp sm" data-a-change="dfrom" value="${d.from || ''}" ${dis}></div><div class="field grow"><label>עד תאריך</label><input type="date" class="inp sm" data-a-change="dto" value="${d.to || ''}" ${dis}></div></div></div>

  </div>`;
}

/* ------------------------------------------------ the editor screen */
function editorScreen() {
  const d = ED.d; const errs = validate(d); const ro = d.ro; const manage = canManage() && !ro; const dr = dirty(); const phone = D.dev === 'phone';
  const banners = [];

  if (ro && D.state !== 'noperm') banners.push(`<div class="banner warn">${ic('lock')}<span><b>התזמון לקריאה בלבד עבורך.</b> הוא כולל התקן שאין לך הרשאת שליטה בו (השקיה). אפשר להפעיל / להשהות אותו; שינוי תוכן – על ידי מי שיש לו הרשאה על כל ההתקנים.</span></div>`);
  if (ED.banner === 'conflict') banners.push(`<div class="banner err" role="alert">${ic('warning')}<span><b>התזמון שונה במקום אחר</b> לפני 40 שניות (שעת ההתחלה של משבצת 2, גרסה <span class="ltr">a91f → 7c02</span>). השינויים שלכם עדיין לא נשמרו.</span><span class="sp"></span><button class="btn sm" data-a="dlg" data-v="compare">השוואה</button><button class="btn sm" data-a="conf-reload">טעינת הגרסה החדשה</button><button class="btn sm danger" data-a="conf-keep">שמירה בכל זאת</button></div>`);
  if (ED.banner === 'saveerror') banners.push(`<div class="banner err" role="alert">${ic('warning')}<span><b>השמירה נכשלה, לא בוצע שום שינוי.</b> תשתית המערכת לא אישרה את העדכון (התקן "תריסי אולם" לא נמצא). אפשר לנסות שוב; הטיוטה נשארת כאן.</span><span class="sp"></span><button class="btn sm" data-a="dbg">העתקת פרטים</button><button class="btn sm primary" data-a="save">ניסיון חוזר</button></div>`);
  if (ED.split) banners.push(`<div class="banner info">${ic('link')}<span><b>העריכה כעת ליום ${DAYS[ED.day]} בלבד.</b> בשמירה יווצר תזמון נפרד "${esc(d.name || 'תזמון')} – ${DAYS[ED.day]}" ואילו שאר הימים יישארו בתזמון הזה.</span><span class="sp"></span><button class="btn sm" data-a="unsplit">ביטול הפיצול</button></div>`);
  const head = `<div class="page-h"><div class="grow"><div class="crumb-mini">תזמונים ${ic('chevron', 11)} ${ED.id ? 'עריכה' : 'תזמון חדש'}</div><div class="titlebar"><button class="btn ghost icon" data-a="back" aria-label="חזרה לרשימה">${ic('back', 18)}</button><h1>${esc(d.name || 'תזמון חדש')}</h1>${dr ? `<span class="badge warn" title="יש שינויים שלא נשמרו">${ic('edit', 12)}לא נשמר</span>` : `<span class="badge off">גרסה <span class="ltr">${esc(d.rev)}</span></span>`}${d.on ? '' : '<span class="badge off">מושהה</span>'}</div></div>
    <div class="actions"><button class="btn ${ED.id ? '' : 'dis'} hide-phone" data-a="run" data-id="${ED.id || ''}" ${D.state === 'noperm' ? 'disabled' : ''}>${ic('play')}הרצה עכשיו</button><button class="btn" data-a="back">ביטול</button><button class="btn primary ${manage && !errs.length ? '' : 'dis'}" data-a="save" ${manage && !errs.length ? '' : 'aria-disabled="true"'}>${ic('check')}שמירה</button></div></div>`;
  const view = ED.view;
  const seg = `<div class="seg" role="group" aria-label="תצוגת המשבצות">${phone ? '' : `<button class="${view === 'week' ? 'on' : ''}" data-a="eview" data-v="week" aria-pressed="${view === 'week'}">${ic('calendar', 14)}שבוע</button>`}<button class="${view === 'day' ? 'on' : ''}" data-a="eview" data-v="day" aria-pressed="${view === 'day'}">${ic('clock', 14)}יום</button><button class="${view === 'table' ? 'on' : ''}" data-a="eview" data-v="table" aria-pressed="${view === 'table'}">${ic('table', 14)}טבלה</button></div>`;
  const legend = `<div class="legend">${['on', 'off', 'level', 'climate', 'cover', 'scene'].map(k => `<span class="k"><span class="sw" style="background:var(--sc-${k}-bg);border-color:var(--sc-${k})"></span>${{ on: 'הדלקה', off: 'כיבוי', level: 'עוצמה', climate: 'מזגן', cover: 'תריס', scene: 'סצנה' }[k]}</span>`).join('')}<span class="k">${ic('sun', 13)}זריחה / שקיעה</span><span class="k"><span style="width:14px;height:2px;background:var(--sw-danger);display:inline-block"></span>עכשיו</span></div>`;
  let board;

  if (t === 'split') return box(`עריכה רק ל${DAYS[ED.day]}`, `התזמון חל כעת על ${ED.d.days.length} ימים עם אותן משבצות. כדי שיום אחד יהיה שונה, נפצל: ${DAYS[ED.day]} יהפוך לתזמון נפרד, ושאר הימים ישארו בתזמון הזה. שני התזמונים ישמרו יחד בתגית אחת.`, `<button class="btn primary" data-a="dosplit">פיצול ועריכה</button><button class="btn" data-a="closedlg">ביטול</button>`);
  if (t === 'copydays') return `${scrim()}<div class="dlg" role="dialog" aria-label="העתקת משבצת לימים"><h3>העתקת המשבצת לימים אחרים</h3><p>ברכיב, כל משבצות התזמון חלות על אותם ימים. הוספת יום מוסיפה אותו לתזמון כולו.</p><div class="daychips" role="group">${DS.map((n, i) => `<button class="${(DLG.days || new Set(ED.d.days)).has(i) ? 'on' : ''}" data-a="cdday" data-v="${i}" title="${DAYS[i]}">${n}</button>`).join('')}</div>
     <div class="foot"><button class="btn primary" data-a="cdadd">הוספת הימים לתזמון הזה</button><button class="btn" data-a="cdnew">יצירת תזמון נפרד לימים אלה</button><button class="btn ghost" data-a="closedlg">ביטול</button></div></div>`;
  if (t === 'compare') return `${scrim()}<div class="dlg" role="dialog" aria-label="השוואת גרסאות"><h3>מה השתנה במקום אחר</h3><div class="tbl"><table style="min-width:0"><thead><tr><th>שדה</th><th>הגרסה שלכם</th><th>הגרסה בתשתית</th></tr></thead><tbody><tr><td>משבצת 2 · שעת התחלה</td><td>19:00</td><td style="color:#b91c1c;font-weight:600">18:30</td></tr><tr><td>ימים</td><td>א׳–ה׳</td><td>א׳–ה׳</td></tr><tr><td>שם</td><td>${esc(ED.d.name)}</td><td>${esc(ED.d.name)}</td></tr></tbody></table></div><p class="hint">השינוי בוצע ברכיב המקורי. "שמירה בכל זאת" תדרוס אותו.</p><div class="foot"><button class="btn primary" data-a="conf-reload">טעינת הגרסה החדשה</button><button class="btn" data-a="closedlg">סגירה</button></div></div>`;
  if (t === 'runnow') { const s = SCH.find(x => x.id === DLG.id); const sl = sorted(s).filter(x => res(x.s) <= NOW.min).pop() || sorted(s)[0]; return box(`להריץ עכשיו את "${esc(s.name)}"?`, `יבוצע מיד: ${esc(actLabel(sl))} על ${esc(entLine(s))}. פעולת תריסים היא תנועה פיזית ולכן נדרש אישור. תנאי המשבצת יידלגו רק אם תבחרו כך.`, `<button class="btn primary" data-a="confirmrun">${ic('play')}הרצה עכשיו</button><button class="btn" data-a="closedlg">ביטול</button>`, `<div class="row"><button class="tgl sm" role="switch" aria-checked="false" data-a="noop"></button><span class="hint">דילוג על התנאים</span></div>`); }
  if (t === 'folder') return `${scrim()}<div class="dlg"><h3>העברה לתיקיה</h3><div class="sidenav">${FOLDERS.map(f => `<button data-a="movef" data-v="${f.id}">${ic('folder', 15)}${f.n}</button>`).join('')}</div><div class="foot"><button class="btn" data-a="closedlg">ביטול</button></div></div>`;
  return '';
}

/* ==================================================================================================
   Organisation screen (order, folders, tags, archive, trash) and the activity list
   ================================================================================================== */
function organiseScreen() {
  const fcount = f => SCH.filter(s => !s.archived && (f === 'all' || (f.startsWith('area:') ? areasOf(s).includes(f.slice(5)) : f.startsWith('tag:') ? s.tags.includes(f.slice(4)) : s.folder === f))).length;
  const tags = [...new Set(SCH.flatMap(s => s.tags))];
  const nav = `<div class="card sidenav" style="padding:8px"><button class="${L.folder === 'all' && !L.archiveView ? 'on' : ''}" data-a="folder" data-v="all">${ic('list', 15)}כל התזמונים<span class="n">${fcount('all')}</span></button>
    <div class="h">לפי קומה / אזור</div>${AREAS.map(a => `<button class="${L.folder === 'area:' + a && !L.archiveView ? 'on' : ''}" data-a="folder" data-v="area:${a}">${ic('floor', 15)}${a}<span class="n">${fcount('area:' + a)}</span></button>`).join('')}
    <div class="h">תיקיות</div>${FOLDERS.map(f => `<button class="${L.folder === f.id && !L.archiveView ? 'on' : ''}" data-a="folder" data-v="${f.id}">${ic('folder', 15)}${f.n}<span class="n">${fcount(f.id)}</span></button>`).join('')}<button data-a="newfolder" style="color:var(--sw-accent-text)">${ic('plus', 15)}תיקיה חדשה</button>
    <div class="h">תגיות (נראות גם ברכיב המקורי)</div><div class="row wrap" style="padding:2px 8px 6px">${tags.map(t => `<button class="chip ${L.folder === 'tag:' + t && !L.archiveView ? 'on' : ''}" data-a="folder" data-v="tag:${t}">${esc(t)}</button>`).join('')}</div>
    <div class="h">שמורים</div><button class="${L.archiveView ? 'on' : ''}" data-a="archview">${ic('archive', 15)}ארכיון<span class="n">${SCH.filter(s => s.archived).length}</span></button><button data-a="noop">${ic('trash', 15)}פח (30 ימים)<span class="n">1</span></button></div>`;
  const list = visible().length || L.archiveView ? visible() : [];
  const otab = L.otab;
  const head = `<div class="page-h"><div><div class="crumb-mini">תזמונים ${ic('chevron', 11)} ארגון</div><div class="titlebar"><button class="btn ghost icon" data-a="go" data-v="list" aria-label="חזרה">${ic('back', 18)}</button><h1>${L.archiveView ? 'ארכיון' : 'ארגון וסדר'}</h1></div></div><div class="actions"><button class="btn" data-a="dlg" data-v="ie">${ic('download')}ייבוא / ייצוא</button><button class="btn primary" data-a="dlg" data-v="create">${ic('plus')}תזמון חדש</button></div></div>`;
  const seg = `<div class="tabs"><button class="${otab === 'order' ? 'on' : ''}" data-a="otab" data-v="order">סדר וארגון</button><button class="${otab === 'activity' ? 'on' : ''}" data-a="otab" data-v="activity">פעילות אחרונה</button></div>`;
  let main;
  if (otab === 'activity') main = activityView();
  else main = `<div class="card flush" role="list" aria-label="תזמונים לפי סדר">${list.map((s, i) => `<div class="rl ${L.sel.has(s.id) ? 'on' : ''}" role="listitem" draggable="${!L.archiveView}" data-drag="${s.id}">
      ${L.archiveView ? '' : `<button class="dragh" aria-label="גרירה לשינוי סדר: ${esc(s.name)}. במקלדת: Alt+חץ למעלה או למטה" data-a="noop" data-grip="${s.id}">${ic('grip', 16)}</button>`}${cb(L.sel.has(s.id), 'sel', s.id, 'בחירת ' + s.name)}
      <div class="grow"><div style="font-weight:600;color:var(--sw-heading)">${esc(s.name)} ${s.pinned ? ic('star', 13) : ''}</div><div class="hint">${esc(entLine(s))} · ${areasOf(s).join(', ')}</div></div>
      <span class="hide-phone row wrap" style="gap:4px;justify-content:flex-end;max-width:180px">${s.tags.map(t => `<span class="chip static" style="min-height:22px;font-size:11px;padding-inline:8px">${esc(t)}</span>`).join('')}</span>
      <select class="sel sm hide-phone" style="width:130px" data-a-change="mfolder" data-id="${s.id}" aria-label="תיקיה"><option value="">ללא תיקיה</option>${FOLDERS.map(f => `<option value="${f.id}" ${s.folder === f.id ? 'selected' : ''}>${f.n}</option>`).join('')}</select>
      ${L.archiveView ? `<button class="btn sm" data-a="archive" data-id="${s.id}">${ic('restore')}שחזור</button>` : `<button class="btn ghost icon sm" data-a="mv" data-id="${s.id}" data-v="-1" aria-label="הזזה למעלה" ${i === 0 ? 'disabled' : ''}>${ic('up', 14)}</button><button class="btn ghost icon sm" data-a="mv" data-id="${s.id}" data-v="1" aria-label="הזזה למטה" ${i === list.length - 1 ? 'disabled' : ''}>${ic('down', 14)}</button><button class="btn ghost icon sm" data-a="pin" data-id="${s.id}" aria-label="הצמדה" title="הצמדה">${ic('star', 14)}</button><button class="btn ghost icon sm" data-a="archive" data-id="${s.id}" aria-label="ארכוב" title="ארכוב">${ic('archive', 14)}</button>`}</div>`).join('') || '<div class="empty"><p>אין תזמונים כאן.</p></div>'}</div>
    <div class="hint" style="margin-top:8px">${ic('info', 12)} הסדר, התיקיות וההצמדה נשמרים ב־Arx בלבד (לרכיב עצמו אין שדה סדר). תגיות נשמרות גם ברכיב ונראות בכרטיס המקורי. במקלדת: Tab לידית הגרירה, Alt+חץ למעלה/למטה.</div>`;
  return `<div class="page">${head}${seg}${L.sel.size ? `<div class="bulkbar"><b>${L.sel.size} נבחרו</b><span class="sp"></span><button class="btn sm" data-a="bulk" data-v="folder">${ic('folder')}העברה לתיקיה</button><button class="btn sm" data-a="bulk" data-v="archive">${ic('archive')}ארכוב</button><button class="btn sm danger" data-a="bulk" data-v="del">${ic('trash')}מחיקה</button></div>` : ''}<div class="two">${nav}<div>${main}</div></div></div>`;
}
function activityView() {
  const res_ = { ok: ['live', 'אושר'], warn: ['warn', 'לא אושר'], skip: ['off', 'דולג'] };
  return `<div class="banner info" style="margin-bottom:10px">${ic('info')}<span>הרשימה נגזרת ממצב ההתקנים לאחר כל הרצה, כי רכיב התזמונים אינו שומר תוצאות. "לא אושר" פירושו שההתקן לא דיווח את השינוי – לא בהכרח שנכשל.</span></div>
   <div class="tbl"><table style="min-width:0"><thead><tr><th>מתי</th><th>תזמון</th><th>פעולה</th><th>תוצאה</th><th class="hide-phone">פירוט</th></tr></thead><tbody>${RUNS.map(r => `<tr><td style="white-space:nowrap">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td><span class="badge ${res_[r[3]][0]}">${res_[r[3]][1]}</span></td><td class="hint hide-phone">${esc(r[4])}</td></tr>`).join('')}</tbody></table></div>`;
}

      <div class="setrow"><div class="tile green">${ic('check')}</div><div class="grow"><div class="t">גשר Arx</div><div class="d">גרסה <span class="ltr">0.3.0</span> (נדרש <span class="ltr">0.3.0</span> ומעלה לכתיבה) · מצומד</div></div></div>
      <div class="setrow"><div class="tile grey">${ic('clock')}</div><div class="grow"><div class="t">סנכרון אחרון</div><div class="d">לפני 12 שניות · ${SCH.length} תזמונים · ${SCH.filter(s => s.ro).length} לקריאה בלבד</div></div></div>

    <div class="card"><h3 style="margin-bottom:8px">מי רשאי מה</h3><table class="rbac"><thead><tr><th>תפקיד</th><th>צפייה</th><th>הרצה</th><th>ניהול</th></tr></thead><tbody>

      <div class="hint" style="margin-top:8px">ניהול = יצירה, עריכה, מחיקה, ארגון. דורש בנוסף הרשאת שליטה בכל התקן של התזמון, ואינו נובע משם התפקיד. הרשאות ניתנות במסך "גישה".</div></div>

<script>
/* ==================================================================================================
   Design notes (the "הערות עיצוב" panel): control -> scheduler component field / service, and the interaction rules
   Marks: V = verified in the component source (see docs/design/CR-014-scheduler.md), U = unverified, P = Arx-only (no component field)
   ================================================================================================== */
const M = { V: '<span class="v">V</span>', U: '<span class="u">U</span>', P: '<span class="p">P</span>' };
const NOTES = {

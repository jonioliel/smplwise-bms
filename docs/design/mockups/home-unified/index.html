/* ====================================================================================================
   Home screen: the unified status card + per-device editing. A mockup only: nothing here is product code.
   Tokens: the glass skin reads the same names as devices-themes.ts (palette "default", light + dark); the flat skin is
   today's light-card look of the product. Every component below reads ONLY the semantic tokens of .frame, so a skin
   (Domus, Tesla, a designer's) is a different token block, never a different widget.
   ==================================================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#dfe4ed;color:#22314c;font-family:"Heebo","Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.mk-dark{background:#15171c}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
svg.ic.fill{fill:currentColor;stroke:none}

/* ---- mockup chrome (not part of the product) ---- */
.mk-bar{position:sticky;top:0;z-index:300;background:#101a2e;color:#e8edf7;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 14px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.mk-bar b{font-weight:700}
.mk-grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mk-grp>span{opacity:.6;margin-inline-end:2px}
.mk-b{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#e8edf7;border-radius:7px;padding:4px 9px;font-size:12px;white-space:nowrap}
.mk-b:hover{background:rgba(255,255,255,.14)}
.mk-b[aria-pressed=true]{background:#2767ed;border-color:#2767ed;color:#fff}
.mk-stage{padding:18px 16px 40px;display:flex;justify-content:center}
.mk-scene{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:nowrap;width:max-content}
.mk-cap{font-size:12.5px;color:#4b5a76;margin:0 2px 8px;max-width:var(--w);line-height:1.5}
body.mk-dark .mk-cap{color:#a6b2c8}
.mk-cap b{color:#22314c}body.mk-dark .mk-cap b{color:#e8edf7}
.mk-col{display:flex;flex-direction:column;--w:390px}
.mk-col.wide{--w:1440px}
.mk-grid{display:grid;gap:22px 28px;grid-template-columns:repeat(3,390px);align-items:start}

/* ---------------------------------------------------------------- tokens */
.frame{
  --font:"Heebo","Segoe UI",-apple-system,"Noto Sans Hebrew",Arial,sans-serif;
  --r-sm:14px;--r-md:22px;--r-lg:28px;
  --ok:#34c759;--ok-soft:rgba(52,199,89,.16);--ok-tx:#1d8a3b;--warn:#ff9f0a;--warn-soft:rgba(255,159,10,.16);--warn-tx:#b36b00;
  --dng:#d70015;--dng-soft:rgba(255,59,48,.13);--neutral:rgba(120,120,128,.14);--off:#8e8e93;
}
/* glass, light (devices-themes.ts palette "default") */
.frame[data-skin=glass]{
  --bd:radial-gradient(1100px 560px at 85% -12%,rgba(255,184,86,.2),transparent 60%),radial-gradient(900px 520px at 8% 112%,rgba(10,132,255,.16),transparent 60%),linear-gradient(180deg,#eef2f9,#e5eaf4);
  --surf:rgba(255,255,255,.64);--surf2:rgba(255,255,255,.5);--surf-solid:#fbfcfe;--blur:blur(28px) saturate(1.7);
  --line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.22);--sh:0 10px 30px rgba(31,45,80,.1),inset 0 1px 0 rgba(255,255,255,.65);--shc:0 1px 4px rgba(0,0,0,.18);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 46%);
  --tx:#1c1c1e;--tx2:#4c4c50;--tx3:#6e6e73;--acc:#007aff;--acc-soft:rgba(0,122,255,.13);--acc-tx:#0062cc;--focus:#007aff;
  --seg:rgba(120,120,128,.14);--seg-thumb:#fff;--shell:rgba(255,255,255,.7);
}
.frame[data-skin=glass][data-scheme=dark]{
  --bd:radial-gradient(1200px 600px at 80% -10%,rgba(255,184,86,.22),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(10,132,255,.25),transparent 60%),#0a0a0c;
  --surf:rgba(28,28,30,.72);--surf2:rgba(44,44,46,.62);--surf-solid:#1c1c1e;
  --line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.24);--sh:0 18px 48px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);--shc:0 1px 4px rgba(0,0,0,.35);
  --sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 50%);
  --tx:#f5f5f7;--tx2:rgba(235,235,245,.72);--tx3:rgba(235,235,245,.56);--acc:#0a84ff;--acc-soft:rgba(10,132,255,.26);--acc-tx:#64d2ff;--focus:#64d2ff;
  --ok:#30d158;--ok-soft:rgba(48,209,88,.2);--ok-tx:#5be07c;--warn-soft:rgba(255,159,10,.2);--warn-tx:#ffb340;--dng:#ff453a;--dng-soft:rgba(255,69,58,.2);--neutral:rgba(142,142,147,.2);
  --seg:rgba(118,118,128,.28);--seg-thumb:rgba(118,118,128,.55);--shell:rgba(28,28,30,.78);
}
/* flat = the light cards of the product today (and a dark twin) */
.frame[data-skin=flat]{
  --bd:#f5f7fb;--surf:#ffffff;--surf2:#f2f5fa;--surf-solid:#fff;--blur:none;--line:#e7ebf2;--line2:#d5dce8;--sh:0 1px 2px rgba(31,45,80,.06);--shc:0 1px 3px rgba(0,0,0,.16);--sheen:none;
  --tx:#22314c;--tx2:#5b6a85;--tx3:#8a97ae;--acc:#2767ed;--acc-soft:#edf3ff;--acc-tx:#2767ed;--focus:#2767ed;--seg:#eef2f8;--seg-thumb:#fff;--shell:#ffffff;
  --r-sm:10px;--r-md:14px;--r-lg:16px;--ok:#22c55e;--dng:#dc2626;
}
.frame[data-skin=flat][data-scheme=dark]{
  --bd:#0f1420;--surf:#1a2130;--surf2:#222b3d;--surf-solid:#1a2130;--line:#2a3447;--line2:#3a465c;--sh:0 1px 2px rgba(0,0,0,.4);
  --tx:#e8edf7;--tx2:#a6b2c8;--tx3:#7e8aa3;--acc:#4d8dff;--acc-soft:rgba(77,141,255,.18);--acc-tx:#8db4ff;--focus:#8db4ff;--seg:#222b3d;--seg-thumb:#2f3a51;--shell:#141a27;
  --ok:#3ddc84;--ok-soft:rgba(61,220,132,.18);--ok-tx:#5be09a;--warn-soft:rgba(255,159,10,.2);--warn-tx:#ffb340;--dng:#ff6b60;--dng-soft:rgba(255,107,96,.18);--neutral:rgba(142,152,175,.18);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.frame[data-skin=glass]{--surf:var(--surf-solid);--blur:none}}
@media (prefers-reduced-transparency:reduce){.frame[data-skin=glass]{--surf:var(--surf-solid);--blur:none}}

/* ---------------------------------------------------------------- frame + shell */
.frame{position:relative;background:var(--bd);color:var(--tx);font-family:var(--font);border-radius:18px;overflow:hidden;box-shadow:0 20px 50px rgba(20,30,55,.22);flex:none}
.frame :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.frame.ph{width:390px;height:844px;display:grid;grid-template-rows:minmax(0,1fr) 66px}
.frame.dk{width:1440px;height:900px;display:grid;grid-template-columns:96px minmax(0,1fr)}
.scroll{overflow:auto;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ph .scroll{padding:12px 16px 20px}
.dk .scroll{padding:16px 40px 20px}
nav.bottom{display:grid;grid-template-columns:repeat(6,1fr);background:var(--shell);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-block-start:1px solid var(--line);position:relative;z-index:6}
nav.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:44px;font-size:11px;font-weight:500;color:var(--tx3);text-decoration:none}
nav.bottom .icp{display:grid;place-items:center;width:50px;height:30px;border-radius:15px;font-size:24px}
nav.bottom a.on{color:var(--acc-tx);font-weight:600}nav.bottom a.on .icp{background:var(--acc-soft);color:var(--acc)}
.avatar{width:27px;height:27px;border-radius:50%;background:var(--neutral);display:grid;place-items:center;font-weight:600;font-size:10px;color:var(--tx2)}
nav.rail{background:var(--shell);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:6px}
.brand{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--acc);color:#fff;font-weight:800;font-size:23px;margin-block-end:8px}
nav.rail a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:80px;min-height:76px;border-radius:14px;font-size:13px;font-weight:500;color:var(--tx2);text-decoration:none;position:relative}

</defs></svg>

<div class="mk-bar" id="bar"></div>
<div class="mk-stage"><div class="mk-scene" id="scene"></div></div>

<script>
/* ======================================================================================== data (the product's demo values) */
const D={time:'16:36',date:'יום חמישי, 1 באוקטובר',dateS:'ה׳ 1 באוקטובר',heb:'ג׳ בחשוון התשפ״ז',hebS:'ג׳ בחשוון',temp:'28°',cond:'מעונן חלקית',hum:'61%',wind:'14 קמ״ש',
 fc:[['ו׳','sun',29,19],['שבת','sun',30,20],['א׳','pc',27,18],['ב׳','rain',24,17],['ג׳','cloud',25,17]],
 parsha:'פרשת נח',candles:'17:34',havd:'18:29'};
const PARTS={
 clock:{n:'שעון'},date:{n:'תאריך'},hebrew:{n:'תאריך עברי'},weather:{n:'מזג אוויר'},forecast:{n:'תחזית 5 ימים'},shabbat:{n:'זמני שבת'},alarm:{n:'אזעקה'}};
const WIDGETS={alarmcard:{n:'כרטיס אזעקה'},quick:{n:'פעולות מהירות'},media:{n:'מולטימדיה'},kpi:{n:'אריחי סיכום'}};
const DAYS={wk:'ראשון–רביעי',thu:'חמישי',sat:'שבת'};

/* the installation's default composition proposed here: the phone keeps the short list, the desktop keeps everything */
const mkBase=()=>({
  parts:[{id:'clock',d:1,p:1},{id:'date',d:1,p:1},{id:'hebrew',d:1,p:1},{id:'weather',d:1,p:1},{id:'forecast',d:1,p:0},{id:'shabbat',d:1,p:0},{id:'alarm',d:1,p:1}],
  w:[{id:'alarmcard',d:0,p:0},{id:'quick',d:1,p:0},{id:'media',d:1,p:0},{id:'kpi',d:1,p:1}],
  unified:{d:1,p:1},shWhen:'auto',shFields:{parsha:1,candles:1,havd:1,holiday:0}
});
const clone=o=>JSON.parse(JSON.stringify(o));
const S={view:'phone',scheme:'light',skin:'glass',day:'thu',scope:'all',pv:'phone',openPart:'',
  src:'ok',wx:'ok',al:'armed',fit:1,
  all:mkBase(),me:null,edDev:'phone'};
S.me=clone(S.all);S.me.parts.find(p=>p.id==='forecast').d=0;S.me.parts.find(p=>p.id==='hebrew').p=0;
const cur=()=>S.scope==='all'?S.all:S.me;

/* ======================================================================================== helpers */
const I=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const WI=(n,c='wi')=>`<svg class="${c}" viewBox="0 0 48 48"><use href="#w-${n}"/></svg>`;
const N=t=>`<span class="n">${t}</span>`;

/* ======================================================================================== the unified card */
function pOn(c,id,dev){const p=c.parts.find(x=>x.id===id);return !!p&&!!(dev==='phone'?p.p:p.d);}
function zoneOrder(c,dev){ // zones in the order of their first enabled part
  const z={time:['clock','date','hebrew'],wx:['weather','forecast'],sh:['shabbat'],al:['alarm']};
  const res=[];
  for(const [k,ids] of Object.entries(z)){
    const idx=c.parts.map((p,i)=>ids.includes(p.id)&&(dev==='phone'?p.p:p.d)?i:-1).filter(i=>i>=0);
    if(idx.length)res.push([k,Math.min(...idx)]);
  }
  return res.sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
}
/* what the Shabbat part shows today (day = the mockup's pretend weekday) */
function shabbat(c,day){
  if(day==='wk'&&c.shWhen==='auto')return null;
  if(day==='wk')return {k:'next',parsha:D.parsha,line:'הדלקת נרות ביום ו׳',t:D.candles,t2:null};
  if(day==='sat')return {k:'sat',parsha:D.parsha,line:'שבת שלום',t:null,t2:D.havd};
  return {k:'wk',parsha:D.parsha,t:D.candles,t2:D.havd};
}
function alarmCls(){return S.al==='armed'?'armed':S.al==='trig'?'trig':'off';}
function alarmTxt(){return S.al==='armed'?['דרוכה (חוץ)','שונה לפני 3 שעות']:S.al==='trig'?['אזעקה!','הופעלה לפני דקה']:['לא דרוכה','שונה לפני 3 שעות'];}

function ucPhone(c,o={}){
  const dev='phone',zs=zoneOrder(c,dev);
  const main=[];let strip='';
  for(const z of zs){
    if(z==='time'){
      const hasT=pOn(c,'clock',dev),hasD=pOn(c,'date',dev),hasH=pOn(c,'hebrew',dev);
      const line=[hasD?`<span>${D.dateS}</span>`:'',hasH?`<span class="hb">${D.hebS}</span>`:''].filter(Boolean).join('');
      main.push(`<div class="z z-time">${hasT?`<div class="tm">${N(D.time)}</div>`:''}${line?`<div class="dl ${hasT?'':'solo'}">${line}</div>`:''}</div>`);
    }else if(z==='wx'){
      if(!pOn(c,'weather',dev))continue;
      if(S.src==='none'){if(o.ghost)main.push(`<div class="z z-wx"><div class="ghost" style="flex-direction:column;gap:2px;padding:7px 10px;white-space:normal;text-align:center;font-size:12px">${I('cloud')}<span>אין מקור</span><b>בחירה</b></div></div>`);continue;}
      if(S.wx==='loading')main.push(`<div class="z z-wx" aria-busy="true"><div class="sk" style="width:38px;height:38px;border-radius:50%"></div><div><div class="sk" style="width:56px;height:26px"></div><div class="sk" style="width:70px;height:11px;margin-top:6px"></div></div></div>`);
      else if(S.wx==='unavail')main.push(`<div class="z z-wx"><div class="wx-off">${I('cloud-off')}<div><div style="font-size:24px;font-weight:700;line-height:1;color:var(--tx3)">${N('--')}</div><div class="wc">אין נתונים</div></div></div></div>`);
      else main.push(`<div class="z z-wx">${WI('pc')}<div><div class="wt">${N(D.temp)}</div><div class="wc">${D.cond}</div></div></div>`);
    }else if(z==='sh'){
      const s=shabbat(c,S.day);
      if(!s)continue;
      const f=c.shFields;
      let h='';
      if(s.k==='next')h=`<span class="it">${I('candle')}<span class="mut">${s.line}</span> <b class="pr">${N(s.t)}</b></span>`;
      else if(s.k==='sat')h=`${f.parsha?`<span class="pr">${s.parsha}</span>`:''}<span class="mut">${s.line}</span><span class="sp"></span><span class="it mo">${I('moon')}<span class="mut">צאת שבת</span> <b class="pr">${N(s.t2)}</b></span>`;
      else h=`${f.parsha?`<span class="pr">${s.parsha}</span><span class="sp"></span>`:''}${f.candles?`<span class="it">${I('candle')}<span class="mut">נרות</span> <b class="pr">${N(s.t)}</b></span>`:''}${f.havd?`<span class="it mo">${I('moon')}<span class="mut">צאת</span> <b class="pr">${N(s.t2)}</b></span>`:''}`;
      strip=`<div class="uc-strip">${h}</div>`;
    }else if(z==='al'){
      const t=alarmTxt();
      main.push(`<div class="z z-al"><button class="al-btn ${alarmCls()}" aria-label="אזעקה: ${t[0]}">${I(S.al==='off'?'shield-off':'shield')}<span class="dot"></span></button></div>`);
    }
  }
  if(!main.length&&!strip)return o.ghost?`<div class="card uc p"><div class="ghost">כרטיס המצב ריק בנייד</div></div>`:'';
  return `<div class="card uc p" data-uc="phone">${main.length?`<div class="uc-main">${main.join('')}</div>`:''}${strip}</div>`;
}

function ucDesk(c,o={}){
  const dev='desktop',zs=zoneOrder(c,dev);
  const out=[];
  for(const z of zs){
    if(z==='time'){
      const hasT=pOn(c,'clock',dev),hasD=pOn(c,'date',dev),hasH=pOn(c,'hebrew',dev);
      out.push(`<div class="z z-time">${hasT?`<div class="tm">${N(D.time)}</div>`:''}${hasD?`<div class="dl ${hasT?'':'solo'}">${D.date} ${N('2026')}</div>`:''}${hasH?`<div class="dl hb ${hasT||hasD?'':'solo'}">${D.heb}</div>`:''}</div>`);
    }else if(z==='wx'){
      if(!pOn(c,'weather',dev))continue;
      if(S.src==='none'){if(o.ghost)out.push(`<div class="z z-wx"><div class="ghost">${I('cloud')} אין מקור למזג אוויר <b>בחירת מקור</b></div></div>`);continue;}
      if(S.wx==='loading'){out.push(`<div class="z z-wx" aria-busy="true"><div class="wx-top"><div class="sk" style="width:62px;height:62px;border-radius:50%"></div><div><div class="sk" style="width:110px;height:48px"></div><div class="sk" style="width:90px;height:14px;margin-top:8px"></div></div></div>${pOn(c,'forecast',dev)?`<div class="fc">${'<div><div class="sk" style="height:12px;width:22px;margin:0 auto"></div><div class="sk" style="height:26px;width:26px;margin:6px auto;border-radius:50%"></div><div class="sk" style="height:12px;width:40px;margin:0 auto"></div></div>'.repeat(5)}</div>`:''}</div>`);continue;}
      if(S.wx==='unavail'){out.push(`<div class="z z-wx"><div class="wx-off">${I('cloud-off')}<div><div style="font-size:40px;font-weight:700;line-height:1">${N('--')}</div><div class="wc">אין נתוני מזג אוויר</div></div></div></div>`);continue;}
      out.push(`<div class="z z-wx"><div class="wx-top">${WI('pc')}<div><div class="wt">${N(D.temp)}</div><div class="wc">${D.cond}</div></div><div class="wm" style="margin-inline-start:auto;flex-direction:column;gap:6px"><span>${I('drop')} ${N(D.hum)} לחות</span><span>${I('wind')} ${N(D.wind)}</span></div></div>${pOn(c,'forecast',dev)?`<div class="fc">${D.fc.map(f=>`<div>${f[0]}${WI(f[1])}<div><span class="hi">${N(f[2]+'°')}</span> <span class="lo">${N(f[3]+'°')}</span></div></div>`).join('')}</div>`:''}</div>`);
    }else if(z==='sh'){
      const s=shabbat(c,S.day);if(!s)continue;const f=c.shFields;
      let h=`${f.parsha?`<div class="ph">${s.parsha}</div>`:''}`;
      if(s.k==='next')h+=`<div class="r">${I('candle')} הדלקת נרות ביום ו׳ <b>${N(s.t)}</b></div>`;
      else if(s.k==='sat')h+=`<div class="r" style="font-size:17px;font-weight:600">שבת שלום</div><div class="r mo">${I('moon')} צאת שבת <b>${N(s.t2)}</b></div>`;
      else h+=`${f.candles?`<div class="r">${I('candle')} הדלקת נרות <b>${N(s.t)}</b></div>`:''}${f.havd?`<div class="r mo">${I('moon')} צאת שבת <b>${N(s.t2)}</b></div>`:''}`;
      out.push(`<div class="z z-sh">${h}</div>`);
    }else if(z==='al'){
      const t=alarmTxt();
      out.push(`<div class="z z-al"><button class="al-btn ${alarmCls()}" aria-label="אזעקה: ${t[0]}">${I(S.al==='off'?'shield-off':'shield')}<span class="dot"></span></button><div><div class="al-t">${t[0]}</div><div class="al-s">${t[1]}</div></div></div>`);
    }
  }
  if(!out.length)return o.ghost?`<div class="card uc d"><div class="ghost" style="margin:auto">כרטיס המצב ריק במחשב</div></div>`:'';
  return `<div class="card uc d" data-uc="desktop">${out.join('')}</div>`;
}

/* ======================================================================================== the home screen content */
const KP=[['bulb','3/9','תאורה דולקת','a'],['bolt','1/3','מתגים פעילים','g'],['layers','3/4','תריסים פתוחים','g'],['snow','1/1','מיזוג פעיל','g'],['play','0/1','מסכים דולקים','b'],['lock','1/1','מנעולים נעולים','g']];
const kpiTile=k=>`<div class="card kpi"><span class="ki ${k[3]}">${I(k[0])}</span><div><div class="kv">${N(k[1])}</div><div class="kl">${k[2]}</div></div></div>`;
const alarmCard=()=>{const t=alarmTxt();return `<div class="card simple"><span class="ci" style="${S.al==='trig'?'background:var(--dng-soft);color:var(--dng)':S.al==='off'?'background:var(--neutral);color:var(--tx3)':''}">${I('shield')}</span><div><div class="s">אזעקה</div><div class="t">${t[0]}</div><div class="s">${t[1]}</div></div></div>`;};
const mediaWide=()=>`<div class="card media wide"><b class="mt">${I('tv')} מולטימדיה<small>8 מסכים · 16 נגנים</small></b><div class="big"><div><strong>${N('5')}</strong>מסכים פעילים</div><div><strong>${N('7')}</strong>נגנים עכשיו</div></div><div class="chips" style="margin:0"><span class="chip"><i></i>טלוויזיה סלון</span><span class="chip"><i></i>טלוויזיה מטבח</span><span class="chip"><i></i>רמקול סלון</span><span class="chip">+9</span></div></div>`;
const mediaCard=()=>`<div class="card media"><div class="h"><b>${I('tv')} מולטימדיה</b><span>8 מסכים · 16 נגנים</span></div><div class="big"><div><strong>${N('5')}</strong>מסכים פעילים</div><div><strong>${N('7')}</strong>נגנים עכשיו</div></div><div class="chips"><span class="chip"><i></i>טלוויזיה סלון</span><span class="chip"><i></i>טלוויזיה מטבח</span><span class="chip">+9</span></div></div>`;
const quickCard=()=>`<div class="card quick"><button class="btn">כבה תאורה בלבד</button><button class="btn">כבה הכל בבניין</button></div>`;
const floorCard=(h,rows)=>`<div class="card fl"><h3>${h}</h3>${rows.map(r=>`<div class="ar"><span class="nm">${r[0]}</span><span class="ct">${r[1]}</span><i class="${r[2]?'':'o'}"></i></div>`).join('')}</div>`;
const FL1=floorCard('קרקע',[['לובי',`${N('1')} ${I('bolt')} ${N('3')} ${I('bulb')} ${N('24.5°')} ${I('snow')}`,1],['מטבח','',0]]);
const FL2=floorCard('קומה 1',[['משרד',`${N('20.5°')} ${I('bolt')}`,1]]);
const treeCard=()=>`<div class="card tree"><div class="tr sel">${I('list')} כל המבנה <span class="c">3 ${I('bulb')}</span></div><div class="tr">קרקע <span class="c">3 ${I('bulb')}</span></div><div class="tr l2">לובי <span class="c">3 ${I('bulb')}</span></div><div class="tr l2">מטבח <span class="c">0 ${I('bulb')}</span></div><div class="tr">קומה 1 <span class="c">0 ${I('bulb')}</span></div><div class="tr l2">משרד <span class="c">0 ${I('bulb')}</span></div></div>`;
const TITLE=`<div class="title-blk"><h1>חשמל והתקנים</h1><p>2 קומות · 3 אזורים · 20 התקנים · נתוני הדגמה</p></div>`;

const bottomNav=(sel='home')=>`<nav class="bottom">${[['home','ראשי'],['shield','אבטחה'],['map','מפה'],['tv','מולטימדיה'],['door','WisKey']].reverse().map(x=>`<a class="${x[0]===sel?'on':''}"><span class="icp">${I(x[0])}</span>${x[1]}</a>`).join('')}<a><span class="icp"><span class="avatar">יו</span></span>יוני</a></nav>`;
const rail=()=>`<nav class="rail"><div class="brand">S</div>${[['home','ראשי',1],['shield','אבטחה'],['map','מפה'],['tv','מולטימדיה'],['door','WisKey']].map(x=>`<a class="${x[2]?'on':''}">${I(x[0])}${x[1]}</a>`).join('')}<div class="grow"></div><a style="min-height:64px"><span class="avatar" style="width:40px;height:40px;font-size:13px">יו</span>יוני</a></nav>`;
const topPhone=`<div class="topbar"><div class="seg"><button aria-pressed="true">מבט על</button><button aria-pressed="false">תזמונים</button></div><span class="card search">${I('search')}</span></div>`;

/* the home of a PHONE, built from a configuration (c) */
function phoneHome(c,o={}){
  const blocks=[];
  if(c.unified.p)blocks.push(ucPhone(c,o));
  for(const w of c.w){
    if(!w.p)continue;
    if(w.id==='alarmcard')blocks.push(alarmCard());
    if(w.id==='quick')blocks.push(quickCard());
    if(w.id==='media')blocks.push(mediaCard());
    if(w.id==='kpi')blocks.push(`<div class="kpis krow">${KP.map(kpiTile).join('')}</div>`);
  }
  blocks.push(FL1,FL2);
  return `${topPhone}${TITLE}<div class="stack" style="margin-block-start:12px">${blocks.join('')}</div>`;
}
function deskHome(c,o={}){
  const band=[];
  if(c.unified.d)band.push(ucDesk(c,o));
  const side=[];
  for(const w of c.w){
    if(!w.d)continue;
    if(w.id==='alarmcard')side.push(alarmCard());
    if(w.id==='quick')side.push(quickCard());
    if(w.id==='media')side.push(mediaWide());
  }
  const kp=c.w.find(w=>w.id==='kpi').d?`<div class="kpis">${KP.map(kpiTile).join('')}</div>`:'';
  return `<div class="topbar" style="margin-block-end:14px"><span class="card search">${I('search')}</span><div class="title-blk" style="flex:1;padding-inline-end:22px">${TITLE.replace('<div class="title-blk">','').replace(/<\/div>$/,'')}</div><div class="seg lg"><button aria-pressed="true">מבט על</button><button aria-pressed="false">תזמונים</button></div></div>
  <div class="stack">${band.join('')}${side.length?`<div style="display:flex;gap:16px;align-items:stretch">${side.join('')}</div>`:''}${kp}
  <div class="dkgrid">${treeCard()}${FL1}${FL2}</div></div>`;
}
const frPhone=(c,o={},extra='')=>`<div class="frame ph" data-skin="${S.skin}" data-scheme="${S.scheme}" ${o.shot?`data-shot="${o.shot}"`:''}><div class="scroll">${phoneHome(c,o)}</div>${bottomNav()}${extra}</div>`;
const frDesk=(c,o={},extra='')=>`<div class="frame dk" data-skin="${S.skin}" data-scheme="${S.scheme}" ${o.shot?`data-shot="${o.shot}"`:''}>${rail()}<div class="scroll">${deskHome(c,o)}</div>${extra}</div>`;

/* ======================================================================================== the editor */
const sw=(on,attrs,diff,label)=>`<button class="sw ${diff?'diff':''}" role="switch" aria-checked="${on?'true':'false'}" aria-label="${label}" ${attrs}><i></i></button>`;
function diffOf(id,kind,flag){ // personal scope: does this switch differ from the installation's?
  if(S.scope!=='me')return false;
  const a=kind==='part'?S.all.parts.find(x=>x.id===id):kind==='w'?S.all.w.find(x=>x.id===id):S.all.unified;
  const b=kind==='part'?S.me.parts.find(x=>x.id===id):kind==='w'?S.me.w.find(x=>x.id===id):S.me.unified;
  return a[flag]!==b[flag];
}
const devHead=`<div class="devh">${I('monitor')}מחשב</div><div class="devh">${I('phone')}נייד</div>`;
function partRow(c,p,i,last,phone){
  const def=PARTS[p.id];
  let sub='';
  if(p.id==='weather')sub=S.src==='none'?`<small>לא נבחר · <b>בחירת מקור</b></small>`:`<small>תחזית הבית</small>`;
  if(p.id==='shabbat')sub=`<small>${c.shWhen==='auto'?'אוטומטי: חמישי עד צאת שבת':'תמיד'}</small>`;
  if(p.id==='forecast')sub='';
  const dim=(!p.d&&!p.p)?'dim':'';
  const ghost=p.id==='weather'&&S.src==='none'?'dim':dim;
  return `<div class="row sub ${ghost}" draggable="true" data-list="parts" data-id="${p.id}">
    <span class="grip" aria-hidden="true">${I('grip','fill')}</span>
    ${phone?'':`<span class="mv"><button data-mv="parts:${p.id}:-1" ${i===0?'disabled':''} aria-label="הקדם">${I('up')}</button><button data-mv="parts:${p.id}:1" ${last?'disabled':''} aria-label="אחר">${I('down')}</button></span>`}
    <span class="nm">${def.n}${sub}</span>
    ${sw(p.d,`data-t="part:${p.id}:d"`,diffOf(p.id,'part','d'),`${def.n}: מחשב`)}${sw(p.p,`data-t="part:${p.id}:p"`,diffOf(p.id,'part','p'),`${def.n}: נייד`)}
  </div>${p.id==='shabbat'&&S.openPart==='shabbat'?shOpts(c):''}`;
}
function shOpts(c){
  const f=c.shFields;
  const ch=(k,l)=>`<button class="chk" aria-pressed="${f[k]?'true':'false'}" data-t="sf:${k}">${f[k]?I('check'):''}${l}</button>`;
  return `<div class="sh-opts"><div><div class="l">מתי להציג</div><div class="seg"><button aria-pressed="${c.shWhen==='auto'}" data-t="shwhen:auto">אוטומטי</button><button aria-pressed="${c.shWhen==='always'}" data-t="shwhen:always">תמיד</button></div></div>
  <div><div class="l">מה להציג</div><div style="display:flex;gap:8px;flex-wrap:wrap">${ch('parsha','פרשה')}${ch('candles','הדלקת נרות')}${ch('havd','צאת שבת')}${ch('holiday','חג')}</div></div></div>`;
}
function matrix(c,phone){
  const parts=c.parts;
  return `<div class="card mx ${phone?'':'dense'}">
    <div class="mx-h"><span class="grow">מה מוצג ובאיזה מכשיר</span>${devHead}</div>
    <div class="row first" style="min-height:60px"><span class="grip" style="visibility:hidden"></span><span class="nm" style="font-size:16px">כרטיס מצב<small>שעון, מזג אוויר, שבת ואזעקה בכרטיס אחד</small></span>${sw(c.unified.d,'data-t="u:d"',diffOf('u','u','d'),'כרטיס מצב: מחשב')}${sw(c.unified.p,'data-t="u:p"',diffOf('u','u','p'),'כרטיס מצב: נייד')}</div>
    ${parts.map((p,i)=>partRow(c,p,i,i===parts.length-1,phone)).join('')}
    <div class="sec-t">כרטיסים נוספים</div>
    ${c.w.map((w,i)=>`<div class="row ${i===0?'first':''}" draggable="true" data-list="w" data-id="${w.id}"><span class="grip" aria-hidden="true">${I('grip','fill')}</span>${phone?'':`<span class="mv"><button data-mv="w:${w.id}:-1" ${i===0?'disabled':''} aria-label="הקדם">${I('up')}</button><button data-mv="w:${w.id}:1" ${i===c.w.length-1?'disabled':''} aria-label="אחר">${I('down')}</button></span>`}<span class="nm">${WIDGETS[w.id].n}</span>${sw(w.d,`data-t="w:${w.id}:d"`,diffOf(w.id,'w','d'),`${WIDGETS[w.id].n}: מחשב`)}${sw(w.p,`data-t="w:${w.id}:p"`,diffOf(w.id,'w','p'),`${WIDGETS[w.id].n}: נייד`)}</div>`).join('')}
    <div class="row"><span class="grip" style="visibility:hidden"></span><span class="nm">קומות<small>בכל מכשיר</small></span><span class="lock">${I('lock')} תמיד מוצג</span></div>
    ${phone?`<div class="ed-foot">${resetBtn()}</div>`:''}
  </div>`;
}
const resetBtn=()=>`<button class="btn ghost" data-t="reset">${I('reset')} ${S.scope==='me'?'אפס להגדרת כולם':'אפס לברירת מחדל'}</button>`;
const scopeSeg=()=>`<div class="seg lg" role="radiogroup" aria-label="עבור מי"><button role="radio" aria-checked="${S.scope==='all'}" data-t="scope:all">לכולם</button><button role="radio" aria-checked="${S.scope==='me'}" data-t="scope:me">רק אני</button></div>`;
const pvSeg=()=>`<div class="seg lg" role="radiogroup" aria-label="תצוגה מקדימה"><button role="radio" aria-checked="${S.pv==='desktop'}" data-t="pv:desktop">${I('monitor')} מחשב</button><button role="radio" aria-checked="${S.pv==='phone'}" data-t="pv:phone">${I('phone')} נייד</button></div>`;
const scheme=()=>`data-skin="${S.skin}" data-scheme="${S.scheme}"`;

function previewPane(c){
  if(S.pv==='phone')return `<div class="prev-box" style="width:312px;height:675px;border-radius:30px;clip-path:inset(0 round 30px);box-shadow:0 0 0 7px #0c0f16,0 0 0 8px rgba(255,255,255,.2)"><div style="zoom:.8;width:390px">${frPhone(c,{ghost:1})}</div></div>`;
  return `<div class="prev-box" style="width:700px;height:444px;clip-path:inset(0 round 18px);box-shadow:0 0 0 1px var(--line)"><div style="zoom:.486;width:1440px">${frDesk(c,{ghost:1})}</div></div>`;
}
function edDesk(){
  const c=cur();
  return `<div class="frame dk" ${scheme()} data-shot="edit-desktop">${rail()}<div class="scroll">
   <div class="ed-top"><h2>עריכת המסך הראשי</h2>${scopeSeg()}${S.scope==='me'?`<span class="badge">${I('user')} שינויים אישיים</span>`:''}<span class="grow"></span>${resetBtn()}<button class="btn">ביטול</button><button class="btn pri">${I('check')} שמירה</button></div>
   <div class="ed-grid"><div>${matrix(c,false)}</div><div class="prev">${pvSeg()}${previewPane(c)}</div></div>
  </div></div>`;
}
function edPhone(){
  const c=cur();
  const pv=S.pv==='phone'?ucPhone(c,{ghost:1})||`<div class="card uc p"><div class="ghost">אין כרטיס מצב בנייד</div></div>`:`<div style="overflow-x:auto;scrollbar-width:none;border-radius:16px"><div style="zoom:.5;width:1300px">${ucDesk(c,{ghost:1})||''}</div></div>`;
  return `<div class="frame ph" ${scheme()} data-shot="edit-phone" style="grid-template-rows:minmax(0,1fr)"><div class="scroll" style="padding:0 0 20px">
    <div style="position:sticky;top:0;z-index:5;background:var(--surf-solid);padding:10px 16px 12px;border-block-end:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:8px;margin-block-end:10px"><button class="ibtn" aria-label="סגירה">${I('x')}</button><b style="font-size:17px;flex:1">עריכת המסך הראשי</b><button class="btn pri" style="min-height:40px;padding:0 16px">שמירה</button></div>
      <div style="display:flex;gap:8px;align-items:center;margin-block-end:10px">${scopeSeg().replace('seg lg','seg lg" style="flex:1').replace(/<button role/g,'<button style="flex:1;justify-content:center" role')}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-block-end:8px"><span style="font-size:12.5px;color:var(--tx3);font-weight:600;flex:1">תצוגה מקדימה</span>${pvSeg().replace('seg lg','seg')}</div>
      ${pv}
    </div>
    <div style="padding:12px 16px 0">${matrix(c,true)}</div></div></div>`;
}

/* ======================================================================================== the views */
function setBody(){document.body.classList.toggle('mk-dark',S.scheme==='dark');}
const cap=(t,w='390px')=>`<div class="mk-cap" style="--w:${w}">${t}</div>`;
function pconf(kind){ // the three phone variants of the unified card, from the installation's phone list
  const c=clone(S.all);const on=(id,v)=>c.parts.find(p=>p.id===id).p=v?1:0;
  on('clock',1);on('date',1);on('hebrew',kind==='B'?1:0);on('weather',1);on('shabbat',kind==='B');on('alarm',kind==='C');
  if(kind==='A')on('hebrew',0);
  c.w.forEach(w=>w.p=w.id==='kpi'?1:0);
  return c;
}

   return `<div class="mk-col wide">${cap('<b>עריכת המסך הראשי במחשב.</b> שני מתגים לכל פריט, מחשב ונייד; גרירה משנה סדר; התצוגה המקדימה מתחלפת בין מחשב לנייד. אפשר ללחוץ על הכל.','1440px')}${edDesk()}</div>
   <div class="mk-col">${cap('<b>אותה עריכה בנייד.</b> התצוגה המקדימה נשארת צמודה למעלה.')}${edPhone()}</div>`;
 },
 states(){
   const saved={src:S.src,wx:S.wx,al:S.al,day:S.day};
   const cell=(label,set,build)=>{Object.assign(S,saved,set);const h=build();Object.assign(S,saved);return `<div class="mk-col">${cap(label)}<div class="frame ph" ${scheme()} data-shot="state" style="height:auto;display:block;padding:14px 16px 16px;border-radius:22px"><div class="stack">${h}</div></div></div>`;};
   const base=pconf('B');
   const ph=(c,o)=>ucPhone(c,Object.assign({ghost:0},o));
   const noShab=clone(base);
   const cells=[
    cell('<b>הכל תקין</b> (חמישי)',{day:'thu',src:'ok',wx:'ok'},()=>ph(base)),
    cell('<b>שבת, יום חול, אוטומטי:</b> אין שורת שבת, הכרטיס נשאר שורה אחת',{day:'wk'},()=>ph(base)),
    cell('<b>שבת, יום חול, "תמיד":</b> הדלקת הנרות הקרובה',{day:'wk'},()=>{const c=clone(base);c.shWhen='always';return ph(c);}),
    cell('<b>בשבת:</b> שבת שלום + צאת שבת',{day:'sat'},()=>ph(base)),
    cell('<b>אין מקור למזג אוויר</b> (משתמש רגיל): החלק פשוט לא מופיע',{src:'none'},()=>ph(base)),
    cell('<b>אין מקור</b> (בעריכה, מנהל): מסגרת מקווקוות עם קישור',{src:'none'},()=>ph(base,{ghost:1})),
    cell('<b>טוען:</b> השעון חי, מזג האוויר שלד',{wx:'loading'},()=>ph(base)),
    cell('<b>מזג אוויר לא זמין:</b> "--" בצבע מושתק',{wx:'unavail'},()=>ph(base)),
    cell('<b>אזעקה מופעלת:</b> כפתור אדום פועם',{al:'trig'},()=>ph(pconf('C'))),
   ];
   return `<div class="mk-grid">${cells.join('')}</div>`;
 },
 entry(){return '';}
};
const VIEW_LABEL={now:'היום מול חדש',phone:'נייד: שלושה וריאנטים',desktop:'מחשב',edit:'עריכה',states:'מצבים'};

function bar(){
  const g=(label,key,opts)=>`<div class="mk-grp"><span>${label}</span>${opts.map(o=>`<button class="mk-b" aria-pressed="${S[key]===o[0]}" data-k="${key}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`;
  return `<b>Arx · כרטיס מצב מאוחד</b>${g('מסך','view',Object.entries(VIEW_LABEL))}${g('תצוגה','scheme',[['light','בהיר'],['dark','כהה']])}${g('עיצוב','skin',[['glass','זכוכית'],['flat','שטוח (כמו היום)']])}${g('היום','day',Object.entries(DAYS))}${g('מזג אוויר','src',[['ok','יש מקור'],['none','אין מקור']])}${g('נתונים','wx',[['ok','תקין'],['loading','טוען'],['unavail','לא זמין']])}${g('אזעקה','al',[['armed','דרוכה'],['off','לא דרוכה'],['trig','מופעלת']])}`;
}
function fit(){
  const sc=document.getElementById('scene');sc.style.zoom=1;
  if(!S.fit)return;
  const w=sc.scrollWidth,avail=innerWidth-32;
  if(w>avail)sc.style.zoom=Math.max(.3,avail/w);
}
function render(){
  setBody();
  document.getElementById('bar').innerHTML=bar();
  document.getElementById('scene').innerHTML=views[S.view]();
  fit();
}
/* ---- interaction ---- */
function toggleT(t){
  const [k,a,b]=t.split(':'),c=cur();
  if(k==='part'){const p=c.parts.find(x=>x.id===a);p[b]=p[b]?0:1;}
  else if(k==='w'){const p=c.w.find(x=>x.id===a);p[b]=p[b]?0:1;}
  else if(k==='u'){c.unified[a]=c.unified[a]?0:1;}
  else if(k==='scope'){S.scope=a;}
  else if(k==='pv'){S.pv=a;}
  else if(k==='shwhen'){c.shWhen=a;}
  else if(k==='sf'){c.shFields[a]=c.shFields[a]?0:1;}
  else if(k==='reset'){if(S.scope==='me')S.me=clone(S.all);else{const n=mkBase();S.all=n;}}
}
function move(list,id,dir){
  const c=cur(),arr=list==='parts'?c.parts:c.w,i=arr.findIndex(x=>x.id===id),j=i+dir;
  if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];
}
let dragId=null,dragList=null;
document.addEventListener('click',e=>{
  const bb=e.target.closest('[data-k]');
  if(bb){S[bb.dataset.k]=bb.dataset.v;if(bb.dataset.k==='src'||bb.dataset.k==='wx'||bb.dataset.k==='day'||bb.dataset.k==='al'){}render();return;}
  const mv=e.target.closest('[data-mv]');
  if(mv){const [l,id,d]=mv.dataset.mv.split(':');move(l,id,+d);render();return;}
  const t=e.target.closest('[data-t]');
  if(t){toggleT(t.dataset.t);render();return;}
  const row=e.target.closest('.row[data-id="shabbat"] .nm');
  if(row){S.openPart=S.openPart==='shabbat'?'':'shabbat';render();}
});
document.addEventListener('dragstart',e=>{const r=e.target.closest('[data-list]');if(!r)return;dragId=r.dataset.id;dragList=r.dataset.list;r.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragover',e=>{const r=e.target.closest('[data-list]');if(!r||!dragId||r.dataset.list!==dragList)return;e.preventDefault();document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));r.classList.add('over');});
document.addEventListener('drop',e=>{const r=e.target.closest('[data-list]');if(!r||!dragId||r.dataset.list!==dragList)return;e.preventDefault();const c=cur(),arr=dragList==='parts'?c.parts:c.w;const from=arr.findIndex(x=>x.id===dragId),to=arr.findIndex(x=>x.id===r.dataset.id);if(from>=0&&to>=0){const [it]=arr.splice(from,1);arr.splice(to,0,it);}dragId=null;render();});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over'));});
addEventListener('resize',fit);
window.__set=o=>{Object.assign(S,o);render();};
const q=new URLSearchParams(location.search);
for(const [k,v] of q)if(k in S)S[k]=k==='fit'?+v:v;
render();
</script>

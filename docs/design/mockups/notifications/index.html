/* ====================================================================================================
   CR-018 notifications mockup. Same layer model as the approved multimedia mockup (docs/design/mockups/media):
   0. the shell (rail, bottom bar, floating corner, user menu) = design A of tokens.css, LIGHT ONLY, never themed;
   1. the glass knobs: every `--dv-*` is the palette "default" of devices-themes.ts (light, dark on
      data-devices-scheme="dark", phone sizes); knobs marked PROPOSED are the notification additions;
   2. element rules reading ONLY knobs (plus 1-8 px structural literals);
   3. fallback: no backdrop-filter / prefers-reduced-transparency -> solid surfaces.
   The lock-screen stage is NOT the product: it shows how the push looks on a phone.
   ==================================================================================================== */
.frame{
  --sw-bg:#f5f7fb; --sw-surface:#ffffff; --sw-surface-3:#eef2f8; --sw-border:#e7ebf2;
  --sw-text:#22314c; --sw-heading:#1e2e47; --sw-text-2:#5b6a85; --sw-text-3:#8a97ae;
  --sw-accent:#2767ed; --sw-accent-soft:#edf3ff; --sw-accent-text:#2767ed; --sw-focus:#2767ed; --sw-live:#22c55e; --sw-danger:#dc2626;
  --sw-font:"Heebo","Segoe UI",-apple-system,BlinkMacSystemFont,"Noto Sans Hebrew",Roboto,Arial,sans-serif;
  --sw-font-mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
}
.frame[data-devices-style=glass]{
  --dv-color-scheme:light;
  --dv-backdrop:radial-gradient(1100px 560px at 85% -12%,rgba(255,184,86,.2),transparent 60%),radial-gradient(900px 520px at 8% 112%,rgba(10,132,255,.16),transparent 60%),linear-gradient(180deg,#eef2f9,#e5eaf4);
  --dv-surface:rgba(255,255,255,.64); --dv-surface-2:rgba(255,255,255,.5); --dv-surface-3:rgba(120,120,128,.14);
  --dv-surface-solid:#fbfcfe; --dv-surface-2-solid:#f2f5fa; --dv-surface-blur:blur(28px) saturate(1.7);
  --dv-border:rgba(60,60,67,.12); --dv-border-strong:rgba(60,60,67,.22); --dv-overlay:rgba(15,23,42,.38);
  --dv-font:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI','Noto Sans Hebrew','Heebo',Roboto,Arial,sans-serif;
  --dv-text:#1c1c1e; --dv-text-2:#4c4c50; --dv-text-3:#6e6e73;
  --dv-accent:#007aff; --dv-accent-hover:#0066d6; --dv-accent-soft:rgba(0,122,255,.13); --dv-accent-text:#0062cc; --dv-focus:#007aff;
  --dv-success:#34c759; --dv-success-soft:rgba(52,199,89,.16); --dv-warning:#ff9f0a; --dv-warning-soft:rgba(255,159,10,.16);
  --dv-danger:#d70015; --dv-danger-soft:rgba(255,59,48,.13); --dv-neutral-soft:rgba(120,120,128,.14); --dv-offline:#8e8e93;
  --dv-radius-sm:14px; --dv-radius-md:22px; --dv-radius-lg:28px; --dv-radius-control:999px;
  --dv-shadow-1:0 10px 30px rgba(31,45,80,.1),inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-2:0 18px 44px rgba(31,45,80,.16),inset 0 1px 0 rgba(255,255,255,.65);
  --dv-shadow-3:0 24px 64px rgba(15,23,42,.26); --dv-shadow-control:0 1px 4px rgba(0,0,0,.18);
  --dv-icon-ring-size:36px; --dv-icon-ring-size-lg:40px; --dv-icon-ring-bg:rgba(120,120,128,.14); --dv-icon-ring-fg:#1c1c1e;
  --dv-toggle-on:#34c759;
  --dv-fs-title:16px; --dv-fs-item-name:12.5px; --dv-fw-title:700;
  --dv-gap-lg:18px; --dv-gap:14px; --dv-gap-sm:10px; --dv-card-pad-block:18px; --dv-card-pad-inline:20px;
  --dv-item-pad-block:12px; --dv-item-pad-inline:14px; --dv-item-min-block:64px; --dv-hover-lift:-2px;
  /* PROPOSED (media mockup) */
  --dv-surface-sheen:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 46%);
  --dv-accent-glow:rgba(0,122,255,.3); --dv-text-inverse:#ffffff;
  --dv-fs-page-title:44px; --dv-fs-page-title-compact:24px;
  --dv-sheet-surface:rgba(248,250,253,.86); --dv-sheet-blur:blur(40px) saturate(1.8); --dv-sheet-w:480px;
  --dv-seg-thumb:#ffffff; --dv-motion:240ms; --dv-ease:cubic-bezier(.22,1,.36,1);
  /* PROPOSED (notifications) */
  --dv-sev-info:#8e8e93; --dv-sev-alert:#ff9f0a; --dv-sev-critical:#d70015;
  --dv-sev-info-soft:rgba(142,142,147,.16); --dv-sev-alert-soft:rgba(255,159,10,.16); --dv-sev-critical-soft:rgba(255,59,48,.14);
  --dv-critical-glow:rgba(215,0,21,.22); --dv-unread-dot:#007aff;
  --dv-row-min:72px; --dv-pin-bg:linear-gradient(180deg,rgba(255,59,48,.08),rgba(255,59,48,.02));
  --dv-timeline-line:rgba(60,60,67,.18); --dv-matrix-head:rgba(120,120,128,.08);
}
.frame[data-devices-style=glass][data-devices-scheme=dark]{
  --dv-color-scheme:dark;
  --dv-backdrop:radial-gradient(1200px 600px at 80% -10%,rgba(255,184,86,.22),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(10,132,255,.25),transparent 60%),#0a0a0c;
  --dv-surface:rgba(28,28,30,.72); --dv-surface-2:rgba(44,44,46,.62); --dv-surface-3:rgba(235,235,245,.14);
  --dv-surface-solid:#1c1c1e; --dv-surface-2-solid:#2c2c2e;
  --dv-border:rgba(255,255,255,.13); --dv-border-strong:rgba(255,255,255,.24); --dv-overlay:rgba(0,0,0,.55);
  --dv-text:#f5f5f7; --dv-text-2:rgba(235,235,245,.72); --dv-text-3:rgba(235,235,245,.56);
  --dv-accent:#0a84ff; --dv-accent-hover:#409cff; --dv-accent-soft:rgba(10,132,255,.26); --dv-accent-text:#64d2ff; --dv-focus:#64d2ff;
  --dv-success:#30d158; --dv-success-soft:rgba(48,209,88,.2); --dv-warning-soft:rgba(255,159,10,.2);
  --dv-danger:#ff453a; --dv-danger-soft:rgba(255,69,58,.2); --dv-neutral-soft:rgba(142,142,147,.2);
  --dv-shadow-1:0 18px 48px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08);
  --dv-shadow-2:0 22px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
  --dv-shadow-3:0 26px 70px rgba(0,0,0,.6); --dv-shadow-control:0 1px 4px rgba(0,0,0,.35);
  --dv-icon-ring-bg:rgba(235,235,245,.12); --dv-icon-ring-fg:#f5f5f7; --dv-toggle-on:#30d158;
  --dv-surface-sheen:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 50%);
  --dv-accent-glow:rgba(10,132,255,.45); --dv-text-inverse:#1c1c1e;
  --dv-sheet-surface:rgba(22,22,25,.86); --dv-seg-thumb:rgba(118,118,128,.5);
  --dv-sev-info:#98989d; --dv-sev-alert:#ffb340; --dv-sev-critical:#ff453a;
  --dv-sev-info-soft:rgba(152,152,157,.2); --dv-sev-alert-soft:rgba(255,179,64,.2); --dv-sev-critical-soft:rgba(255,69,58,.22);
  --dv-critical-glow:rgba(255,69,58,.3); --dv-unread-dot:#0a84ff;
  --dv-pin-bg:linear-gradient(180deg,rgba(255,69,58,.14),rgba(255,69,58,.03));
  --dv-timeline-line:rgba(255,255,255,.2); --dv-matrix-head:rgba(255,255,255,.05);
}
.frame.dev-phone[data-devices-style=glass]{--dv-gap:10px;--dv-gap-lg:12px;--dv-card-pad-block:14px;--dv-card-pad-inline:14px;--dv-fs-page-title:32px;--dv-fs-page-title-compact:20px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .frame[data-devices-style=glass]{--dv-surface:var(--dv-surface-solid);--dv-surface-2:var(--dv-surface-2-solid);--dv-surface-blur:none;--dv-sheet-surface:var(--dv-surface-solid);--dv-sheet-blur:none}
}
@media (prefers-reduced-transparency:reduce){
  .frame[data-devices-style=glass]{--dv-surface:var(--dv-surface-solid);--dv-surface-2:var(--dv-surface-2-solid);--dv-surface-blur:none;--dv-sheet-surface:var(--dv-surface-solid);--dv-sheet-blur:none}
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#dfe4ed;color:#22314c;font-family:"Heebo","Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------------------------------------------------------- 0. the shell (light only) */
.frame{position:relative;background:var(--sw-bg);border-radius:16px;box-shadow:0 20px 50px rgba(20,30,55,.22);overflow:hidden;display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-areas:'rail main';font-size:14px;color:var(--sw-text);font-family:var(--sw-font);

/* ---------------------------------------------------------------- 2. the glass area */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding-inline:18px;border-radius:var(--dv-radius-control);border:1px solid var(--dv-border);background:var(--dv-surface-sheen),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);color:var(--dv-text);font-size:13.5px;font-weight:600;line-height:1;white-space:nowrap;box-shadow:var(--dv-shadow-control);transition:background var(--dv-motion) var(--dv-ease),transform 120ms var(--dv-ease)}

.seg{display:inline-flex;align-items:center;gap:2px;background:var(--dv-surface-3);border-radius:var(--dv-radius-control);padding:3px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:var(--dv-radius-control);padding:6px 16px;font-size:13px;font-weight:600;color:var(--dv-text);min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background var(--dv-motion) var(--dv-ease),color var(--dv-motion)}

.dh{position:sticky;top:0;z-index:15;margin-inline:-36px;padding:16px 36px 6px;padding-inline-end:96px;display:flex;flex-direction:column;gap:12px}
.dh.flat{position:static}
.dev-phone .dh{margin-inline:-14px;padding:12px 14px 4px;padding-inline-end:86px;gap:10px}
.dh-row{display:flex;align-items:center;gap:12px 18px;min-width:0;flex-wrap:wrap}
.dh h1{margin:0;font-size:var(--dv-fs-page-title);font-weight:700;letter-spacing:-.035em;line-height:1.04;flex:none}
.dh .crumb{font-size:14px;color:var(--dv-text-2);display:flex;align-items:center;gap:6px}
.dh .crumb .ic{font-size:14px}
.dh .back{width:44px;height:44px;border-radius:50%;border:1px solid var(--dv-border);background:var(--dv-surface-sheen),var(--dv-surface);-webkit-backdrop-filter:var(--dv-surface-blur);backdrop-filter:var(--dv-surface-blur);display:grid;place-items:center;color:var(--dv-text);flex:none;box-shadow:var(--dv-shadow-control)}
.dh .back .ic{font-size:18px}

/* ---------------------------------------------------------------- home behind the sheet */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--dv-gap-lg)}
.dev-phone .hgrid{grid-template-columns:1fr}
.hcard{padding:var(--dv-card-pad-block) var(--dv-card-pad-inline);display:flex;flex-direction:column;gap:10px;min-height:150px}
.hcard h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em}
.hcard .hl{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dv-text-2)}
.hcard .hl .ring{width:var(--dv-icon-ring-size);height:var(--dv-icon-ring-size);border-radius:50%;background:var(--dv-icon-ring-bg);color:var(--dv-icon-ring-fg);display:grid;place-items:center;font-size:17px}
.hcard .hl b{color:var(--dv-text);font-weight:600}
.rooms{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.rooms::-webkit-scrollbar{display:none}

/* ---------------------------------------------------------------- the notification center sheet */
.nsheet{position:absolute;z-index:58;inset-block:12px;inset-inline-start:calc(var(--rail-w) + 12px);width:var(--dv-sheet-w);background:var(--dv-surface-sheen),var(--dv-sheet-surface);-webkit-backdrop-filter:var(--dv-sheet-blur);backdrop-filter:var(--dv-sheet-blur);border:1px solid var(--dv-border);border-radius:var(--dv-radius-lg);box-shadow:var(--dv-shadow-3);display:flex;flex-direction:column;overflow:hidden;isolation:isolate;color:var(--dv-text);font-family:var(--dv-font)}
.nsheet.enter{animation:rin 300ms var(--dv-ease)}
@keyframes rin{from{transform:translateX(32px);opacity:0}}
@keyframes rup{from{transform:translateY(56px);opacity:0}}
.dev-phone .nsheet{inset:auto 0 0 0;width:auto;height:calc(100% - 20px);border-radius:28px 28px 0 0;border-bottom:0;z-index:80}
.dev-phone .nsheet.enter{animation-name:rup}
.dev-phone .scrim.soft{z-index:79}
.grab{display:none;width:40px;height:5px;border-radius:3px;background:var(--dv-border-strong);margin:8px auto 0;flex:none}
.dev-phone .grab{display:block}
.nh{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;flex:none}
.dev-phone .nh{padding:8px 16px 8px}
.nh .tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.nh h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.nh h3 .cnt{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--dv-accent);color:#fff;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.nh small{font-size:12.5px;color:var(--dv-text-2)}
.nh .x{width:44px;height:44px;border-radius:50%;border:0;background:var(--dv-surface-3);display:grid;place-items:center;color:var(--dv-text);flex:none}
.nh .x .ic{font-size:17px}
.nbars{display:flex;flex-direction:column;gap:8px;padding:0 16px 8px;flex:none}
.nfilt{display:flex;align-items:center;gap:8px;padding:4px 16px 12px;flex:none;overflow-x:auto;scrollbar-width:none}
.nfilt::-webkit-scrollbar{display:none}
.nfilt .seg{flex:none}
.srcbtn{position:relative;flex:none}
.srcbtn .rc{height:44px}
.srcbtn .rc .ic:last-child{font-size:14px;transition:transform var(--dv-motion) var(--dv-ease)}
.srcbtn .rc[aria-expanded=true] .ic:last-child{transform:rotate(180deg)}
.srcbtn .pop{inset-block-start:calc(100% + 6px);inset-inline-end:0;min-width:250px}
.nbody{flex:1;overflow:auto;padding:0 10px 18px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;overscroll-behavior:contain}
.nbody>*{flex-shrink:0}
.gh{display:flex;align-items:center;gap:8px;padding:14px 10px 6px;font-size:12.5px;font-weight:600;color:var(--dv-text-3);letter-spacing:.02em}
.gh:first-child{padding-top:4px}
.gh i{flex:1;height:1px;background:var(--dv-border)}
.gh.pin{color:var(--dv-sev-critical)}
.nrow{position:relative;display:grid;grid-template-columns:4px var(--dv-icon-ring-size-lg) minmax(0,1fr) auto;gap:0 12px;align-items:center;min-height:var(--dv-row-min);padding:10px 12px 10px 8px;padding-inline:10px 8px;border-radius:18px;border:1px solid transparent;background:transparent;text-align:start;width:100%;color:var(--dv-text);transition:background var(--dv-motion),border-color var(--dv-motion)}
.nrow:hover{background:var(--dv-surface-2);border-color:var(--dv-border)}
.nrow.sel{background:var(--dv-surface);border-color:var(--dv-border-strong);box-shadow:var(--dv-shadow-control)}
.nrow .bar{width:4px;height:calc(100% - 8px);border-radius:4px;background:var(--sev)}
.nrow .ring{width:var(--dv-icon-ring-size-lg);height:var(--dv-icon-ring-size-lg);border-radius:50%;display:grid;place-items:center;background:var(--sev-soft);color:var(--sev);font-size:19px;position:relative}
.nrow .ring .cnt{position:absolute;display:grid;inset-block-end:-4px;inset-inline-start:-6px;min-width:22px;height:20px;padding:0 5px;border-radius:10px;background:var(--dv-text);color:var(--dv-text-inverse);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;border:2px solid var(--dv-sheet-surface)}
.nrow .tx{min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.3}
.nrow .tx b{font-size:14.5px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
.nrow .tx b .ud{width:8px;height:8px;border-radius:50%;background:var(--dv-unread-dot);flex:none;box-shadow:0 0 0 3px var(--dv-accent-soft)}
.nrow.read .tx b{font-weight:500}
.nrow .tx small{font-size:12.5px;color:var(--dv-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.nrow .tx small .sep{opacity:.5}
.nrow .tx small .st{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.nrow .tx small .st.ack{color:var(--dv-success)}
.nrow .tx small .st.res{color:var(--dv-text-3)}
.nrow .tx small .st.snz{color:var(--dv-accent-text)}
.nrow .tx small .st.fail{color:var(--dv-danger)}
.nrow .tx small .st .ic{font-size:13px}
.nrow .more{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--dv-text-3);opacity:0;transition:opacity var(--dv-motion)}
.nrow:hover .more,.nrow.sel .more,.nrow.pop-open .more,.dev-phone .nrow .more{opacity:1}
.nrow .more:hover{background:var(--dv-surface-3);color:var(--dv-text)}
.nrow.pop-open{z-index:20}
.nrow .pop{inset-block-start:calc(100% - 8px);inset-inline-end:8px}
.nrow.crit.open{background:var(--dv-pin-bg);border-color:color-mix(in srgb,var(--dv-sev-critical) 30%,transparent)}
.nrow.crit.open:hover{border-color:color-mix(in srgb,var(--dv-sev-critical) 45%,transparent)}
.nrow.crit.open .ring{box-shadow:0 0 0 4px var(--dv-sev-critical-soft),0 8px 20px var(--dv-critical-glow)}
.nrow.snz .ring,.nrow.res .ring{opacity:.6}
.nfoot{display:flex;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--dv-border);flex:none}
.dev-phone .nfoot{padding-bottom:16px}
.nfoot .btn{flex:1}

/* detail */
.ndet{flex:1;overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.ndet>*{flex-shrink:0}
.dhead{display:flex;align-items:flex-start;gap:14px;padding:4px 2px 0}
.dhead .ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sev-soft);color:var(--sev);font-size:25px;flex:none}
.dhead.crit .ring{box-shadow:0 0 0 5px var(--dv-sev-critical-soft),0 10px 26px var(--dv-critical-glow)}
.dhead .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dhead h4{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.dhead .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12.5px;color:var(--dv-text-2)}
.dhead .meta .sevtag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;background:var(--sev-soft);color:var(--sev);font-weight:700;font-size:11.5px}
.dcard{padding:14px 16px;display:flex;flex-direction:column;gap:12px;border-radius:20px}
.dcard .kv{display:grid;grid-template-columns:80px minmax(0,1fr);gap:4px 12px;align-items:baseline;font-size:13.5px}
.dcard .kv .k{color:var(--dv-text-3);font-size:12.5px;font-weight:600}
.dcard .kv .v{color:var(--dv-text);min-width:0}
.dcard .kv .v b{font-weight:600}
.dcard .kv .v .lnk{all:unset;cursor:pointer;color:var(--dv-accent-text);font-weight:600;display:inline-flex;align-items:center;gap:4px;border-radius:6px;min-height:28px}
.dcard .kv .v .lnk .ic{font-size:14px}
.dacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dacts .btn.span2{grid-column:1 / -1}
.snap{position:relative;height:150px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 70% 30%,#3b4660,#141a28 70%);color:#fff;display:grid;place-items:center;border:1px solid var(--dv-border)}
.snap::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 12px,transparent 12px 24px)}
.snap .ctr{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.8)}
.snap .ctr .ic{font-size:28px;stroke-width:1.5}
.snap .pil{position:absolute;inset-block-start:10px;inset-inline-start:10px;height:24px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16)}
.dline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dv-text-2);padding:0 4px}
.dline .ic{font-size:15px;color:var(--dv-success)}
.dline.bad .ic{color:var(--dv-danger)}.dline.bad{color:var(--dv-danger);font-weight:600}
.dline.held .ic{color:var(--dv-accent)}
.tl{display:flex;flex-direction:column;gap:0;padding:2px 4px}
.tl .ev{display:grid;grid-template-columns:52px 20px minmax(0,1fr);gap:0 10px;align-items:start;min-height:46px;position:relative}
.tl .ev .t{font-size:12.5px;color:var(--dv-text-3);font-variant-numeric:tabular-nums;padding-top:2px;text-align:end;direction:ltr}
.tl .ev .d{position:relative;display:flex;justify-content:center;padding-top:5px}
.tl .ev .d i{width:12px;height:12px;border-radius:50%;background:var(--dv-text-3);border:2px solid var(--dv-sheet-surface);box-shadow:0 0 0 2px var(--dv-timeline-line);z-index:1}
.tl .ev .d::after{content:'';position:absolute;top:17px;bottom:-5px;width:2px;background:var(--dv-timeline-line)}
.tl .ev:last-child .d::after{display:none}
.tl .ev.esc .d i{background:var(--dv-sev-critical)}
.tl .ev.ack .d i{background:var(--dv-success)}
.tl .ev.now .d i{background:var(--dv-accent);box-shadow:0 0 0 2px var(--dv-timeline-line),0 0 0 6px var(--dv-accent-soft)}
.tl .ev.fail .d i{background:var(--dv-danger)}
.tl .ev .b{display:flex;flex-direction:column;gap:1px;font-size:13.5px;line-height:1.3;padding-bottom:10px}
.tl .ev .b b{font-weight:600}
.tl .ev .b small{font-size:12px;color:var(--dv-text-2)}
.tl .ev.pend .b{color:var(--dv-text-3)}
.tl .ev.pend .d i{background:transparent;border:2px dashed var(--dv-text-3);box-shadow:none}

/* ---------------------------------------------------------------- settings tab */
.set{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
.dev-phone .set{grid-template-columns:1fr;gap:12px}
.setnav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px;padding:8px}
.dev-phone .setnav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:4px 0;background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.dev-phone .setnav::-webkit-scrollbar{display:none}
.setnav button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:14px;border:0;background:transparent;text-align:start;font-size:13.5px;font-weight:500;color:var(--dv-text-2);white-space:nowrap}
.setnav button .ic{font-size:17px;color:var(--dv-text-3)}
.setnav button:hover{background:var(--dv-surface-3);color:var(--dv-text)}
.setnav button[aria-current=true]{background:var(--dv-accent-soft);color:var(--dv-accent-text);font-weight:600}
.setnav button[aria-current=true] .ic{color:var(--dv-accent-text)}
.dev-phone .setnav button{flex:none;height:44px;border:1px solid var(--dv-border);background:var(--dv-surface-2);border-radius:999px;padding:0 14px}
.dev-phone .setnav button[aria-current=true]{background:var(--dv-text);color:var(--dv-text-inverse);border-color:transparent}
.dev-phone .setnav button[aria-current=true] .ic{color:inherit}
.dev-phone .setnav button .ic{display:none}
.secs{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{padding:var(--dv-card-pad-block) var(--dv-card-pad-inline);display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:60px}
.sec header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec header h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sec header h2 .ic{font-size:19px;color:var(--dv-text-2)}
.sec header .sp{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frow{display:flex;align-items:center;gap:14px;min-height:52px;padding:4px 0;border-top:1px solid var(--dv-border);flex-wrap:wrap}
.frow:first-of-type,.sec header + .frow{border-top:0}
.frow .l{flex:1 1 180px;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.frow .l b{font-size:14px;font-weight:600}
.frow .l small{font-size:12.5px;color:var(--dv-text-2)}
.frow .r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.frow.dis .l{opacity:.55}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.fgrid label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--dv-text-2);min-width:0}
.fgrid label.w2{grid-column:span 2}
.dev-phone .fgrid label.w2{grid-column:span 1}
/* matrix */
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
.mx th{font-size:12px;font-weight:600;color:var(--dv-text-3);text-align:start;padding:8px 8px;background:var(--dv-matrix-head);border-bottom:1px solid var(--dv-border);white-space:nowrap}
.mx th:first-child{border-start-start-radius:12px}.mx th:last-child{border-start-end-radius:12px}
.mx th.c,.mx td.c{text-align:center}
.mx td{padding:6px 8px;border-bottom:1px solid var(--dv-border);vertical-align:middle;min-height:52px;height:52px}
.mx tr:last-child td{border-bottom:0}
.mx tr.cat td{background:transparent;border-bottom:0;padding:16px 8px 6px;font-weight:700;font-size:12.5px;color:var(--dv-text-2);letter-spacing:.02em}
.mx tr.cat td .ic{font-size:14px;vertical-align:-2px;margin-inline-end:6px}
.mx tr.off td:not(.keep){opacity:.45}
.mx .nm{display:flex;align-items:center;gap:10px;min-width:0}
.mx .nm .ring{width:32px;height:32px;border-radius:50%;background:var(--dv-icon-ring-bg);color:var(--dv-icon-ring-fg);display:grid;place-items:center;font-size:15px;flex:none}
.mx .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx .sevseg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--dv-surface-3)}
.mx .sevseg button{border:0;background:transparent;border-radius:999px;height:32px;min-width:32px;padding:0 9px;font-size:12px;font-weight:600;color:var(--dv-text-2);display:inline-flex;align-items:center;gap:4px}
.mx .sevseg button[aria-pressed=true]{background:var(--dv-seg-thumb);color:var(--dv-text);box-shadow:var(--dv-shadow-control)}
.mx .sevseg button i{width:8px;height:8px;border-radius:50%;background:var(--sev)}
.mx .chs{display:inline-flex;gap:6px;align-items:center;flex-wrap:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--dv-border);background:var(--dv-surface-2);font-size:12px;font-weight:600;color:var(--dv-text-2);white-space:nowrap}
.chip .ic{font-size:14px}
.chip[aria-pressed=true]{background:var(--dv-accent-soft);border-color:transparent;color:var(--dv-accent-text)}
.chip.lock{background:var(--dv-neutral-soft);color:var(--dv-text-2);border-color:transparent}
.chip[disabled]{opacity:.45;pointer-events:none}
.chip.soon{border-style:dashed;width:34px;padding:0;justify-content:center;opacity:.55}
.mx .nm b{font-size:13px}
.mx .chs .chip{height:32px;padding:0 9px;font-size:11.5px}
.mx .chs .chip.soon{width:32px;padding:0}
.mx .inp.sm{height:38px;font-size:12.5px;padding-inline:10px 30px}
/* phone: source cards instead of the matrix */
.scards{display:flex;flex-direction:column;gap:10px}
.scard{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-radius:18px}
.scard .top{display:flex;align-items:center;gap:10px}
.scard .top .ring{width:36px;height:36px;border-radius:50%;background:var(--dv-icon-ring-bg);color:var(--dv-icon-ring-fg);display:grid;place-items:center;font-size:17px;flex:none}
.scard .top b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scard .ln>small{font-size:12px;color:var(--dv-text-3);font-weight:600;min-width:52px}
.scard.off .ln{opacity:.45}
/* quiet matrix */
.qmx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.qmx th,.qmx td{padding:10px 8px;border-bottom:1px solid var(--dv-border);text-align:center}
.qmx th{font-size:12px;font-weight:600;color:var(--dv-text-3);background:var(--dv-matrix-head)}
.qmx td:first-child,.qmx th:first-child{text-align:start}
.qmx tr:last-child td{border-bottom:0}
.qmx .sv{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.qmx .sv i{width:10px;height:10px;border-radius:50%;background:var(--sev)}
.qmx td .chk{margin:0 auto}
/* lock preview inside settings */
.prev{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.prev .seg{flex:none}
.pushcard{width:100%;max-width:340px;background:rgba(255,255,255,.86);color:#1c1c1e;border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);font-family:var(--dv-font);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.6)}
.pushcard .ph{display:flex;align-items:center;gap:8px;font-size:12px;color:#6e6e73}
.pushcard .ph .app{width:20px;height:20px;border-radius:6px;background:#2767ed;color:#fff;font-weight:800;font-size:11px;display:grid;place-items:center}
.pushcard .ph .ago{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.pushcard b{font-size:14.5px;font-weight:700;line-height:1.25}
.pushcard p{margin:0;font-size:13px;color:#3a3a3c;line-height:1.35}
.pushcard .acts{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.pushcard .acts span{height:34px;padding:0 12px;border-radius:999px;background:rgba(120,120,128,.14);display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#1c1c1e}
.pushcard .acts span .ic{font-size:14px}

function timelineHTML(n) {
  const ev = [];
  const esc = S.set.esc;
  ev.push({ t: n.first ?? n.t, k: 'created', b: 'נוצרה', s: `נשלח ל־${N(n.src === 'alarm.triggered' ? 3 : 3)} משתמשים · דחיפה` });
  if (n.count > 1) ev.push({ t: n.t, k: 'fold', b: `${N('×' + n.count)} אירועים מקופלים`, s: `האחרון ${hhmm(n.t)}` });
  const st = stateOf(n);
  if (n.sev === 'critical' && n.esc) {
    const ackAt = st === 'acked' ? (S.acked.has(n.id) ? NOW : n.ackAt) : null;
    for (let i = 1; i <= esc.steps; i++) {
      const at = n.t + esc.min * i;
      if (ackAt !== null && at > ackAt) break;
      if (at <= NOW) ev.push({ t: at, k: 'esc', b: `הסלמה ${N(i)} · נשלח שוב ל־${N(2)} מנהלים`, s: `${N(esc.min * i)} דק׳ בלי אישור · דחיפה דחופה` });
      else if (st === 'open') { ev.push({ t: at, k: 'pend', b: `הסלמה ${N(i)} בעוד ${N(at - NOW)} דק׳`, s: i === esc.steps ? 'השלב האחרון' : '' }); break; }
    }
  }
  if (n.deliv.some((d) => d[1] === 'failed') || (S.state === 'fail' && n.id === 'n1')) ev.push({ t: n.t, k: 'fail', b: 'המסירה לטלפון נכשלה', s: 'ההרשמה פגה · ההתראה במרכז' });
  if (st === 'acked') ev.push({ t: S.acked.has(n.id) ? NOW : n.ackAt, k: 'ack', b: `אושר · ${esc_(S.acked.has(n.id) ? 'יוני' : n.ackBy)}`, s: n.sev === 'critical' ? 'ההסלמה נעצרה' : '' });
  if (st === 'resolved') { if (n.ackBy) ev.push({ t: n.ackAt, k: 'ack', b: `אושר · ${esc_(n.ackBy)}`, s: 'ההסלמה נעצרה' }); ev.push({ t: n.resAt, k: 'ack', b: `נפתר · ${esc_(n.resTxt)}`, s: '' }); }
  if (st === 'open' && !ev.some((e) => e.k === 'pend')) ev.push({ t: NOW, k: 'now', b: 'ממתין לאישור', s: '' });
  ev.sort((a, b) => a.t - b.t);
  return `<div class="tl">${ev.map((e) => `<div class="ev ${e.k}"><span class="t">${hhmm(e.t)}</span><span class="d"><i></i></span><span class="b"><b>${e.b}</b>${e.s ? `<small>${e.s}</small>` : ''}</span></div>`).join('')}</div>`;
}

  <li><b>מרכז אחד</b>: נפתח מ"התראות" בתפריט המשתמש (הצ'יפ = לא נקראו, הנקודה על האווטאר = קריטי פתוח). במחשב חלונית זכוכית בקצה ההתחלה של התוכן (כמו השלט במולטימדיה); בטלפון גיליון מלא.</li>
  <li><b>קריטי פתוח נעוץ למעלה</b> ("דורש אישור") עד אישור או פתרון. שאר השורות לפי יום. קיפול לפי מפתח: <code>×N</code> על הטבעת.</li>
  <li><b>למשתמש</b> רק: נקרא/לא נקרא, "השתק לשעה" (ובפרטים "עד הבוקר"), אישור כשמותר. אין העדפות אישיות (החלטה 4ב).</li>
  <li><b>"פתח דלת"</b> בצלצול: רק קישור לדיאלוג אישור בתוך Arx למשתמש מחובר עם <code>door.unlock</code>; "מפעיל" לא רואה את הכפתור. האישור רץ במסלול הקיים עם יומן ביקורת.</li>
  <li><b>הגדרות</b>: לשונית אחת "התראות" עם שמונה מדורים (CR §19); רק <code>notify.manage</code>. בטלפון: כרטיס לכל מקור במקום המטריצה.</li>
  <li>מסכי מפעיל נקיים: בלי פסקאות הסבר, תוויות קצרות, בלי שמות תשתית. "Companion" מופיע רק בהגדרות.</li>
  <li>מסך נעול: שלוש רמות (גנרי / סוג ומקום / מלא) – הגדרת מנהל. אף רמה לא כוללת שם אדם או תמונה. כפתורי הפעולה בדחיפה: רק בדפדפנים שתומכים (ב־iOS הקשה פותחת את Arx).</li></ul>
  <h3>שכבת הזכוכית (knobs)</h3><ul>
  <li>כל הערכים <code>--dv-*</code> של <code>devices-themes.ts</code> (palette default, בהיר/כהה לפי <code>data-devices-scheme</code>).</li>
  <li>חדשים (מוצעים): <code>--dv-sev-info/alert/critical(-soft)</code> <code>--dv-critical-glow</code> <code>--dv-unread-dot</code> <code>--dv-row-min</code> <code>--dv-pin-bg</code> <code>--dv-timeline-line</code> <code>--dv-matrix-head</code>.</li></ul>
  <h3>מיפוי ל־API (NOTIFICATIONS_API.md)</h3>
  <table><tr><th>מסך</th><th>נתיב</th></tr>
  <tr><td>רשימה / צ'יפ</td><td><code>GET /notifications</code> · <code>/notifications/summary</code> · <code>/me/ws</code></td></tr>
  <tr><td>נקרא / השתק / אישור</td><td><code>POST /notifications/{id}/read|snooze|ack</code></td></tr>
  <tr><td>תמונה</td><td><code>GET /notifications/{id}/snapshot</code> (בתוך Arx בלבד)</td></tr>
  <tr><td>פתח דלת</td><td>קישור <code>#/doors/&lt;id&gt;?confirm=</code> → <code>POST /doors/{id}/unlock</code> הקיים</td></tr>
  <tr><td>מקורות</td><td><code>GET|PUT /notify/policies</code> (recipients, channels)</td></tr>
  <tr><td>שעות שקט, הסלמה, מסך נעול, שמירה</td><td><code>GET|PUT /notify/settings</code></td></tr>
  <tr><td>דואר יוצא</td><td><code>PUT /notify/email</code> · <code>POST /notify/email/test</code></td></tr>
  <tr><td>יומן מסירה</td><td><code>GET /notify/deliveries</code> · <code>/notify/stats</code></td></tr></table>
  <h3>מצבים במוקאפ</h3><ul><li>טוען / ריק / שגיאה · שעות שקט (באנר + "לא נשלח") · דחיפה לא נתמכת (באנר) · כשל מסירה (באנר + סימון בשורה ובציר) · משתמש "מפעיל": בלי הגדרות, בלי אישור בטיחות, בלי "פתח דלת".</li></ul>`;
}

readHash();
buildBar();
render();
/* deep links: a hash change from outside (the evidence script, a pasted link) re-reads the state */
let lastHash = location.hash;
window.addEventListener('hashchange', () => { if (location.hash === lastHash) return; lastHash = location.hash; S = newState(); readHash(); render(); });
const _writeHash = writeHash; writeHash = function () { _writeHash(); lastHash = location.hash; };

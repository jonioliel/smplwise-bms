# ---- SmplWise Arx shell: optional build settings --------------------------------------------------------------------
# The app asks for its servers on the first start and keeps a list, so nothing here is required. Pass values with -P...
# on the command line rather than editing this file for one customer.
#   arxHost          optional pre-seeded server: a bare hostname (no scheme, port or path), e.g. site.example.com; added
#                    once, on the first start, when the list is empty
#   arxPath          the pre-seeded server's path (the add-on option remote_path), with both slashes; default /arx/
#   arxServerName    the pre-seeded server's display name (default: its hostname)
#   arxVersionCode   integer; raise it for every APK you hand out, or Android refuses the update
#   arxVersionName   shown in the phone's app info and as ArxApp.version to the page
arxHost=
arxPath=/arx/
arxServerName=
arxVersionCode=1
arxVersionName=2.0.0

# ---- Gradle / Android --------------------------------------------------------------------------------------------
# Modest limits: the owner's workstation also runs the dev backend, browsers and Playwright.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.9.1 is tested up to compileSdk 35; the androidx libraries in use want 36 (as on the TWA branch)
android.suppressUnsupportedCompileSdk=36
